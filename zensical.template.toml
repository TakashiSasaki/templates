[project]
site_name = "Language-neutral Agent Skill Template"
site_url = "https://templates.moukaeritai.work/"
site_description = "A language-neutral repository template for portable Agent Skills with CLI and MCP interfaces."
repo_url = "https://github.com/TakashiSasaki/templates"
repo_name = "TakashiSasaki/templates"
docs_dir = "docs"
site_dir = "site"
extra_css = ["stylesheets/extra.css"]
extra_javascript = [
  "javascripts/repository-tree-viewer.js",
  "javascripts/pwa.js"
]
nav = __GENERATED_NAV__

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]

[project.theme]
favicon = "icon.svg"
font = false
features = [
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.sections",
  "navigation.path",
  "navigation.footer"
]
