[project]
site_name = "Templates Documentation Portal"
site_url = "https://templates.moukaeritai.work/"
site_description = "A reproducible documentation portal for Website, Web application, Agent Skill, and coding-agent Policy guidance."
repo_url = "https://github.com/TakashiSasaki/templates"
repo_name = "TakashiSasaki/templates"
docs_dir = "docs"
site_dir = "site"
extra_css = [
  "stylesheets/extra.css",
  "stylesheets/landing-cover.css",
  "stylesheets/landing-shell.css",
  "stylesheets/mobile-density.css",
  "stylesheets/translation-reader.css",
  "stylesheets/glossary-inline.css",
  "stylesheets/freshness-status.css",
  "stylesheets/composition-playground.css"
]
extra_javascript = [
  "javascripts/github-url.js",
  "javascripts/pwa.js",
  "javascripts/reader-navigation.js",
  "javascripts/audience-context.js",
  "javascripts/audience-shell.js",
  "javascripts/search-history.js",
  "javascripts/audience-search.js",
  "javascripts/glossary-inline.js",
  "javascripts/composition-playground.js",
  "javascripts/composition-playground-explain.js",
  "javascripts/composition-playground-webmcp.js"
]
nav = __GENERATED_NAV__

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]

[project.markdown_extensions.toc]
permalink = true

[project.theme]
favicon = "icon.svg"
font = false
features = [
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.sections",
  "navigation.path",
  "navigation.footer"
]
