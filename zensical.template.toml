[project]
site_name = "Templates Documentation Portal"
site_url = "https://templates.moukaeritai.work/"
site_description = "A reproducible documentation portal for independent skill, policy, and Web application templates."
repo_url = "https://github.com/TakashiSasaki/templates"
repo_name = "TakashiSasaki/templates"
docs_dir = "docs"
site_dir = "site"
extra_css = [
  "stylesheets/extra.css",
  "stylesheets/landing-cover.css",
  "stylesheets/landing-shell.css",
  "stylesheets/mobile-density.css",
  "stylesheets/translation-reader.css",
  "stylesheets/glossary-inline.css",
  "stylesheets/freshness-status.css"
]
extra_javascript = [
  "javascripts/repository-tree-viewer.js",
  "javascripts/pwa.js",
  "javascripts/reader-navigation.js",
  "javascripts/search-history.js",
  "javascripts/glossary-inline.js"
]
nav = __GENERATED_NAV__

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]

[project.theme]
favicon = "icon.svg"
font = false
features = [
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.sections",
  "navigation.path",
  "navigation.footer"
]