[project]
site_name = "Templates Documentation Portal"
site_url = "https://templates.moukaeritai.work/"
site_description = "A reproducible documentation portal for independent skill, policy, and Web application templates."
repo_url = "https://github.com/TakashiSasaki/templates"
repo_name = "TakashiSasaki/templates"
docs_dir = "docs"
site_dir = "site"
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/repository-tree-viewer.js"]
nav = __GENERATED_NAV__

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]

[project.theme]
font = false
features = [
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.sections",
  "navigation.path",
  "navigation.footer"
]
