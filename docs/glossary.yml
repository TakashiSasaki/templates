schema_version: 1
terms:
  - id: templates-policy-module
    term: Policy module
    localized_labels:
      ja:
        term: ポリシーモジュール
    origin: repository
    definition: >-
      A shared-policy source file that owns one independently applicable
      normative rule and one stable rule ID, with metadata such as severity,
      override permission, and deterministic order plus optional rationale and
      examples.

  - id: templates-policy-profile
    term: Policy profile
    localized_labels:
      ja:
        term: ポリシープロファイル
    origin: repository
    definition: >-
      A named ordered selection of shared policy modules that can be selected
      by a managed repository or policy context as part of its semantic policy
      input.
    related_terms:
      - templates-policy-module
      - templates-skill-profile

  - id: templates-policy-context
    term: Policy context
    localized_labels:
      ja:
        term: ポリシーコンテキスト
    origin: repository
    definition: >-
      A named semantic authority boundary in agent-policy configuration that
      selects shared policy profiles, repository-local policy files, and any
      explicit overrides. Outputs reference a context rather than selecting
      policy semantics independently.
    related_terms:
      - templates-policy-profile
      - templates-policy-renderer
      - templates-context-policy
      - templates-repository-local-policy
      - templates-policy-override

  - id: templates-policy-renderer
    term: Policy renderer
    localized_labels:
      ja:
        term: ポリシーレンダラー
    origin: repository
    definition: >-
      A presentation adapter that renders the semantic rules selected by a
      policy context into a caller-facing output format without selecting,
      adding, removing, or overriding policy rules.
    related_terms:
      - templates-policy-context
      - templates-adapter-renderer-requirement

  - id: templates-shared-policy
    term: Shared policy
    localized_labels:
      ja:
        term: 共有ポリシー
    origin: repository
    definition: >-
      Artifact- and engine-independent operating behavior that is generally
      applicable and is authored in the policy branch as canonical shared
      semantics rather than copied into consumer repositories as an independent
      handwritten authority.
    related_terms:
      - templates-policy-module
      - templates-policy-profile
      - templates-context-policy
      - templates-repository-local-policy

  - id: templates-context-policy
    term: Context policy
    localized_labels:
      ja:
        term: コンテキストポリシー
    origin: repository
    definition: >-
      Artifact- and engine-independent policy content selected only for a
      particular operational context, such as pull-request review or external
      artifact intake. It is policy content, not the Policy context selector:
      a Policy context is the named semantic authority boundary that selects
      profiles, repository-local policy, and overrides; each output separately
      references both a context and a renderer.
    related_terms:
      - templates-policy-context
      - templates-shared-policy

  - id: templates-repository-local-policy
    term: Repository-local policy
    localized_labels:
      ja:
        term: リポジトリローカルポリシー
    origin: repository
    definition: >-
      Policy owned by a managed repository for local facts, invariants,
      justified extensions, or explicit permitted overrides. It supplements
      shared semantics instead of restating shared rules merely for
      convenience.
    related_terms:
      - templates-policy-context
      - templates-shared-policy
      - templates-policy-override

  - id: templates-artifact-contract
    term: Artifact contract
    localized_labels:
      ja:
        term: アーティファクト契約
    origin: repository
    definition: >-
      A requirement class that defines what a produced Skill, Web application,
      CLI, library, service, or other artifact must contain or do. Artifact
      contracts belong to the produced artifact rather than to shared
      coding-agent operating policy.
    related_terms:
      - templates-adapter-renderer-requirement
      - templates-explanatory-material

  - id: templates-adapter-renderer-requirement
    term: Adapter/renderer requirement
    localized_labels:
      ja:
        term: アダプター／レンダラー要件
    origin: repository
    definition: >-
      A requirement whose meaning depends on a particular agent, platform,
      protocol, command surface, renderer, or output format. It adapts or
      presents semantics instead of defining application-independent shared
      policy.
    related_terms:
      - templates-policy-renderer
      - templates-artifact-contract

  - id: templates-explanatory-material
    term: Explanatory material
    localized_labels:
      ja:
        term: 説明資料
    origin: repository
    definition: >-
      Rationale, examples, history, proposals, and other non-normative text that
      explains policy or artifact decisions without itself establishing a
      normative policy rule or artifact contract.
    related_terms:
      - templates-artifact-contract

  - id: templates-policy-override
    term: Policy override
    localized_labels:
      ja:
        term: ポリシーオーバーライド
    origin: repository
    definition: >-
      The mechanism by which a repository-local rule intentionally replaces an
      overridable shared rule with the same stable rule ID. The containing
      policy context must record that exception in an explicit override
      declaration with a non-empty reason, while the repository-local policy
      file remains the source of the replacement rule body.
    related_terms:
      - templates-policy-context
      - templates-shared-policy
      - templates-repository-local-policy

  - id: templates-policy-stable-release
    term: Stable release
    localized_labels:
      ja:
        term: 安定版リリース
    origin: repository
    definition: >-
      The executable Policy toolchain release currently selected by the stable
      release descriptor. It may intentionally lag the advancing policy branch
      and is identified by the promoted toolchain revision rather than by the
      later promotion-state commit.
    related_terms:
      - templates-policy-stable-release-descriptor
      - templates-policy-promoted-toolchain-revision

  - id: templates-policy-stable-release-descriptor
    term: Stable release descriptor
    localized_labels:
      ja:
        term: 安定版リリース記述子
    origin: repository
    definition: >-
      The committed release/toolchain.json record for the stable channel that
      binds the Policy toolchain repository and exact promoted revision together
      with synchronized contract versions and verifier requirements.
    related_terms:
      - templates-policy-stable-release
      - templates-policy-promoted-toolchain-revision
      - templates-policy-bootstrap-trust-seed

  - id: templates-policy-promoted-toolchain-revision
    term: Promoted toolchain revision
    localized_labels:
      ja:
        term: 昇格済みツールチェーンリビジョン
    origin: repository
    definition: >-
      The reviewed candidate full commit SHA selected by Policy promotion and
      written into both the stable release descriptor and the integrated
      bootstrap manifest. It is a strict ancestor of the later promotion state,
      avoiding recursive self-reference.
    related_terms:
      - templates-policy-stable-release
      - templates-policy-stable-release-descriptor
      - templates-policy-bootstrap-trust-seed

  - id: templates-policy-bootstrap-trust-seed
    term: Bootstrap trust seed
    localized_labels:
      ja:
        term: ブートストラップ信頼シード
    origin: repository
    definition: >-
      The installable skills/bootstrap-agent-policy package that provides the
      reviewed entry route for onboarding a repository through one immutable
      Policy toolchain revision and a closed route set. Its bootstrap manifest
      pins the same promoted revision as the stable release descriptor and
      intentionally exposes no adoption-finalization route.
    related_terms:
      - templates-policy-stable-release-descriptor
      - templates-policy-promoted-toolchain-revision
      - templates-policy-managed-repository

  - id: templates-policy-managed-repository
    term: Managed repository
    localized_labels:
      ja:
        term: 管理対象リポジトリ
    origin: repository
    definition: >-
      A product repository that Policy onboarding inspection classifies as
      managed because the canonical .agent-policy.yml path resolves to an
      existing regular file. Managed repositories use normal validate, render,
      and check operations instead of bootstrap onboarding; the classification
      itself does not assert that configuration semantics have already passed
      those validations, and partial or conflicting generated state is
      classified separately as inconsistent.
    related_terms:
      - templates-policy-profile
      - templates-policy-context
      - templates-repository-local-policy
      - templates-policy-bootstrap-trust-seed
