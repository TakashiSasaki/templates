schema_version: 1
terms:
  - id: templates-webapp-template-mode
    term: Template mode
    localized_labels:
      ja:
        term: テンプレートモード
    origin: repository
    definition: >-
      The source-template evidence state in which the Webapp template records
      required structure and proof obligations without claiming concrete
      product source locations, commands, verified results, release gates, or
      release decisions.
    related_terms:
      - templates-webapp-product-mode

  - id: templates-webapp-contract-manifest
    term: Contract manifest
    localized_labels:
      ja:
        term: コントラクトマニフェスト
        aliases:
          - 契約マニフェスト
    origin: repository
    definition: >-
      The closed versioned registry in contracts/manifest.json that identifies
      every active Webapp contract family and schema and preserves the identity
      and version history of retired families. Contract files do not become
      part of the authoritative set merely by existing in the repository.
    related_terms:
      - templates-webapp-contract-family
      - templates-webapp-release-bundle

  - id: templates-webapp-implementation-evidence
    term: Implementation evidence
    localized_labels:
      ja:
        term: 実装エビデンス
        aliases:
          - 実装証跡
    origin: repository
    definition: >-
      The Webapp contract that connects framework-neutral declarations to
      repository-local implementation boundaries, positive and negative
      proofs, authoritative command definitions, and release-gate definitions.
      It defines what must be proved and run but does not prove candidate
      execution itself.
    related_terms:
      - templates-webapp-release-evidence
      - templates-webapp-product-mode
      - templates-artifact-contract

  - id: templates-webapp-release-evidence
    term: Release evidence
    localized_labels:
      ja:
        term: リリースエビデンス
        aliases:
          - リリース証跡
    origin: repository
    definition: >-
      A revision-specific Webapp release record that binds one exact product
      revision to the current authoritative command definitions and release
      gates, records their completed results and provenance, and records the
      resulting release decision. It supplements rather than replaces
      implementation evidence.
    related_terms:
      - templates-webapp-implementation-evidence
      - templates-webapp-product-mode
      - templates-webapp-release-bundle
      - templates-webapp-candidate-revision
      - templates-artifact-contract

  - id: templates-webapp-template-source-artifact
    term: Template source artifact
    localized_labels:
      ja:
        term: テンプレートソースアーティファクト
    origin: repository
    definition: >-
      The complete Webapp branch checkout used by template maintainers. It
      contains the copyable template together with source-only tests,
      publication integration, audits, policy, and distribution validation.
    related_terms:
      - templates-webapp-template-distribution-artifact
      - templates-webapp-product-repository-artifact

  - id: templates-webapp-template-distribution-artifact
    term: Template distribution artifact
    localized_labels:
      ja:
        term: テンプレート配布アーティファクト
    origin: repository
    definition: >-
      The committed contents of the Webapp template/ subtree that are copied
      without content transformation to the root of a newly created product
      repository and form the canonical downstream repository template.
    related_terms:
      - templates-webapp-template-source-artifact
      - templates-webapp-product-repository-artifact

  - id: templates-webapp-product-repository-artifact
    term: Product repository artifact
    localized_labels:
      ja:
        term: プロダクトリポジトリアーティファクト
    origin: repository
    definition: >-
      A repository created from the template distribution after product-specific
      contracts, implementation, evidence, commands, CI, release results, and
      deployment configuration are supplied.
    related_terms:
      - templates-webapp-template-source-artifact
      - templates-webapp-template-distribution-artifact

  - id: templates-webapp-product-mode
    term: Product mode
    localized_labels:
      ja:
        term: プロダクトモード
    origin: repository
    definition: >-
      The concrete-product evidence state in which Webapp evidence contracts
      require the repository-local implementation locations, commands, release
      gates, immutable revisions, verified results, provenance, and decisions
      governed by each contract. It is the counterpart to Template mode, which
      records obligations without claiming those product values.
    related_terms:
      - templates-webapp-template-mode
      - templates-webapp-implementation-evidence
      - templates-webapp-release-evidence

  - id: templates-webapp-release-bundle
    term: Release bundle
    localized_labels:
      ja:
        term: リリースバンドル
    origin: repository
    definition: >-
      The provider-neutral Webapp handoff contract that binds one approved
      candidate revision to the exact current bytes of the active contract set
      being transferred. It complements release evidence rather than recording
      command execution and approval itself.
    related_terms:
      - templates-webapp-contract-manifest
      - templates-webapp-release-evidence
      - templates-webapp-candidate-revision
      - templates-artifact-contract

  - id: templates-webapp-contract-family
    term: Contract family
    localized_labels:
      ja:
        term: コントラクトファミリー
    origin: repository
    definition: >-
      A stable versioned identity for one Webapp contract concern in the
      contract manifest, with active or retired state, version history,
      migration ownership, registered paths, and evidence coverage maintained
      across contract evolution.
    related_terms:
      - templates-webapp-contract-manifest

  - id: templates-webapp-candidate-revision
    term: Candidate revision
    localized_labels:
      ja:
        term: 候補リビジョン
    origin: repository
    definition: >-
      The immutable source revision whose reviewed authoritative commands and
      release gates ran and whose approval is recorded by Webapp release
      evidence. Product-mode release bundle version 1 binds this same revision
      and requires it to equal both the explicit expected revision and the
      release-evidence subject.
    related_terms:
      - templates-webapp-merge-test-revision
      - templates-webapp-released-revision
      - templates-webapp-release-evidence
      - templates-webapp-release-bundle

  - id: templates-webapp-merge-test-revision
    term: Merge-test revision
    localized_labels:
      ja:
        term: マージテストリビジョン
    origin: repository
    definition: >-
      A temporary or synthetic source revision used to test the proposed result
      of merging a change, such as a pull-request merge ref. It can provide
      validation evidence but is not the candidate revision unless that role is
      selected explicitly.
    related_terms:
      - templates-webapp-candidate-revision

  - id: templates-webapp-released-revision
    term: Released revision
    localized_labels:
      ja:
        term: リリース済みリビジョン
    origin: repository
    definition: >-
      The immutable source identity published by a release system. It may equal
      the candidate revision or a later merge commit. The release system must
      preserve an auditable mapping from the accepted bundle to this identity;
      if that mapping changes the source revision, the prior candidate bundle
      cannot be silently relabeled and new release evidence plus a new bundle
      are required for the newly selected candidate.
    related_terms:
      - templates-webapp-candidate-revision
      - templates-webapp-deployed-revision

  - id: templates-webapp-deployed-revision
    term: Deployed revision
    localized_labels:
      ja:
        term: デプロイ済みリビジョン
    origin: repository
    definition: >-
      The immutable source identity observed in a target environment after
      deployment. It belongs to deployment and post-deployment verification,
      not the pre-release handoff contract, and should be compared with the
      released revision in product-owned deployment evidence.
    related_terms:
      - templates-webapp-released-revision
