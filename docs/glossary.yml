schema_version: 1
terms:
  - id: templates-skill-profile
    term: Skill profile
    localized_labels:
      ja:
        term: スキルプロファイル
        aliases:
          - Skill プロファイル
    origin: repository
    definition: >-
      A selectable structural pattern that activates the repository resources
      and contracts needed by a concrete Agent Skill. Profiles are not
      mandatory maturity levels, and compatible non-instruction-only profiles
      may be combined.
    related_terms:
      - templates-policy-profile

  - id: templates-skill-template-scaffold
    term: Skill template scaffold
    localized_labels:
      ja:
        term: スキルテンプレート・スキャフォールド
        aliases:
          - スキルテンプレート雛形
    origin: repository
    definition: >-
      The uncustomized Agent Skill template state identified by the reserved
      template-scaffold selection. A concrete operational skill must replace
      this selection before retaining operational resources, implementation,
      runtime manifests, or interface contracts.
    related_terms:
      - templates-skill-profile

  - id: templates-skill-mcp-extension
    term: Skill MCP extension
    localized_labels:
      ja:
        term: スキルMCP拡張
        aliases:
          - MCP拡張
    origin: repository
    definition: >-
      An MCP extension identifier selected for an mcp-enabled Skill and
      recorded separately from Skill profile tags. Selecting an extension does
      not create a new Skill profile; for example, MCP Apps is represented by
      the io.modelcontextprotocol/ui extension identifier.
    related_terms:
      - templates-skill-profile
      - external-mcp-model-context-protocol

  - id: templates-skill-runtime-decision-record
    term: Runtime decision record
    localized_labels:
      ja:
        term: ランタイム決定記録
    origin: repository
    definition: >-
      A maintained Skill authority that records implementation runtime,
      dependencies, exact shared commands, package and distribution choices,
      selected core protocol revision, extension identifiers, transport
      selections, and deployment lifecycle for profiles that need a separate
      runtime record.
    related_terms:
      - templates-skill-profile

  - id: templates-skill-public-interface-selection-contract
    term: Public interface selection contract
    localized_labels:
      ja:
        term: 公開インターフェース選択契約
    origin: repository
    definition: >-
      A Skill contract that selects one preferred agent interface and a
      deterministic fallback order among retained public interfaces without
      owning the interface-specific caller-visible behavior defined by those
      interfaces' dedicated contracts.
    related_terms:
      - templates-skill-profile
      - templates-skill-runtime-decision-record
      - templates-artifact-contract
      - templates-adapter-renderer-requirement

  - id: external-mcp-model-context-protocol
    term: Model Context Protocol
    aliases:
      - MCP
    localized_labels:
      ja:
        term: モデルコンテキストプロトコル
    origin: external
    summary: >-
      An open protocol that standardizes how LLM applications connect to
      external context sources, tools, and capabilities through a host, client,
      and server architecture.
    authority:
      kind: normative
      sources:
        - title: Model Context Protocol Specification
          url: https://modelcontextprotocol.io/specification/2026-07-28
          version: 2026-07-28
    repository_usage: >-
      The Skill template uses MCP 2026-07-28 as its current core protocol
      baseline and records optional MCP extension identifiers separately from
      the core protocol revision.
