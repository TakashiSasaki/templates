    <rect x="68" y="20" width="34" height="38" rx="9" fill="#3fe0c1" opacity=".72"/>
    <path d="M52 32h16M52 47h16" stroke="#e6fff9" stroke-width="4" stroke-linecap="round"/>
    <text x="80" y="79" text-anchor="middle" fill="#e6fff9" font-family="system-ui,sans-serif" font-size="16" font-weight="750">Agent Skill</text>
  </g>

