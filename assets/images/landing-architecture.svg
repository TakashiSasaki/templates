<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Templates authority model</title>
  <desc id="desc">Composition contains Agent Skill, Website, and Web application artifact semantics plus reusable foundations, capabilities, and lifecycle contracts. Policy independently defines coding-agent operation. The Site publishes reviewed revisions of both through one validated portal.</desc>
  <defs>
    <linearGradient id="background" x1="38" y1="24" x2="724" y2="496" gradientUnits="userSpaceOnUse">
      <stop stop-color="#13253d"/>
      <stop offset="1" stop-color="#091322"/>
    </linearGradient>
    <linearGradient id="composition" x1="60" y1="54" x2="460" y2="336" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123b48"/>
      <stop offset="1" stop-color="#10243a"/>
