  <text x="599" y="303" text-anchor="middle" fill="#f1ecff" font-family="system-ui,sans-serif" font-size="15" font-weight="750">operation</text>

  <path d="M262 338v27c0 18 16 25 44 25h74" fill="none" stroke="url(#flow)" stroke-width="6" stroke-linecap="round"/>
  <path d="M599 338v27c0 18-16 25-44 25h-75" fill="none" stroke="url(#flow)" stroke-width="6" stroke-linecap="round"/>
  <path d="m380 390 15 10-15 10" fill="none" stroke="#45d4ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m480 390-15 10 15 10" fill="none" stroke="#8c75ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="164" y="405" width="432" height="72" rx="22" fill="url(#site)" stroke="#45d4ff" stroke-width="2"/>
  <circle cx="205" cy="441" r="14" fill="#45d4ff" opacity=".18"/>
