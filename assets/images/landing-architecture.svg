  <text x="235" y="438" fill="#ecf8ff" font-family="system-ui,sans-serif" font-size="18" font-weight="800">SITE · VALIDATED PORTAL</text>
  <text x="235" y="458" fill="#9db8d3" font-family="system-ui,sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">REVIEWED REVISIONS · LINKS · PROVENANCE · PAGES</text>
