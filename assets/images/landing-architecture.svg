<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Templates authority model</title>
  <desc id="desc">Composition contains Agent Skill and Web application artifact semantics plus reusable capabilities. Policy independently defines coding-agent operation. The Site publishes reviewed revisions of both through one validated portal.</desc>
  <defs>
    <linearGradient id="background" x1="38" y1="24" x2="724" y2="496" gradientUnits="userSpaceOnUse">
      <stop stop-color="#13253d"/>
      <stop offset="1" stop-color="#091322"/>
    </linearGradient>
    <linearGradient id="composition" x1="60" y1="54" x2="460" y2="336" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123b48"/>
      <stop offset="1" stop-color="#10243a"/>
    </linearGradient>
    <linearGradient id="policy" x1="500" y1="54" x2="700" y2="336" gradientUnits="userSpaceOnUse">
      <stop stop-color="#30265a"/>
      <stop offset="1" stop-color="#181c3d"/>
    </linearGradient>
    <linearGradient id="site" x1="165" y1="385" x2="595" y2="475" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12324e"/>
      <stop offset="1" stop-color="#18234c"/>
    </linearGradient>
    <linearGradient id="flow" x1="258" y1="322" x2="520" y2="419" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3fe0c1"/>
      <stop offset=".48" stop-color="#45d4ff"/>
      <stop offset="1" stop-color="#9a78ff"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0v36" fill="none" stroke="#8aa4c7" stroke-width="1" opacity=".1"/>
    </pattern>
  </defs>

  <rect x="18" y="18" width="724" height="484" rx="36" fill="url(#background)"/>
  <rect x="18" y="18" width="724" height="484" rx="36" fill="url(#grid)"/>

  <rect x="58" y="52" width="408" height="286" rx="28" fill="url(#composition)" stroke="#45d4ff" stroke-width="2" opacity=".98"/>
  <circle cx="92" cy="86" r="8" fill="#45d4ff"/>
  <text x="110" y="91" fill="#dff7ff" font-family="system-ui,sans-serif" font-size="17" font-weight="800" letter-spacing="1.5">COMPOSITION AUTHORITY</text>
  <text x="88" y="126" fill="#91b8cf" font-family="system-ui,sans-serif" font-size="12" font-weight="700" letter-spacing="1.6">ARTIFACT SEMANTICS</text>

  <g transform="translate(88 146)">
