  <circle cx="111" cy="288" r="5" fill="#45d4ff"/>
  <text x="127" y="293" fill="#c8eaff" font-family="system-ui,sans-serif" font-size="12" font-weight="700" letter-spacing="1">REUSABLE CAPABILITIES · LIFECYCLE</text>

  <rect x="496" y="52" width="206" height="286" rx="28" fill="url(#policy)" stroke="#9a78ff" stroke-width="2"/>
