    <linearGradient id="policy" x1="500" y1="54" x2="700" y2="336" gradientUnits="userSpaceOnUse">
      <stop stop-color="#30265a"/>
      <stop offset="1" stop-color="#181c3d"/>
    </linearGradient>
    <linearGradient id="site" x1="165" y1="385" x2="595" y2="475" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12324e"/>
      <stop offset="1" stop-color="#18234c"/>
    </linearGradient>
