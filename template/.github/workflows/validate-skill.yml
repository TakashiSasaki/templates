name: Validate Agent Skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Skill
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3

      - name: Validate Skill repository
        run: python .github/scripts/validate_skill_repository.py

      - name: Test uncustomized template baseline
        if: hashFiles('.github/scripts/test_template_baseline.py') != ''
        run: python .github/scripts/test_template_baseline.py
