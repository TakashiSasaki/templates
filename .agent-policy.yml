    enabled: true
    path: AGENTS.md
    context: default
    renderer: agents-md
  review-authority:
    enabled: true
    path: .review-authority/review-policy.md
    context: review
    renderer: policy-context-md
skills:
  enabled:
  - maintain-progressive-discovery
