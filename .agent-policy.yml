schema_version: 2
toolchain:
  repository: TakashiSasaki/templates
  revision: 601673cbced48ce15862eb3ba40d3c9ccb9abc7e
contexts:
  default:
    profiles:
    - core
    - security-baseline
    - pull-request
    - progressive-discovery
    project_policy:
      files:
      - policy/project.md
  review:
    profiles:
    - core
    - security-baseline
    - review
    project_policy:
      files:
      - policy/project.md
outputs:
