name: Temporary Webapp worklist proof obligations

on:
  push:
    branches:
      - agent/webapp-worklist-proof-obligations-pr12

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/webapp-worklist-proof-obligations-pr12
          fetch-depth: 0
      - name: Apply focused patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_count(path: str, old: str, new: str, expected: int) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} replacements, found {count}: {old!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          targets = "components/artifact.webapp-core/files/scripts/webapp_evidence_targets.py"
          replace_once(
              targets,
              'DOMAIN_IDS = {"surfaces", "routes", "ui_states", "viewports"}\nRECORD_ID = re.compile(r"^[a-z][a-z0-9-]*$")\n',
              'DOMAIN_IDS = {"surfaces", "routes", "ui_states", "viewports"}\nRECORD_ID = re.compile(r"^[a-z][a-z0-9-]*$")\nBROWSER_LEVEL_PROOF_KINDS = ("accessibility-test", "end-to-end-test")\nBROWSER_SENSITIVE_CONTRACT_ITEMS = frozenset(\n    {\n        ("routes", "route"),\n        ("viewports", "input-capability"),\n        ("viewports", "viewport"),\n    }\n)\n',
          )
          replace_once(
              targets,
              '\ndef _sort_key(target: dict[str, Any]) -> str:\n',
              '\ndef artifact_required_proof_kinds(target: object) -> tuple[str, ...]:\n    """Return artifact-mandated proof-kind alternatives for a Webapp target."""\n    if (\n        isinstance(target, dict)\n        and target.get("kind") == "contract-item"\n        and (target.get("contractId"), target.get("itemKind"))\n        in BROWSER_SENSITIVE_CONTRACT_ITEMS\n    ):\n        return BROWSER_LEVEL_PROOF_KINDS\n    return ()\n\n\ndef requires_browser_level_proof(target: object) -> bool:\n    return bool(artifact_required_proof_kinds(target))\n\n\ndef _sort_key(target: dict[str, Any]) -> str:\n',
          )

          validator = "components/artifact.webapp-core/files/scripts/validate_webapp_evidence.py"
          replace_once(
              validator,
              'if __package__:\n    from .webapp_evidence_targets import allowed_targets, expected_targets, target_key\nelse:\n    from webapp_evidence_targets import allowed_targets, expected_targets, target_key\n\n\nBROWSER_LEVEL_PROOF_KINDS = frozenset({"accessibility-test", "end-to-end-test"})\nBROWSER_SENSITIVE_CONTRACT_ITEMS = frozenset(\n    {\n        ("routes", "route"),\n        ("viewports", "input-capability"),\n        ("viewports", "viewport"),\n    }\n)\n',
              'if __package__:\n    from .webapp_evidence_targets import (\n        BROWSER_LEVEL_PROOF_KINDS,\n        BROWSER_SENSITIVE_CONTRACT_ITEMS,\n        allowed_targets,\n        expected_targets,\n        requires_browser_level_proof,\n        target_key,\n    )\nelse:\n    from webapp_evidence_targets import (\n        BROWSER_LEVEL_PROOF_KINDS,\n        BROWSER_SENSITIVE_CONTRACT_ITEMS,\n        allowed_targets,\n        expected_targets,\n        requires_browser_level_proof,\n        target_key,\n    )\n',
          )
          replace_once(
              validator,
              '\ndef requires_browser_level_proof(target: object) -> bool:\n    return (\n        isinstance(target, dict)\n        and target.get("kind") == "contract-item"\n        and (target.get("contractId"), target.get("itemKind"))\n        in BROWSER_SENSITIVE_CONTRACT_ITEMS\n    )\n\n',
              '\n',
          )

          scaffold = "components/artifact.webapp-core/files/scripts/scaffold_webapp_evidence.py"
          replace_once(
              scaffold,
              'if __package__:\n    from .webapp_evidence_targets import expected_targets, record_id, target_key\nelse:\n    from webapp_evidence_targets import expected_targets, record_id, target_key\n',
              'if __package__:\n    from .webapp_evidence_targets import (\n        artifact_required_proof_kinds,\n        expected_targets,\n        record_id,\n        target_key,\n    )\nelse:\n    from webapp_evidence_targets import (\n        artifact_required_proof_kinds,\n        expected_targets,\n        record_id,\n        target_key,\n    )\n',
          )
          replace_once(
              scaffold,
              '\ndef record_skeleton(target: dict[str, Any]) -> dict[str, Any]:\n',
              '\ndef _artifact_proof_requirements(\n    targets: tuple[dict[str, Any], ...]\n) -> list[dict[str, Any]]:\n    projected: list[dict[str, Any]] = []\n    for target in targets:\n        kinds = artifact_required_proof_kinds(target)\n        if not kinds:\n            continue\n        kind_options = list(kinds)\n        projected.append(\n            {\n                "recordId": record_id(target),\n                "target": target,\n                "positiveEvidenceKindAtLeastOneOf": kind_options,\n                "negativeEvidenceKindAtLeastOneOf": kind_options,\n                "linkedRequirementRequiredPositiveProofKindAtLeastOneOf": kind_options,\n            }\n        )\n    return sorted(projected, key=lambda item: item["recordId"])\n\n\ndef record_skeleton(target: dict[str, Any]) -> dict[str, Any]:\n',
          )
          replace_once(scaffold, '"formatVersion": 1,', '"formatVersion": 2,')
          replace_once(
              scaffold,
              '        "recordCount": len(records),\n        "records": records,\n',
              '        "recordCount": len(records),\n        "artifactProofRequirements": _artifact_proof_requirements(targets),\n        "records": records,\n',
          )

          replace_once(
              "components/artifact.webapp-core/files/TEMPLATE.md",
              'The generated worklist is still non-canonical and contains TODO placeholders rather than fabricated implementation claims. It projects each current target as `[verified]`, `[missing]`, or `[deferred]` from the canonical document; those labels are a deterministic checklist, not a substitute for validation. Use it to identify concrete implementation boundaries, positive and negative proofs, authoritative commands, and release gates. Then switch `contracts/implementation-evidence.json` to product mode and provide one fully verified record for every current Webapp target. Add `contract-transition` evidence only when this consumer actually underwent a registered contract migration; provider history that predates the product is not a fresh-product implementation obligation.\n',
              'The generated worklist is still non-canonical and contains TODO placeholders rather than fabricated implementation claims. It projects each current target as `[verified]`, `[missing]`, or `[deferred]` from the canonical document; those labels are a deterministic checklist, not a substitute for validation. Worklist format v2 also exposes `artifactProofRequirements` before any product requirement has been authored. Each entry identifies a browser-sensitive record and states the positive-evidence, negative-evidence, and linked-requirement proof-kind alternatives from which at least one kind is mandatory. Treat these as artifact constraints, not as claims that proof has already run. Use the worklist to identify concrete implementation boundaries, positive and negative proofs, authoritative commands, and release gates. Then switch `contracts/implementation-evidence.json` to product mode and provide one fully verified record for every current Webapp target. Add `contract-transition` evidence only when this consumer actually underwent a registered contract migration; provider history that predates the product is not a fresh-product implementation obligation.\n',
          )

          scaffold_test = "tests/test_webapp_evidence_scaffold.py"
          replace_once(scaffold_test, 'self.assertEqual(worklist["formatVersion"], 1)', 'self.assertEqual(worklist["formatVersion"], 2)')
          replace_once(
              scaffold_test,
              '            self.assertEqual(len(record_ids), len(set(record_ids)))\n            self.assertEqual(len(targets), len(set(targets)))\n            for record in worklist["records"]:\n',
              '            self.assertEqual(len(record_ids), len(set(record_ids)))\n            self.assertEqual(len(targets), len(set(targets)))\n\n            browser_sensitive_ids = {\n                record["id"]\n                for record in worklist["records"]\n                if (\n                    record["target"].get("contractId"),\n                    record["target"].get("itemKind"),\n                )\n                in {\n                    ("routes", "route"),\n                    ("viewports", "input-capability"),\n                    ("viewports", "viewport"),\n                }\n            }\n            proof_requirements = worklist["artifactProofRequirements"]\n            self.assertEqual(\n                {item["recordId"] for item in proof_requirements},\n                browser_sensitive_ids,\n            )\n            expected_browser_kinds = ["accessibility-test", "end-to-end-test"]\n            for item in proof_requirements:\n                self.assertEqual(\n                    item["positiveEvidenceKindAtLeastOneOf"], expected_browser_kinds\n                )\n                self.assertEqual(\n                    item["negativeEvidenceKindAtLeastOneOf"], expected_browser_kinds\n                )\n                self.assertEqual(\n                    item["linkedRequirementRequiredPositiveProofKindAtLeastOneOf"],\n                    expected_browser_kinds,\n                )\n\n            for record in worklist["records"]:\n',
          )

          projection_test = "tests/test_webapp_evidence_projection.py"
          replace_once(
              projection_test,
              '            self.assertEqual(verified["requirements"][0]["status"], "verified")\n',
              '            self.assertEqual(verified["requirements"][0]["status"], "verified")\n            self.assertEqual(verified["artifactProofRequirements"], [])\n',
          )
          replace_once(
              projection_test,
              '            self.write_json(root / "contracts/routes.json", {"routes": []})\n            self.write_json(root / "contracts/ui-states.json", {"states": []})\n            self.write_json(root / "contracts/viewports.json", {"viewports": [], "inputCapabilities": []})\n',
              '            self.write_json(root / "contracts/routes.json", {"routes": [{"id": "home"}]})\n            self.write_json(root / "contracts/ui-states.json", {"states": []})\n            self.write_json(\n                root / "contracts/viewports.json",\n                {"viewports": [{"id": "base"}], "inputCapabilities": ["keyboard"]},\n            )\n',
          )
          replace_once(
              projection_test,
              '            self.assertEqual(worklist["statusCounts"]["missing"], 1)\n            self.assertEqual(worklist["recordStatuses"][0]["status"], "missing")\n            self.assertEqual(worklist["requirements"], [])\n',
              '            self.assertEqual(worklist["statusCounts"]["missing"], 4)\n            self.assertTrue(\n                all(item["status"] == "missing" for item in worklist["recordStatuses"])\n            )\n            self.assertEqual(worklist["requirements"], [])\n            self.assertEqual(\n                [item["recordId"] for item in worklist["artifactProofRequirements"]],\n                [\n                    "routes-route-home",\n                    "viewports-input-capability-keyboard",\n                    "viewports-viewport-base",\n                ],\n            )\n            for item in worklist["artifactProofRequirements"]:\n                self.assertEqual(\n                    item["positiveEvidenceKindAtLeastOneOf"],\n                    ["accessibility-test", "end-to-end-test"],\n                )\n                self.assertEqual(\n                    item["negativeEvidenceKindAtLeastOneOf"],\n                    ["accessibility-test", "end-to-end-test"],\n                )\n                self.assertEqual(\n                    item["linkedRequirementRequiredPositiveProofKindAtLeastOneOf"],\n                    ["accessibility-test", "end-to-end-test"],\n                )\n',
          )

          replace_once(
              "components/artifact.webapp-core/component.json",
              '  "version": 8,',
              '  "version": 9,',
          )
          replace_once(
              "tests/test_webapp_neutral_seed.py",
              'self.assertEqual(descriptor["version"], 8)',
              'self.assertEqual(descriptor["version"], 9)',
          )
          replace_once(
              "tests/test_routes_v3_access_failures.py",
              'self.assertEqual(component["version"], 8)',
              'self.assertEqual(component["version"], 9)',
          )
          replace_once(
              "tests/test_webapp_v4_upgrade.py",
              'self.assertEqual(artifact["version"], 8)',
              'self.assertEqual(artifact["version"], 9)',
          )
          replace_once(
              "tests/test_webapp_v4_upgrade.py",
              'self.assertEqual(changed["artifact.webapp-core"]["to_version"], 8)',
              'self.assertEqual(changed["artifact.webapp-core"]["to_version"], 9)',
          )
          replace_count(
              "tests/test_webapp_v5_surface_upgrade.py",
              'self.assertEqual(artifact["version"], 8)',
              'self.assertEqual(artifact["version"], 9)',
              2,
          )
          replace_once(
              "tests/test_webapp_v5_surface_upgrade.py",
              'self.assertEqual(changed["artifact.webapp-core"]["to_version"], 8)',
              'self.assertEqual(changed["artifact.webapp-core"]["to_version"], 9)',
          )

          Path(".github/workflows/tmp-webapp-worklist-proof-obligations.yml").unlink()
          PY
      - name: Commit focused changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "TakashiSasaki templates automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Project artifact proof obligations into Webapp worklists"
          git push origin HEAD:agent/webapp-worklist-proof-obligations-pr12
