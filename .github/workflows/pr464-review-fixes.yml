name: PR 464 review fixes

on:
  push:
    branches:
      - agent/composition-task-ledger-browser-proof

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add temporary PR 464 fixer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/composition-task-ledger-browser-proof
          fetch-depth: 0
      - name: Apply exact review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          browser_path = Path('examples/onboarding/task-ledger/browser_proof.py')
          browser = browser_path.read_text(encoding='utf-8')
          old_controls = "const controls = ['#title', '#new-task button', '#status'];"
          new_controls = "const controls = ['#main-heading', '#title', '#new-task button', '#status'];"
          if browser.count(old_controls) != 1:
              raise SystemExit(f'expected exactly one narrow controls selector, got {browser.count(old_controls)}')
          browser = browser.replace(old_controls, new_controls, 1)
          browser_path.write_text(browser, encoding='utf-8')

          ja_path = Path('translations/ja/docs/guides/webapp-product-walkthrough.md')
          japanese = ja_path.read_text(encoding='utf-8')
          anchor = "Browser: `primary` surface、`/` の home route、実際に表示する state、tested viewport/input behavior を記述します。\n"
          paragraph = (
              "\nviewport coverage の先頭 target では `minWidthPx: 0` を維持してください。"
              "これは幅 0px のブラウザをサポートするという意味ではなく、validator が coverage graph の先頭に隙間がないことを確認するための coverage-start sentinel です。"
              "この walkthrough の実ブラウザ proof が検証する実用上の最小幅は 320px であり、`minWidthPx: 0` の sentinel と tested minimum の 320px は別の概念です。\n"
          )
          if japanese.count(anchor) != 1:
              raise SystemExit(f'expected exactly one Japanese Section 11 anchor, got {japanese.count(anchor)}')
          if 'coverage-start sentinel' not in japanese:
              japanese = japanese.replace(anchor, anchor + paragraph, 1)
          ja_path.write_text(japanese, encoding='utf-8')

          test_path = Path('tests/test_human_first_webapp_onboarding.py')
          test = test_path.read_text(encoding='utf-8')
          browser_assert_anchor = '        browser_source = BROWSER_PROOF.read_text(encoding="utf-8")\n'
          browser_assert = (
              "        self.assertIn(\n"
              "            \"const controls = ['#main-heading', '#title', '#new-task button', '#status'];\",\n"
              "            browser_source,\n"
              "        )\n"
          )
          if test.count(browser_assert_anchor) != 1:
              raise SystemExit('browser source test anchor changed')
          if "const controls = ['#main-heading'" not in test:
              test = test.replace(browser_assert_anchor, browser_assert_anchor + browser_assert, 1)

          ja_assert_anchor = '            "evidence documentを `template` modeに保ちます",\n'
          ja_assert = (
              '            "`minWidthPx: 0`",\n'
              '            "coverage-start sentinel",\n'
              '            "実用上の最小幅は 320px",\n'
              '            "sentinel と tested minimum の 320px は別の概念",\n'
          )
          if test.count(ja_assert_anchor) != 1:
              raise SystemExit('Japanese expectation anchor changed')
          if '"coverage-start sentinel",' not in test:
              test = test.replace(ja_assert_anchor, ja_assert_anchor + ja_assert, 1)
          test_path.write_text(test, encoding='utf-8')

          workflow = Path('.github/workflows/pr464-review-fixes.yml')
          workflow.unlink()
          PY
      - name: Commit review fixes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add examples/onboarding/task-ledger/browser_proof.py \
                  translations/ja/docs/guides/webapp-product-walkthrough.md \
                  tests/test_human_first_webapp_onboarding.py \
                  .github/workflows/pr464-review-fixes.yml
          git diff --cached --check
          git commit -m "Address final PR 464 review findings"
          git push origin HEAD:agent/composition-task-ledger-browser-proof
