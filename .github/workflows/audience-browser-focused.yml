name: Focused audience browser regression

on:
  pull_request:
    branches:
      - site
      - site-*
      - feat/site-*
      - perf/site-*
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - scripts/check_audience_*.py
      - tests/test_check_audience_*.py

permissions:
  contents: read
  actions: read

concurrency:
  group: focused-audience-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify focused audience diagnostic
    runs-on: ubuntu-24.04
    outputs:
      eligible: ${{ steps.scope.outputs.eligible }}
      reason: ${{ steps.scope.outputs.reason }}
      changed_paths: ${{ steps.scope.outputs.changed_paths }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require harness-only audience changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          base = os.environ['BASE_SHA']
          head = os.environ['HEAD_SHA']
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '--no-renames', base, head],
              text=True,
          ).splitlines()
          if not changed:
              raise SystemExit('focused audience classifier received an empty diff')

          def allowed(path: str) -> bool:
              return (
                  path.startswith('scripts/check_audience_') and path.endswith('.py')
              ) or (
                  path.startswith('tests/test_check_audience_') and path.endswith('.py')
              )

          harness_changed = any(
              path.startswith('scripts/check_audience_') and path.endswith('.py')
              for path in changed
          )
          eligible = harness_changed and all(allowed(path) for path in changed)
          reason = (
              'harness-only audience browser change'
              if eligible
              else 'diff includes product/build/CI-control paths; canonical CI remains authoritative'
          )
          output = Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a', encoding='utf-8') as stream:
              stream.write(f"eligible={'true' if eligible else 'false'}\n")
              stream.write(f"reason={reason}\n")
              stream.write('changed_paths=' + ','.join(changed) + '\n')
          PY
      - name: Record focused-lane scope
        env:
          ELIGIBLE: ${{ steps.scope.outputs.eligible }}
          REASON: ${{ steps.scope.outputs.reason }}
          CHANGED: ${{ steps.scope.outputs.changed_paths }}
        run: |
          {
            echo '### Focused audience browser diagnostic'
            echo
            echo "- eligible: \`$ELIGIBLE\`"
            echo "- reason: $REASON"
            echo "- changed paths: \`$CHANGED\`"
            echo '- authority: diagnostic only; canonical Site CI remains the merge/qualification authority.'
          } >> "$GITHUB_STEP_SUMMARY"

  focused:
    name: Run focused audience browser diagnostic
    needs: classify
    if: ${{ needs.classify.outputs.eligible == 'true' }}
    runs-on: ubuntu-24.04
    outputs:
      artifact_available: ${{ steps.base_artifact.outputs.available }}
      producer_run: ${{ steps.base_artifact.outputs.producer_run }}
    steps:
      - name: Check out proposed checker revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Reuse qualified PR-base Pages artifact
        id: base_artifact
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          python scripts/fetch_base_site_artifact.py \
            --target build/site \
            --metadata build/focused-audience-base-artifact.json \
            --github-output "$GITHUB_OUTPUT"
          status=$?
          set -e
          if [ "$status" -eq 3 ]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'No qualified base artifact is currently reusable; canonical CI remains authoritative.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$status"
      - name: Check out artifact Composition publication
        if: ${{ steps.base_artifact.outputs.available == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.base_artifact.outputs.composition_revision }}
          path: composition-source
          persist-credentials: false
      - name: Check out artifact Policy publication
        if: ${{ steps.base_artifact.outputs.available == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.base_artifact.outputs.policy_revision }}
          path: policy-source
          persist-credentials: false
      - name: Set up Python
        if: ${{ steps.base_artifact.outputs.available == 'true' }}
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-visual.txt
      - name: Install Playwright controller
        if: ${{ steps.base_artifact.outputs.available == 'true' }}
        run: python -m pip install --disable-pip-version-check -r requirements-visual.txt
      - name: Verify system Chrome runtime
        if: ${{ steps.base_artifact.outputs.available == 'true' }}
        run: google-chrome --version
      - name: Validate reused audience artifact contract
        if: ${{ steps.base_artifact.outputs.available == 'true' }}
        run: >-
          python scripts/check_audience_artifact.py
          --site-root build/site
          --composition-root composition-source
          --policy-root policy-source
      - name: Run focused audience browser regression
        if: ${{ steps.base_artifact.outputs.available == 'true' }}
        run: >-
          python scripts/check_audience_runtime.py
          --site-root build/site
          --output build/focused-audience/audience-runtime.json
          --composition-root composition-source
          --policy-root policy-source
      - name: Upload focused diagnostic evidence
        if: ${{ always() && steps.base_artifact.outputs.available == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: focused-audience-browser-${{ github.event.pull_request.number }}
          path: |
            build/focused-audience
            build/focused-audience-base-artifact.json
          if-no-files-found: error
          retention-days: 7
      - name: Record artifact reuse
        if: ${{ steps.base_artifact.outputs.available == 'true' }}
        env:
          PRODUCER_RUN: ${{ steps.base_artifact.outputs.producer_run }}
          ARTIFACT_ID: ${{ steps.base_artifact.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.base_artifact.outputs.artifact_digest }}
        run: |
          {
            echo '### Focused artifact reuse'
            echo
            echo "- producer run: \`$PRODUCER_RUN\`"
            echo "- artifact: \`$ARTIFACT_ID\`"
            echo "- digest: \`$ARTIFACT_DIGEST\`"
            echo '- result: PR-head audience checker executed against the qualified PR-base Site artifact.'
            echo '- boundary: diagnostic evidence only; it does not replace exact-head canonical qualification.'
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: Focused audience browser / validate
    if: ${{ always() }}
    needs:
      - classify
      - focused
    runs-on: ubuntu-24.04
    steps:
      - name: Require coherent diagnostic result
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          ELIGIBLE: ${{ needs.classify.outputs.eligible }}
          FOCUSED_RESULT: ${{ needs.focused.result }}
          ARTIFACT_AVAILABLE: ${{ needs.focused.outputs.artifact_available }}
        run: |
          test "$CLASSIFY_RESULT" = success
          if [ "$ELIGIBLE" = true ]; then
            test "$FOCUSED_RESULT" = success
            if [ "$ARTIFACT_AVAILABLE" = true ]; then
              echo 'Focused audience browser diagnostic executed successfully.'
            else
              echo 'Focused diagnostic was eligible but no reusable base artifact was available; canonical CI remains authoritative.'
            fi
          else
            test "$FOCUSED_RESULT" = skipped
            echo 'Focused audience browser diagnostic not applicable.'
          fi
