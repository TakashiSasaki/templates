name: Create orphan webapp branch

on:
  push:
    branches:
      - site
    paths:
      - .github/workflows/create-webapp-orphan.yml

permissions:
  contents: write

concurrency:
  group: create-orphan-webapp-branch
  cancel-in-progress: false

jobs:
  create-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            repository

      - name: Create unrelated webapp history
        working-directory: repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin refs/heads/webapp >/dev/null 2>&1; then
            echo "The webapp branch already exists; refusing to replace it."
          else
            git switch --orphan webapp
            git rm -rf . >/dev/null 2>&1 || true

            cat > README.md <<'EOF'
          # Web application repository template

          This branch is an orphan branch with a history unrelated to the other
          branches in `TakashiSasaki/templates`.

          It is reserved for a technology-neutral web-application repository
          template. The template will convert relevant guidance from
          `TakashiSasaki/agent-policy` into repository structure, executable
          contracts, tests, CI, documentation, and coding-agent instructions.
          EOF

            git add README.md
            git commit -m "Initialize orphan webapp template branch"
            git push origin HEAD:refs/heads/webapp
          fi

      - name: Remove one-shot workflow from site branch
        working-directory: repository
        run: |
          set -euo pipefail
          git switch site
          git pull --ff-only origin site
          git rm .github/workflows/create-webapp-orphan.yml
          git commit -m "chore: remove one-shot webapp bootstrap workflow [skip ci]"
          git push origin HEAD:refs/heads/site
