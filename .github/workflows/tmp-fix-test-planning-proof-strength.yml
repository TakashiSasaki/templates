name: Temporary fix and test planning proof strength
on:
  push:
    branches:
      - agent/planning-proof-strength-pr21
permissions:
  contents: write
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dev dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Apply stale expectation fixes and run focused regressions
        shell: bash
        run: |
          set +e
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "tests/test_implementation_evidence_planning.py": [
                  ('self.assertIn("planning mode", webapp.stdout)', 'self.assertIn("Webapp planning targets and browser proof strength: OK", webapp.stdout)', 1),
              ],
              "tests/test_planning_consumer_validation.py": [
                  ('"planning mode; product target coverage pending",', '"Webapp planning targets and browser proof strength: OK",', 1),
              ],
              "tests/test_web_interface_contract.py": [
                  ('self.assertEqual(descriptor["version"], 2)', 'self.assertEqual(descriptor["version"], 3)', 1),
              ],
              "tests/test_mcp_interface_contract.py": [
                  ('self.assertEqual(descriptor["version"], 2)', 'self.assertEqual(descriptor["version"], 3)', 1),
              ],
              "tests/test_mcp_apps_contract.py": [
                  ('self.assertEqual(descriptor["version"], 2)', 'self.assertEqual(descriptor["version"], 3)', 1),
              ],
              "tests/test_webapp_neutral_seed.py": [
                  ('self.assertEqual(descriptor["version"], 11)', 'self.assertEqual(descriptor["version"], 12)', 1),
              ],
              "tests/test_webapp_v4_upgrade.py": [
                  ('self.assertEqual(artifact["version"], 11)', 'self.assertEqual(artifact["version"], 12)', 1),
                  ('self.assertEqual(changed["artifact.webapp-core"]["to_version"], 11)', 'self.assertEqual(changed["artifact.webapp-core"]["to_version"], 12)', 1),
              ],
              "tests/test_webapp_v5_surface_upgrade.py": [
                  ('self.assertEqual(artifact["version"], 11)', 'self.assertEqual(artifact["version"], 12)', 2),
                  ('self.assertEqual(changed["artifact.webapp-core"]["to_version"], 11)', 'self.assertEqual(changed["artifact.webapp-core"]["to_version"], 12)', 1),
              ],
          }

          for relative, edits in replacements.items():
              path = Path(relative)
              text = path.read_text(encoding="utf-8")
              for old, new, expected_count in edits:
                  actual = text.count(old)
                  if actual != expected_count:
                      raise SystemExit(
                          f"{relative}: expected {expected_count} occurrences of {old!r}, found {actual}"
                      )
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY
          patch_status=$?

          python - <<'PY' > /tmp/version-audit.txt
          from pathlib import Path
          import json
          import re

          components = [
              "artifact.webapp-core",
              "capability.cli",
              "capability.service",
              "capability.web-interface",
              "capability.mcp",
              "capability.mcp-apps",
          ]
          print("CURRENT COMPONENT VERSIONS")
          for component in components:
              data = json.loads((Path("components") / component / "component.json").read_text(encoding="utf-8"))
              print(f"{component}={data['version']}")

          print("\nREPOSITORY-WIDE TEST VERSION ASSERTIONS / TRANSITIONS")
          patterns = (
              'descriptor["version"]',
              'artifact["version"]',
              '["from_version"]',
              '["to_version"]',
          )
          for path in sorted(Path("tests").rglob("*.py")):
              lines = path.read_text(encoding="utf-8").splitlines()
              for lineno, line in enumerate(lines, 1):
                  if any(pattern in line for pattern in patterns):
                      print(f"{path}:{lineno}:{line.strip()}")
          PY

          if [ "$patch_status" -eq 0 ]; then
            PYTHONDONTWRITEBYTECODE=1 python -m unittest \
              tests.test_planning_target_proof_strength \
              tests.test_implementation_evidence_planning \
              tests.test_planning_consumer_validation \
              tests.test_webapp_evidence_scaffold \
              tests.test_cli_interface_contract \
              tests.test_service_interface_contract \
              tests.test_web_interface_contract \
              tests.test_mcp_interface_contract \
              tests.test_mcp_apps_contract \
              tests.test_webapp_neutral_seed \
              tests.test_webapp_v4_upgrade \
              tests.test_webapp_v5_surface_upgrade
            test_status=$?
          else
            test_status=$patch_status
          fi
          echo "$test_status" > /tmp/focused-status.txt
          exit 0
      - name: Upload version audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planning-proof-version-audit
          path: /tmp/version-audit.txt
          if-no-files-found: warn
      - name: Commit fixes, self-delete, and preserve test result
        if: always()
        shell: bash
        run: |
          status=1
          if [ -f /tmp/focused-status.txt ]; then
            status=$(cat /tmp/focused-status.txt)
          fi
          rm -f .github/workflows/tmp-fix-test-planning-proof-strength.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Refresh planning proof-strength regression expectations"
            git push
          fi
          exit "$status"
