name: PR 464 zoom reachability fix

on:
  push:
    branches:
      - agent/composition-task-ledger-browser-proof

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/composition-task-ledger-browser-proof
          fetch-depth: 0
      - name: Apply fixes
        shell: bash
        run: |
          python -c "import base64,zlib;open('/tmp/pr464.sh','wb').write(zlib.decompress(base64.b64decode('')) )"
          bash /tmp/pr464.sh
