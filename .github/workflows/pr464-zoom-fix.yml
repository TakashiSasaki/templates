name: PR 464 zoom reachability fix

on:
  push:
    branches:
      - agent/composition-task-ledger-browser-proof

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run PR 464 zoom reachability fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/composition-task-ledger-browser-proof
          fetch-depth: 0

      - name: Patch zoom proof and regression expectation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          browser_path = Path('examples/onboarding/task-ledger/browser_proof.py')
          browser = browser_path.read_text(encoding='utf-8')
          old = '''            const viewport = window.visualViewport;
            const controls = [
              ...['#main-heading', '#title', '#new-task button', '#status'].map(
                (selector) => document.querySelector(selector)
              ),
              ...document.querySelectorAll('#tasks li span, #tasks li button'),
            ];
            const effectivelyVisible = (element) => {
              for (let current = element; current; current = current.parentElement) {
                const style = getComputedStyle(current);
                if (style.display === 'none' || style.visibility === 'hidden'
                    || Number.parseFloat(style.opacity || '1') <= 0) return false;
              }
              return true;
            };
            const reachable = controls.length >= 7 && controls.every((element) => {
              const rect = element?.getBoundingClientRect();
              if (!element || !effectivelyVisible(element)
                  || !rect || rect.width <= 0 || rect.height <= 0
                  || rect.left < viewport.offsetLeft
                  || rect.right > viewport.offsetLeft + viewport.width
                  || rect.top < viewport.offsetTop
                  || rect.bottom > viewport.offsetTop + viewport.height) return false;
              const hit = document.elementFromPoint(
                rect.left + rect.width / 2,
                rect.top + rect.height / 2,
              );
              return hit === element || element.contains(hit);
            });
            return {
              scale: viewport?.scale || 0,
              reachable,
              layoutOverflow: document.documentElement.scrollWidth > window.innerWidth + 1,
            };
'''
          new = '''            const viewport = window.visualViewport;
            const controls = [
              ...['#main-heading', '#title', '#new-task button', '#status'].map(
                (selector) => document.querySelector(selector)
              ),
              ...document.querySelectorAll('#tasks li span, #tasks li button'),
            ];
            const effectivelyVisible = (element) => {
              for (let current = element; current; current = current.parentElement) {
                const style = getComputedStyle(current);
                if (style.display === 'none' || style.visibility === 'hidden'
                    || Number.parseFloat(style.opacity || '1') <= 0) return false;
              }
              return true;
            };
            const reachable = controls.length >= 7 && controls.every((element) => {
              if (!element || !effectivelyVisible(element)) return false;
              element.scrollIntoView({block: 'center', inline: 'nearest'});
              const currentViewport = window.visualViewport;
              const rect = element.getBoundingClientRect();
              if (!currentViewport || rect.width <= 0 || rect.height <= 0
                  || rect.left < currentViewport.offsetLeft
                  || rect.right > currentViewport.offsetLeft + currentViewport.width
                  || rect.top < currentViewport.offsetTop
                  || rect.bottom > currentViewport.offsetTop + currentViewport.height) return false;
              const hit = document.elementFromPoint(
                rect.left + rect.width / 2,
                rect.top + rect.height / 2,
              );
              return hit === element || element.contains(hit);
            });
            return {
              scale: viewport?.scale || 0,
              reachable,
              layoutOverflow: document.documentElement.scrollWidth > window.innerWidth + 1,
            };
'''
          if browser.count(old) != 1:
              raise SystemExit(f'zoom reachability block: expected 1 match, got {browser.count(old)}')
          browser_path.write_text(browser.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/test_human_first_webapp_onboarding.py')
          test = test_path.read_text(encoding='utf-8')
          old_expected = '            "`[\\\\\\\"ready\\\\\\\", \\\\\\\"empty\\\\\\\", \\\\\\\"error\\\\\\\"]`",\n'
          new_expected = '            \'`["ready", "empty", "error"]`\',\n'
          if test.count(old_expected) != 1:
              raise SystemExit(f'Japanese state expectation: expected 1 match, got {test.count(old_expected)}')
          test_path.write_text(test.replace(old_expected, new_expected, 1), encoding='utf-8')
          PY

          git rm .github/workflows/pr464-zoom-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add examples/onboarding/task-ledger/browser_proof.py tests/test_human_first_webapp_onboarding.py
          git diff --cached --check
          git commit -m "Fix zoom reachability proof semantics"
          git rev-parse HEAD > /tmp/proof-revision

      - name: Repin immutable proof and translation provenance
        shell: bash
        run: |
          export PROOF_REVISION="$(cat /tmp/proof-revision)"
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path

          revision = os.environ['PROOF_REVISION']
          old_revision = 'd921437bfd1d7a53e7c238222b9e420c3d302a95'
          paths = [
              Path('docs/guides/webapp-product-walkthrough.md'),
              Path('translations/ja/docs/guides/webapp-product-walkthrough.md'),
              Path('tests/test_human_first_webapp_onboarding.py'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              count = text.count(old_revision)
              if count != 1:
                  raise SystemExit(f'{path}: expected one old proof revision, got {count}')
              path.write_text(text.replace(old_revision, revision, 1), encoding='utf-8')

          canonical = Path('docs/guides/webapp-product-walkthrough.md')
          data = canonical.read_bytes()
          blob_sha = hashlib.sha1(f'blob {len(data)}\0'.encode('ascii') + data).hexdigest()
          manifest_path = Path('translations/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          matches = [
              item for item in manifest['translations']
              if item['canonical'] == canonical.as_posix() and item['language'] == 'ja'
          ]
          if len(matches) != 1:
              raise SystemExit(f'expected one Japanese walkthrough provenance entry, got {len(matches)}')
          matches[0]['canonical_blob_sha'] = blob_sha
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          git add docs/guides/webapp-product-walkthrough.md \
                  translations/ja/docs/guides/webapp-product-walkthrough.md \
                  tests/test_human_first_webapp_onboarding.py \
                  translations/manifest.json
          git diff --cached --check
          git commit -m "Repin Task Ledger browser proof after zoom fix"
          git push origin HEAD:agent/composition-task-ledger-browser-proof
