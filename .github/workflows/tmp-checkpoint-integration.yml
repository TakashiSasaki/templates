name: Temporary checkpoint integration regressions

on:
  push:
    branches:
      - agent/lifecycle-checkpoint-authority

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-deps -r requirements-dev.lock
      - name: Run focused core regressions
        run: >-
          python -m unittest
          tests/test_catalog_consumer_selection_guide.py
          tests/test_composer_generated_material.py
          tests/test_composer_mvp.py
          tests/test_composer_post_apply_guidance.py
          tests/test_composer_public_lifecycle_acceptance.py
          tests/test_composer_upgrade.py
          tests/test_mcp_apps_product_integration.py
          tests/test_mcp_interface_contract.py
          tests/test_pr3_production_catalog.py
          tests/test_production_catalog.py
          tests/test_web_interface_materialized_validation.py
          tests/test_lifecycle_checkpoints.py
          tests/test_lifecycle_checkpoint_writer.py
          tests/test_lifecycle_checkpoint_upgrade_boundary.py

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-deps -r requirements-dev.lock
      - name: Prepare ChromeDriver
        run: |
          driver_path="$(python -I scripts/prepare_chromedriver.py --output-dir "$RUNNER_TEMP/composition-chromedriver")"
          echo "CHROMEWEBDRIVER=$driver_path" >> "$GITHUB_ENV"
      - name: Run checkpointed browser product regressions
        run: >-
          python -m unittest
          tests/test_task_ledger_walkthrough_browser_acceptance.py
          tests/test_webapp_productization_acceptance.py
