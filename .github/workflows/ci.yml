name: Policy CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: policy-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONHOME: ""
      PYTHONPATH: ""
      PYTHONNOUSERSITE: "1"
      PIP_PYTHON: ""
      PIP_CACHE_DIR: ""
      PIP_NO_CACHE_DIR: ""
      PIP_QUIET: ""
      PIP_LOG: ""
      PIP_CONFIG_FILE: /dev/null
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch policy source history
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.number }}
          PUSH_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            source_ref="refs/pull/${PR_NUMBER}/head"
          else
            source_ref="$PUSH_REF"
          fi
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            shallow_args=(--unshallow)
          else
            shallow_args=()
          fi
          git fetch --no-tags "${shallow_args[@]}" origin \
            "+${source_ref}:refs/remotes/origin/policy-source"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Create isolated CI environment
        run: python -I -m venv --clear .venv

      - name: Install locked CI dependencies
        run: env -u PIP_REQUIREMENT -u PIP_CONSTRAINT -u PIP_BUILD_CONSTRAINT -u PIP_REQUIRE_HASHES -u PIP_DRY_RUN -u PIP_NO_BINARY -u PIP_ONLY_BINARY -u PIP_PLATFORM -u PIP_PYTHON_VERSION -u PIP_IMPLEMENTATION -u PIP_ABI -u PIP_UPLOADED_PRIOR_TO -u PIP_INDEX_URL -u PIP_EXTRA_INDEX_URL -u PIP_NO_INDEX -u PIP_FIND_LINKS -u PIP_TARGET -u PIP_PREFIX -u PIP_ROOT -u PIP_USER -u PIP_PYTHON -u PIP_CACHE_DIR -u PIP_NO_CACHE_DIR -u PIP_QUIET -u PIP_EDITABLE -u PIP_GROUP -u PIP_REQUIREMENTS_FROM_SCRIPT -u PIP_REPORT -u PIP_CONFIG_SETTINGS -u PIP_IGNORE_REQUIRES_PYTHON -u PIP_LOG .venv/bin/python -m pip install --disable-pip-version-check --no-deps --requirement requirements-ci.lock

      - name: Install agent-policy without dependency resolution
        run: env -u PIP_REQUIREMENT -u PIP_CONSTRAINT -u PIP_BUILD_CONSTRAINT -u PIP_REQUIRE_HASHES -u PIP_DRY_RUN -u PIP_NO_BINARY -u PIP_ONLY_BINARY -u PIP_PLATFORM -u PIP_PYTHON_VERSION -u PIP_IMPLEMENTATION -u PIP_ABI -u PIP_UPLOADED_PRIOR_TO -u PIP_INDEX_URL -u PIP_EXTRA_INDEX_URL -u PIP_NO_INDEX -u PIP_FIND_LINKS -u PIP_TARGET -u PIP_PREFIX -u PIP_ROOT -u PIP_USER -u PIP_PYTHON -u PIP_CACHE_DIR -u PIP_NO_CACHE_DIR -u PIP_QUIET -u PIP_EDITABLE -u PIP_GROUP -u PIP_REQUIREMENTS_FROM_SCRIPT -u PIP_REPORT -u PIP_CONFIG_SETTINGS -u PIP_IGNORE_REQUIRES_PYTHON -u PIP_LOG .venv/bin/python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .

      - name: Verify installed distribution set
        run: .venv/bin/python scripts/verify_ci_environment.py

      - name: Verify installed dependency graph
        run: .venv/bin/python -m pip check

      - name: Verify stable release synchronization
        run: env -u PIP_REQUIREMENT -u PIP_CONSTRAINT -u PIP_BUILD_CONSTRAINT -u PIP_REQUIRE_HASHES -u PIP_DRY_RUN -u PIP_NO_BINARY -u PIP_ONLY_BINARY -u PIP_PLATFORM -u PIP_PYTHON_VERSION -u PIP_IMPLEMENTATION -u PIP_ABI -u PIP_UPLOADED_PRIOR_TO -u PIP_INDEX_URL -u PIP_EXTRA_INDEX_URL -u PIP_NO_INDEX -u PIP_FIND_LINKS -u PIP_TARGET -u PIP_PREFIX -u PIP_ROOT -u PIP_USER -u PIP_PYTHON -u PIP_CACHE_DIR -u PIP_NO_CACHE_DIR -u PIP_QUIET -u PIP_EDITABLE -u PIP_GROUP -u PIP_REQUIREMENTS_FROM_SCRIPT -u PIP_REPORT -u PIP_CONFIG_SETTINGS -u PIP_IGNORE_REQUIRES_PYTHON -u PIP_LOG .venv/bin/python scripts/verify-release-state.py --git-ref refs/remotes/origin/policy-source

      - name: Verify trusted review promotion candidate
        run: env -u PIP_REQUIREMENT -u PIP_CONSTRAINT -u PIP_BUILD_CONSTRAINT -u PIP_REQUIRE_HASHES -u PIP_DRY_RUN -u PIP_NO_BINARY -u PIP_ONLY_BINARY -u PIP_PLATFORM -u PIP_PYTHON_VERSION -u PIP_IMPLEMENTATION -u PIP_ABI -u PIP_UPLOADED_PRIOR_TO -u PIP_INDEX_URL -u PIP_EXTRA_INDEX_URL -u PIP_NO_INDEX -u PIP_FIND_LINKS -u PIP_TARGET -u PIP_PREFIX -u PIP_ROOT -u PIP_USER -u PIP_PYTHON -u PIP_CACHE_DIR -u PIP_NO_CACHE_DIR -u PIP_QUIET -u PIP_EDITABLE -u PIP_GROUP -u PIP_REQUIREMENTS_FROM_SCRIPT -u PIP_REPORT -u PIP_CONFIG_SETTINGS -u PIP_IGNORE_REQUIRES_PYTHON -u PIP_LOG .venv/bin/python scripts/verify_trusted_review_candidate.py --git-ref refs/remotes/origin/policy-source

      - name: Verify skill installer publication
        run: .venv/bin/python scripts/verify_skill_installer_release.py --git-ref refs/remotes/origin/policy-source

      - name: Validate translations
        run: .venv/bin/python scripts/validate_translations.py

      - name: Check formatting and static rules
        run: |
          .venv/bin/python -m ruff --version
          .venv/bin/python -m ruff check src tests scripts skills/agent-policy/scripts

      - name: Run tests
        run: .venv/bin/python -m pytest

      - name: Compile Python sources
        run: .venv/bin/python -m compileall -q src scripts skills/agent-policy/scripts

      - name: Verify installed command
        run: .venv/bin/agent-policy --help
