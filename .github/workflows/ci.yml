name: Policy CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: policy-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ""
      PIP_CONFIG_FILE: /dev/null
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Fetch policy source history
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.number }}
          PUSH_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            source_ref="refs/pull/${PR_NUMBER}/head"
          else
            source_ref="$PUSH_REF"
          fi
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            shallow_args=(--unshallow)
          else
            shallow_args=()
          fi
          git fetch --no-tags "${shallow_args[@]}" origin \
            "+${source_ref}:refs/remotes/origin/policy-source"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Create isolated CI environment
        run: python -m venv --clear .venv

      - name: Install locked CI dependencies
        run: env -u PIP_REQUIREMENT -u PIP_CONSTRAINT -u PIP_EDITABLE -u PIP_GROUP -u PIP_REQUIREMENTS_FROM_SCRIPT .venv/bin/python -m pip install --disable-pip-version-check --no-deps --requirement requirements-ci.lock

      - name: Install agent-policy without dependency resolution
        run: env -u PIP_REQUIREMENT -u PIP_CONSTRAINT -u PIP_EDITABLE -u PIP_GROUP -u PIP_REQUIREMENTS_FROM_SCRIPT .venv/bin/python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .

      - name: Verify installed distribution set
        run: .venv/bin/python scripts/verify_ci_environment.py

      - name: Verify installed dependency graph
        run: .venv/bin/python -m pip check

      - name: Verify stable release synchronization
        run: .venv/bin/python scripts/verify-release-state.py --git-ref refs/remotes/origin/policy-source

      - name: Check formatting and static rules
        run: |
          .venv/bin/python -m ruff --version
          .venv/bin/python -m ruff check src tests scripts skills/bootstrap-agent-policy/scripts

      - name: Run tests
        run: .venv/bin/python -m pytest

      - name: Compile Python sources
        run: .venv/bin/python -m compileall -q src scripts skills/bootstrap-agent-policy/scripts

      - name: Verify installed command
        run: .venv/bin/agent-policy --help
