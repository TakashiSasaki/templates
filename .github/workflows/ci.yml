name: Policy CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: policy-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install locked CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.lock

      - name: Install agent-policy without dependency resolution
        run: python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .

      - name: Verify installed dependency graph
        run: python -m pip check

      - name: Check formatting and static rules
        run: |
          ruff --version
          ruff check src tests scripts skills/bootstrap-agent-policy/scripts

      - name: Run tests
        run: pytest

      - name: Compile Python sources
        run: python -m compileall -q src scripts skills/bootstrap-agent-policy/scripts
