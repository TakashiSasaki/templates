name: Validate extended profile contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  extended-profile-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up minimum supported Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python validator dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3

      - name: Test shared profile contract model
        shell: bash
        run: ruby .github/scripts/test-profile-contract-model.rb

      - name: Test shared Python profile contract model
        shell: bash
        run: python .github/scripts/test_profile_contract_model.py

      - name: Test Python review-fix regressions
        shell: bash
        run: python .github/scripts/test_python_review_fixes.py

      - name: Test direct profile contract validation
        shell: bash
        run: ruby .github/scripts/test-direct-profile-contracts.rb

      - name: Test minimal profile repository layouts
        shell: bash
        run: ruby .github/scripts/test-minimal-profile-layouts.rb

      - name: Test clean-room template adoption and installation
        shell: bash
        run: ruby .github/scripts/test-copyable-template-consumption.rb

      - name: Test parent-owned vendoring
        shell: bash
        run: ruby .github/scripts/test-parent-owned-vendoring.rb

      - name: Test script-assisted optional-runtime profile fixture
        shell: bash
        run: ruby .github/scripts/test-script-assisted-runtime-profile.rb

      - name: Test packaged CLI profile fixture
        shell: bash
        run: ruby .github/scripts/test-packaged-cli-profile.rb

      - name: Test decomposed interface contract validation
        shell: bash
        run: ruby .github/scripts/test-decomposed-interface-contracts.rb

      - name: Test selected scalar placeholder rejection
        shell: bash
        run: ruby .github/scripts/test-selected-contract-scalar-placeholders.rb

      - name: Test CLI structured-output contract
        shell: bash
        run: ruby .github/scripts/test-cli-structured-output-contract.rb

      - name: Test Ruby and Python CLI validator parity
        shell: bash
        run: python .github/scripts/test_python_cli_contract_parity.py

      - name: Test initial Ruby and Python validator parity
        shell: bash
        run: python .github/scripts/test_python_initial_validator_parity.py

      - name: Test concrete and late-review Ruby/Python parity
        shell: bash
        run: python .github/scripts/test_python_cutover_validator_parity.py

      - name: Test interface routing/decomposition Ruby/Python parity
        shell: bash
        run: python .github/scripts/test_python_interface_validator_parity.py

      - name: Test interface runtime/summary Ruby/Python parity
        shell: bash
        run: python .github/scripts/test_python_runtime_summary_validator_parity.py

      - name: Test bundled MCP client Ruby/Python parity
        shell: bash
        run: python .github/scripts/test_python_bundled_mcp_validator_parity.py

      - name: Test core/extended Ruby/Python parity
        shell: bash
        run: python .github/scripts/test_python_core_extended_validator_parity.py

      - name: Test MCP runtime-authority declaration
        shell: bash
        run: ruby .github/scripts/test-mcp-runtime-authority.rb

      - name: Test browser-interface routing
        shell: bash
        run: ruby .github/scripts/test-browser-interface-routing.rb

      - name: Test MCP caller-behavior placeholder rejection
        shell: bash
        run: ruby .github/scripts/test-mcp-behavior-section-placeholders.rb

      - name: Test bundled MCP client consistency
        shell: bash
        run: ruby .github/scripts/test-bundled-mcp-client-consistency.rb

      - name: Test endpoint and operational-summary consistency
        shell: bash
        run: ruby .github/scripts/test-interface-summary-details.rb

      - name: Test concrete CLI exit-code meanings
        shell: bash
        run: ruby .github/scripts/test-cli-exit-code-meanings.rb

      - name: Validate Python review follow-up contracts in the copyable template
        shell: bash
        working-directory: template
        run: python .github/scripts/validate_review_followup_contracts.py

      - name: Validate all profile contracts in the copyable template
        shell: bash
        working-directory: template
        run: ruby .github/scripts/validate-profile-contracts.rb

  cli-mcp-combined-profile-fixture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up minimum supported Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"

      - name: Install Bundler
        shell: bash
        run: gem install bundler --no-document

      - name: Test combined packaged CLI and MCP profile fixture
        shell: bash
        run: ruby .github/scripts/test-cli-mcp-combined-profile.rb

  mcp-enabled-profile-fixture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up minimum supported Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"

      - name: Install Bundler
        shell: bash
        run: gem install bundler --no-document

      - name: Test MCP-enabled profile fixture
        shell: bash
        run: ruby .github/scripts/test-mcp-enabled-profile.rb

  mcp-systemd-service-profile-fixture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up minimum supported Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"

      - name: Install Bundler
        shell: bash
        run: gem install bundler --no-document

      - name: Test MCP systemd service profile fixture
        shell: bash
        run: ruby .github/scripts/test-mcp-systemd-service-profile.rb

      - name: Install fixture dependencies for systemd smoke
        shell: bash
        working-directory: .github/fixtures/profiles/mcp-systemd-service
        run: |
          bundle config set --local path .bundle
          bundle install --jobs 4 --retry 3

      - name: Test real systemd lifecycle
        shell: bash
        working-directory: .github/fixtures/profiles/mcp-systemd-service
        run: bundle exec bash tests/systemd_smoke.sh

  browser-interface-profile-fixture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up minimum supported Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"

      - name: Install Bundler
        shell: bash
        run: gem install bundler --no-document

      - name: Test browser-interface profile fixture
        shell: bash
        run: ruby .github/scripts/test-browser-interface-profile.rb

  headless-service-profile-fixture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up minimum supported Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"

      - name: Install Bundler
        shell: bash
        run: gem install bundler --no-document

      - name: Test headless-service profile fixture
        shell: bash
        run: ruby .github/scripts/test-headless-service-profile.rb

      - name: Test restrictive-umask PID lifecycle
        shell: bash
        working-directory: .github/fixtures/profiles/headless-service
        run: |
          bundle config set --local path .bundle
          bundle install --jobs 4 --retry 3
          bundle exec ruby ../../../scripts/test-headless-service-restrictive-umask.rb

      - name: Test atomic PID-record publication
        shell: bash
        working-directory: .github/fixtures/profiles/headless-service
        run: bundle exec ruby ../../../scripts/test-headless-service-pid-publication.rb
