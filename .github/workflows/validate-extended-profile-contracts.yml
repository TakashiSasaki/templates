name: Validate extended profile contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  extended-profile-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test shared profile contract model
        shell: bash
        run: ruby .github/scripts/test-profile-contract-model.rb

      - name: Test direct profile contract validation
        shell: bash
        run: ruby .github/scripts/test-direct-profile-contracts.rb

      - name: Test minimal profile repository layouts
        shell: bash
        run: ruby .github/scripts/test-minimal-profile-layouts.rb

      - name: Test packaged CLI profile fixture
        shell: bash
        run: ruby .github/scripts/test-packaged-cli-profile.rb

      - name: Test decomposed interface contract validation
        shell: bash
        run: ruby .github/scripts/test-decomposed-interface-contracts.rb

      - name: Test selected scalar placeholder rejection
        shell: bash
        run: ruby .github/scripts/test-selected-contract-scalar-placeholders.rb

      - name: Test CLI structured-output contract
        shell: bash
        run: ruby .github/scripts/test-cli-structured-output-contract.rb

      - name: Test MCP runtime-authority declaration
        shell: bash
        run: ruby .github/scripts/test-mcp-runtime-authority.rb

      - name: Test browser-interface routing
        shell: bash
        run: ruby .github/scripts/test-browser-interface-routing.rb

      - name: Test MCP caller-behavior placeholder rejection
        shell: bash
        run: ruby .github/scripts/test-mcp-behavior-section-placeholders.rb

      - name: Test bundled MCP client consistency
        shell: bash
        run: ruby .github/scripts/test-bundled-mcp-client-consistency.rb

      - name: Test endpoint and operational-summary consistency
        shell: bash
        run: ruby .github/scripts/test-interface-summary-details.rb

      - name: Test concrete CLI exit-code meanings
        shell: bash
        run: ruby .github/scripts/test-cli-exit-code-meanings.rb

      - name: Validate all profile contracts
        shell: bash
        run: ruby .github/scripts/validate-profile-contracts.rb

  mcp-enabled-profile-fixture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up minimum supported Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"

      - name: Install Bundler
        shell: bash
        run: gem install bundler --no-document

      - name: Test MCP-enabled profile fixture
        shell: bash
        run: ruby .github/scripts/test-mcp-enabled-profile.rb

  browser-interface-profile-fixture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up minimum supported Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"

      - name: Install Bundler
        shell: bash
        run: gem install bundler --no-document

      - name: Test browser-interface profile fixture
        shell: bash
        run: ruby .github/scripts/test-browser-interface-profile.rb
