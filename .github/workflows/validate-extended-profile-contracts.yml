name: Validate extended profile contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  extended-profile-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python validator dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3

      - name: Test shared Python profile contract model
        run: python .github/scripts/test_profile_contract_model.py

      - name: Test Python review-fix regressions
        run: python .github/scripts/test_python_review_fixes.py

      - name: Test minimal profile repository layouts
        run: python .github/scripts/test_minimal_profile_layouts.py

      - name: Test clean-room template adoption and installation
        run: python .github/scripts/test_copyable_template_consumption.py

      - name: Test parent-owned vendoring
        run: python .github/scripts/test_parent_owned_vendoring.py

      - name: Test script-assisted optional-runtime profile fixture
        run: python .github/scripts/test_script_assisted_runtime_profile.py

      - name: Test packaged CLI profile fixture
        run: python .github/scripts/test_packaged_cli_profile.py

      - name: Test canonical profile and interface mutations
        run: python .github/scripts/test_contract_regressions.py

      - name: Test direct Python CLI contract matrices
        run: python .github/scripts/test_cli_contract_regressions.py

      - name: Test MCP extension selection and Apps activation
        run: python .github/scripts/test_mcp_extensions_contract.py

      - name: Validate review follow-up contracts in the copyable template
        working-directory: template
        run: python .github/scripts/validate_review_followup_contracts.py

      - name: Validate the copyable template repository
        working-directory: template
        run: python .github/scripts/validate_skill_repository.py

  mcp-enabled-profile-fixture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js for MCP 2026-07-28 fixture
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python validator dependencies
        run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3

      - name: Test MCP 2026-07-28 Modern profile fixture
        run: python .github/scripts/test_mcp_enabled_profile.py

  mcp-apps-enabled-profile-fixture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js for MCP Apps fixture
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python validator dependencies
        run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3

      - name: Test MCP Apps executable profile fixture
        run: python .github/scripts/test_mcp_apps_enabled_profile.py

  browser-interface-profile-fixture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python validator dependencies
        run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3

      - name: Test browser-interface profile fixture
        run: python .github/scripts/test_browser_interface_profile.py

  headless-service-profile-fixture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python validator dependencies
        run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3

      - name: Test headless-service profile fixture
        run: python .github/scripts/test_headless_service_profile.py

      - name: Test restrictive-umask PID lifecycle
        run: python .github/scripts/test_headless_service_restrictive_umask.py

      - name: Test atomic PID-record publication
        run: python .github/scripts/test_headless_service_pid_publication.py
