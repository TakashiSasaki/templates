name: Validate extended profile contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  extended-profile-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test decomposed interface contract validation
        shell: bash
        run: ruby .github/scripts/test-decomposed-interface-compat.rb

      - name: Test endpoint and operational-summary consistency
        shell: bash
        run: ruby .github/scripts/test-interface-summary-details.rb

      - name: Test concrete CLI exit-code meanings
        shell: bash
        run: ruby .github/scripts/test-cli-exit-code-meanings.rb

      - name: Validate scaffold, helper, and MCP contracts
        shell: bash
        run: ruby .github/scripts/validate-profile-contracts.rb .github/scripts/validate-extended-profile-contracts.rb

      - name: Validate concrete profile consistency
        shell: bash
        run: ruby .github/scripts/validate-profile-contracts.rb .github/scripts/validate-concrete-profile-consistency.rb

      - name: Validate review follow-up contracts
        shell: bash
        run: ruby .github/scripts/validate-profile-contracts.rb .github/scripts/validate-review-followup-contracts.rb

      - name: Validate late-review runtime contracts
        shell: bash
        run: ruby .github/scripts/validate-profile-contracts.rb .github/scripts/validate-late-review-contracts.rb
