name: Validate extended profile contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  extended-profile-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate scaffold, helper, and MCP contracts
        shell: bash
        run: ruby .github/scripts/validate-extended-profile-contracts.rb
