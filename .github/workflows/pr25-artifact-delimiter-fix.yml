name: PR 25 escaped artifact delimiter fix

on:
  push:
    branches:
      - site-generated-link-validation

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: site-generated-link-validation
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply focused fix and regression tests
        run: |
          python - <<'PY'
          from pathlib import Path

          script_path = Path('scripts/validate_site_links.py')
          script = script_path.read_text(encoding='utf-8')
          old = '_ENCODED_PATH_SEPARATOR = re.compile(r"%(?:2f|5c|3f|23)", re.IGNORECASE)'
          new = '_ENCODED_PATH_SEPARATOR = re.compile(r"%(?:2f|5c)", re.IGNORECASE)'
          if old not in script and new not in script:
              raise SystemExit('encoded path separator pattern not found')
          script = script.replace(old, new)
          script = script.replace(
              '"""Decode percent escapes while keeping encoded URL delimiters in-segment."""',
              '"""Decode path data while keeping encoded separators in-segment."""',
          )
          script_path.write_text(script, encoding='utf-8')

          tests_path = Path('tests/test_site_links_review_regressions.py')
          tests = tests_path.read_text(encoding='utf-8')
          marker = '\n\nif __name__ == "__main__":\n'
          additions = r'''
    def test_decodes_escaped_query_and_fragment_delimiters_for_artifact_lookup(self) -> None:
        self.config_file.write_text(
            '[project]\nsite_url = "https://example.test/docs/"\n',
            encoding="utf-8",
        )
        self.write(
            "index.html",
            '<a href="asset%3F.txt">Question</a><a href="asset%23.txt">Hash</a>',
        )
        self.write("asset?.txt", "question\n")
        self.write("asset#.txt", "hash\n")

        result = self.run_validator()

        self.assertEqual(result.returncode, 0, result.stderr)
        self.assertIn("Validated 2 local links across 1 generated HTML pages", result.stdout)
'''
          if 'test_decodes_escaped_query_and_fragment_delimiters_for_artifact_lookup' not in tests:
              if marker not in tests:
                  raise SystemExit('test insertion marker not found')
              tests = tests.replace(marker, '\n' + additions + marker)
          tests_path.write_text(tests, encoding='utf-8')
          PY

          python -m pip install --requirement requirements.txt
          python -m unittest discover --start-directory tests --verbose

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/validate_site_links.py tests/test_site_links_review_regressions.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Decode escaped delimiters before artifact lookup'
          git push origin HEAD:site-generated-link-validation
