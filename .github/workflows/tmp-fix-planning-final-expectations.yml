name: Temporary fix planning final expectations
on:
  push:
    branches:
      - agent/planning-requirement-ledger-pr16
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/planning-requirement-ledger-pr16
          fetch-depth: 0
      - name: Apply exact test fixes
        run: |
          python .github/tmp/fix_planning_final_expectations.py
          python -m py_compile tests/test_implementation_evidence_planning.py
          python -m py_compile tests/test_small_model_clean_room_evaluation_prompt.py
          python -m py_compile tests/test_selected_component_validation.py
      - name: Commit fixes and self-delete
        run: |
          rm -f .github/tmp/fix_planning_final_expectations.py
          rm -f .github/workflows/tmp-fix-planning-final-expectations.yml
          find . -type f -name '*.pyc' -delete
          find . -type d -name '__pycache__' -empty -delete
          git config user.name 'TakashiSasaki templates automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Align final planning-mode test expectations'
          git push origin HEAD:agent/planning-requirement-ledger-pr16
