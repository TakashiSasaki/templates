name: Apply PR 161 bidi review fix

on:
  push:
    branches:
      - agent/site-index-navigation-graph
    paths:
      - .github/workflows/apply-pr161-bidi-review-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/site-index-navigation-graph
          fetch-depth: 0
      - name: Apply bounded WHATWG bidi compatibility fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/generate_index_navigation.py')
          text = path.read_text(encoding='utf-8')

          helper = '''\n\ndef whatwg_bidi_compatibility_label(label: str) -> str:\n    \"\"\"Adapt browser-compatible Arabic Extended-B letters for Bidi validation only.\"\"\"\n    return \"\".join(\n        \"a\" if 0x0870 <= ord(character) < 0x088F else character\n        for character in label\n    )\n'''
          anchor = '\n\ndef validate_ascii_punycode_labels(\n'
          if 'def whatwg_bidi_compatibility_label(' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('validate_ascii_punycode_labels anchor mismatch')
              text = text.replace(anchor, helper + anchor, 1)

          old_ascii = '''    bidi_domain = any(\n        unicodedata.bidirectional(character) in {\"R\", \"AL\", \"AN\"}\n        for label in decoded_alabels\n        for character in label\n    )\n    if bidi_domain:\n        for label in decoded_alabels:\n            try:\n                idna.check_bidi(label, check_ltr=True)\n            except idna.IDNAError as exc:\n                raise IndexNavigationError(\n                    f\"malformed external link in {source}:{line}: {target!r}\"\n                ) from exc\n'''
          new_ascii = '''    bidi_labels = [\n        whatwg_bidi_compatibility_label(label) for label in decoded_alabels\n    ]\n    bidi_domain = any(\n        unicodedata.bidirectional(character) in {\"R\", \"AL\", \"AN\"}\n        for label in bidi_labels\n        for character in label\n    )\n    if bidi_domain:\n        for label in bidi_labels:\n            try:\n                idna.check_bidi(label, check_ltr=True)\n            except idna.IDNAError as exc:\n                raise IndexNavigationError(\n                    f\"malformed external link in {source}:{line}: {target!r}\"\n                ) from exc\n'''
          if text.count(old_ascii) != 1:
              raise SystemExit('ASCII A-label bidi block mismatch')
          text = text.replace(old_ascii, new_ascii, 1)

          old_unicode = '''    bidi_domain = any(\n        unicodedata.bidirectional(character) in {\"R\", \"AL\", \"AN\"}\n        for label in semantic_labels\n        for character in label\n    )\n    for label in semantic_labels:\n        if (\n            unicodedata.normalize(\"NFC\", label) != label\n            or unicodedata.category(label[0]).startswith(\"M\")\n            or not contextual_joiners_are_valid(label)\n        ):\n            raise IndexNavigationError(\n                f\"malformed external link in {source}:{line}: {target!r}\"\n            )\n        if bidi_domain:\n            try:\n                idna.check_bidi(label, check_ltr=True)\n            except idna.IDNAError as exc:\n                raise IndexNavigationError(\n                    f\"malformed external link in {source}:{line}: {target!r}\"\n                ) from exc\n'''
          new_unicode = '''    bidi_labels = [\n        whatwg_bidi_compatibility_label(label) for label in semantic_labels\n    ]\n    bidi_domain = any(\n        unicodedata.bidirectional(character) in {\"R\", \"AL\", \"AN\"}\n        for label in bidi_labels\n        for character in label\n    )\n    for label, bidi_label in zip(semantic_labels, bidi_labels, strict=True):\n        if (\n            unicodedata.normalize(\"NFC\", label) != label\n            or unicodedata.category(label[0]).startswith(\"M\")\n            or not contextual_joiners_are_valid(label)\n        ):\n            raise IndexNavigationError(\n                f\"malformed external link in {source}:{line}: {target!r}\"\n            )\n        if bidi_domain:\n            try:\n                idna.check_bidi(bidi_label, check_ltr=True)\n            except idna.IDNAError as exc:\n                raise IndexNavigationError(\n                    f\"malformed external link in {source}:{line}: {target!r}\"\n                ) from exc\n'''
          if text.count(old_unicode) != 1:
              raise SystemExit('Unicode bidi block mismatch')
          text = text.replace(old_unicode, new_unicode, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- scripts/generate_index_navigation.py
      - name: Commit production fix
        shell: bash
        run: |
          if git diff --quiet -- scripts/generate_index_navigation.py; then
            echo 'No production diff to commit.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/generate_index_navigation.py
          git commit -m 'fix: align WHATWG bidi compatibility'
          git push origin HEAD:agent/site-index-navigation-graph
