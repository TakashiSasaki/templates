name: Fix Webapp completion path Markdown

on:
  push:
    branches:
      - docs/webapp-checkpoint-completion-path
    paths:
      - .github/workflows/fix-webapp-completion-markdown.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Restore Markdown list indentation and regression coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          def deindent_completion(path: Path, end_marker: str) -> None:
              text = path.read_text(encoding="utf-8")
              start = text.index("## Completion path at a glance\n")
              end = text.index(end_marker, start)
              section = text[start:end]
              lines = section.splitlines(keepends=True)
              fixed = []
              for line in lines:
                  if line.startswith("    "):
                      line = line[4:]
                  fixed.append(line)
              path.write_text(text[:start] + "".join(fixed) + text[end:], encoding="utf-8")

          deindent_completion(
              Path("docs/guides/webapp-product-walkthrough.md"),
              "## 0. What this walkthrough will produce\n",
          )
          deindent_completion(
              Path("translations/ja/docs/guides/webapp-product-walkthrough.md"),
              "## 0. この walkthrough で何を作るか\n",
          )

          test_path = Path("tests/test_human_first_webapp_onboarding.py")
          tests = test_path.read_text(encoding="utf-8")
          anchor = '        self.assertIn("lifecycle.next_actions", text)\n'
          replacement = (
              '        self.assertIn("lifecycle.next_actions", text)\n'
              '        self.assertIn("\\n1. **Doctor**", text)\n'
              '        self.assertNotIn("\\n    1. **Doctor**", text)\n'
          )
          if tests.count(anchor) != 1:
              raise SystemExit("English Markdown regression anchor mismatch")
          tests = tests.replace(anchor, replacement, 1)
          ja_anchor = '        self.assertIn("**Create planning checkpoint**", japanese)\n'
          ja_replacement = (
              '        self.assertIn("**Create planning checkpoint**", japanese)\n'
              '        self.assertIn("\\n1. **Doctor**", japanese)\n'
              '        self.assertNotIn("\\n    1. **Doctor**", japanese)\n'
          )
          if tests.count(ja_anchor) != 1:
              raise SystemExit("Japanese Markdown regression anchor mismatch")
          tests = tests.replace(ja_anchor, ja_replacement, 1)
          test_path.write_text(tests, encoding="utf-8")
          PY
          python -m unittest tests.test_human_first_webapp_onboarding
      - name: Commit Markdown repair and remove helper
        env:
          BRANCH: docs/webapp-checkpoint-completion-path
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/guides/webapp-product-walkthrough.md translations/ja/docs/guides/webapp-product-walkthrough.md tests/test_human_first_webapp_onboarding.py
          git rm .github/workflows/fix-webapp-completion-markdown.yml
          git commit -m "Fix Webapp completion path Markdown structure"
          git push origin HEAD:${BRANCH}
