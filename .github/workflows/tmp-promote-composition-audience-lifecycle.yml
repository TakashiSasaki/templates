name: Temporary Composition audience lifecycle promotion

on:
  push:
    branches:
      - promote/site-composition-audience-publication

permissions:
  contents: write

jobs:
  promote:
    if: github.event.head_commit.message == 'Retry lifecycle evidence promotion from planning baseline'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: promote/site-composition-audience-publication
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.13'
      - name: Install Site dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Create validated planning and product checkpoints
        run: python scripts/tmp_promote_composition_audience_lifecycle.py
      - name: Commit validated lifecycle promotion
        run: |
          set -euo pipefail
          git config user.name 'Takashi SASAKI'
          git config user.email 'takashi316@gmail.com'
          git add -A
          git commit -m 'Record Composition audience publication lifecycle promotion'
          git push origin HEAD:promote/site-composition-audience-publication
