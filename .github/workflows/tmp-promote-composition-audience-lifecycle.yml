name: Temporary Composition audience lifecycle promotion

on:
  push:
    branches:
      - promote/site-composition-audience-publication

permissions:
  contents: write

jobs:
  promote:
    if: github.event.head_commit.message == 'Run lifecycle evidence promotion'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: promote/site-composition-audience-publication
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.13'
      - name: Install Site dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Create planning and product lifecycle checkpoints
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy
          import json
          from pathlib import Path

          path = Path('contracts/implementation-evidence.json')
          product = json.loads(path.read_text(encoding='utf-8'))
          if product.get('mode') != 'product':
              raise SystemExit('expected product implementation evidence')

          new_items = [
              ('document-metadata', 'document_metadata', 'page-metadata', 'composition-publication-boundary', 'composition-provider-maintenance'),
              ('document-metadata', 'document_metadata', 'page-metadata', 'composition-publication-boundary', 'composition-installer-release'),
              ('site-structure', 'site_structure', 'page', 'composition-publication-boundary', 'composition-provider-maintenance'),
              ('site-structure', 'site_structure', 'page', 'composition-publication-boundary', 'composition-installer-release'),
          ]
          records = {record['id']: record for record in product['records']}
          requirements = {req['id']: req for req in product['requirements']}

          for prefix, contract_id, item_kind, template_item, item_id in new_items:
              template_id = f'{prefix}-{template_item}'
              new_id = f'{prefix}-{item_id}'
              if new_id in records or new_id in requirements:
                  raise SystemExit(f'evidence target already exists: {new_id}')
              if template_id not in records or template_id not in requirements:
                  raise SystemExit(f'missing evidence template: {template_id}')

              record = copy.deepcopy(records[template_id])
              record['id'] = new_id
              record['target'] = {
                  'kind': 'contract-item',
                  'contractId': contract_id,
                  'itemKind': item_kind,
                  'itemId': item_id,
              }
              boundary = record.get('implementationBoundary', {})
              boundary['description'] = f'Site publication assembly and browser implementation for {new_id}'
              record['implementationBoundary'] = boundary
              for field, suffix in (('positiveEvidence', 'positive'), ('negativeEvidence', 'negative')):
                  evidence = record.get(field)
                  if not isinstance(evidence, list) or len(evidence) != 1:
                      raise SystemExit(f'unexpected {field} template shape for {template_id}')
                  evidence[0]['id'] = f'{new_id}-{suffix}'
              records[new_id] = record

              requirement = copy.deepcopy(requirements[template_id])
              requirement['id'] = new_id
              requirement['description'] = f'Site fulfills {new_id}'
              requirement['targets'] = [copy.deepcopy(record['target'])]
              requirement['recordIds'] = [new_id]
              requirements[new_id] = requirement

          product['records'] = sorted(records.values(), key=lambda item: item['id'])
          product['requirements'] = sorted(requirements.values(), key=lambda item: item['id'])
          Path('/tmp/product-evidence.json').write_text(
              json.dumps(product, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )

          planning = copy.deepcopy(product)
          planning['mode'] = 'planning'
          planning['commands'] = []
          planning['releaseGates'] = []
          planning['records'] = []
          planning_requirements = []
          for req in planning['requirements']:
              planning_requirements.append({
                  'id': req['id'],
                  'description': req['description'],
                  'targets': req['targets'],
                  'recordIds': [],
                  'requiredPositiveProofKinds': req['requiredPositiveProofKinds'],
              })
          planning['requirements'] = planning_requirements
          path.write_text(json.dumps(planning, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

          python .template-composition/checkpoint.py planning \
            --id composition-audience-publication-promotion

          cp /tmp/product-evidence.json contracts/implementation-evidence.json

          python .template-composition/checkpoint.py product \
            --id composition-audience-publication-promotion-product \
            --from composition-audience-publication-promotion

          python scripts/render_reference_consumer.py --write

          python - <<'PY'
          import json
          from pathlib import Path

          ledger = json.loads(Path('contracts/lifecycle-checkpoints.json').read_text(encoding='utf-8'))
          wanted = [
              next(item for item in ledger['checkpoints'] if item['id'] == 'composition-audience-publication-promotion'),
              next(item for item in ledger['checkpoints'] if item['id'] == 'composition-audience-publication-promotion-product'),
          ]
          doc = Path('docs/lifecycle.md')
          text = doc.read_text(encoding='utf-8')
          heading = '### Composition audience publication promotion history'
          if heading in text:
              raise SystemExit('lifecycle promotion history already documented')
          rows = '\n'.join(
              f"| {item['sequence']} | {item['phase']} | {item['id']} | {item['snapshotPath']} | {item['manifestSha256']} |"
              for item in wanted
          )
          addition = (
              '\n\n### Composition audience publication promotion history\n\n'
              'These checkpoints bind the validated Site promotion of the already-qualified '
              'Composition audience records into the active publication mapping.\n\n'
              '| Sequence | Phase | ID | Snapshot | Manifest SHA-256 |\n'
              '| --- | --- | --- | --- | --- |\n'
              f'{rows}\n'
          )
          doc.write_text(text.rstrip() + addition, encoding='utf-8')
          PY

          python .template-composition/validate.py . --format json > /tmp/final-validation.json
          python -m unittest tests.test_ledger_overview tests.test_reference_consumer -v
          python -I tests/test_composition_playground_cross_authority_workflow.py
          python scripts/site_website_contract.py
          git diff --check

      - name: Commit validated lifecycle promotion
        run: |
          set -euo pipefail
          git config user.name 'Takashi SASAKI'
          git config user.email 'takashi316@gmail.com'
          git add -A
          git commit -m 'Record Composition audience publication lifecycle promotion'
          git push origin HEAD:promote/site-composition-audience-publication
