name: One-shot PR 81 review fix

on:
  push:
    branches:
      - agent/skill-branch-rename-migration

permissions:
  contents: write

jobs:
  fix:
    if: github.repository == 'TakashiSasaki/templates'
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v7
        with:
          ref: agent/skill-branch-rename-migration

      - name: Apply scheduled-workflow correction
        shell: python
        run: |
          from pathlib import Path

          workflow_path = Path('.github/workflows/pages.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          schedule = "  schedule:\n    - cron: '17 3 * * 1'\n"
          if workflow.count(schedule) != 1:
              raise SystemExit('expected exactly one obsolete schedule block')
          workflow = workflow.replace(schedule, '')
          old_comment = (
              "    # Pull-request runs validate GitHub's proposed merge commit. Scheduled and\n"
              "    # manual runs always resolve the current skill branch, regardless of the ref\n"
              "    # selected when dispatching the workflow. The called site workflow is\n"
          )
          new_comment = (
              "    # Pull-request runs validate GitHub's proposed merge commit. Manually\n"
              "    # dispatched runs resolve the current skill branch, regardless of the ref\n"
              "    # selected when dispatching the workflow. The called site workflow is\n"
          )
          if workflow.count(old_comment) != 1:
              raise SystemExit('expected the obsolete scheduled-run comment exactly once')
          workflow = workflow.replace(old_comment, new_comment)
          workflow_path.write_text(workflow, encoding='utf-8')

          contributing_path = Path('CONTRIBUTING.md')
          contributing = contributing_path.read_text(encoding='utf-8')
          old_guidance = (
              "The same non-deploying check runs weekly and can be started manually to detect "
              "documentation drift. No workflow on `skill` deploys GitHub Pages; publication "
              "is outside this branch's authority."
          )
          new_guidance = (
              "The same non-deploying check can be started manually to detect documentation "
              "drift. GitHub schedules workflows only from the repository default branch, "
              "which is `site`, so this `skill`-branch workflow does not claim a weekly "
              "scheduled run. No workflow on `skill` deploys GitHub Pages; publication is "
              "outside this branch's authority."
          )
          if contributing.count(old_guidance) != 1:
              raise SystemExit('expected the obsolete weekly guidance exactly once')
          contributing = contributing.replace(old_guidance, new_guidance)
          contributing_path.write_text(contributing, encoding='utf-8')

          test_path = Path('.github/scripts/test-pages-deployment-boundary.rb')
          test = test_path.read_text(encoding='utf-8')
          anchor = (
              'abort "compatibility workflow still targets the removed main branch" '
              'if trigger_block.include?("\\n      - main\\n")\n'
          )
          addition = (
              anchor
              + 'abort "skill workflow incorrectly claims a scheduled run" '
              + 'if trigger_block.include?("\\n  schedule:\\n")\n'
              + 'abort "skill workflow lacks manual drift-check dispatch" '
              + 'unless trigger_block.include?("\\n  workflow_dispatch:\\n")\n'
          )
          if test.count(anchor) != 1:
              raise SystemExit('expected the trigger-boundary anchor exactly once')
          test = test.replace(anchor, addition)
          guidance_anchor = (
              'unless contributing.include?("No workflow on `skill` deploys GitHub Pages")\n'
              '  abort "contributor guidance does not state the skill deployment boundary"\n'
              'end\n'
          )
          guidance_addition = (
              guidance_anchor
              + 'unless contributing.include?("this `skill`-branch workflow does not claim a weekly scheduled run")\n'
              + '  abort "contributor guidance incorrectly claims a weekly skill schedule"\n'
              + 'end\n'
          )
          if test.count(guidance_anchor) != 1:
              raise SystemExit('expected the contributor-guidance anchor exactly once')
          test = test.replace(guidance_anchor, guidance_addition)
          test_path.write_text(test, encoding='utf-8')

          Path('.github/workflows/one-shot-review-fix.yml').unlink()

      - name: Commit review fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Correct skill compatibility scheduling contract"
          git push origin HEAD:agent/skill-branch-rename-migration

# This second push ensures the workflow exists before its trigger event.
