name: Temporary Task Ledger browser proof repin

on:
  push:
    branches:
      - agent/task-ledger-browser-bootstrap-retry-pr10

permissions:
  contents: write

jobs:
  repin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/task-ledger-browser-bootstrap-retry-pr10
          fetch-depth: 0
      - name: Repin Task Ledger browser proof
        run: python scripts/temp_repin_task_ledger_browser_proof.py
      - name: Commit repin and remove temporary machinery
        run: |
          rm scripts/temp_repin_task_ledger_browser_proof.py
          rm .github/workflows/temp-repin-task-ledger-browser-proof.yml
          git config user.name "TakashiSasaki templates automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Repin Task Ledger browser proof walkthrough fixture"
          git push origin HEAD:refs/heads/agent/task-ledger-browser-bootstrap-retry-pr10
