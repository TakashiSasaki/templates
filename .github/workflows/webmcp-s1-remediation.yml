name: WebMCP S1 remediation

on:
  pull_request:
    paths:
      - .github/workflows/webmcp-s1-remediation.yml
      - .github/scripts/webmcp_s1_remediate.py

permissions:
  contents: write

jobs:
  remediate:
    if: >-
      github.event.pull_request.number == 765 &&
      github.event.pull_request.head.ref == 'webmcp/s1-reader-docs' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.sha != '6a8503a5249ae27cc0d288411de77cce73af736b'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact S1 branch
        uses: actions/checkout@v7
        with:
          ref: webmcp/s1-reader-docs
          path: site-source
          fetch-depth: 0
          persist-credentials: true

      - name: Check out exact Composition C5 provider
        uses: actions/checkout@v7
        with:
          ref: a739b3823660e3db742ff0e1e159d279126cba7c
          path: composition-source
          persist-credentials: false

      - name: Check out exact Policy provider
        uses: actions/checkout@v7
        with:
          ref: c5a3294809a1066bf59b83f467f1d597f885289a
          path: policy-source
          persist-credentials: false

      - name: Remediate and push only after focused validation
        run: |
          sed -i 's/return completed.stdout.strip()/return completed.stdout.rstrip("\\n")/' site-source/.github/scripts/webmcp_s1_remediate.py
          python site-source/.github/scripts/webmcp_s1_remediate.py \
            --site-root site-source \
            --composition-root composition-source \
            --policy-root policy-source
