name: WebMCP S1 final remediation

on:
  pull_request:
    paths:
      - .github/workflows/webmcp-s1-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    if: >-
      github.event.pull_request.number == 765 &&
      github.event.pull_request.head.ref == 'webmcp/s1-reader-docs' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact S1 branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          path: site-source
          fetch-depth: 0
          persist-credentials: true

      - name: Verify setup provenance
        working-directory: site-source
        env:
          PRIOR_S1_HEAD: 6a8503a5249ae27cc0d288411de77cce73af736b
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          mapfile -t changed < <(git diff --name-only "$PRIOR_S1_HEAD" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/webmcp-s1-remediation.yml'

      - name: Check out exact Composition provider
        uses: actions/checkout@v7
        with:
          ref: a739b3823660e3db742ff0e1e159d279126cba7c
          path: composition-source
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact Policy provider
        uses: actions/checkout@v7
        with:
          ref: c5a3294809a1066bf59b83f467f1d597f885289a
          path: policy-source
          fetch-depth: 1
          persist-credentials: false

      - name: Refresh reader history and translations
        working-directory: site-source
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement target, got {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          old_en = '''The current canonical Site history contains four validated checkpoints:

```text
1  site-reference-adoption
   phase: planning
   changeKind: initial
   parentId: null
   snapshotPath: artifacts/lifecycle/001-site-reference-adoption
   manifestSha256: 9ec8d87ea01cf6f178422ca39589882ac3aac86dbc6084d7cc71f5a03df667d4

2  site-reference-adoption-product
   phase: product
   changeKind: initial
   parentId: site-reference-adoption

3  routes-v5-publication
   phase: planning
   changeKind: specification-change
   parentId: site-reference-adoption-product

4  routes-v5-publication-product
   phase: product
   changeKind: specification-change
   parentId: routes-v5-publication
   snapshotPath: artifacts/lifecycle/004-routes-v5-publication-product
   manifestSha256: c3ba91ed78fc90f780213b443182b17c38316d77d92f0151fb3d00392e77d9f1
```

`site-reference-adoption` identifies the first validated planning baseline,
not an individual requirement. The next checkpoint consumes that identity as
its parent. The later `routes-v5-publication -> routes-v5-publication-product`
pair shows a specification change continuing the same linear history after the
initial product state. The root requirement/evidence ledger represents current
product state while these snapshots preserve the validated states it passed
through.'''
          new_en = '''The current canonical Site history contains six validated checkpoints:

```text
1  site-reference-adoption
   phase: planning
   changeKind: initial
   parentId: null
   snapshotPath: artifacts/lifecycle/001-site-reference-adoption
   manifestSha256: 9ec8d87ea01cf6f178422ca39589882ac3aac86dbc6084d7cc71f5a03df667d4

2  site-reference-adoption-product
   phase: product
   changeKind: initial
   parentId: site-reference-adoption

3  routes-v5-publication
   phase: planning
   changeKind: specification-change
   parentId: site-reference-adoption-product

4  routes-v5-publication-product
   phase: product
   changeKind: specification-change
   parentId: routes-v5-publication

5  webmcp-reader-publication
   phase: planning
   changeKind: specification-change
   parentId: routes-v5-publication-product

6  webmcp-reader-publication-product
   phase: product
   changeKind: specification-change
   parentId: webmcp-reader-publication
   snapshotPath: artifacts/lifecycle/006-webmcp-reader-publication-product
   manifestSha256: 2b434f5636675eeacc0d6c4a9676f68a64c953abfada439b1306449ed31ea2a1
```

`site-reference-adoption` identifies the first validated planning baseline,
not an individual requirement. The next checkpoint consumes that identity as
its parent. The later `routes-v5-publication -> routes-v5-publication-product`
and `webmcp-reader-publication -> webmcp-reader-publication-product` pairs show
successive specification changes continuing the same linear history after the
initial product state. The root requirement/evidence ledger represents current
product state while these snapshots preserve the validated states it passed
through.'''
          replace_once('docs/lifecycle.md', old_en, new_en)

          old_ja = '''現在の canonical Site history には、次の4つの validated checkpoint が存在します。

```text
1  site-reference-adoption
   phase: planning
   changeKind: initial
   parentId: null
   snapshotPath: artifacts/lifecycle/001-site-reference-adoption
   manifestSha256: 9ec8d87ea01cf6f178422ca39589882ac3aac86dbc6084d7cc71f5a03df667d4

2  site-reference-adoption-product
   phase: product
   changeKind: initial
   parentId: site-reference-adoption

3  routes-v5-publication
   phase: planning
   changeKind: specification-change
   parentId: site-reference-adoption-product

4  routes-v5-publication-product
   phase: product
   changeKind: specification-change
   parentId: routes-v5-publication
   snapshotPath: artifacts/lifecycle/004-routes-v5-publication-product
   manifestSha256: c3ba91ed78fc90f780213b443182b17c38316d77d92f0151fb3d00392e77d9f1
```

`site-reference-adoption` は individual requirement ではなく、最初の validated planning baseline の identity です。次の checkpoint はこの identity を parent として消費します。後続の `routes-v5-publication -> routes-v5-publication-product` は、initial product state の後も同じ linear history 上で specification change が継続することを示します。root の requirement/evidence ledger が current product state を表す一方、これらの snapshot はそこへ至った validated state を保存します。'''
          new_ja = '''現在の canonical Site history には、次の6つの validated checkpoint が存在します。

```text
1  site-reference-adoption
   phase: planning
   changeKind: initial
   parentId: null
   snapshotPath: artifacts/lifecycle/001-site-reference-adoption
   manifestSha256: 9ec8d87ea01cf6f178422ca39589882ac3aac86dbc6084d7cc71f5a03df667d4

2  site-reference-adoption-product
   phase: product
   changeKind: initial
   parentId: site-reference-adoption

3  routes-v5-publication
   phase: planning
   changeKind: specification-change
   parentId: site-reference-adoption-product

4  routes-v5-publication-product
   phase: product
   changeKind: specification-change
   parentId: routes-v5-publication

5  webmcp-reader-publication
   phase: planning
   changeKind: specification-change
   parentId: routes-v5-publication-product

6  webmcp-reader-publication-product
   phase: product
   changeKind: specification-change
   parentId: webmcp-reader-publication
   snapshotPath: artifacts/lifecycle/006-webmcp-reader-publication-product
   manifestSha256: 2b434f5636675eeacc0d6c4a9676f68a64c953abfada439b1306449ed31ea2a1
```

`site-reference-adoption` は individual requirement ではなく、最初の validated planning baseline の identity です。次の checkpoint はこの identity を parent として消費します。後続の `routes-v5-publication -> routes-v5-publication-product` と `webmcp-reader-publication -> webmcp-reader-publication-product` は、initial product state の後も同じ linear history 上で specification change が継続することを示します。root の requirement/evidence ledger が current product state を表す一方、これらの snapshot はそこへ至った validated state を保存します。'''
          replace_once('translations/ja/docs/lifecycle.md', old_ja, new_ja)

          replace_once(
              'translations/ja/docs/capabilities.md',
              '- [Headless service interface](/capabilities/service/)\n',
              '- [Headless service interface](/capabilities/service/)\n- [WebMCP 読者ガイド](/capabilities/webmcp/)\n',
          )
          replace_once(
              'translations/ja/docs/capabilities.md',
              '- [Progressive Web App capability](/capabilities/pwa/)\n\n別の [Policy PWA usage guide]',
              '- [Progressive Web App capability](/capabilities/pwa/)\n- [WebMCP 読者ガイド](/capabilities/webmcp/)\n\nWebMCP ガイドでは、読者向けに adoption の選択と security implication を説明します。canonical な WebMCP capability と contract semantics は Composition が所有します。\n\n別の [Policy PWA usage guide]',
          )

          test_path = Path('tests/test_ledger_overview.py')
          text = test_path.read_text(encoding='utf-8')
          replacements = [
              ('                "routes-v5-publication-product",\n            ],', '                "routes-v5-publication-product",\n                "webmcp-reader-publication",\n                "webmcp-reader-publication-product",\n            ],'),
              ('self.assertEqual([item["sequence"] for item in checkpoints], [1, 2, 3, 4])', 'self.assertEqual([item["sequence"] for item in checkpoints], [1, 2, 3, 4, 5, 6])'),
              ('["planning", "product", "planning", "product"],', '["planning", "product", "planning", "product", "planning", "product"],'),
              ('["initial", "initial", "specification-change", "specification-change"],', '[\n                "initial",\n                "initial",\n                "specification-change",\n                "specification-change",\n                "specification-change",\n                "specification-change",\n            ],'),
              ('                "routes-v5-publication",\n            ],', '                "routes-v5-publication",\n                "routes-v5-publication-product",\n                "webmcp-reader-publication",\n            ],'),
              ('"artifacts/lifecycle/004-routes-v5-publication-product",', '"artifacts/lifecycle/006-webmcp-reader-publication-product",'),
              ('"c3ba91ed78fc90f780213b443182b17c38316d77d92f0151fb3d00392e77d9f1",', '"2b434f5636675eeacc0d6c4a9676f68a64c953abfada439b1306449ed31ea2a1",'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'tests/test_ledger_overview.py: expected one target for {old!r}, got {text.count(old)}')
              text = text.replace(old, new)
          test_path.write_text(text, encoding='utf-8')

          def blob_sha(path: str) -> str:
              payload = Path(path).read_bytes()
              return hashlib.sha1(b'blob ' + str(len(payload)).encode() + b'\0' + payload).hexdigest()

          manifest_path = Path('translations/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          expected = {
              'docs/policy-composition-coexistence.md': 'cd474329b511ab80c0080a0605522cc7840a3e43',
              'docs/capabilities.md': 'b739fd8d4bd55c20dd8286701f62d349d86c69cb',
              'docs/lifecycle.md': blob_sha('docs/lifecycle.md'),
          }
          seen = set()
          for entry in manifest['translations']:
              canonical = entry['canonical']
              if canonical in expected:
                  entry['canonical_blob_sha'] = expected[canonical]
                  seen.add(canonical)
          if seen != set(expected):
              raise SystemExit(f'translation manifest missing expected entries: {set(expected) - seen}')
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Regenerate exact provider agent projections
        working-directory: site-source
        run: |
          set -euo pipefail
          python scripts/generate_agent_bootstrap.py \
            --site-root . \
            --composition-root ../composition-source \
            --policy-root ../policy-source \
            --write
          python scripts/generate_agent_bootstrap.py \
            --site-root . \
            --composition-root ../composition-source \
            --policy-root ../policy-source

      - name: Verify bounded remediation diff
        working-directory: site-source
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/expected.txt" <<'EOF'
          agent.json
          assets/agent.json
          docs/lifecycle.md
          tests/test_ledger_overview.py
          translations/ja/docs/capabilities.md
          translations/ja/docs/lifecycle.md
          translations/manifest.json
          EOF
          git diff --name-only | LC_ALL=C sort > "$RUNNER_TEMP/actual.txt"
          LC_ALL=C sort "$RUNNER_TEMP/expected.txt" -o "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
          test "$(git hash-object docs/policy-composition-coexistence.md)" = cd474329b511ab80c0080a0605522cc7840a3e43
          test "$(git hash-object docs/capabilities.md)" = b739fd8d4bd55c20dd8286701f62d349d86c69cb
          python - <<'PY'
          import json
          from pathlib import Path
          ledger = json.loads(Path('contracts/lifecycle-checkpoints.json').read_text())
          assert [x['id'] for x in ledger['checkpoints']][-2:] == ['webmcp-reader-publication', 'webmcp-reader-publication-product']
          assert ledger['checkpoints'][-1]['manifestSha256'] == '2b434f5636675eeacc0d6c4a9676f68a64c953abfada439b1306449ed31ea2a1'
          PY

      - name: Run focused regressions
        working-directory: site-source
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m unittest \
            tests.test_agent_bootstrap_manifest \
            tests.test_ledger_overview \
            tests.test_site_owned_translations

      - name: Commit and push remediation
        working-directory: site-source
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent.json assets/agent.json docs/lifecycle.md tests/test_ledger_overview.py translations/ja/docs/capabilities.md translations/ja/docs/lifecycle.md translations/manifest.json
          git diff --cached --quiet && { echo 'expected remediation diff is empty' >&2; exit 1; }
          git commit -m 'Complete WebMCP S1 reader qualification state'
          git push origin "HEAD:${PR_BRANCH}"
