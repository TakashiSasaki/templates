name: Temporary diagnose planning proof strength
on:
  push:
    branches:
      - agent/planning-proof-strength-pr21
permissions:
  contents: write
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dev dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Run focused suite and capture output
        shell: bash
        run: |
          set +e
          PYTHONDONTWRITEBYTECODE=1 python -m unittest -v \
            tests.test_planning_target_proof_strength \
            tests.test_implementation_evidence_planning \
            tests.test_planning_consumer_validation \
            tests.test_webapp_evidence_scaffold \
            tests.test_cli_interface_contract \
            tests.test_service_interface_contract \
            tests.test_web_interface_contract \
            tests.test_mcp_interface_contract \
            tests.test_mcp_apps_contract \
            tests.test_webapp_neutral_seed \
            tests.test_webapp_v4_upgrade \
            tests.test_webapp_v5_surface_upgrade \
            > /tmp/focused.log 2>&1
          echo "$?" > /tmp/focused-status.txt
          exit 0
      - name: Upload focused output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planning-proof-focused-output
          path: /tmp/focused.log
          if-no-files-found: error
      - name: Self-delete and preserve test result
        if: always()
        shell: bash
        run: |
          status=1
          if [ -f /tmp/focused-status.txt ]; then
            status=$(cat /tmp/focused-status.txt)
          fi
          rm -f .github/workflows/tmp-diagnose-planning-proof-strength.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove temporary planning proof diagnostic workflow"
            git push
          fi
          exit "$status"
