name: Temporary clean PR507 bytecode
on:
  push:
    branches:
      - agent/cli-machine-evidence-pr14
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/cli-machine-evidence-pr14
      - name: Remove bytecode and temporary workflow
        run: |
          rm -f tests/__pycache__/test_composer_upgrade.cpython-312.pyc
          rm -f tests/__pycache__/test_composition_lock_v2.cpython-312.pyc
          rm -f tests/__pycache__/test_task_ledger_walkthrough_browser_acceptance.cpython-312.pyc
          rmdir tests/__pycache__ 2>/dev/null || true
          rm .github/workflows/tmp-pr507-clean-pyc.yml
          git config user.name 'TakashiSasaki templates automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary Python bytecode artifacts'
          git push origin HEAD:agent/cli-machine-evidence-pr14
