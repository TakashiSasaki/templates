name: Mobile visual regression

on:
  pull_request:
    branches:
      - site

permissions:
  contents: read
  actions: read

concurrency:
  group: mobile-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: >-
      github.repository == 'TakashiSasaki/templates' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out proposed Site revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Wait for documentation artifact build
        id: documentation_build
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = context.payload.pull_request.head.sha;
            const deadline = Date.now() + 20 * 60 * 1000;

            while (Date.now() < deadline) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'build-pages.yml',
                event: 'pull_request',
                head_sha: headSha,
                per_page: 20,
              });
              const runs = response.data.workflow_runs
                .slice()
                .sort((left, right) => right.id - left.id);
              const run = runs[0];

              if (!run) {
                core.info(`Documentation build for ${headSha} has not started yet.`);
              } else if (run.status === 'completed') {
                if (run.conclusion !== 'success') {
                  throw new Error(
                    `Documentation build ${run.id} concluded ${run.conclusion}.`
                  );
                }
                core.setOutput('run_id', String(run.id));
                core.info(`Using documentation build ${run.id}.`);
                return;
              } else {
                core.info(`Documentation build ${run.id} is ${run.status}.`);
              }

              await new Promise((resolve) => setTimeout(resolve, 10000));
            }

            throw new Error(`Timed out waiting for documentation build for ${headSha}.`);

      - name: Download built Pages artifact
        uses: actions/download-artifact@v5
        with:
          name: github-pages
          path: pages-artifact
          github-token: ${{ github.token }}
          run-id: ${{ steps.documentation_build.outputs.run_id }}

      - name: Extract built site
        run: |
          mkdir -p build/site
          tar --extract --file pages-artifact/artifact.tar --directory build/site
          test -f build/site/index.html

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Playwright controller
        run: python -m pip install --disable-pip-version-check -r requirements-visual.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Check mobile layout geometry
        run: |
          python scripts/check_mobile_layout.py \
            --site-root build/site \
            --output-root build/mobile-visual

      - name: Check localized inline Glossary chrome
        run: |
          python scripts/check_glossary_locale_chrome.py \
            --site-root build/site \
            --output build/mobile-visual/glossary-locale-chrome.json

      - name: Check PWA freshness lifecycle
        run: |
          python scripts/check_pwa_freshness.py \
            --site-root build/site \
            --output build/mobile-visual/pwa-freshness.json

      - name: Check localized PWA freshness chrome
        run: |
          python scripts/check_pwa_locale_chrome.py \
            --site-root build/site \
            --output build/mobile-visual/pwa-locale-chrome.json

      - name: Check PWA document commit correlation
        run: |
          python scripts/check_pwa_commit_regressions.py \
            --site-root build/site \
            --output build/mobile-visual/pwa-document-commit.json

      - name: Check PWA slow-network convergence
        run: |
          python scripts/check_pwa_slow_convergence.py \
            --site-root build/site \
            --output build/mobile-visual/pwa-slow-convergence.json

      - name: Check PWA freshness capability messaging
        run: |
          python scripts/check_pwa_capabilities.py \
            --site-root build/site \
            --output build/mobile-visual/pwa-capabilities.json

      - name: Upload mobile visual evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mobile-visual-${{ github.event.pull_request.number }}
          path: build/mobile-visual
          if-no-files-found: warn
          retention-days: 7
