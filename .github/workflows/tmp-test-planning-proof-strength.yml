name: Temporary test planning proof strength
on:
  push:
    branches:
      - agent/planning-proof-strength-pr21
permissions:
  contents: write
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dev dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Run focused planning proof-strength regressions and self-delete
        shell: bash
        run: |
          set +e
          PYTHONDONTWRITEBYTECODE=1 python -m unittest \
            tests.test_planning_target_proof_strength \
            tests.test_implementation_evidence_planning \
            tests.test_planning_consumer_validation \
            tests.test_webapp_evidence_scaffold \
            tests.test_cli_interface_contract \
            tests.test_service_interface_contract \
            tests.test_web_interface_contract \
            tests.test_mcp_interface_contract \
            tests.test_mcp_apps_contract
          status=$?
          set -e
          rm .github/workflows/tmp-test-planning-proof-strength.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary planning proof test workflow"
          git push
          exit "$status"
