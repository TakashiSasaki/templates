name: Temporary clean planning branch artifacts
on:
  push:
    branches:
      - agent/planning-requirement-ledger-pr16
permissions:
  contents: write
jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/planning-requirement-ledger-pr16
          fetch-depth: 0
      - name: Remove generated environment and migrate Webapp current-version expectations
        run: |
          rm -rf .venv
          find scripts tests -type d -name __pycache__ -prune -exec rm -rf {} + || true
          python - <<'PY'
          from pathlib import Path
          paths = [
              'tests/test_webapp_v4_upgrade.py',
              'tests/test_routes_v3_access_failures.py',
              'tests/test_webapp_neutral_seed.py',
              'tests/test_webapp_v5_surface_upgrade.py',
          ]
          for name in paths:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              # Preserve legacy from_version assignments; only current-version assertions / to_version move 10 -> 11.
              text = text.replace('self.assertEqual(artifact["version"], 10)', 'self.assertEqual(artifact["version"], 11)')
              text = text.replace('self.assertEqual(component["version"], 10)', 'self.assertEqual(component["version"], 11)')
              text = text.replace('self.assertEqual(descriptor["version"], 10)', 'self.assertEqual(descriptor["version"], 11)')
              text = text.replace('self.assertEqual(changed["artifact.webapp-core"]["to_version"], 10)', 'self.assertEqual(changed["artifact.webapp-core"]["to_version"], 11)')
              path.write_text(text, encoding='utf-8')
          PY
      - name: Audit generated artifacts
        run: |
          test ! -e .venv
          if find scripts tests -type f -name '*.pyc' -print -quit | grep -q .; then
            echo 'generated pyc remains' >&2
            exit 1
          fi
      - name: Commit cleanup and self-delete
        run: |
          rm -f .github/workflows/tmp-clean-planning-branch.yml
          git config user.name 'TakashiSasaki templates automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Clean planning fixtures and generated artifacts'
          git push origin HEAD:agent/planning-requirement-ledger-pr16
