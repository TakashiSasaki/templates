name: PR 790 final review remediation retry

on:
  push:
    branches:
      - perf/site-provider-materialization-phase

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v7
        with:
          ref: perf/site-provider-materialization-phase
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Extract and apply corrected remediation payload
        shell: bash
        run: |
          awk '
            /^          python - <<'\''PY'\''$/ { capture=1; next }
            capture && /^          PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/pr790-final-review-remediation.yml > /tmp/pr790-remediate.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/pr790-remediate.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('PurePosixPath(".")', "PurePosixPath('.')")
          path.write_text(text, encoding='utf-8')
          PY
          python /tmp/pr790-remediate.py

      - name: Syntax check
        run: python -m py_compile scripts/materialize_publication_assets.py tests/test_materialize_publication_assets_review_followup.py

      - name: Run focused regressions
        run: python -m unittest tests.test_materialize_publication_assets tests.test_materialize_publication_assets_review_followup tests.test_assembly_materialization_boundary --verbose

      - name: Commit remediation and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/materialize_publication_assets.py tests/test_materialize_publication_assets_review_followup.py
          git rm .github/workflows/pr790-final-review-remediation.yml
          git rm .github/workflows/pr790-final-review-remediation-retry.yml
          git diff --cached --check
          git commit -m "Fix final materialization review races"
          git push origin HEAD:perf/site-provider-materialization-phase
