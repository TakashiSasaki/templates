name: Align current Composition publication qualification pins

on:
  push:
    branches:
      - promote/site-composition-audience-publication

permissions:
  contents: write

jobs:
  align:
    if: github.event.head_commit.message == 'Run current Composition qualification pin alignment'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: promote/site-composition-audience-publication
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.13'
      - name: Install Site test dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Align operational pins and decouple historical tests from the live publication lock
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          old = "0f0c4012818a3b8646ad89fbca7db22c71ad5dd8"
          new = "6b7d764c963f957c6bee43c0c1d42eb03970ec8f"

          workflow_counts = {
              ".github/workflows/site-composition-materialization-cross-authority.yml": 1,
              ".github/workflows/site-composition-playground-cross-authority.yml": 2,
              ".github/workflows/site-composition-playground-explain.yml": 1,
          }
          for name, expected in workflow_counts.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if text.count(old) != expected:
                  raise SystemExit(f"{name}: expected {expected} current-pin occurrences, found {text.count(old)}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          for name in (
              "tests/test_composition_playground_cross_authority_workflow.py",
              "tests/test_site_composition_materialization_cross_authority_workflow.py",
          ):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{name}: expected one current-pin occurrence, found {text.count(old)}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          routes = Path("tests/test_routes_v5_promotion.py")
          text = routes.read_text(encoding="utf-8")
          text = text.replace(f'COMPOSITION_MERGE_SHA = "{old}"\n', "")
          old_block = '''        self.assertEqual(\n            COMPOSITION_MERGE_SHA,\n            sources["publications"]["composition"]["revision"],\n        )\n'''
          new_block = '''        current_composition_revision = sources["publications"]["composition"]["revision"]\n'''
          if text.count(old_block) != 1:
              raise SystemExit("routes-v5 current-lock assertion anchor mismatch")
          text = text.replace(old_block, new_block, 1)
          old_agent = '''        self.assertEqual(\n            COMPOSITION_MERGE_SHA,\n            agent["authorities"]["composition"]["publication_revision"],\n        )\n'''
          new_agent = '''        self.assertEqual(\n            current_composition_revision,\n            agent["authorities"]["composition"]["publication_revision"],\n        )\n'''
          if text.count(old_agent) != 1:
              raise SystemExit("routes-v5 agent projection anchor mismatch")
          routes.write_text(text.replace(old_agent, new_agent, 1), encoding="utf-8")

          ledger = Path("tests/test_ledger_overview.py")
          text = ledger.read_text(encoding="utf-8")
          old_ledger = f'''        self.assertEqual(\n            sources["publications"]["composition"]["revision"],\n            "{old}",\n        )\n'''
          if text.count(old_ledger) != 1:
              raise SystemExit("ledger current Composition assertion anchor mismatch")
          ledger.write_text(text.replace(old_ledger, "", 1), encoding="utf-8")

          for path in Path("tests").glob("*.py"):
              if old in path.read_text(encoding="utf-8"):
                  raise SystemExit(f"stale operational Composition publication pin remains in {path}")
          PY
          git diff --check
      - name: Run focused promotion regressions
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_ledger_overview \
            tests.test_routes_v5_promotion \
            tests.test_site_composition_materialization_cross_authority_workflow \
            tests.test_reference_consumer \
            -v
          python -I tests/test_composition_playground_cross_authority_workflow.py
          python scripts/render_reference_consumer.py
          python scripts/site_website_contract.py
      - name: Commit exact operational alignment
        run: |
          set -euo pipefail
          rm .github/workflows/sync-composition-promotion-projections.yml
          git config user.name 'Takashi SASAKI'
          git config user.email 'takashi316@gmail.com'
          git add -A
          git commit -m 'Align current Composition publication qualification pins'
          echo "Created alignment commit $(git rev-parse HEAD)"
          git push origin HEAD:promote/site-composition-audience-publication
