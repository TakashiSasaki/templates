name: Policy runtime distribution

on:
  push:
    branches:
      - policy
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: policy-runtime-distribution-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify_runtime:
    name: classify runtime requirement
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      required: ${{ steps.classify.outputs.required }}
      reason: ${{ steps.classify.outputs.reason }}
      changed_count: ${{ steps.classify.outputs.changed_count }}
      authority_source: ${{ steps.classify.outputs.authority_source }}
    steps:
      - name: Check out repository history for change classification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify runtime requirement
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          classifier_dir="$RUNNER_TEMP/runtime-ci-classifier-authority"
          rm -rf "$classifier_dir"
          mkdir -p "$classifier_dir"
          authority_source="proposed-head"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            if git show "$BASE_SHA:scripts/classify_runtime_distribution_ci.py" > "$classifier_dir/classify_runtime_distribution_ci.py" \
              && git show "$BASE_SHA:scripts/ci_change_classification.py" > "$classifier_dir/ci_change_classification.py"; then
              authority_source="base"
            else
              authority_source="base-unavailable-full"
              {
                echo "authority_source=$authority_source"
                echo "required=true"
                echo "reason=base-classifier-unavailable"
                echo "changed_count=unknown"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            cp scripts/classify_runtime_distribution_ci.py "$classifier_dir/classify_runtime_distribution_ci.py"
            cp scripts/ci_change_classification.py "$classifier_dir/ci_change_classification.py"
          fi

          echo "authority_source=$authority_source" >> "$GITHUB_OUTPUT"
          python3 -I "$classifier_dir/classify_runtime_distribution_ci.py" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Record runtime CI selection
        env:
          RUNTIME_REQUIRED: ${{ steps.classify.outputs.required }}
          RUNTIME_REASON: ${{ steps.classify.outputs.reason }}
        run: |
          {
            echo '### Policy runtime distribution selection'
            echo
            echo "- runtime checks required: \`$RUNTIME_REQUIRED\`"
            echo "- reason: \`$RUNTIME_REASON\`"
            echo '- canonical runtime and skill-source checks use the Ubuntu runner Python'
          } >> "$GITHUB_STEP_SUMMARY"

  runtime-checks:
    name: Ubuntu runner Python
    needs:
      - classify_runtime
    if: ${{ always() && !cancelled() && needs.classify_runtime.result == 'success' && needs.classify_runtime.outputs.required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDIDATE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      PYTHONHOME: ""
      PYTHONPATH: ""
      PYTHONUSERBASE: ""
      PYTHONNOUSERSITE: "1"
      PIP_PYTHON: ""
      PIP_CACHE_DIR: ""
      PIP_NO_CACHE_DIR: ""
      PIP_QUIET: ""
      PIP_LOG: ""
      PIP_CONFIG_FILE: /dev/null
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_REVISION }}
          persist-credentials: false

      - name: Run canonical Policy runtime checks
        run: >-
          python3 -I scripts/run_policy_runtime_checks.py
          --check all
          --revision "${{ env.CANDIDATE_REVISION }}"

  validate:
    name: runtime distribution validate
    if: ${{ always() }}
    needs:
      - classify_runtime
      - runtime-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require policy-correct runtime outcome
        env:
          CLASSIFIER_RESULT: ${{ needs.classify_runtime.result }}
          RUNTIME_REQUIRED: ${{ needs.classify_runtime.outputs.required }}
          RUNTIME_CHECKS_RESULT: ${{ needs.runtime-checks.result }}
        run: |
          test "$CLASSIFIER_RESULT" = success
          case "$RUNTIME_REQUIRED" in
            true)
              test "$RUNTIME_CHECKS_RESULT" = success
              ;;
            false)
              test "$RUNTIME_CHECKS_RESULT" = skipped
              ;;
            *)
              echo "invalid runtime classification: $RUNTIME_REQUIRED" >&2
              exit 1
              ;;
          esac
