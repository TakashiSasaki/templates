name: Materialize Playground publication bytes

on:
  push:
    branches:
      - codex/composition-playground-v1-publication

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/composition-playground-v1-publication
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Install locked generator dependencies
        run: python -m pip install --disable-pip-version-check --no-deps --requirement requirements-dev.lock
      - name: Generate deterministic binary publication
        run: |
          python scripts/generate_composition_playground_publication.py \
            --output generated/composition-playground-v1.json.gz \
            --source-revision 6c1ee765795ff44add2ab284e9e82977d91ef40c
          printf '%s  %s\n' \
            ec92e567b287d3900f6129b4c58407eda4c3fdb66f5e9dcc1ab8c1ee2f1ccdf2 \
            generated/composition-playground-v1.json.gz | sha256sum --check --strict
      - name: Commit binary and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated/composition-playground-v1.json.gz
          git rm .github/workflows/materialize-playground-publication.yml
          git commit -m 'Fix Playground publication binary transport'
          git push origin HEAD:codex/composition-playground-v1-publication
