name: Modeling qualification
on:
  pull_request:
  push:
    branches: [modeling]
permissions:
  contents: read
concurrency:
  group: modeling-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 observed 2026-09-17
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install selected validation tooling
        run: python3 -m pip install -r requirements-dev.txt
      - name: Qualify the exact source head
        run: |
          git rev-parse HEAD
          python3 tools/qualify.py
