name: Modeling qualification
on:
  pull_request:
  push:
    branches: [modeling]
permissions:
  contents: read
concurrency:
  group: modeling-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 observed 2026-09-17
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install selected validation tooling
        run: python3 -m pip install -r requirements-dev.txt
      - name: Qualify the exact source head
        run: |
          git rev-parse HEAD
          python3 tools/qualify.py

  notify-integration:
    name: Notify Integration after provider qualification
    needs: qualify
    if: >-
      github.repository == 'TakashiSasaki/templates' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/modeling' &&
      needs.qualify.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Dispatch the qualified immutable provider revision
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER: modeling
          PROVIDER_REVISION: ${{ github.sha }}
          WORKFLOW_HEAD: ${{ github.workflow_sha }}
        run: |
          python3 - "$PROVIDER_REVISION" "$WORKFLOW_HEAD" <<'PY'
          import re
          import sys
          for label, value in zip(("provider revision", "workflow revision"), sys.argv[1:]):
              if re.fullmatch(r"[0-9a-f]{40}", value) is None:
                  raise SystemExit(f"{label} is not an immutable commit SHA")
          PY
          gh api "repos/$GITHUB_REPOSITORY/dispatches" \
            --method POST \
            -f event_type='publication.provider-qualified' \
            -f "client_payload[provider]=$PROVIDER" \
            -f "client_payload[provider_revision]=$PROVIDER_REVISION" \
            -f "client_payload[provider_qualification_run_id]=$GITHUB_RUN_ID" \
            -f "client_payload[provider_qualification_attempt]=$GITHUB_RUN_ATTEMPT" \
            -f "client_payload[qualification_workflow_head]=$WORKFLOW_HEAD" \
            -f "client_payload[qualification_workflow_name]=Modeling qualification" \
            -f "client_payload[qualification_workflow_event]=$GITHUB_EVENT_NAME" \
            -f "client_payload[qualification_workflow_path]=.github/workflows/modeling-ci.yml"
