name: Temporary normalize generated CLI Python files

on:
  push:
    branches:
      - agent/cli-machine-evidence-pr14

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/cli-machine-evidence-pr14
          fetch-depth: 0
      - name: Normalize generated Python source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('components/capability.cli/files/.template-composition/validators/validate_cli_interface.py'),
              Path('tests/test_cli_interface_contract.py'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              if not text.startswith('\\\n'):
                  raise SystemExit(f'{path}: expected leading raw-string backslash')
              lines = text[2:].splitlines(keepends=True)
              normalized = ''.join(
                  line[4:] if line.startswith('    ') else line
                  for line in lines
              )
              if normalized.startswith(' '):
                  raise SystemExit(f'{path}: normalization left leading indentation')
              compile(normalized, str(path), 'exec')
              path.write_text(normalized, encoding='utf-8')
          PY
      - name: Commit normalization and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-fix-cli-generated-python.yml
          git config user.name "TakashiSasaki templates automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Normalize generated CLI validator sources"
          git push origin HEAD:agent/cli-machine-evidence-pr14
