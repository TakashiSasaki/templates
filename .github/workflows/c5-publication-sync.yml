name: C5 publication identity sync

on:
  push:
    branches:
      - agent/composition-human-output-publication

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7
        with:
          ref: agent/composition-human-output-publication
          fetch-depth: 1
      - name: Synchronize stable identities and provenance
        shell: python
        run: |
          from __future__ import annotations
          import hashlib
          import re
          from pathlib import Path

          OLD_I = "452cef1960612353b9ea206447b97a022ac1c2d7"
          OLD_S = "8f8c36aa4bdf3060f9217edde644856d1da9d72d"
          OLD_T = "e09966b72e0d3ca7bdaee0ee9ed2cb8bae2b4b21"
          I5 = "9c1c093fca1e7e47a9974150e7739665ec570f6e"

          walkthroughs = [
              Path("docs/guides/webapp-product-walkthrough.md"),
              Path("translations/ja/docs/guides/webapp-product-walkthrough.md"),
              Path("docs/guides/skill-first-use-walkthrough.md"),
              Path("translations/ja/docs/guides/skill-first-use-walkthrough.md"),
          ]
          for path in walkthroughs:
              text = path.read_text(encoding="utf-8")
              count = text.count(OLD_I)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one old installer identity, found {count}")
              path.write_text(text.replace(OLD_I, I5), encoding="utf-8")

          def git_blob_sha(path: Path) -> str:
              data = path.read_bytes()
              return hashlib.sha1(f"blob {len(data)}\0".encode("ascii") + data).hexdigest()

          manifest_path = Path("translations/manifest.json")
          manifest = manifest_path.read_text(encoding="utf-8")
          for canonical in (
              "docs/consumer-guide.md",
              "docs/guides/webapp-product-walkthrough.md",
              "docs/guides/skill-first-use-walkthrough.md",
          ):
              digest = git_blob_sha(Path(canonical))
              pattern = re.compile(
                  r'("canonical":\s*"' + re.escape(canonical) + r'".*?"canonical_blob_sha":\s*")[0-9a-f]{40}(" )?'.replace('(\" )?', '(\")'),
                  re.DOTALL,
              )
              # Keep formatting byte-stable except for the SHA value.
              block_pattern = re.compile(
                  r'("canonical":\s*"' + re.escape(canonical) + r'".*?"canonical_blob_sha":\s*")([0-9a-f]{40})(")',
                  re.DOTALL,
              )
              manifest, count = block_pattern.subn(lambda m: m.group(1) + digest + m.group(3), manifest, count=1)
              if count != 1:
                  raise SystemExit(f"translations/manifest.json: expected one provenance entry for {canonical}, found {count}")
          manifest_path.write_text(manifest, encoding="utf-8")

          current_surfaces = [
              Path("release/README.md"),
              Path("release/composition-installer.json"),
              Path("docs/consumer-guide.md"),
              Path("translations/ja/docs/consumer-guide.md"),
              *walkthroughs,
          ]
          for path in current_surfaces:
              text = path.read_text(encoding="utf-8")
              for old in (OLD_I, OLD_S, OLD_T):
                  if old in text:
                      raise SystemExit(f"{path}: stale stable identity remains: {old}")

          Path(".github/workflows/c5-publication-sync.yml").unlink()
      - name: Commit synchronized publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Synchronize C5 first-use publication identities"
          git push origin HEAD:agent/composition-human-output-publication
