name: Deploy documentation from site

# Keep this workflow source-controlled so each diagnostic retry uses a new commit SHA.
on:
  workflow_dispatch:
    inputs:
      site_revision:
        description: Exact merged Site SHA to qualify and deploy
        type: string
        required: false
        default: ''
      automatic:
        description: Set true only for the separately authorized post-adoption automation path
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

env:
  PUBLIC_SITE_URL: https://templates.moukaeritai.work/

concurrency:
  group: documentation-deployment
  cancel-in-progress: true

jobs:
  deployment_metadata:
    if: >-
      github.repository == 'TakashiSasaki/templates' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/site' &&
      ((inputs.automatic != true && vars.PUBLICATION_AUTOMATION_KILL_SWITCH != 'true') ||
       (inputs.automatic == true &&
        vars.PUBLICATION_AUTOMATION_MODE == 'auto-publish' &&
        vars.PUBLICATION_AUTOMATION_AUTHORIZED == 'true' &&
        vars.PUBLICATION_POLICY_REVISION != '' &&
        vars.PUBLICATION_CONTROLLER_REVISION != '' &&
        vars.PUBLICATION_AUTOMATION_KILL_SWITCH != 'true'))
    runs-on: ubuntu-latest
    outputs:
      deployment_timestamp: ${{ steps.timestamp.outputs.deployment_timestamp }}
      site_revision: ${{ steps.site_revision.outputs.site_revision }}
      policy_revision: ${{ steps.trusted_identity.outputs.policy_revision }}
      controller_revision: ${{ steps.trusted_identity.outputs.controller_revision }}

    steps:
      - name: Capture deployment timestamp
        id: timestamp
        run: |
          echo "deployment_timestamp=$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S JST')" \
            >> "$GITHUB_OUTPUT"
      - name: Bind the exact Site revision
        id: site_revision
        env:
          REQUESTED_SITE_REVISION: ${{ inputs.site_revision || github.sha }}
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import os, re
          value = os.environ['REQUESTED_SITE_REVISION']
          if not re.fullmatch(r'[0-9a-f]{40}', value):
              raise SystemExit('site_revision must be a full lowercase commit SHA')
          print('site_revision=' + value)
          PYCODE
      - name: Capture the trusted publication identities
        id: trusted_identity
        if: ${{ inputs.automatic == true }}
        env:
          POLICY_REVISION: ${{ vars.PUBLICATION_POLICY_REVISION }}
          CONTROLLER_REVISION: ${{ vars.PUBLICATION_CONTROLLER_REVISION }}
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import os
          import re

          for output, environment in (
              ('policy_revision', 'POLICY_REVISION'),
              ('controller_revision', 'CONTROLLER_REVISION'),
          ):
              value = os.environ.get(environment, '')
              if not re.fullmatch(r'[0-9a-f]{40}', value):
                  raise SystemExit(f'{environment} must be a full lowercase commit SHA')
              print(f'{output}={value}')
          PYCODE

  build:
    if: >-
      github.repository == 'TakashiSasaki/templates' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/site' &&
      ((inputs.automatic != true && vars.PUBLICATION_AUTOMATION_KILL_SWITCH != 'true') ||
       (inputs.automatic == true &&
        vars.PUBLICATION_AUTOMATION_MODE == 'auto-publish' &&
        vars.PUBLICATION_AUTOMATION_AUTHORIZED == 'true' &&
        vars.PUBLICATION_POLICY_REVISION != '' &&
        vars.PUBLICATION_CONTROLLER_REVISION != '' &&
        vars.PUBLICATION_AUTOMATION_KILL_SWITCH != 'true'))
    needs: deployment_metadata
    uses: ./.github/workflows/build-pages.yml
    with:
      deployment_timestamp: ${{ needs.deployment_metadata.outputs.deployment_timestamp }}
      deployment_revision: ${{ needs.deployment_metadata.outputs.site_revision }}
      trusted_release_required: true
    permissions:
      contents: read
      actions: read

  artifact_gate:
    if: >-
      github.repository == 'TakashiSasaki/templates' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/site' &&
      ((inputs.automatic != true && vars.PUBLICATION_AUTOMATION_KILL_SWITCH != 'true') ||
       (inputs.automatic == true &&
        vars.PUBLICATION_AUTOMATION_MODE == 'auto-publish' &&
        vars.PUBLICATION_AUTOMATION_AUTHORIZED == 'true' &&
        vars.PUBLICATION_POLICY_REVISION != '' &&
        vars.PUBLICATION_CONTROLLER_REVISION != '' &&
        vars.PUBLICATION_AUTOMATION_KILL_SWITCH != 'true')) &&
      needs.deployment_metadata.result == 'success' &&
      needs.build.result == 'success'
    needs:
      - deployment_metadata
      - build
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    steps:
      - name: Verify the exact Pages artifact selected by the build
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
          BUILD_INPUTS: ${{ needs.build.outputs.build_inputs }}
          QUALIFICATION_GATE: ${{ needs.build.outputs.qualification_gate }}
          EXPECTED_SITE_REVISION: ${{ needs.deployment_metadata.outputs.site_revision }}
        run: |
          test -n "$ARTIFACT_ID"
          test "$ARTIFACT_DIGEST" = "sha256:${ARTIFACT_DIGEST#sha256:}"
          test -n "$BUILD_INPUTS"
          test "$QUALIFICATION_GATE" = success
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" > artifact.json
          python3 - <<'PYCODE'
          import json
          import os
          from pathlib import Path

          artifact = json.loads(Path('artifact.json').read_text())
          expected_digest = os.environ['ARTIFACT_DIGEST']
          if artifact.get('name') != 'github-pages':
              raise SystemExit('artifact name is not the canonical Pages artifact')
          if artifact.get('expired') is not False:
              raise SystemExit('Pages artifact is missing or expired')
          if artifact.get('digest') != expected_digest:
              raise SystemExit('Pages artifact digest differs from the producer output')
          if artifact.get('workflow_run', {}).get('id') != int(os.environ['GITHUB_RUN_ID']):
              raise SystemExit('Pages artifact belongs to a different workflow run')
          inputs = json.loads(os.environ['BUILD_INPUTS'])
          if not isinstance(inputs, dict) or not inputs.get('publication_bundle', {}).get('identity'):
              raise SystemExit('build input identity is missing the selected Bundle identity')
          if inputs.get('site') != os.environ['EXPECTED_SITE_REVISION']:
              raise SystemExit('Pages artifact was built from a different Site revision')
          ref = json.loads(__import__('subprocess').check_output([
              'gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/git/ref/heads/site"
          ]))
          if ref.get('object', {}).get('sha') != os.environ['EXPECTED_SITE_REVISION']:
              raise SystemExit('Site branch advanced after the deployment build was selected')
          print(json.dumps({'artifact_id': artifact['id'], 'digest': artifact['digest'], 'bundle_identity': inputs['publication_bundle']['identity'], 'site_revision': inputs['site']}, sort_keys=True))
          PYCODE
          echo 'Exact artifact gate passed; deployment may consume only this artifact.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: >-
      github.repository == 'TakashiSasaki/templates' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/site' &&
      ((inputs.automatic != true && vars.PUBLICATION_AUTOMATION_KILL_SWITCH != 'true') ||
       (inputs.automatic == true &&
        vars.PUBLICATION_AUTOMATION_MODE == 'auto-publish' &&
        vars.PUBLICATION_AUTOMATION_AUTHORIZED == 'true' &&
        vars.PUBLICATION_POLICY_REVISION != '' &&
        vars.PUBLICATION_CONTROLLER_REVISION != '' &&
        vars.PUBLICATION_AUTOMATION_KILL_SWITCH != 'true')) &&
      needs.deployment_metadata.result == 'success' &&
      needs.build.result == 'success' &&
      needs.artifact_gate.result == 'success'
    needs:
      - build
      - artifact_gate
      - deployment_metadata
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Revalidate publication preconditions immediately before Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SITE_REVISION: ${{ needs.deployment_metadata.outputs.site_revision }}
          EXPECTED_POLICY_REVISION: ${{ needs.deployment_metadata.outputs.policy_revision }}
          EXPECTED_CONTROLLER_REVISION: ${{ needs.deployment_metadata.outputs.controller_revision }}
          EXPECTED_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
          EXPECTED_BUILD_INPUTS: ${{ needs.build.outputs.build_inputs }}
          BUILD_RECEIPT: ${{ needs.build.outputs.bundle_receipt }}
          AUTOMATIC: ${{ inputs.automatic }}
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          import re
          import subprocess

          repository = os.environ['GITHUB_REPOSITORY']

          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', path], text=True))

          def repository_variable(name, default=None):
              try:
                  value = api(f'repos/{repository}/actions/variables/{name}')
              except subprocess.CalledProcessError:
                  if default is not None:
                      return default
                  raise
              result = value.get('value')
              if not isinstance(result, str):
                  raise SystemExit(f'publication variable {name} has no string value')
              return result

          kill_switch = repository_variable('PUBLICATION_AUTOMATION_KILL_SWITCH', 'false')
          if kill_switch != 'false':
              raise SystemExit('publication kill switch is enabled before Pages deployment')

          receipt = json.loads(os.environ['BUILD_RECEIPT'])
          trusted = receipt.get('trusted_receipt')
          if not isinstance(trusted, dict):
              raise SystemExit('the qualified build did not carry a trusted Integration receipt')
          for field in ('policy_revision', 'controller_revision'):
              if not re.fullmatch(r'[0-9a-f]{40}', trusted.get(field, '')):
                  raise SystemExit(f'trusted receipt {field} is not an exact SHA')
          if os.environ['AUTOMATIC'].lower() == 'true':
              current = {
                  'mode': repository_variable('PUBLICATION_AUTOMATION_MODE'),
                  'authorized': repository_variable('PUBLICATION_AUTOMATION_AUTHORIZED'),
                  'policy': repository_variable('PUBLICATION_POLICY_REVISION'),
                  'controller': repository_variable('PUBLICATION_CONTROLLER_REVISION'),
              }
              if current['mode'] != 'auto-publish' or current['authorized'] != 'true':
                  raise SystemExit('publication authorization changed before Pages deployment')
              if current['policy'] != os.environ['EXPECTED_POLICY_REVISION']:
                  raise SystemExit('trusted Policy revision changed before Pages deployment')
              if current['controller'] != os.environ['EXPECTED_CONTROLLER_REVISION']:
                  raise SystemExit('trusted controller revision changed before Pages deployment')
              if trusted['policy_revision'] != current['policy'] or trusted['controller_revision'] != current['controller']:
                  raise SystemExit('trusted receipt identities differ from active automation pins')

          expected_site = os.environ['EXPECTED_SITE_REVISION']
          ref = api(f'repos/{repository}/git/ref/heads/site')
          if ref.get('object', {}).get('sha') != expected_site:
              raise SystemExit('Site branch advanced before Pages deployment')

          artifact_id = os.environ['EXPECTED_ARTIFACT_ID']
          if not re.fullmatch(r'[1-9][0-9]*', artifact_id):
              raise SystemExit('Pages artifact id is invalid before deployment')
          artifact = api(f'repos/{repository}/actions/artifacts/{artifact_id}')
          if artifact.get('id') != int(artifact_id) or artifact.get('name') != 'github-pages':
              raise SystemExit('Pages artifact identity changed before deployment')
          if artifact.get('expired') is not False:
              raise SystemExit('Pages artifact is missing or expired before deployment')
          if artifact.get('digest') != os.environ['EXPECTED_ARTIFACT_DIGEST']:
              raise SystemExit('Pages artifact digest changed before deployment')
          if artifact.get('workflow_run', {}).get('id') != int(os.environ['GITHUB_RUN_ID']):
              raise SystemExit('Pages artifact belongs to a different deployment run')

          inputs = json.loads(os.environ['EXPECTED_BUILD_INPUTS'])
          if not isinstance(inputs, dict):
              raise SystemExit('Pages build inputs are not an object')
          if inputs.get('site') != expected_site:
              raise SystemExit('Pages artifact was built from a different Site revision')
          bundle = inputs.get('publication_bundle')
          if not isinstance(bundle, dict) or not isinstance(bundle.get('identity'), str) or not bundle['identity']:
              raise SystemExit('Pages artifact is missing the selected Bundle identity')
          if (receipt.get('producer') != bundle.get('producer', {}).get('revision')
                  or receipt.get('identity') != bundle.get('identity')
                  or trusted.get('bundle_content_digest') != bundle.get('content_digest')):
              raise SystemExit('trusted receipt and final artifact selected different Bundle inputs')
          print(json.dumps({
              'artifact_id': artifact['id'],
              'digest': artifact['digest'],
              'site_revision': inputs['site'],
              'bundle_identity': bundle['identity'],
          }, sort_keys=True))
          PYCODE

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Verify configured public URL
        env:
          ACTUAL_BASE_URL: ${{ steps.pages.outputs.base_url }}
          ACTUAL_HOST: ${{ steps.pages.outputs.host }}
          ACTUAL_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          expected_base_url="${PUBLIC_SITE_URL%/}"
          expected_host="${expected_base_url#https://}"
          test "$ACTUAL_BASE_URL" = "$expected_base_url"
          test "$ACTUAL_HOST" = "$expected_host"
          test -z "$ACTUAL_BASE_PATH"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: github-pages
