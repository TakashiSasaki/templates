name: Deploy documentation from site

# Keep this workflow source-controlled so each diagnostic retry uses a new commit SHA.
on:
  workflow_dispatch:
    inputs:
      site_revision:
        description: Exact merged Site SHA to qualify and deploy
        type: string
        required: false
        default: ''
      automatic:
        description: Set true only for the separately authorized post-adoption automation path
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

env:
  PUBLIC_SITE_URL: https://templates.moukaeritai.work/

concurrency:
  group: documentation-deployment
  # Let an in-flight deployment finish before the newest request proceeds.
  # Cancelling an action while it is talking to Pages does not provide an
  # atomic external rollback guarantee.
  cancel-in-progress: false

jobs:
  deployment_metadata:
    if: >-
      github.repository == 'TakashiSasaki/templates' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/site' &&
      ((inputs.automatic != true && vars.PUBLICATION_AUTOMATION_KILL_SWITCH != 'true') ||
       (inputs.automatic == true &&
        vars.PUBLICATION_AUTOMATION_MODE == 'auto-publish' &&
        vars.PUBLICATION_AUTOMATION_AUTHORIZED == 'true' &&
        vars.PUBLICATION_POLICY_REVISION != '' &&
        vars.PUBLICATION_CONTROLLER_REVISION != '' &&
        vars.PUBLICATION_AUTOMATION_KILL_SWITCH != 'true'))
    runs-on: ubuntu-latest
    outputs:
      deployment_timestamp: ${{ steps.timestamp.outputs.deployment_timestamp }}
      site_revision: ${{ steps.site_revision.outputs.site_revision }}
      policy_revision: ${{ steps.trusted_identity.outputs.policy_revision }}
      controller_revision: ${{ steps.trusted_identity.outputs.controller_revision }}

    steps:
      - name: Capture deployment timestamp
        id: timestamp
        run: |
          echo "deployment_timestamp=$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S JST')" \
            >> "$GITHUB_OUTPUT"
      - name: Bind the exact Site revision
        id: site_revision
        env:
          REQUESTED_SITE_REVISION: ${{ inputs.site_revision || github.sha }}
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import os, re
          value = os.environ['REQUESTED_SITE_REVISION']
          if not re.fullmatch(r'[0-9a-f]{40}', value):
              raise SystemExit('site_revision must be a full lowercase commit SHA')
          print('site_revision=' + value)
          PYCODE
      - name: Capture the trusted publication identities
        id: trusted_identity
        if: ${{ inputs.automatic == true }}
        env:
          POLICY_REVISION: ${{ vars.PUBLICATION_POLICY_REVISION }}
          CONTROLLER_REVISION: ${{ vars.PUBLICATION_CONTROLLER_REVISION }}
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import os
          import re

          for output, environment in (
              ('policy_revision', 'POLICY_REVISION'),
              ('controller_revision', 'CONTROLLER_REVISION'),
          ):
              value = os.environ.get(environment, '')
              if not re.fullmatch(r'[0-9a-f]{40}', value):
                  raise SystemExit(f'{environment} must be a full lowercase commit SHA')
              print(f'{output}={value}')
          PYCODE

  build:
    if: >-
      github.repository == 'TakashiSasaki/templates' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/site' &&
      ((inputs.automatic != true && vars.PUBLICATION_AUTOMATION_KILL_SWITCH != 'true') ||
       (inputs.automatic == true &&
        vars.PUBLICATION_AUTOMATION_MODE == 'auto-publish' &&
        vars.PUBLICATION_AUTOMATION_AUTHORIZED == 'true' &&
        vars.PUBLICATION_POLICY_REVISION != '' &&
        vars.PUBLICATION_CONTROLLER_REVISION != '' &&
        vars.PUBLICATION_AUTOMATION_KILL_SWITCH != 'true'))
    needs: deployment_metadata
    uses: ./.github/workflows/build-pages.yml
    with:
      deployment_timestamp: ${{ needs.deployment_metadata.outputs.deployment_timestamp }}
      deployment_revision: ${{ needs.deployment_metadata.outputs.site_revision }}
      # Human dispatch is the authorization for the manual lane.  It still
      # consumes an exact lock and a read-only qualified Bundle, while the
      # automatic lane additionally requires the trusted promoted receipt.
      trusted_release_required: ${{ inputs.automatic == true }}
    permissions:
      contents: read
      actions: read

  artifact_gate:
    if: >-
      github.repository == 'TakashiSasaki/templates' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/site' &&
      ((inputs.automatic != true && vars.PUBLICATION_AUTOMATION_KILL_SWITCH != 'true') ||
       (inputs.automatic == true &&
        vars.PUBLICATION_AUTOMATION_MODE == 'auto-publish' &&
        vars.PUBLICATION_AUTOMATION_AUTHORIZED == 'true' &&
        vars.PUBLICATION_POLICY_REVISION != '' &&
        vars.PUBLICATION_CONTROLLER_REVISION != '' &&
        vars.PUBLICATION_AUTOMATION_KILL_SWITCH != 'true')) &&
      needs.deployment_metadata.result == 'success' &&
      needs.build.result == 'success'
    needs:
      - deployment_metadata
      - build
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    steps:
      - name: Verify the exact Pages artifact selected by the build
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
          BUILD_INPUTS: ${{ needs.build.outputs.build_inputs }}
          QUALIFICATION_GATE: ${{ needs.build.outputs.qualification_gate }}
          EXPECTED_SITE_REVISION: ${{ needs.deployment_metadata.outputs.site_revision }}
        run: |
          test -n "$ARTIFACT_ID"
          test "$ARTIFACT_DIGEST" = "sha256:${ARTIFACT_DIGEST#sha256:}"
          test -n "$BUILD_INPUTS"
          test "$QUALIFICATION_GATE" = success
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" > artifact.json
          python3 - <<'PYCODE'
          import json
          import os
          from pathlib import Path

          artifact = json.loads(Path('artifact.json').read_text())
          expected_digest = os.environ['ARTIFACT_DIGEST']
          if artifact.get('name') != 'github-pages':
              raise SystemExit('artifact name is not the canonical Pages artifact')
          if artifact.get('expired') is not False:
              raise SystemExit('Pages artifact is missing or expired')
          if artifact.get('digest') != expected_digest:
              raise SystemExit('Pages artifact digest differs from the producer output')
          if artifact.get('workflow_run', {}).get('id') != int(os.environ['GITHUB_RUN_ID']):
              raise SystemExit('Pages artifact belongs to a different workflow run')
          inputs = json.loads(os.environ['BUILD_INPUTS'])
          if not isinstance(inputs, dict) or not inputs.get('publication_bundle', {}).get('identity'):
              raise SystemExit('build input identity is missing the selected Bundle identity')
          if inputs.get('site') != os.environ['EXPECTED_SITE_REVISION']:
              raise SystemExit('Pages artifact was built from a different Site revision')
          ref = json.loads(__import__('subprocess').check_output([
              'gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/git/ref/heads/site"
          ]))
          if ref.get('object', {}).get('sha') != os.environ['EXPECTED_SITE_REVISION']:
              raise SystemExit('Site branch advanced after the deployment build was selected')
          print(json.dumps({'artifact_id': artifact['id'], 'digest': artifact['digest'], 'bundle_identity': inputs['publication_bundle']['identity'], 'site_revision': inputs['site']}, sort_keys=True))
          PYCODE
          echo 'Exact artifact gate passed; deployment may consume only this artifact.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: >-
      github.repository == 'TakashiSasaki/templates' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/site' &&
      ((inputs.automatic != true && vars.PUBLICATION_AUTOMATION_KILL_SWITCH != 'true') ||
       (inputs.automatic == true &&
        vars.PUBLICATION_AUTOMATION_MODE == 'auto-publish' &&
        vars.PUBLICATION_AUTOMATION_AUTHORIZED == 'true' &&
        vars.PUBLICATION_POLICY_REVISION != '' &&
        vars.PUBLICATION_CONTROLLER_REVISION != '' &&
        vars.PUBLICATION_AUTOMATION_KILL_SWITCH != 'true')) &&
      needs.deployment_metadata.result == 'success' &&
      needs.build.result == 'success' &&
      needs.artifact_gate.result == 'success'
    needs:
      - build
      - artifact_gate
      - deployment_metadata
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out the trusted deployment verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .trusted-deployment-verifier
          sparse-checkout: scripts/revalidate_pages_deployment.py
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the deployment verifier revision
        env:
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          test "$(git -C .trusted-deployment-verifier rev-parse HEAD)" = "$EXPECTED_WORKFLOW_SHA"

      - name: Revalidate publication preconditions immediately before Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SITE_REVISION: ${{ needs.deployment_metadata.outputs.site_revision }}
          EXPECTED_POLICY_REVISION: ${{ needs.deployment_metadata.outputs.policy_revision }}
          EXPECTED_CONTROLLER_REVISION: ${{ needs.deployment_metadata.outputs.controller_revision }}
          EXPECTED_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
          EXPECTED_BUILD_INPUTS: ${{ needs.build.outputs.build_inputs }}
          BUILD_RECEIPT: ${{ needs.build.outputs.bundle_receipt }}
          AUTOMATIC: ${{ inputs.automatic }}
          EXPECTED_KILL_SWITCH: ${{ vars.PUBLICATION_AUTOMATION_KILL_SWITCH || 'false' }}
        run: |
          python3 .trusted-deployment-verifier/scripts/revalidate_pages_deployment.py

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Verify configured public URL
        env:
          ACTUAL_BASE_URL: ${{ steps.pages.outputs.base_url }}
          ACTUAL_HOST: ${{ steps.pages.outputs.host }}
          ACTUAL_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          expected_base_url="${PUBLIC_SITE_URL%/}"
          expected_host="${expected_base_url#https://}"
          test "$ACTUAL_BASE_URL" = "$expected_base_url"
          test "$ACTUAL_HOST" = "$expected_host"
          test -z "$ACTUAL_BASE_PATH"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: github-pages
