name: Deploy documentation from site

on:
  push:
    branches:
      - site

permissions:
  contents: read

concurrency:
  group: documentation-deployment
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'TakashiSasaki/templates'
    uses: ./.github/workflows/build-pages.yml
    with:
      site_ref: ${{ github.sha }}
      source_ref: main
    permissions:
      contents: read

  deploy:
    if: >-
      github.repository == 'TakashiSasaki/templates' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/site'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
