name: Build documentation while deployment is suspended

on:
  push:
    branches:
      - site

permissions:
  contents: read

concurrency:
  group: documentation-deployment
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.repository == 'TakashiSasaki/templates' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/site'
    uses: ./.github/workflows/build-pages.yml
    with:
      site_ref: ${{ github.sha }}
    permissions:
      contents: read
