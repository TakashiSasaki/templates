name: Deploy documentation from site
on:
  push:
    branches: [site]
  workflow_run:
    workflows: [Integration publication, Refresh publication]
    types: [completed]
    branches: [integration, site]
  workflow_dispatch:
    inputs:
      publication_run:
        description: Successful publication run to use; empty selects newest available success
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: documentation-deployment
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'site' }}
          persist-credentials: false
      - run: python3 -m pip install -r requirements-build.lock
      - name: Consume a complete successful publication
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_RUN: ${{ inputs.publication_run }}
        run: |
          args=(--output "$RUNNER_TEMP/publication")
          if [ -n "$PUBLICATION_RUN" ]; then args+=(--run "$PUBLICATION_RUN"); fi
          python3 scripts/fetch_publication.py "${args[@]}"
      - name: Render and check the Site artifact
        run: |
          python3 scripts/build_site.py --bundle "$RUNNER_TEMP/publication" --output "$RUNNER_TEMP/build"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ${{ runner.temp }}/build/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        id: deployment
