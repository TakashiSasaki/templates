name: Temporary PR 161 review fix

on:
  push:
    branches:
      - agent/site-index-navigation-graph
    paths:
      - .github/workflows/tmp-review-fix-161.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/site-index-navigation-graph
          fetch-depth: 0
      - name: Apply review fix and regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('scripts/generate_index_navigation.py')
          source = source_path.read_text(encoding='utf-8')

          marker = 'CONTEXTUAL_JOINERS = frozenset({"\\u200c", "\\u200d"})\n'
          replacement = marker + 'WHATWG_BIDI_LTR_COMPAT_RANGE = range(0x0870, 0x088F)\n'
          assert marker in source
          source = source.replace(marker, replacement, 1)

          marker = '''def validate_ascii_punycode_labels(\n'''
          helper = '''def whatwg_bidi_validation_text(label: str) -> str:\n    """Mirror browser UTS #46 bidi treatment for Arabic Extended-B compatibility letters."""\n    return "".join(\n        "a" if ord(character) in WHATWG_BIDI_LTR_COMPAT_RANGE else character\n        for character in label\n    )\n\n\ndef is_whatwg_bidi_trigger(character: str) -> bool:\n    """Return whether a code point activates browser-style bidi-domain validation."""\n    return (\n        ord(character) not in WHATWG_BIDI_LTR_COMPAT_RANGE\n        and unicodedata.bidirectional(character) in {"R", "AL", "AN"}\n    )\n\n\n'''
          assert marker in source
          source = source.replace(marker, helper + marker, 1)

          old = '''    bidi_domain = any(\n        unicodedata.bidirectional(character) in {"R", "AL", "AN"}\n        for label in decoded_alabels\n        for character in label\n    )\n    if bidi_domain:\n        for label in decoded_alabels:\n            try:\n                idna.check_bidi(label, check_ltr=True)\n            except idna.IDNAError as exc:\n'''
          new = '''    bidi_domain = any(\n        is_whatwg_bidi_trigger(character)\n        for label in decoded_alabels\n        for character in label\n    )\n    if bidi_domain:\n        for label in decoded_alabels:\n            try:\n                idna.check_bidi(whatwg_bidi_validation_text(label), check_ltr=True)\n            except idna.IDNAError as exc:\n'''
          assert old in source
          source = source.replace(old, new, 1)

          old = '''    bidi_domain = any(\n        unicodedata.bidirectional(character) in {"R", "AL", "AN"}\n        for label in semantic_labels\n        for character in label\n    )\n'''
          new = '''    bidi_domain = any(\n        is_whatwg_bidi_trigger(character)\n        for label in semantic_labels\n        for character in label\n    )\n'''
          assert old in source
          source = source.replace(old, new, 1)

          old = '''                idna.check_bidi(label, check_ltr=True)\n'''
          new = '''                idna.check_bidi(whatwg_bidi_validation_text(label), check_ltr=True)\n'''
          # Exactly one remaining Unicode-label call after the A-label call was already replaced above.
          assert source.count(old) == 1, source.count(old)
          source = source.replace(old, new, 1)
          source_path.write_text(source, encoding='utf-8')

          test_path = Path('tests/test_index_navigation_review_round_20260812_t.py')
          test_path.write_text('''import unittest\n\nfrom scripts import generate_index_navigation as navigation\nfrom scripts.generate_index_navigation import IndexNavigationError\n\n\nclass LatestIndexNavigationReviewRoundTTests(unittest.TestCase):\n    def test_browser_valid_arabic_extended_b_ltr_host_is_accepted(self) -> None:\n        for target in (\n            "https://a\\u0870b.com/",\n            "https://xn--ab-h8e.com/",\n            "https://\\u0870.com/",\n        ):\n            with self.subTest(target=target):\n                navigation.validate_external_location(target, "docs/index.md", 2)\n\n    def test_other_mixed_direction_hosts_remain_rejected(self) -> None:\n        for target in ("https://a\\u05d0b.com/", "https://a\\u0639b.com/"):\n            with self.subTest(target=target):\n                with self.assertRaises(IndexNavigationError):\n                    navigation.validate_external_location(target, "docs/index.md", 2)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY
      - name: Run focused tests
        run: python -m unittest tests/test_index_navigation_review_round_20260812_t.py
      - name: Run navigation test suite
        run: python -m unittest discover -s tests -p 'test_index_navigation*.py'
      - name: Commit production change and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-review-fix-161.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate_index_navigation.py tests/test_index_navigation_review_round_20260812_t.py .github/workflows/tmp-review-fix-161.yml
          git commit -m "Align navigation host bidi validation with browsers"
          git push origin HEAD:agent/site-index-navigation-graph
