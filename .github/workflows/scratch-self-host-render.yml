name: Scratch self-host render

on:
  push:
    branches:
      - scratch/self-host-render
    paths:
      - .agent-policy.yml
      - .github/workflows/scratch-self-host-render.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out scratch candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Render with exact trusted-review stable runtime
        uses: TakashiSasaki/templates@8600bc014b4381c3531eedb3bd832d9ac09a500e
        with:
          command: render
          config: .agent-policy.yml

      - name: Record exact generated outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            .agent-policy.lock \
            AGENTS.md \
            .review-authority \
            .agents/skills/pr-review \
            .github/REVIEW_GUIDELINES.md
          git diff --cached --quiet && {
            echo "Renderer produced no changes; refusing empty scratch commit."
            exit 1
          }
          git commit -m "Record exact self-host generated outputs"
          git push origin HEAD:scratch/self-host-render
