name: Temporary Site publication cutover generator 648

on:
  push:
    branches:
      - tmp-site-publication-cutover-648-generator-09fa0124

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact prepared Site revision
        uses: actions/checkout@v7
        with:
          ref: e8f579c9c66c2ca652abaf4b5800d8dd583dbc4a
          path: site-root
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact merged Composition revision
        uses: actions/checkout@v7
        with:
          ref: 09fa0124669b9a655c97fbe1155d1d1f93f66f27
          path: composition-root
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run canonical Site publication advance
        run: |
          python site-root/scripts/advance_publication_source.py \
            --site-root site-root \
            --provider composition \
            --provider-root composition-root \
            --composition-root composition-root \
            --target 09fa0124669b9a655c97fbe1155d1d1f93f66f27 \
            --expected-current cb38a6bee2ac277f9b94b1f8459020f77d999af8

      - name: Emit exact generated bytes and digests
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib

          root = Path('site-root')
          for relative in ('publication-sources.json', 'agent.json', 'assets/agent.json'):
              data = (root / relative).read_bytes()
              print(f'===BEGIN_GENERATED:{relative}===')
              print(base64.b64encode(data).decode('ascii'))
              print(f'SHA256:{hashlib.sha256(data).hexdigest()}')
              print(f'===END_GENERATED:{relative}===')
          PY

      - name: Upload exact generated files
        uses: actions/upload-artifact@v4
        with:
          name: site-publication-cutover-648-generated
          path: |
            site-root/publication-sources.json
            site-root/agent.json
            site-root/assets/agent.json
          if-no-files-found: error
          retention-days: 1
