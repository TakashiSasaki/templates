name: Rebuild PR 791 on current S1

on:
  push:
    branches:
      - rebuild/site-publication-consumer-reuse

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rebuild/site-publication-consumer-reuse
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reapply S2-only changes on current S1
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin perf/site-publication-consumer-reuse
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          OLD = 'origin/perf/site-publication-consumer-reuse'
          copy_paths = [
              '.github/workflows/build-pages-stacked-site.yml',
              '.github/workflows/site-composition-materialization-cross-authority.yml',
              'tests/test_catalog_architecture_translation_integration.py',
              'tests/test_composer_mvp_translation_integration.py',
              'tests/test_composition_model_translation_integration.py',
              'tests/test_composition_translation_reader_integration.py',
              'tests/test_generated_contract_manifest_translation_integration.py',
              'tests/test_site_composition_materialization_cross_authority_workflow.py',
          ]
          for raw in copy_paths:
              path = Path(raw)
              path.parent.mkdir(parents=True, exist_ok=True)
              content = subprocess.run(
                  ['git', 'show', f'{OLD}:{raw}'],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout
              path.write_text(content, encoding='utf-8')

          # Keep the current S1 safety/race implementation and replace only the
          # Composition-specific semantic metadata read with the provider-owned
          # descriptor contract already established by S2.
          source = Path('scripts/materialize_publication_assets.py')
          text = source.read_text(encoding='utf-8')
          old = '''def _provider_semantic_revision(root: Path) -> str:\n    manifest_path = root / "generated" / "composition-playground-publication.json"\n    if manifest_path.is_file() and not manifest_path.is_symlink():\n        try:\n            data = json.loads(manifest_path.read_text(encoding="utf-8"))\n            if isinstance(data, dict) and isinstance(data.get("semantic_revision"), str):\n                return data["semantic_revision"]\n        except Exception:\n            pass\n    return ""\n'''
          new = '''def _provider_semantic_revision(root: Path) -> str:\n    # Semantic identity is provider-owned metadata. Site knows only the generic\n    # descriptor locations and never parses Composition-specific output formats.\n    for relative in (\n        Path("publication-descriptor.json"),\n        Path("generated/publication-descriptor.json"),\n    ):\n        descriptor_path = root / relative\n        if descriptor_path.is_symlink() or not descriptor_path.is_file():\n            continue\n        try:\n            data = json.loads(descriptor_path.read_text(encoding="utf-8"))\n        except (OSError, UnicodeError, json.JSONDecodeError):\n            continue\n        if isinstance(data, dict) and isinstance(data.get("semantic_revision"), str):\n            return data["semantic_revision"]\n    return ""\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one legacy semantic reader, found {text.count(old)}')
          source.write_text(text.replace(old, new), encoding='utf-8')

          # Add a focused authority-boundary regression to the existing S1
          # review-followup suite rather than restoring S2's obsolete duplicate
          # materialization tests.
          tests = Path('tests/test_materialize_publication_assets_review_followup.py')
          text = tests.read_text(encoding='utf-8')
          footer = '\nif __name__ == "__main__":\n    unittest.main()\n'
          if text.count(footer) != 1:
              raise SystemExit('review-followup footer not found exactly once')
          method = textwrap.indent(textwrap.dedent(r'''

          def test_semantic_revision_uses_provider_owned_descriptor_only(self) -> None:
              with tempfile.TemporaryDirectory() as directory:
                  root = Path(directory)
                  materializer = self.write_v4_provider(root)
                  materializer.write_text(
                      "from __future__ import annotations\n"
                      "import argparse, json\n"
                      "from pathlib import Path\n"
                      "parser = argparse.ArgumentParser()\n"
                      "parser.add_argument('--source-root', type=Path, required=True)\n"
                      "args = parser.parse_args()\n"
                      "generated = args.source_root / 'generated'\n"
                      "generated.mkdir(parents=True, exist_ok=True)\n"
                      "(generated / 'output.bin').write_bytes(b'deterministic-output')\n"
                      "(generated / 'publication-descriptor.json').write_text(\n"
                      "    json.dumps({'schema_version': 1, 'provider': 'fixture', 'semantic_revision': 'provider-semantic'}),\n"
                      "    encoding='utf-8',\n"
                      ")\n",
                      encoding="utf-8",
                  )
                  internal = root / "generated" / "composition-playground-publication.json"
                  internal.parent.mkdir(parents=True, exist_ok=True)
                  internal.write_text(
                      json.dumps({"semantic_revision": "composition-internal"}),
                      encoding="utf-8",
                  )

                  self.assertTrue(materialize_publication(root, "fixture"))
                  stamp = json.loads((root / STAMP_FILE).read_text(encoding="utf-8"))
                  self.assertEqual("provider-semantic", stamp["semantic_revision"])

                  (root / "generated" / "publication-descriptor.json").unlink()
                  self.assertFalse(is_publication_materialized(root, "fixture"))
          '''), '    ')
          tests.write_text(text.replace(footer, method + footer), encoding='utf-8')

          # Add/update reader-facing lifecycle documentation against the current
          # S1 contract rather than copying the stale pre-remediation wording.
          docs = Path('docs/ci/site-performance.md')
          text = docs.read_text(encoding='utf-8')
          heading = '## Provider publication materialization lifecycle'
          section = '''## Provider publication materialization lifecycle\n\nProvider publications pass through an explicit, authority-preserving materialization lifecycle in Pages CI:\n\n1. **Source state**: the provider checkout owns its catalog, source inputs, and optional `scripts/materialize_publication.py` entrypoint. Site does not implement provider generator semantics.\n2. **Explicit materialization phase**: `.github/workflows/build-pages.yml` invokes `scripts/materialize_publication_assets.py` before provider integration tests, assembly, and translation publication. The provider entrypoint runs in isolated Python mode with bytecode writes disabled so execution does not create undeclared source-tree side effects.\n3. **Stable materialized state**: Site validates the materialized catalog and records an untracked `.publication-materialization-stamp.json`. Reuse is bound to the canonical provider root, exact Git revision when available, Git-visible tracked/untracked source state, catalog/materializer fingerprint, provider-owned semantic revision from `publication-descriptor.json` or `generated/publication-descriptor.json`, and exact SHA-256 snapshots of declared materialized products.\n4. **Boundary revalidation**: source identity, semantic identity, and materialized-output snapshots are rechecked at stamp acceptance, stamp commit, and success-return boundaries. Any observed change fails closed instead of publishing a mixed-state result.\n5. **Process-crossing reuse**: downstream Python processes validate the persistent stamp before reuse. A missing, stale, malformed, or corrupted stamp/output causes re-materialization or a fail-closed error according to ownership rules; the in-process cache is only a bounded local optimization.\n6. **Authority boundary**: Composition owns generation, semantic identity, descriptors, and publication products. Site owns only generic orchestration, contract validation, and reuse verification; it does not parse Composition-specific generated manifests or reproduce Composition planning/generation logic.\n\n'''
          if heading in text:
              start = text.index(heading)
              next_heading = text.find('\n## ', start + len(heading))
              if next_heading == -1:
                  text = text[:start] + section
              else:
                  text = text[:start] + section + text[next_heading + 1:]
          else:
              marker = '\n## Validation status\n'
              if marker not in text:
                  raise SystemExit('site-performance validation heading not found')
              text = text.replace(marker, '\n' + section + marker, 1)
          docs.write_text(text, encoding='utf-8')
          PY
      - name: Run focused S2 qualification
        run: |
          python -m py_compile scripts/materialize_publication_assets.py tests/test_materialize_publication_assets_review_followup.py tests/test_site_composition_materialization_cross_authority_workflow.py
          python -m unittest \
            tests.test_materialize_publication_assets \
            tests.test_materialize_publication_assets_review_followup \
            tests.test_assembly_materialization_boundary \
            tests.test_site_composition_materialization_cross_authority_workflow \
            tests.test_catalog_architecture_translation_integration \
            tests.test_composer_mvp_translation_integration \
            tests.test_composition_model_translation_integration \
            tests.test_composition_translation_reader_integration \
            tests.test_generated_contract_manifest_translation_integration \
            --verbose
      - name: Commit reconstructed S2 and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build-pages-stacked-site.yml \
                  .github/workflows/site-composition-materialization-cross-authority.yml \
                  docs/ci/site-performance.md \
                  scripts/materialize_publication_assets.py \
                  tests/test_catalog_architecture_translation_integration.py \
                  tests/test_composer_mvp_translation_integration.py \
                  tests/test_composition_model_translation_integration.py \
                  tests/test_composition_translation_reader_integration.py \
                  tests/test_generated_contract_manifest_translation_integration.py \
                  tests/test_materialize_publication_assets_review_followup.py \
                  tests/test_site_composition_materialization_cross_authority_workflow.py
          git rm .github/workflows/rebuild-791.yml
          git diff --cached --check
          git commit -m "Rebuild Site publication consumer reuse on current materialization base"
          git push origin HEAD:rebuild/site-publication-consumer-reuse
