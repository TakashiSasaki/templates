name: Temporary align Webapp worklist proof status

on:
  push:
    branches:
      - agent/webapp-worklist-proof-obligations-pr12

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/webapp-worklist-proof-obligations-pr12
          fetch-depth: 0
      - name: Align projected status with artifact proof requirements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = "components/artifact.webapp-core/files/scripts/scaffold_webapp_evidence.py"
          replace_once(
              path,
              '    if any(\n        not isinstance(proof, dict)\n        or proof.get("status") not in {"verified", "deferred"}\n        for proof in proofs\n    ):\n        return "missing"\n    if any(proof.get("status") == "deferred" for proof in proofs):\n',
              '    if any(\n        not isinstance(proof, dict)\n        or proof.get("status") not in {"verified", "deferred"}\n        for proof in proofs\n    ):\n        return "missing"\n\n    artifact_kinds = set(artifact_required_proof_kinds(record.get("target")))\n    if artifact_kinds:\n        for proof_set in proof_sets:\n            assert isinstance(proof_set, list)\n            observed_kinds = {\n                proof.get("kind")\n                for proof in proof_set\n                if isinstance(proof, dict) and isinstance(proof.get("kind"), str)\n            }\n            if observed_kinds.isdisjoint(artifact_kinds):\n                return "missing"\n\n    if any(proof.get("status") == "deferred" for proof in proofs):\n',
          )
          replace_once(
              path,
              ') -> tuple[dict[tuple[Any, ...], dict[str, Any]], dict[str, str]]:\n    records = evidence.get("records", [])\n',
              ') -> tuple[\n    dict[tuple[Any, ...], dict[str, Any]],\n    dict[str, str],\n    dict[str, object],\n]:\n    records = evidence.get("records", [])\n',
          )
          replace_once(
              path,
              '    by_target: dict[tuple[Any, ...], dict[str, Any]] = {}\n    statuses: dict[str, str] = {}\n',
              '    by_target: dict[tuple[Any, ...], dict[str, Any]] = {}\n    statuses: dict[str, str] = {}\n    targets_by_record_id: dict[str, object] = {}\n',
          )
          replace_once(
              path,
              '        if isinstance(record_id_value, str):\n            statuses[record_id_value] = _record_status(record)\n    return by_target, statuses\n',
              '        if isinstance(record_id_value, str):\n            statuses[record_id_value] = _record_status(record)\n            targets_by_record_id[record_id_value] = record.get("target")\n    return by_target, statuses, targets_by_record_id\n',
          )
          replace_once(
              path,
              'def _project_requirements(\n    evidence: dict[str, Any], record_statuses: dict[str, str]\n) -> list[dict[str, Any]]:\n',
              'def _project_requirements(\n    evidence: dict[str, Any],\n    record_statuses: dict[str, str],\n    targets_by_record_id: dict[str, object],\n) -> list[dict[str, Any]]:\n',
          )
          replace_once(
              path,
              '        required_kinds = requirement.get("requiredPositiveProofKinds")\n        if required_kinds is not None:\n            if not isinstance(required_kinds, list) or not required_kinds:\n                raise ValueError(\n                    f"canonical requirement {requirement_id!r} has invalid proof kinds"\n                )\n            item["requiredPositiveProofKinds"] = list(required_kinds)\n        projected.append(item)\n',
              '        required_kinds = requirement.get("requiredPositiveProofKinds")\n        if required_kinds is None:\n            item["status"] = "missing"\n        else:\n            if not isinstance(required_kinds, list) or not required_kinds:\n                raise ValueError(\n                    f"canonical requirement {requirement_id!r} has invalid proof kinds"\n                )\n            item["requiredPositiveProofKinds"] = list(required_kinds)\n            declared_kinds = {kind for kind in required_kinds if isinstance(kind, str)}\n            for record_id_value in record_ids:\n                artifact_kinds = set(\n                    artifact_required_proof_kinds(\n                        targets_by_record_id.get(record_id_value)\n                    )\n                )\n                if artifact_kinds and declared_kinds.isdisjoint(artifact_kinds):\n                    item["status"] = "missing"\n                    break\n        projected.append(item)\n',
          )
          replace_once(
              path,
              '    canonical_by_target, record_statuses = _canonical_records(evidence)\n',
              '    canonical_by_target, record_statuses, targets_by_record_id = _canonical_records(\n        evidence\n    )\n',
          )
          replace_once(
              path,
              '    status = _status_union(list(projected_statuses.values()))\n    return {\n',
              '    projected_requirements = _project_requirements(\n        evidence, record_statuses, targets_by_record_id\n    )\n    status = _status_union(\n        list(projected_statuses.values())\n        + [item["status"] for item in projected_requirements]\n    )\n    return {\n',
          )
          replace_once(
              path,
              '        "statusCounts": {\n            value: sum(projected_statuses[record_id_value] == value for record_id_value in projected_statuses)\n            for value in STATUSES\n        },\n',
              '        "statusCounts": {\n            value: sum(projected_statuses[record_id_value] == value for record_id_value in projected_statuses)\n            for value in STATUSES\n        },\n        "requirementStatusCounts": {\n            value: sum(item["status"] == value for item in projected_requirements)\n            for value in STATUSES\n        },\n',
          )
          replace_once(
              path,
              '        "records": records,\n        "requirements": _project_requirements(evidence, record_statuses),\n',
              '        "records": records,\n        "requirements": projected_requirements,\n',
          )

          replace_once(
              "components/artifact.webapp-core/files/TEMPLATE.md",
              'Worklist format v2 also exposes `artifactProofRequirements` before any product requirement has been authored. Each entry identifies a browser-sensitive record and states the positive-evidence, negative-evidence, and linked-requirement proof-kind alternatives from which at least one kind is mandatory. Treat these as artifact constraints, not as claims that proof has already run.',
              'Worklist format v2 also exposes `artifactProofRequirements` before any product requirement has been authored. Each entry identifies a browser-sensitive record and states the positive-evidence, negative-evidence, and linked-requirement proof-kind alternatives from which at least one kind is mandatory. Treat these as artifact constraints, not as claims that proof has already run. The v2 projection keeps a browser-sensitive record `[missing]` until both evidence directions contain an allowed kind, keeps a linked requirement `[missing]` until its `requiredPositiveProofKinds` intersects the artifact-mandated set, and combines record plus requirement status into the top-level `status`; `statusCounts` remains the record count and `requirementStatusCounts` reports requirement state separately.',
          )

          Path(".github/workflows/tmp-align-worklist-proof-status.yml").unlink()
          PY
      - name: Commit alignment and remove temporary workflow
        shell: bash
        run: |
          git config user.name "TakashiSasaki templates automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Align Webapp worklist status with proof obligations"
          git push origin HEAD:agent/webapp-worklist-proof-obligations-pr12
