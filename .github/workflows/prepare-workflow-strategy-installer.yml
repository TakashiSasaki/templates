name: Prepare workflow strategy installer candidate
on:
  push:
    branches:
      - release/workflow-strategy-installer
    paths:
      - '.github/workflows/prepare-workflow-strategy-installer.yml'
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'TakashiSasaki/templates'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact preparation head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare exact installer candidate and commit through GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request

          old = 'a7b260ccc361ad8cd1bab94803a9b355c640fe7e'
          new = '20cdbc720249516e3d30fc93e050391b81eaa6b4'
          paths = [
              pathlib.Path('scripts/install_agent_policy_skill.py'),
              pathlib.Path('scripts/smoke_test_agent_policy_installer_candidate.py'),
              pathlib.Path('tests/test_installer_candidate_smoke.py'),
          ]
          root = pathlib.Path('.').resolve()
          token = os.environ['GH_TOKEN']
          expected = os.environ['EXPECTED_SHA']
          branch = os.environ['BRANCH']
          repository = os.environ['REPOSITORY']
          api = f'https://api.github.com/repos/{repository}'

          def call(method: str, path: str, payload: object | None = None) -> object:
              data = None if payload is None else json.dumps(payload, separators=(',', ':')).encode()
              request = urllib.request.Request(
                  api + path,
                  data=data,
                  method=method,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'templates-installer-candidate-preparer/1',
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          ref_path = '/git/ref/heads/' + urllib.parse.quote(branch, safe='/')
          ref = call('GET', ref_path)
          if not isinstance(ref, dict) or ref.get('object', {}).get('sha') != expected:
              raise SystemExit('branch moved before installer preparation')

          for relative in paths:
              path = root / relative
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{relative}: expected exactly one old revision, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          commit = call('GET', f'/git/commits/{expected}')
          if not isinstance(commit, dict) or not isinstance(commit.get('tree'), dict):
              raise SystemExit('unable to resolve base tree')
          entries = []
          for relative in paths:
              blob = call(
                  'POST',
                  '/git/blobs',
                  {
                      'content': base64.b64encode((root / relative).read_bytes()).decode('ascii'),
                      'encoding': 'base64',
                  },
              )
              entries.append({'path': relative.as_posix(), 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          tree = call('POST', '/git/trees', {'base_tree': commit['tree']['sha'], 'tree': entries})
          created = call(
              'POST',
              '/git/commits',
              {
                  'message': 'Bind installer candidate to corrected skill source',
                  'tree': tree['sha'],
                  'parents': [expected],
              },
          )
          ref = call('GET', ref_path)
          if not isinstance(ref, dict) or ref.get('object', {}).get('sha') != expected:
              raise SystemExit('branch moved before guarded installer ref update')
          call('PATCH', '/git/refs/heads/' + urllib.parse.quote(branch, safe='/'), {'sha': created['sha'], 'force': False})
          print(f"Installer candidate commit: {created['sha']}")
          PY
