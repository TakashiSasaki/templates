name: Temporary PR507 follow-up
on:
  push:
    branches:
      - agent/cli-machine-evidence-pr14
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/cli-machine-evidence-pr14
          fetch-depth: 0
      - name: Fix follow-up patch script
        run: python .github/tmp/fix_pr507_followup.py
      - name: Apply follow-up patch
        run: python .github/tmp/patch_pr507_followup.py
      - name: Verify focused syntax
        run: |
          python -m py_compile tests/test_task_ledger_walkthrough_browser_acceptance.py
          python -m py_compile tests/test_composer_upgrade.py
          python -m py_compile tests/test_composition_lock_v2.py
      - name: Commit patch and remove temporary files
        run: |
          rm .github/tmp/fix_pr507_followup.py
          rm .github/tmp/patch_pr507_followup.py
          rm .github/workflows/tmp-pr507-followup.yml
          git config user.name 'TakashiSasaki templates automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Align Task Ledger with CLI executable evidence'
          git push origin HEAD:agent/cli-machine-evidence-pr14
