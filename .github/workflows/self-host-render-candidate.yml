name: Policy self-host render candidate

on:
  pull_request:
    branches:
      - policy

permissions:
  contents: write

concurrency:
  group: policy-self-host-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    if: >-
      github.repository == 'TakashiSasaki/templates' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'update/policy-self-host-independent-review'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Render with exact promoted Policy toolchain
        uses: TakashiSasaki/templates@b12b190cff4a9f5fa9f9ba76cc3425c479b67b87
        with:
          command: render
          config: .agent-policy.yml

      - name: Verify generated self-host state
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import pathlib
          import yaml

          expected = "b12b190cff4a9f5fa9f9ba76cc3425c479b67b87"
          lock = yaml.safe_load(pathlib.Path(".agent-policy.lock").read_text(encoding="utf-8"))
          assert lock["toolchain"]["revision"] == expected
          agents = pathlib.Path("AGENTS.md").read_text(encoding="utf-8")
          assert "pull-request.require-independent-exact-head-review" in agents
          review = pathlib.Path(".github/REVIEW_GUIDELINES.md")
          assert review.is_file()
          for path in (pathlib.Path("AGENTS.md"), review):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert lock["outputs"][path.as_posix()]["sha256"] == digest
          PY

      - name: Check rendered state with exact promoted Policy toolchain
        uses: TakashiSasaki/templates@b12b190cff4a9f5fa9f9ba76cc3425c479b67b87
        with:
          command: check
          config: .agent-policy.yml

      - name: Commit exact generated state and remove temporary workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repository = os.environ["REPOSITORY"]
          head_ref = os.environ["HEAD_REF"]
          expected_head = os.environ["EXPECTED_HEAD"]
          api = f"https://api.github.com/repos/{repository}"

          def request(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "policy-self-host-render-candidate",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          ref = request("GET", f"{api}/git/ref/heads/{head_ref}")
          current_head = ref["object"]["sha"]
          if current_head != expected_head:
              raise SystemExit(
                  f"PR head drifted before generated-state commit: expected {expected_head}, got {current_head}"
              )

          commit = request("GET", f"{api}/git/commits/{current_head}")
          base_tree = commit["tree"]["sha"]
          entries = []
          for relative in (
              "AGENTS.md",
              ".github/REVIEW_GUIDELINES.md",
              ".agent-policy.lock",
          ):
              raw = pathlib.Path(relative).read_bytes()
              blob = request(
                  "POST",
                  f"{api}/git/blobs",
                  {
                      "content": base64.b64encode(raw).decode("ascii"),
                      "encoding": "base64",
                  },
              )
              entries.append(
                  {"path": relative, "mode": "100644", "type": "blob", "sha": blob["sha"]}
              )

          entries.append(
              {
                  "path": ".github/workflows/self-host-render-candidate.yml",
                  "mode": "100644",
                  "type": "blob",
                  "sha": None,
              }
          )
          tree = request(
              "POST",
              f"{api}/git/trees",
              {"base_tree": base_tree, "tree": entries},
          )
          generated_commit = request(
              "POST",
              f"{api}/git/commits",
              {
                  "message": "Regenerate Policy self-host consumer state",
                  "tree": tree["sha"],
                  "parents": [current_head],
              },
          )

          latest = request("GET", f"{api}/git/ref/heads/{head_ref}")["object"]["sha"]
          if latest != current_head:
              raise SystemExit(
                  f"PR head drifted at commit boundary: expected {current_head}, got {latest}"
              )
          request(
              "PATCH",
              f"{api}/git/refs/heads/{head_ref}",
              {"sha": generated_commit["sha"], "force": False},
          )
          print(f"generated_commit={generated_commit['sha']}")
          PY
