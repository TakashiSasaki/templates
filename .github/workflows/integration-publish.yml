name: Integration publication
on:
  push:
    branches: [integration]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: integrated-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'push' && github.ref == 'refs/heads/integration' && github.sha || 'integration' }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m pip install -r requirements-build.lock
      - name: Resolve provider branches once and qualify their publication
        run: python3 scripts/publish.py --output "$RUNNER_TEMP/publication"
      - name: Package the completed publication
        run: tar -C "$RUNNER_TEMP/publication" -cf "$RUNNER_TEMP/publication.tar" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integrated-publication
          path: ${{ runner.temp }}/publication.tar
          if-no-files-found: error
          retention-days: 90
