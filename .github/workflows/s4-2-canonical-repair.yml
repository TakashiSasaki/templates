name: One-shot S4.2 canonical validation repair

on:
  push:
    branches:
      - feat/s4-2-audience-manifest-schema
    paths:
      - .github/workflows/s4-2-canonical-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@v4
        with:
          ref: feat/s4-2-audience-manifest-schema
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply canonical-validation repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected repair anchor missing: {path}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Expose the canonical parser for in-memory consumers while keeping
          # duplicate-member detection in the file-loading entry point.
          replace_once(
              "scripts/assemble_publications.py",
              'def load_manifest(path: Path) -> Manifest:\n    data = read_json(path, "site manifest")\n    schema_version = data.get("schema_version")\n',
              'def parse_manifest(data: dict[str, Any]) -> Manifest:\n    schema_version = data.get("schema_version")\n',
          )
          replace_once(
              "scripts/assemble_publications.py",
              '    raise AssemblyError("site manifest must be schema version 2 or 3")\n\n\ndef asset_entries',
              '    raise AssemblyError("site manifest must be schema version 2 or 3")\n\n\ndef load_manifest(path: Path) -> Manifest:\n    return parse_manifest(read_json(path, "site manifest"))\n\n\ndef asset_entries',
          )

          # Website projection must consume the canonical manifest model.
          replace_once(
              "scripts/site_website_contract.py",
              'import argparse\nimport json\nfrom pathlib import Path\n',
              'import argparse\nimport json\nimport sys\nfrom pathlib import Path\n\nif __package__ in (None, ""):\n    sys.path.insert(0, str(Path(__file__).resolve().parents[1]))\n\nfrom scripts.assemble_publications import AssemblyError, load_manifest\n',
          )
          website = Path("scripts/site_website_contract.py")
          text = website.read_text(encoding="utf-8")
          start = text.index('    manifest_data = read(root, "site-manifest.json")\n')
          end = text.index('    pages, routes, metadata = [], [], []\n', start)
          replacement = '''    try:\n        manifest = load_manifest(root / "site-manifest.json")\n    except AssemblyError as exc:\n        raise ValueError(str(exc)) from exc\n    navigation = manifest.documents\n'''
          website.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          # Repository-tree/index-navigation projection must consume canonical
          # validated document mappings, including safe destinations.
          replace_once(
              "scripts/generate_repository_trees.py",
              'import re\nimport subprocess\nimport tomllib\n',
              'import re\nimport subprocess\nimport sys\nimport tomllib\n',
          )
          replace_once(
              "scripts/generate_repository_trees.py",
              'from urllib.parse import quote, quote_from_bytes, urlsplit\n\n\nNAME =',
              'from urllib.parse import quote, quote_from_bytes, urlsplit\n\nif __package__ in (None, ""):\n    sys.path.insert(0, str(Path(__file__).resolve().parents[1]))\n\nfrom scripts.assemble_publications import AssemblyError, load_manifest\n\n\nNAME =',
          )
          target = Path("scripts/generate_repository_trees.py")
          text = target.read_text(encoding="utf-8")
          start = text.index('def manifest_destinations(site_root: Path) -> dict[tuple[str, str], str]:\n')
          end = text.index('\n\ndef published_sources(', start)
          replacement = '''def manifest_destinations(site_root: Path) -> dict[tuple[str, str], str]:\n    try:\n        manifest = load_manifest(site_root / "site-manifest.json")\n    except AssemblyError as exc:\n        raise RepositoryTreeError(str(exc)) from exc\n    return {\n        (document["publication"], document["document"]): document["destination"].as_posix()\n        for document in manifest.documents\n    }\n'''
          target.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          # Publication preparation validates the complete in-memory manifest
          # before the managed output root can be created or written.
          replace_once(
              "scripts/prepare_repository_tree_publication.py",
              'import json\nimport shutil\nfrom pathlib import Path\n',
              'import json\nimport shutil\nimport sys\nfrom pathlib import Path\n',
          )
          replace_once(
              "scripts/prepare_repository_tree_publication.py",
              'from typing import Any, Iterable\n\nOUTPUT_MARKER =',
              'from typing import Any, Iterable\n\nif __package__ in (None, ""):\n    sys.path.insert(0, str(Path(__file__).resolve().parents[1]))\n\nfrom scripts.assemble_publications import AssemblyError, parse_manifest\n\nOUTPUT_MARKER =',
          )
          target = Path("scripts/prepare_repository_tree_publication.py")
          text = target.read_text(encoding="utf-8")
          start = text.index('def augment_manifest(manifest: dict[str, Any]) -> dict[str, Any]:\n')
          end = text.index('\n\ndef prepare(site_root: Path, output_root: Path) -> list[str]:\n', start)
          replacement = '''def augment_manifest(manifest: dict[str, Any]) -> dict[str, Any]:\n    try:\n        validated = parse_manifest(manifest)\n    except AssemblyError as exc:\n        raise PreparationError(str(exc)) from exc\n    if validated.schema_version == 3:\n        return dict(manifest)\n\n    navigation = manifest["navigation"]\n    if any(\n        isinstance(node, dict) and node.get("title") == TREE_NAVIGATION["title"]\n        for node in navigation\n    ):\n        raise PreparationError(\n            "base site manifest must not predeclare generated repository trees"\n        )\n\n    result = dict(manifest)\n    result["navigation"] = [\n        navigation[0],\n        json.loads(json.dumps(TREE_NAVIGATION)),\n        *navigation[1:],\n    ]\n    return result\n'''
          text = text[:start] + replacement + text[end:]
          old = '''    output_root = prepare_output_root(output_root, site_root)\n    copy_tree(site_root / "docs", output_root / "docs", "site docs")\n'''
          new = '''    manifest_data = read_json(manifest_path, "site manifest")\n    prepared_manifest = augment_manifest(manifest_data)\n\n    output_root = prepare_output_root(output_root, site_root)\n    copy_tree(site_root / "docs", output_root / "docs", "site docs")\n'''
          if old not in text:
              raise SystemExit("prepare pre-write validation anchor missing")
          text = text.replace(old, new, 1)
          old = '''    write_json(\n        prepared_manifest_path,\n        augment_manifest(read_json(manifest_path, "site manifest")),\n    )\n'''
          new = '''    write_json(\n        prepared_manifest_path,\n        prepared_manifest,\n    )\n'''
          if old not in text:
              raise SystemExit("prepare manifest write anchor missing")
          target.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Canonical schema-v2 validation requires the home declaration; keep
          # legacy test fixtures explicit rather than weakening production validation.
          replace_once(
              "tests/test_repository_trees.py",
              '                    "schema_version": 2,\n                    "navigation": [\n',
              '                    "schema_version": 2,\n                    "home": {"publication": "composition", "document": "overview"},\n                    "navigation": [\n',
          )
          replace_once(
              "tests/test_repository_file_previews.py",
              '                    "schema_version": 2,\n                    "navigation": [\n',
              '                    "schema_version": 2,\n                    "home": {"publication": "skill", "document": "overview"},\n                    "navigation": [\n',
          )

          Path("tests/test_canonical_manifest_consumer_boundaries.py").write_text(r'''from __future__ import annotations

import json
import shutil
import tempfile
import unittest
from pathlib import Path

from scripts import site_website_contract as website
from scripts.generate_repository_trees import RepositoryTreeError, manifest_destinations
from scripts.prepare_repository_tree_publication import PreparationError, prepare

ROOT = Path(__file__).resolve().parents[1]


class CanonicalManifestConsumerBoundaryTests(unittest.TestCase):
    def production_manifest(self) -> dict[str, object]:
        return json.loads((ROOT / "site-manifest.json").read_text(encoding="utf-8"))

    def write_manifest(self, root: Path, manifest: dict[str, object]) -> None:
        root.mkdir(parents=True, exist_ok=True)
        (root / "site-manifest.json").write_text(
            json.dumps(manifest, ensure_ascii=False), encoding="utf-8"
        )

    def invalid_manifests(self):
        incomplete = self.production_manifest()
        incomplete.pop("audiences")
        unsafe = self.production_manifest()
        unsafe["documents"][1]["destination"] = "../outside.md"
        return (("incomplete", incomplete), ("unsafe", unsafe))

    def test_website_projection_reuses_complete_canonical_validation(self) -> None:
        for label, manifest in self.invalid_manifests():
            with self.subTest(label=label), tempfile.TemporaryDirectory() as tmp:
                root = Path(tmp)
                shutil.copy2(ROOT / "zensical.template.toml", root / "zensical.template.toml")
                self.write_manifest(root, manifest)
                with self.assertRaises(ValueError):
                    website.documents(root)

    def test_repository_tree_projection_reuses_complete_canonical_validation(self) -> None:
        for label, manifest in self.invalid_manifests():
            with self.subTest(label=label), tempfile.TemporaryDirectory() as tmp:
                root = Path(tmp)
                self.write_manifest(root, manifest)
                with self.assertRaises(RepositoryTreeError):
                    manifest_destinations(root)

    def test_preparation_rejects_invalid_manifest_before_output_creation(self) -> None:
        for label, manifest in self.invalid_manifests():
            with self.subTest(label=label), tempfile.TemporaryDirectory() as tmp:
                root = Path(tmp) / "site"
                output = Path(tmp) / "prepared"
                self.write_manifest(root, manifest)
                with self.assertRaises(PreparationError):
                    prepare(root, output)
                self.assertFalse(output.exists())


if __name__ == "__main__":
    unittest.main()
''', encoding="utf-8")
          PY

      - name: Run focused regression tests
        run: |
          python -m unittest \
            tests.test_site_website_contract_schema_version \
            tests.test_repository_tree_manifest_schema_version \
            tests.test_canonical_manifest_consumer_boundaries \
            tests.test_repository_trees \
            tests.test_repository_file_previews -v
          python scripts/site_website_contract.py
          python scripts/generate_repository_trees.py --help >/dev/null
          python scripts/prepare_repository_tree_publication.py --help >/dev/null

      - name: Run repository test suite
        run: python -m unittest discover --start-directory tests --verbose

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/s4-2-canonical-repair.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(site): reuse canonical manifest validation in projections"
          git push origin HEAD:refs/heads/feat/s4-2-audience-manifest-schema
