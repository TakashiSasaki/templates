name: One-shot S4.2 canonical validation repair

on:
  push:
    branches:
      - feat/s4-2-audience-manifest-schema
    paths:
      - .github/workflows/s4-2-canonical-repair.yml
      - scripts/s4_2_canonical_repair_once.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@v4
        with:
          ref: feat/s4-2-audience-manifest-schema
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply canonical-validation repair
        run: python scripts/s4_2_canonical_repair_once.py

      - name: Run focused regression tests
        run: |
          python -m unittest tests.test_site_website_contract_schema_version tests.test_repository_tree_manifest_schema_version tests.test_canonical_manifest_consumer_boundaries tests.test_repository_trees tests.test_repository_file_previews -v
          python scripts/site_website_contract.py
          python scripts/generate_repository_trees.py --help >/dev/null
          python scripts/prepare_repository_tree_publication.py --help >/dev/null

      - name: Run repository test suite
        run: python -m unittest discover --start-directory tests --verbose

      - name: Commit repair and remove one-shot helpers
        run: |
          rm .github/workflows/s4-2-canonical-repair.yml scripts/s4_2_canonical_repair_once.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(site): reuse canonical manifest validation in projections"
          git push origin HEAD:refs/heads/feat/s4-2-audience-manifest-schema
