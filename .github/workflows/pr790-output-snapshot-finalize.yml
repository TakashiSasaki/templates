name: PR 790 output snapshot finalize

on:
  push:
    branches:
      - perf/site-provider-materialization-phase

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Finalize PR 790 output snapshot regression'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/site-provider-materialization-phase
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reuse remediation payload and make snapshot regression deterministic
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          import re
          from pathlib import Path

          helper = Path('.github/workflows/pr790-review-round2-remediation.yml').read_text(encoding='utf-8')
          match = re.search(r"b64decode\('([^']+)'\)", helper)
          if match is None:
              raise SystemExit('remediation payload not found')
          exec(gzip.decompress(base64.b64decode(match.group(1))).decode())

          test_path = Path('tests/test_materialize_publication_assets_review_followup.py')
          text = test_path.read_text(encoding='utf-8')
          start = text.index('    def test_output_snapshot_is_rechecked_before_stamp_commit')
          end = text.index('    def test_ignored_output_snapshot_is_rechecked_before_stamp_acceptance', start)
          replacement = '''    def test_output_snapshot_is_rechecked_before_stamp_commit(self) -> None:\n        with tempfile.TemporaryDirectory() as directory:\n            root = Path(directory)\n            self.write_v4_provider(root)\n            (root / ".gitignore").write_text("generated/\\n", encoding="utf-8")\n            self.initialize_git_checkout(root)\n            original = materialization._snapshot_materialized_outputs\n            snapshots = 0\n\n            def mutate_after_first_snapshot(*args, **kwargs):\n                nonlocal snapshots\n                observed = original(*args, **kwargs)\n                snapshots += 1\n                if snapshots == 1:\n                    (root / "generated" / "output.bin").write_bytes(b"late-mutation")\n                return observed\n\n            with patch.object(\n                materialization,\n                "_snapshot_materialized_outputs",\n                side_effect=mutate_after_first_snapshot,\n            ):\n                with self.assertRaisesRegex(\n                    PublicationMaterializationError,\n                    "output snapshot changed before materialization stamp commit",\n                ):\n                    materialize_publication(root, "fixture")\n            self.assertGreaterEqual(snapshots, 2)\n            self.assertFalse((root / STAMP_FILE).exists())\n\n'''
          text = text[:start] + replacement + text[end:]
          test_path.write_text(text, encoding='utf-8')
          PY
      - name: Run focused regression suite
        run: >-
          python -m unittest
          tests.test_materialize_publication_assets
          tests.test_materialize_publication_assets_review_followup
          tests.test_assembly_materialization_boundary
          --verbose
      - name: Commit remediation and remove helper workflows
        shell: bash
        run: |
          rm .github/workflows/pr790-review-round2-remediation.yml
          rm .github/workflows/pr790-output-snapshot-retry.yml
          rm .github/workflows/pr790-output-snapshot-finalize.yml
          git config user.name 'TakashiSasaki'
          git config user.email '556958+TakashiSasaki@users.noreply.github.com'
          git add scripts/materialize_publication_assets.py \
            tests/test_materialize_publication_assets_review_followup.py \
            .github/workflows/pr790-review-round2-remediation.yml \
            .github/workflows/pr790-output-snapshot-retry.yml \
            .github/workflows/pr790-output-snapshot-finalize.yml
          git commit -m 'Bind materialization stamps to atomic output snapshots'
          git push origin HEAD:perf/site-provider-materialization-phase
