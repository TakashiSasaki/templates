name: Self-host canonical materialization
on:
  push:
    branches:
      - policy-self-host-delayed-qualification-f
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: TakashiSasaki/templates@33a7ab809225c2a8b8dd2598ef04d0a39cf076a7
        with:
          command: render
          config: .agent-policy.yml
      - name: Materialize canonical generated outputs
        shell: bash
        run: |
          set -euo pipefail
          git add -- .agent-policy.lock AGENTS.md .review-authority .agents/skills
          if git diff --cached --quiet; then
            echo "Canonical render already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Materialize remediated Policy self-host outputs"
          git push origin "HEAD:${GITHUB_REF_NAME}"
