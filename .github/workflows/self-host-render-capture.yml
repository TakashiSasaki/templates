name: Self-host render capture
on:
  push:
    branches:
      - self-host-orchestration-stable
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Render with reviewed stable candidate
        uses: TakashiSasaki/templates@8a956f044b1a5e07590eb90e3306227c82452280
        with:
          command: render
          config: .agent-policy.yml
      - name: Upload canonical self-host render
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: policy-self-host-render-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .agent-policy.lock
            AGENTS.md
            .review-authority/review-policy.md
            .agents/skills/pr-review
            .agents/skills/orchestrate-repository-change
