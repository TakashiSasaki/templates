name: Debug Composition provenance promotion

on:
  pull_request:
    branches: [composition]

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Reproduce installed-skill offline provenance
        shell: bash
        run: |
          set -euxo pipefail
          installed="$RUNNER_TEMP/installed-composition"
          consumer="$RUNNER_TEMP/consumer"
          python -I skills/composition/scripts/install.py "$installed"
          export HTTP_PROXY=http://127.0.0.1:9
          export HTTPS_PROXY=http://127.0.0.1:9
          export ALL_PROXY=http://127.0.0.1:9
          export http_proxy=http://127.0.0.1:9
          export https_proxy=http://127.0.0.1:9
          export all_proxy=http://127.0.0.1:9
          export NO_PROXY=
          export no_proxy=
          python -I "$installed/scripts/run.py" --repository "$consumer" provenance
