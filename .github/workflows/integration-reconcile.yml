name: Reconcile Integration publication candidate

# This controller starts in Shadow.  Changing the repository variable to an
# activated mode is a one-time post-landing operation; this workflow does not
# self-enable it and never calls an LLM or coding-agent service.
on:
  workflow_dispatch:
    inputs:
      producer_ref:
        description: Exact trusted Integration producer SHA
        type: string
        default: ''
      composition_ref:
        description: Optional exact Composition candidate SHA
        type: string
        default: ''
      policy_ref:
        description: Optional exact Policy candidate SHA
        type: string
        default: ''
      modeling_ref:
        description: Optional exact Modeling candidate SHA
        type: string
        default: ''
      controller_ref:
        description: Exact trusted Integration controller SHA when called externally
        type: string
        default: ''
  repository_dispatch:
    types:
      - publication.provider-qualified
      - publication.reconcile
  workflow_call:
    inputs:
      producer_ref:
        description: Exact trusted Integration producer SHA
        type: string
        required: true
      composition_ref:
        description: Optional exact Composition candidate SHA
        type: string
        default: ''
      policy_ref:
        description: Optional exact Policy candidate SHA
        type: string
        default: ''
      modeling_ref:
        description: Optional exact Modeling candidate SHA
        type: string
        default: ''
      controller_ref:
        description: Exact trusted Integration controller SHA
        type: string
        required: true
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: integration-publication-reconciliation
  cancel-in-progress: false
env:
  AUTOMATION_MODE: ${{ vars.PUBLICATION_AUTOMATION_MODE || 'shadow' }}
  AUTOMATION_KILL_SWITCH: ${{ vars.PUBLICATION_AUTOMATION_KILL_SWITCH || 'false' }}
  AUTOMATION_AUTHORIZED: ${{ vars.PUBLICATION_AUTOMATION_AUTHORIZED || 'false' }}
jobs:
  qualify:
    uses: ./.github/workflows/integration-qualification.yml
    with:
      producer_ref: ${{ inputs.producer_ref || github.event.client_payload.producer_ref || github.sha }}
      composition_ref: ${{ inputs.composition_ref || github.event.client_payload.composition_ref || '' }}
      policy_ref: ${{ inputs.policy_ref || github.event.client_payload.policy_ref || '' }}
      modeling_ref: ${{ inputs.modeling_ref || github.event.client_payload.modeling_ref || '' }}
      trusted_controller_revision: ${{ vars.PUBLICATION_CONTROLLER_REVISION || inputs.controller_ref || '' }}
      trusted_rebuild: true
      trusted_policy_revision: ${{ vars.PUBLICATION_POLICY_REVISION || '' }}
      artifact_namespace: reconciliation
    permissions:
      contents: read
      actions: read

  controller:
    needs: qualify
    if: ${{ needs.qualify.result == 'success' }}
    runs-on: ubuntu-24.04
    outputs:
      classification: ${{ steps.reconcile.outputs.classification }}
      idempotency_key: ${{ steps.reconcile.outputs.idempotency_key }}
      consumer_base: ${{ steps.base.outputs.revision }}
      consumer_lock_digest: ${{ steps.base.outputs.lock_digest }}
      lock_update_required: ${{ steps.promotion_intent.outputs.lock_update_required }}
      promotion_intent_digest: ${{ steps.promotion_intent.outputs.intent_digest }}
      promotion_intent_artifact_id: ${{ steps.intent_upload.outputs.artifact-id }}
      promotion_intent_artifact_digest: sha256:${{ steps.intent_upload.outputs.artifact-digest }}
      promotion_intent_artifact_name: publication-promotion-intent-${{ needs.qualify.outputs.bundle_identity }}-${{ needs.qualify.outputs.workflow_attempt }}-reconciliation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ vars.PUBLICATION_CONTROLLER_REVISION || inputs.controller_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the reconciliation controller to its trusted identity
        env:
          EXPECTED_CONTROLLER: ${{ vars.PUBLICATION_CONTROLLER_REVISION || inputs.controller_ref || github.sha }}
        run: |
          test -n "$EXPECTED_CONTROLLER"
          python3 - "$EXPECTED_CONTROLLER" <<'PY'
          import re
          import sys
          if re.fullmatch(r'[0-9a-f]{40}', sys.argv[1]) is None:
              raise SystemExit('controller revision must be a full lowercase commit SHA')
          PY
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROLLER"
      - name: Snapshot the current Integration consumer base
        id: base
        run: |
          git fetch --quiet origin refs/heads/integration
          revision=$(git rev-parse FETCH_HEAD)
          git show "$revision:publication-sources.json" > current-publication-sources.json
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "lock_digest=$(sha256sum current-publication-sources.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Download the exact structured qualification report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: publication-compatibility-${{ needs.qualify.outputs.bundle_identity }}-${{ github.run_attempt }}-reconciliation
          path: qualification
      - name: Checkout exact provider declarations as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.qualify.outputs.composition_revision }}
          path: provider-inputs/composition
          persist-credentials: false
      - name: Checkout exact Policy declaration as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.qualify.outputs.policy_revision }}
          path: provider-inputs/policy
          persist-credentials: false
      - name: Checkout exact Modeling declaration as data
        if: ${{ needs.qualify.outputs.modeling_revision != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.qualify.outputs.modeling_revision }}
          path: provider-inputs/modeling
          persist-credentials: false
      - name: Consume the exact Bundle artifact through the trusted transport
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MODELING: ${{ needs.qualify.outputs.modeling_revision }}
        run: |
          WORKFLOW_PATH=".github/workflows/${GITHUB_WORKFLOW_REF#*/.github/workflows/}"
          WORKFLOW_PATH="${WORKFLOW_PATH%@*}"
          test -n "$WORKFLOW_PATH"
          args=(
            consume
            --repository "$REPOSITORY"
            --artifact-id "${{ needs.qualify.outputs.artifact_id }}"
            --archive-digest "${{ needs.qualify.outputs.artifact_digest }}"
            --bundle-identity "${{ needs.qualify.outputs.bundle_identity }}"
            --producer "${{ needs.qualify.outputs.producer_revision }}"
            --workflow-head "${{ needs.qualify.outputs.workflow_head }}"
            --workflow-name "${{ needs.qualify.outputs.workflow_name }}"
            --workflow-event "${{ needs.qualify.outputs.workflow_event }}"
            --workflow-path "$WORKFLOW_PATH"
            --artifact-name "${{ needs.qualify.outputs.artifact_name }}"
            --run-id "${{ needs.qualify.outputs.workflow_run_id }}"
            --attempt "${{ needs.qualify.outputs.workflow_attempt }}"
            --composition "${{ needs.qualify.outputs.composition_revision }}"
            --policy "${{ needs.qualify.outputs.policy_revision }}"
            --output qualification/bundle
          )
          if [ -n "$MODELING" ]; then args+=(--modeling "$MODELING"); fi
          python3 scripts/publication_bundle_artifact.py "${args[@]}"
      - name: Render the expected lock without executing candidate code
        env:
          COMPOSITION: ${{ inputs.composition_ref || github.event.client_payload.composition_ref || '' }}
          POLICY: ${{ inputs.policy_ref || github.event.client_payload.policy_ref || '' }}
          MODELING: ${{ inputs.modeling_ref || github.event.client_payload.modeling_ref || '' }}
        run: |
          args=(--lock current-publication-sources.json --output candidate-lock.json)
          if [ -n "$COMPOSITION" ]; then args+=(--override "composition=$COMPOSITION"); fi
          if [ -n "$POLICY" ]; then args+=(--override "policy=$POLICY"); fi
          if [ -n "$MODELING" ]; then args+=(--candidate-provider modeling --override "modeling=$MODELING"); fi
          python3 scripts/render_candidate_source_lock.py "${args[@]}"
      - name: Verify the report and Bundle with the trusted controller
        id: verified_report
        env:
          EXPECTED_POLICY: ${{ vars.PUBLICATION_POLICY_REVISION || '' }}
          EXPECTED_CONTROLLER: ${{ vars.PUBLICATION_CONTROLLER_REVISION || inputs.controller_ref || '' }}
          MODELING: ${{ needs.qualify.outputs.modeling_revision }}
        run: |
          WORKFLOW_PATH=".github/workflows/${GITHUB_WORKFLOW_REF#*/.github/workflows/}"
          WORKFLOW_PATH="${WORKFLOW_PATH%@*}"
          test -n "$WORKFLOW_PATH"
          args=(
            --report qualification/compatibility-report.json
            --bundle qualification/bundle
            --candidate candidate-lock.json
            --composition-root provider-inputs/composition
            --composition-revision "${{ needs.qualify.outputs.composition_revision }}"
            --policy-root provider-inputs/policy
            --policy-revision "${{ needs.qualify.outputs.policy_revision }}"
            --expected-integration-revision "${{ needs.qualify.outputs.producer_revision }}"
            --expected-controller-revision "$EXPECTED_CONTROLLER"
            --workflow-run-id "${{ needs.qualify.outputs.workflow_run_id }}"
            --workflow-attempt "${{ needs.qualify.outputs.workflow_attempt }}"
            --workflow-head "${{ needs.qualify.outputs.workflow_head }}"
            --workflow-name "${{ needs.qualify.outputs.workflow_name }}"
            --workflow-event "${{ needs.qualify.outputs.workflow_event }}"
            --workflow-path "$WORKFLOW_PATH"
            --artifact-id "${{ needs.qualify.outputs.artifact_id }}"
            --artifact-digest "${{ needs.qualify.outputs.artifact_digest }}"
            --artifact-name "${{ needs.qualify.outputs.artifact_name }}"
            --output qualification/verified-report.json
          )
          if [ -n "$MODELING" ]; then
            args+=(--modeling-root provider-inputs/modeling --modeling-revision "$MODELING")
          fi
          if [ -n "$EXPECTED_POLICY" ]; then args+=(--expected-policy-revision "$EXPECTED_POLICY"); fi
          python3 scripts/verify_qualification_report.py "${args[@]}"
          echo "digest=$(sha256sum qualification/verified-report.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Classify the guarded reconciliation transaction
        id: reconcile
        env:
          AUTHORIZED: ${{ env.AUTOMATION_AUTHORIZED }}
          KILL_SWITCH: ${{ env.AUTOMATION_KILL_SWITCH }}
          EXPECTED_INTEGRATION: ${{ needs.qualify.outputs.producer_revision }}
          EXPECTED_CONSUMER_BASE: ${{ steps.base.outputs.revision }}
          EXPECTED_POLICY: ${{ vars.PUBLICATION_POLICY_REVISION || '' }}
          EXPECTED_CONTROLLER: ${{ vars.PUBLICATION_CONTROLLER_REVISION || inputs.controller_ref || '' }}
        run: |
          auth_args=()
          if [ "$AUTHORIZED" = true ]; then auth_args+=(--authorization); fi
          kill_args=()
          if [ "$KILL_SWITCH" = true ]; then kill_args+=(--kill-switch); fi
          python3 scripts/reconcile_publication.py \
            --mode "$AUTOMATION_MODE" \
            --current current-publication-sources.json \
            --candidate candidate-lock.json \
            --qualification qualification/verified-report.json \
            --source-qualification qualification/compatibility-report.json \
            --expected-integration-revision "$EXPECTED_INTEGRATION" \
            --expected-consumer-base "$EXPECTED_CONSUMER_BASE" \
            --expected-policy-revision "$EXPECTED_POLICY" \
            --expected-controller-revision "$EXPECTED_CONTROLLER" \
            "${auth_args[@]}" "${kill_args[@]}" \
            --output reconciliation-report.json
          echo "classification=$(python3 -c 'import json; print(json.load(open("reconciliation-report.json"))["classification"])')" >> "$GITHUB_OUTPUT"
          echo "idempotency_key=$(python3 -c 'import json; print(json.load(open("reconciliation-report.json"))["idempotency_key"])')" >> "$GITHUB_OUTPUT"
          cat reconciliation-report.json >> "$GITHUB_STEP_SUMMARY"

      - name: Build the deterministic trusted promotion intent
        id: promotion_intent
        if: ${{ steps.reconcile.outputs.classification == 'AUTO_PROCESSABLE' }}
        run: |
          python3 scripts/publication_promotion_intent.py build \
            --current current-publication-sources.json \
            --candidate candidate-lock.json \
            --source-report qualification/compatibility-report.json \
            --verified-report qualification/verified-report.json \
            --reconciliation-report reconciliation-report.json \
            --producer-revision "${{ needs.qualify.outputs.producer_revision }}" \
            --consumer-base-revision "${{ steps.base.outputs.revision }}" \
            --expected-current-lock-digest "${{ steps.base.outputs.lock_digest }}" \
            --qualification-artifact-id "${{ needs.qualify.outputs.qualification_artifact_id }}" \
            --qualification-artifact-digest "${{ needs.qualify.outputs.qualification_artifact_digest }}" \
            --qualification-artifact-name "${{ needs.qualify.outputs.qualification_artifact_name }}" \
            --trusted-controller-revision "${{ vars.PUBLICATION_CONTROLLER_REVISION || '' }}" \
            --trusted-policy-revision "${{ vars.PUBLICATION_POLICY_REVISION || '' }}" \
            --output publication-promotion-intent.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Publish the trusted promotion intent for the guarded PR job
        id: intent_upload
        if: ${{ steps.reconcile.outputs.classification == 'AUTO_PROCESSABLE' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-promotion-intent-${{ needs.qualify.outputs.bundle_identity }}-${{ needs.qualify.outputs.workflow_attempt }}-reconciliation
          path: publication-promotion-intent.json
          if-no-files-found: error
          retention-days: 7

  promote_lock_pr:
    needs: controller
    if: >-
      needs.controller.result == 'success' &&
      needs.controller.outputs.classification == 'AUTO_PROCESSABLE' &&
      (vars.PUBLICATION_AUTOMATION_MODE == 'adoption-only' || vars.PUBLICATION_AUTOMATION_MODE == 'auto-publish') &&
      vars.PUBLICATION_AUTOMATION_AUTHORIZED == 'true' &&
      vars.PUBLICATION_POLICY_REVISION != '' &&
      vars.PUBLICATION_CONTROLLER_REVISION != '' &&
      vars.PUBLICATION_AUTOMATION_KILL_SWITCH != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.PUBLICATION_APP_TOKEN }}
      EXPECTED_CONSUMER_BASE: ${{ needs.controller.outputs.consumer_base }}
      CONTROLLER_REF: ${{ vars.PUBLICATION_CONTROLLER_REVISION }}
      COMPOSITION: ${{ inputs.composition_ref || github.event.client_payload.composition_ref || '' }}
      POLICY: ${{ inputs.policy_ref || github.event.client_payload.policy_ref || '' }}
      MODELING: ${{ inputs.modeling_ref || github.event.client_payload.modeling_ref || '' }}
      IDEMPOTENCY_KEY: ${{ needs.controller.outputs.idempotency_key }}
      LOCK_UPDATE_REQUIRED: ${{ needs.controller.outputs.lock_update_required }}
      PROMOTION_INTENT_DIGEST: ${{ needs.controller.outputs.promotion_intent_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ vars.PUBLICATION_CONTROLLER_REVISION }}
          path: controller-source
          fetch-depth: 0
          persist-credentials: false
      - name: Bind privileged controller checkout to the active pin
        run: |
          test -n "$CONTROLLER_REF"
          python3 - "$CONTROLLER_REF" <<'PY'
          import re
          import sys
          if re.fullmatch(r'[0-9a-f]{40}', sys.argv[1]) is None:
              raise SystemExit('active controller revision must be a full lowercase commit SHA')
          PY
          test "$(git -C controller-source rev-parse HEAD)" = "$CONTROLLER_REF"
      - name: Require the one-time activated controller credential
        run: test -n "$GH_TOKEN"
      - name: Check out the exact Integration consumer base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.controller.outputs.consumer_base }}
          path: integration-base
          fetch-depth: 0
          persist-credentials: false
      - name: Reject a stale Integration consumer base
        run: |
          test -n "$EXPECTED_CONSUMER_BASE"
          test "$EXPECTED_CONSUMER_BASE" = "$(git -C integration-base rev-parse HEAD)"
          test "$EXPECTED_CONSUMER_BASE" = "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/integration" --jq '.object.sha')"
      - name: Render and verify the exact candidate lock
        env:
          EXPECTED_CONSUMER_LOCK_DIGEST: ${{ needs.controller.outputs.consumer_lock_digest }}
        run: |
          candidate_lock="$RUNNER_TEMP/candidate-lock.json"
          base_lock="$RUNNER_TEMP/base-publication-sources.json"
          cp integration-base/publication-sources.json "$base_lock"
          args=(--lock "$base_lock" --output "$candidate_lock")
          if [ -n "$COMPOSITION" ]; then args+=(--override "composition=$COMPOSITION"); fi
          if [ -n "$POLICY" ]; then args+=(--override "policy=$POLICY"); fi
          if [ -n "$MODELING" ]; then args+=(--candidate-provider modeling --override "modeling=$MODELING"); fi
          python3 controller-source/scripts/render_candidate_source_lock.py "${args[@]}"
          test "$(sha256sum "$base_lock" | awk '{print $1}')" = "$EXPECTED_CONSUMER_LOCK_DIGEST"
      - name: Download the exact trusted promotion intent
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.controller.outputs.promotion_intent_artifact_id }}
          path: promotion-intent
      - name: Verify the promotion intent against the pinned controller and exact lock
        id: verify_intent
        env:
          EXPECTED_CONSUMER_LOCK_DIGEST: ${{ needs.controller.outputs.consumer_lock_digest }}
          ACTIVE_POLICY: ${{ vars.PUBLICATION_POLICY_REVISION }}
        run: |
          base_lock="$RUNNER_TEMP/base-publication-sources.json"
          candidate_lock="$RUNNER_TEMP/candidate-lock.json"
          python3 controller-source/scripts/publication_promotion_intent.py verify \
            --intent promotion-intent/publication-promotion-intent.json \
            --base-lock "$base_lock" \
            --selected-lock "$candidate_lock" \
            --consumer-base-revision "$EXPECTED_CONSUMER_BASE" \
            --trusted-controller-revision "$CONTROLLER_REF" \
            --trusted-policy-revision "$ACTIVE_POLICY" \
            --branch "automation/publication-$IDEMPOTENCY_KEY" \
            --expected-intent-digest "$PROMOTION_INTENT_DIGEST" \
            --github-output "$GITHUB_OUTPUT"
      - name: Apply only the deterministic source-lock patch when the selection changes
        if: ${{ needs.controller.outputs.lock_update_required == 'true' }}
        run: |
          adoption_report="$RUNNER_TEMP/adoption-report.json"
          expected=$(sha256sum "$RUNNER_TEMP/base-publication-sources.json" | awk '{print $1}')
          python3 controller-source/scripts/adopt_publication_sources.py \
            --current integration-base/publication-sources.json \
            --candidate "$RUNNER_TEMP/candidate-lock.json" \
            --expected-current-digest "$expected" --apply --output "$adoption_report"
          python3 - "$adoption_report" integration-base/publication-sources.json <<'PY'
          import json
          import sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          if report.get('classification') != 'AUTO_PROCESSABLE' or report.get('applied') is not True:
              raise SystemExit('source-lock updater did not produce an applied expected patch')
          if report.get('expected_bytes') != Path(sys.argv[2]).read_text(encoding='utf-8'):
              raise SystemExit('applied source-lock bytes differ from the trusted expected patch')
          PY
      - name: Add the deterministic promotion intent
        run: |
          cp promotion-intent/publication-promotion-intent.json integration-base/publication-promotion-intent.json
          git -C integration-base add publication-sources.json publication-promotion-intent.json
          expected_paths="publication-promotion-intent.json"
          if [ "$LOCK_UPDATE_REQUIRED" = true ]; then expected_paths=$'publication-promotion-intent.json\npublication-sources.json'; fi
          actual_paths=$(git -C integration-base diff --cached --name-only | sort)
          test "$actual_paths" = "$(printf '%s\n' "$expected_paths" | sort)"
          test -z "$(git -C integration-base diff --cached --summary)"
      - name: Revalidate the live target before every privileged PR action
        env:
          BRANCH: automation/publication-$IDEMPOTENCY_KEY
        run: |
          set -euo pipefail
          gh auth setup-git
          git -C integration-base config user.name publication-controller
          git -C integration-base config user.email publication-controller@users.noreply.github.com
          expected_tree=$(git -C integration-base write-tree)
          expected_paths=("publication-promotion-intent.json")
          if [ "$LOCK_UPDATE_REQUIRED" = true ]; then
            expected_paths+=("publication-sources.json")
          fi
          repository_owner="${GITHUB_REPOSITORY%%/*}"
          open_pr_numbers() {
            gh api \
              "repos/$GITHUB_REPOSITORY/pulls?state=open&base=integration&head=$repository_owner:$BRANCH&per_page=100" \
              --jq '.[].number'
          }
          require_at_most_one_pr() {
            local numbers="$1"
            local count
            count=$(printf '%s\n' "$numbers" | awk 'NF { count++ } END { print count + 0 }')
            if [ "$count" -gt 1 ]; then
              echo 'Multiple open PRs are bound to the same automation branch; stop.' >&2
              return 1
            fi
          }
          verify_target() {
            git -C integration-base fetch --quiet origin refs/heads/integration
            live_base=$(git -C integration-base rev-parse FETCH_HEAD)
            python3 controller-source/scripts/publication_promotion_intent.py verify-target \
              --expected-base "$EXPECTED_CONSUMER_BASE" \
              --live-base "$live_base"
          }
          verify_existing() {
            local pr="$1"
            local pr_json="$RUNNER_TEMP/publication-pr-$pr.json"
            verify_target
            git -C integration-base fetch --quiet origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" > "$pr_json"
            verify_target
            args=(
              verify-pr
              --pr-json "$pr_json"
              --repository-root integration-base
              --repository "$GITHUB_REPOSITORY"
              --expected-base "$EXPECTED_CONSUMER_BASE"
              --expected-tree "$expected_tree"
              --expected-intent-digest "$PROMOTION_INTENT_DIGEST"
              --expected-branch "$BRANCH"
              --expected-idempotency-key "$IDEMPOTENCY_KEY"
              --remote-head-ref "refs/remotes/origin/$BRANCH"
            )
            for path in "${expected_paths[@]}"; do args+=(--expected-path "$path"); done
            python3 controller-source/scripts/publication_promotion_intent.py "${args[@]}"
          }

          existing=$(open_pr_numbers)
          require_at_most_one_pr "$existing"
          if [ -n "$existing" ]; then
            verify_existing "$existing"
            # Re-read the live target and PR immediately before the merge request.
            verify_existing "$existing"
            gh pr merge "$existing" --repo "$GITHUB_REPOSITORY" --auto --squash
            exit 0
          fi
          branch_before=$(git -C integration-base ls-remote origin "refs/heads/$BRANCH" | awk 'NF { print $1 }')
          if [ -n "$branch_before" ]; then
            echo 'An idempotency branch exists without an open PR; stop for human recovery.' >&2
            exit 1
          fi
          # This target check is immediately before the branch push.
          verify_target
          git -C integration-base switch -c "$BRANCH"
          git -C integration-base commit -m "chore(integration): record trusted publication intent"
          test "$(git -C integration-base rev-parse HEAD^{tree})" = "$expected_tree"
          test "$(git -C integration-base rev-parse HEAD^1)" = "$EXPECTED_CONSUMER_BASE"
          verify_target
          git -C integration-base push --force-with-lease="refs/heads/$BRANCH:$branch_before" origin "HEAD:$BRANCH"
          verify_target
          existing=$(open_pr_numbers)
          require_at_most_one_pr "$existing"
          if [ -z "$existing" ]; then
            # This target check is immediately before PR creation.
            verify_target
            gh pr create --repo "$GITHUB_REPOSITORY" --base integration --head "$BRANCH" --title "chore(integration): record trusted publication intent" --body "Guarded deterministic Integration publication promotion. Consumer base: $EXPECTED_CONSUMER_BASE. Idempotency key: $IDEMPOTENCY_KEY. The PR updates the provider lock only when it differs; otherwise it records the exact trusted promotion intent. Post-merge qualification uses the merged Integration revision. Auto-merge remains subject to branch protection and required CI."
            existing=$(open_pr_numbers)
            require_at_most_one_pr "$existing"
          fi
          test -n "$existing"
          verify_existing "$existing"
          # Re-read the live target and PR immediately before the merge request.
          verify_existing "$existing"
          gh pr merge "$existing" --repo "$GITHUB_REPOSITORY" --auto --squash
