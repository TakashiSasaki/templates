name: Temporary align CLI catalog translation

on:
  push:
    branches:
      - agent/cli-machine-evidence-pr14

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/cli-machine-evidence-pr14
          fetch-depth: 0
      - name: Align translation and binding
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ja = Path('translations/ja/catalog/README.md')
          text = ja.read_text(encoding='utf-8')
          old = '| packaged command-line interface | `capability.cli` | `capability.runtime` | caller-visible CLI contract |'
          new = '| packaged command-line interface | `capability.cli` | `capability.runtime` + implementation evidence（および contract evolution） | executable-proof enforcement を伴う machine-readable caller-visible CLI contract |'
          if text.count(old) != 1:
              raise SystemExit(f'Japanese CLI row count: {text.count(old)}')
          ja.write_text(text.replace(old, new), encoding='utf-8')

          manifest_path = Path('translations/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          entry = next(
              item for item in manifest['translations']
              if item['canonical'] == 'catalog/README.md' and item['language'] == 'ja'
          )
          if entry['canonical_blob_sha'] != 'fac18e42137720e7850dd233106cec5fb4a851ff':
              raise SystemExit(f"unexpected prior catalog blob: {entry['canonical_blob_sha']}")
          entry['canonical_blob_sha'] = 'a02910068d5c819ccc0c6e84d0037602ed2d22e7'
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-cli-translation-followup.yml
          git config user.name "TakashiSasaki templates automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Align CLI catalog translation"
          git push origin HEAD:agent/cli-machine-evidence-pr14
