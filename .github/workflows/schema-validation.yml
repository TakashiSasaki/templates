name: Composition schema validation

on:
  push:
    branches:
      - composition
      - "agent/composition-**"
  pull_request:
    branches:
      - composition

permissions:
  contents: read

concurrency:
  group: composition-schema-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Managed update/upgrade validates that the lock's old source revision
          # exists locally and is an ancestor of the target source revision.
          # Keep history available so CI exercises that real contract rather
          # than replacing it with a mocked ancestry check.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Create isolated validation environment
        run: python -I -m venv --clear .venv

      - name: Install locked validation dependencies
        run: .venv/bin/python -m pip install --isolated --disable-pip-version-check --no-deps --requirement requirements-dev.lock

      - name: Verify dependency graph
        run: .venv/bin/python -m pip check

      - name: Run schema and semantic contract tests
        run: .venv/bin/python -m unittest discover -s tests -v
