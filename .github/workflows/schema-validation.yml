name: Composition schema validation

on:
  push:
    branches:
      - composition
      - "agent/composition-**"
  pull_request:
    branches:
      - composition

permissions:
  contents: read

concurrency:
  group: composition-schema-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify_browser:
    name: classify real-browser requirement
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      required: ${{ steps.classify.outputs.required }}
      reason: ${{ steps.classify.outputs.reason }}
      changed_count: ${{ steps.classify.outputs.changed_count }}
    steps:
      - name: Check out repository history for change classification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify real-browser requirement
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 -I scripts/classify_composition_ci.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"

  primary:
    name: preflight + core tests (2/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SITE_PUBLICATION_PROTOCOL_ROOT: ${{ github.workspace }}/.site-publication-protocol
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Managed update/upgrade validates that the lock's old source revision
          # exists locally and is an ancestor of the target source revision.
          # Release verification also checks the immutable T -> S -> I ancestry.
          # Keep real history available for both contracts.
          fetch-depth: 0

      - name: Check out Site publication protocol
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 3ae5d1e60c65e7a8ebf5f9af0436044484e42983
          path: .site-publication-protocol
          sparse-checkout: |
            scripts/publication_contract.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Create isolated validation environment
        run: python -I -m venv --clear .venv

      - name: Install locked validation dependencies
        run: .venv/bin/python -m pip install --isolated --disable-pip-version-check --no-deps --requirement requirements-dev.lock

      - name: Verify dependency graph
        run: .venv/bin/python -m pip check

      - name: Validate Site-owned publication contract
        run: .venv/bin/python -I "$SITE_PUBLICATION_PROTOCOL_ROOT/scripts/publication_contract.py" --source-root .

      - name: Validate Composition publication semantics
        run: .venv/bin/python -I scripts/validate_publication.py

      - name: Validate Composition translations
        run: .venv/bin/python -I scripts/validate_translations.py

      - name: Enforce component descriptor version monotonicity
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/composition'
        env:
          COMPONENT_VERSION_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: .venv/bin/python scripts/validate_component_versions.py --base "$COMPONENT_VERSION_BASE"

      - name: Verify Composition installer release
        run: .venv/bin/python -I scripts/verify_composition_skill_installer_release.py --git-ref HEAD

      - name: Verify deterministic core unittest partition
        run: .venv/bin/python scripts/run_unittest_shard.py --suite core --shard-count 2 --verify-only

      - name: Run core schema and semantic contract test shard 2/2
        run: >-
          .venv/bin/python scripts/run_unittest_shard.py
          --suite core
          --shard-count 2
          --shard-index 1

  parallel:
    name: core tests (1/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SITE_PUBLICATION_PROTOCOL_ROOT: ${{ github.workspace }}/.site-publication-protocol
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check out Site publication protocol
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 3ae5d1e60c65e7a8ebf5f9af0436044484e42983
          path: .site-publication-protocol
          sparse-checkout: |
            scripts/publication_contract.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Create isolated validation environment
        run: python -I -m venv --clear .venv

      - name: Install locked validation dependencies
        run: .venv/bin/python -m pip install --isolated --disable-pip-version-check --no-deps --requirement requirements-dev.lock

      - name: Verify dependency graph
        run: .venv/bin/python -m pip check

      - name: Run core schema and semantic contract test shard 1/2
        run: >-
          .venv/bin/python scripts/run_unittest_shard.py
          --suite core
          --shard-count 2
          --shard-index 0

  real_browser:
    name: real-browser acceptance
    needs:
      - classify_browser
    if: needs.classify_browser.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SITE_PUBLICATION_PROTOCOL_ROOT: ${{ github.workspace }}/.site-publication-protocol
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check out Site publication protocol
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 3ae5d1e60c65e7a8ebf5f9af0436044484e42983
          path: .site-publication-protocol
          sparse-checkout: |
            scripts/publication_contract.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Create isolated validation environment
        run: python -I -m venv --clear .venv

      - name: Install locked validation dependencies
        run: .venv/bin/python -m pip install --isolated --disable-pip-version-check --no-deps --requirement requirements-dev.lock

      - name: Verify dependency graph
        run: .venv/bin/python -m pip check

      - name: Prepare compatible ChromeDriver
        run: |
          driver_path="$(
            .venv/bin/python -I scripts/prepare_chromedriver.py \
              --output-dir "$RUNNER_TEMP/composition-chromedriver"
          )"
          echo "CHROMEWEBDRIVER=$driver_path" >> "$GITHUB_ENV"

      - name: Verify real-browser evidence runtime
        run: |
          google-chrome --version
          "$CHROMEWEBDRIVER" --version

      - name: Run real-browser acceptance suite
        run: >-
          .venv/bin/python scripts/run_unittest_shard.py
          --suite real-browser
          --shard-count 1
          --shard-index 0

  validate:
    if: always()
    needs:
      - classify_browser
      - primary
      - parallel
      - real_browser
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require successful core validation and policy-correct browser outcome
        env:
          CLASSIFIER_RESULT: ${{ needs.classify_browser.result }}
          PRIMARY_RESULT: ${{ needs.primary.result }}
          PARALLEL_RESULT: ${{ needs.parallel.result }}
          BROWSER_REQUIRED: ${{ needs.classify_browser.outputs.required }}
          BROWSER_RESULT: ${{ needs.real_browser.result }}
        run: |
          test "$CLASSIFIER_RESULT" = success
          test "$PRIMARY_RESULT" = success
          test "$PARALLEL_RESULT" = success
          case "$BROWSER_REQUIRED" in
            true)
              test "$BROWSER_RESULT" = success
              ;;
            false)
              test "$BROWSER_RESULT" = skipped
              ;;
            *)
              echo "invalid real-browser classification: $BROWSER_REQUIRED" >&2
              exit 1
              ;;
          esac
