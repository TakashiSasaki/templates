name: Composition schema validation

on:
  push:
    branches:
      - composition
  pull_request:

permissions:
  contents: read

concurrency:
  group: composition-schema-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  classify_browser:
    name: classify real-browser requirement
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      required: ${{ steps.classify.outputs.required }}
      reason: ${{ steps.classify.outputs.reason }}
      changed_count: ${{ steps.classify.outputs.changed_count }}
    steps:
      - name: Check out repository history for change classification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify real-browser requirement
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 -I scripts/classify_composition_ci.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"

  primary:
    name: publication + preflight + core tests (2/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      INTEGRATION_PUBLICATION_PROTOCOL_ROOT: ${{ github.workspace }}/.integration-publication-protocol
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out Integration publication protocol
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a30699cf7dc56bf3ef7a1b6fd8f6ffd45cdd426d
          path: .integration-publication-protocol
          sparse-checkout: |
            integration/publication_contract.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
          fetch-depth: 1

      # Keep this venv: the locked development dependencies are the validation
      # boundary, and the ephemeral runner's host Python is not that boundary.
      - name: Create isolated validation environment
        run: python3 -I -m venv --clear .venv

      - name: Install locked validation dependencies
        run: .venv/bin/python -m pip install --isolated --disable-pip-version-check --no-deps --requirement requirements-dev.lock

      - name: Verify dependency graph
        run: .venv/bin/python -m pip check

      - name: Reject source and environment defects before publication and core shard
        run: .venv/bin/python -B -I scripts/composition_phase_zero.py

      - name: Run bounded real-consumer spine before core shard
        run: .venv/bin/python -B -I scripts/run_composition_consumer_smoke.py

      - name: Materialize Composition publication once for primary validation
        run: .venv/bin/python -I scripts/materialize_publication.py --source-root .

      - name: Validate Integration-owned publication contract once
        run: .venv/bin/python -I "$INTEGRATION_PUBLICATION_PROTOCOL_ROOT/integration/publication_contract.py" --source-root .

      - name: Validate Composition-owned publication semantics once
        run: .venv/bin/python -I scripts/validate_publication.py

      - name: Run canonical Composition validator preflight without rebuilding publication
        env:
          COMPONENT_VERSION_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: >-
          .venv/bin/python -I scripts/run_composition_preflight.py fast
          --validators-only
          --publication-already-validated
          --component-version-base "$COMPONENT_VERSION_BASE"
          --expected-head "$EXPECTED_HEAD"

      - name: Run core schema and semantic contract test shard 2/2
        run: >-
          .venv/bin/python scripts/run_unittest_shard.py
          --suite core
          --shard-count 2
          --shard-index 1

  parallel:
    name: core tests (1/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      INTEGRATION_PUBLICATION_PROTOCOL_ROOT: ${{ github.workspace }}/.integration-publication-protocol
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out Integration publication protocol
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a30699cf7dc56bf3ef7a1b6fd8f6ffd45cdd426d
          path: .integration-publication-protocol
          sparse-checkout: |
            integration/publication_contract.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
          fetch-depth: 1

      # Keep this venv for the locked development-dependency boundary.
      - name: Create isolated validation environment
        run: python3 -I -m venv --clear .venv

      - name: Install locked validation dependencies
        run: .venv/bin/python -m pip install --isolated --disable-pip-version-check --no-deps --requirement requirements-dev.lock

      - name: Verify dependency graph
        run: .venv/bin/python -m pip check

      - name: Reject source and environment defects before materialization and core shard
        run: .venv/bin/python -B -I scripts/composition_phase_zero.py

      - name: Materialize Composition publication for shard-local test inputs
        run: .venv/bin/python -I scripts/materialize_publication.py --source-root .

      - name: Run core schema and semantic contract test shard 1/2
        run: >-
          .venv/bin/python scripts/run_unittest_shard.py
          --suite core
          --shard-count 2
          --shard-index 0

  real_browser:
    name: real-browser acceptance
    needs:
      - classify_browser
    if: needs.classify_browser.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Keep this venv for the locked development-dependency boundary.
      - name: Create isolated validation environment
        run: python3 -I -m venv --clear .venv

      - name: Install locked validation dependencies
        run: .venv/bin/python -m pip install --isolated --disable-pip-version-check --no-deps --requirement requirements-dev.lock

      - name: Verify dependency graph
        run: .venv/bin/python -m pip check

      - name: Select runner-provided ChromeDriver
        run: |
          driver_path="$(command -v chromedriver)"
          test -n "$driver_path"
          echo "CHROMEWEBDRIVER=$driver_path" >> "$GITHUB_ENV"

      - name: Verify real-browser evidence runtime
        run: |
          google-chrome --version
          "$CHROMEWEBDRIVER" --version

      - name: Probe canonical phase-zero browser environment
        run: .venv/bin/python -B -I scripts/composition_phase_zero.py --driver "$CHROMEWEBDRIVER"

      - name: Run real-browser acceptance suite
        run: >-
          .venv/bin/python scripts/run_unittest_shard.py
          --suite real-browser
          --shard-count 1
          --shard-index 0

  validate:
    if: always()
    needs:
      - classify_browser
      - primary
      - parallel
      - real_browser
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require successful core validation and policy-correct browser outcome
        env:
          CLASSIFIER_RESULT: ${{ needs.classify_browser.result }}
          PRIMARY_RESULT: ${{ needs.primary.result }}
          PARALLEL_RESULT: ${{ needs.parallel.result }}
          BROWSER_REQUIRED: ${{ needs.classify_browser.outputs.required }}
          BROWSER_RESULT: ${{ needs.real_browser.result }}
        run: |
          test "$CLASSIFIER_RESULT" = success
          test "$PRIMARY_RESULT" = success
          test "$PARALLEL_RESULT" = success
          case "$BROWSER_REQUIRED" in
            true)
              test "$BROWSER_RESULT" = success
              ;;
            false)
              test "$BROWSER_RESULT" = skipped
              ;;
            *)
              echo "invalid real-browser classification: $BROWSER_REQUIRED" >&2
              exit 1
              ;;
          esac
