name: Models qualification
on:
  pull_request:
    branches: [models, 'codex/models-*']
  push:
    branches: [models]
permissions:
  contents: read
concurrency:
  group: models-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 observed 2026-09-17
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 observed 2026-09-17
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install selected validation tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Qualify the exact source head
        run: |
          git rev-parse HEAD
          python tools/qualify.py
