name: Final Site provenance v5 E2E diagnostic

on:
  pull_request:
    branches:
      - site

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify merged Site deployment succeeded
        uses: actions/github-script@v8
        env:
          TARGET_SITE_SHA: 767c3c263ba295816bc69a741cbd39b4354680ea
        with:
          script: |
            const target = process.env.TARGET_SITE_SHA;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-pages.yml',
              event: 'push',
              branch: 'site',
              per_page: 50,
            });
            const run = data.workflow_runs.find((candidate) => candidate.head_sha === target);
            if (!run) {
              core.setFailed(`No deploy-pages push run found for ${target}`);
              return;
            }
            core.info(`Deployment workflow run: ${run.html_url}`);
            core.info(`status=${run.status} conclusion=${run.conclusion}`);
            if (run.status !== 'completed' || run.conclusion !== 'success') {
              core.setFailed(
                `Deploy documentation from site is ${run.status}/${run.conclusion} for ${target}`
              );
            }

      - name: Verify public surfaces migration and provenance
        env:
          PUBLIC_SITE_URL: https://templates.moukaeritai.work
          EXPECTED_SITE_SHA: 767c3c263ba295816bc69a741cbd39b4354680ea
          EXPECTED_COMPOSITION_SHA: 96dcb7707ff335554175acc76a004a4ddbce9852
          EXPECTED_POLICY_SHA: 904636a90e73b41d542c494fe88861ccca56b6c8
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          fetch() {
            local path="$1"
            local output="$2"
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 2 --retry-all-errors \
              "${PUBLIC_SITE_URL}${path}" -o "$output"
          }

          fetch /webapp/docs/migrations/surfaces-v1-to-v2/ "$work/surfaces-v2.html"
          fetch /build-provenance.json "$work/provenance.json"

          grep -Fq 'Surfaces contract v1 to v2' "$work/surfaces-v2.html"
          grep -Fq 'surfaceDependencies' "$work/surfaces-v2.html"

          python - "$work/provenance.json" <<'PY'
          import json
          import os
          import pathlib
          import sys

          provenance = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert provenance["site_commit"] == os.environ["EXPECTED_SITE_SHA"], provenance
          assert provenance["publication_commits"]["composition"] == os.environ["EXPECTED_COMPOSITION_SHA"], provenance
          assert provenance["publication_commits"]["policy"] == os.environ["EXPECTED_POLICY_SHA"], provenance
          print(json.dumps(provenance, sort_keys=True))
          PY
