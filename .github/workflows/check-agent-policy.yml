name: Check Site agent policy
on:
  push:
    branches:
      - site
  workflow_call:
    inputs:
      site_revision:
        description: Exact Site revision whose policy output is being checked
        type: string
        default: ''
permissions:
  contents: read
jobs:
  policy:
    if: github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'ci/full-qualification' || github.event.label.name == 'ci/full-site-verification'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.site_revision || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: TakashiSasaki/templates@ad89f96fc3822ce6b0f9012a28340f6ca7da9e82
        with:
          command: check
      - name: Verify review output freshness and regeneration
        run: python3 .github/tests/test_policy_outputs.py
