name: Check agent policy
on:
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: TakashiSasaki/templates@65a11ecac55c95edf20c1c445fd0c0092b4668cb
        with:
          command: check
          config: .agent-policy.yml
