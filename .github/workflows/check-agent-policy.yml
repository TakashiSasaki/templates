name: Check agent policy

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: policy-check-agent-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-head-self-qualification:
    name: current-head self qualification
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # Keep this venv: self-qualification installs the locked CI graph and
      # checks the installed Policy distribution in isolation.
      - name: Create isolated environment
        run: python3 -I -m venv --clear .venv

      - name: Install current Policy implementation
        run: |
          .venv/bin/python -m pip install --disable-pip-version-check --no-deps --requirement requirements-ci.lock
          .venv/bin/python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .

      - name: Qualify current-head generated state
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: .venv/bin/python scripts/run_policy_preflight.py --check self-check --expected-head "$EXPECTED_HEAD"

