name: Check agent policy
on:
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: TakashiSasaki/templates@b12b190cff4a9f5fa9f9ba76cc3425c479b67b87
        with:
          command: check
          config: .agent-policy.yml
