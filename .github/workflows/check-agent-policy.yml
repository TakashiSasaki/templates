name: Check Site agent policy
on:
  push:
    branches:
      - site
  workflow_call: {}
permissions:
  contents: read
jobs:
  policy:
    if: github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'ci/full-qualification' || github.event.label.name == 'ci/full-site-verification'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: TakashiSasaki/templates@733c86941f8154f301a225054d88c6b8a477058a
        with:
          command: check
      - name: Verify review output freshness and regeneration
        run: python3 .github/tests/test_policy_outputs.py
