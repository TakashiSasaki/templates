name: One-shot skill branch rename migration

on:
  push:
    branches:
      - agent/skill-branch-rename-migration

permissions:
  contents: write

jobs:
  migrate:
    if: github.repository == 'TakashiSasaki/templates'
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v7
        with:
          ref: agent/skill-branch-rename-migration

      - name: Apply and verify branch-name replacements
        shell: python
        run: |
          from pathlib import Path

          workflow_path = Path('.github/workflows/pages.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          workflow = workflow.replace('      - main\n', '      - skill\n')
          workflow = workflow.replace("|| 'main' }}", "|| 'skill' }}")
          workflow = workflow.replace('current main branch', 'current skill branch')
          if '      - main\n' in workflow or "|| 'main' }}" in workflow:
              raise SystemExit('documentation compatibility workflow still references main')
          if '      - skill\n' not in workflow or "|| 'skill' }}" not in workflow:
              raise SystemExit('documentation compatibility workflow does not target skill')
          workflow_path.write_text(workflow, encoding='utf-8')

          boundary_path = Path('.github/scripts/test-pages-deployment-boundary.rb')
          boundary = boundary_path.read_text(encoding='utf-8')
          boundary = boundary.replace('main push still triggers documentation workflow', 'skill push still triggers documentation workflow')
          boundary = boundary.replace('removed main publication workflow', 'removed skill publication workflow')
          boundary = boundary.replace('No workflow on `main` deploys GitHub Pages', 'No workflow on `skill` deploys GitHub Pages')
          boundary = boundary.replace('main deployment boundary', 'skill deployment boundary')
          boundary = boundary.replace('main workflows and contributor guidance', 'skill workflows and contributor guidance')
          if 'No workflow on `skill` deploys GitHub Pages' not in boundary:
              raise SystemExit('deployment boundary test does not require skill guidance')
          boundary_path.write_text(boundary, encoding='utf-8')

          contributing_path = Path('CONTRIBUTING.md')
          contributing = contributing_path.read_text(encoding='utf-8')
          contributing = contributing.replace('Pull requests to `main`', 'Pull requests to `skill`')
          contributing = contributing.replace('No workflow on `main` deploys GitHub Pages', 'No workflow on `skill` deploys GitHub Pages')
          if 'Pull requests to `skill`' not in contributing:
              raise SystemExit('contributor guidance does not target skill pull requests')
          contributing_path.write_text(contributing, encoding='utf-8')

          Path('.github/workflows/one-shot-branch-rename.yml').unlink()

      - name: Commit migration result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Migrate documentation compatibility to skill branch"
          git push origin HEAD:agent/skill-branch-rename-migration
