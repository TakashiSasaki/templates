          # Consumer selection guide explains the stronger transitive closure.
          catalog = Path('catalog/README.md')
          text = catalog.read_text(encoding='utf-8')
          old = '| A packaged command-line interface | `capability.cli` | `capability.runtime` | Caller-visible CLI contract |'
          new = '| A packaged command-line interface | `capability.cli` | `capability.runtime` + implementation evidence (and contract evolution) | Machine-readable caller-visible CLI contract with executable-proof enforcement |'
          if text.count(old) != 1:
              raise SystemExit('catalog CLI row not found exactly once')
          catalog.write_text(text.replace(old, new), encoding='utf-8')

          # Dependency closure regression.
          catalog_test = Path('tests/test_catalog_consumer_selection_guide.py')
          text = catalog_test.read_text(encoding='utf-8')
          needle = '''        self.assertEqual(\n            dependency_closure("artifact.skill-core", "lifecycle.release-bundle"),\n'''
          insertion = '''        self.assertEqual(\n            dependency_closure("artifact.skill-core", "capability.cli"),\n            {\n                "artifact.skill-core",\n                "capability.cli",\n                "capability.runtime",\n                "lifecycle.composition-state",\n                "lifecycle.contract-evolution",\n                "lifecycle.implementation-evidence",\n            },\n        )\n\n'''
          if text.count(needle) != 1:
              raise SystemExit('catalog dependency insertion point not found')
          catalog_test.write_text(text.replace(needle, insertion + needle), encoding='utf-8')

          # Integrated selected-component dispatch regression.
          selected_test = Path('tests/test_selected_component_validation.py')
          text = selected_test.read_text(encoding='utf-8')
