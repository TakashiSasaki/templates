name: Temporary machine-readable CLI evidence authority

on:
  push:
    branches:
      - agent/cli-machine-evidence-pr14

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/cli-machine-evidence-pr14
          fetch-depth: 0
      - name: Apply CLI authority patch
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          def write_json(path: str, value: object) -> None:
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(json.dumps(value, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          # capability.cli becomes the authority for a registered machine-readable CLI contract.
          cli_descriptor_path = Path('components/capability.cli/component.json')
          cli = json.loads(cli_descriptor_path.read_text(encoding='utf-8'))
          if cli['version'] != 1:
              raise SystemExit(f"unexpected capability.cli version: {cli['version']}")
          cli['version'] = 2
          cli['requires'] = ['capability.runtime', 'lifecycle.implementation-evidence']
          registration = {
              'id': 'cli_interface',
              'document': 'contracts/cli-interface.json',
              'schema': 'schemas/cli-interface.schema.json',
              'migration_slug': 'cli-interface',
              'document_schema_version': 1,
              'version_history': [{'version': 1, 'change_type': 'initial'}],
              'purpose': 'Declare caller-visible packaged CLI entrypoints, invocation probes, structured output, and exit-code contracts.',
          }
          rebuilt = {}
          for key, value in cli.items():
              if key == 'materials':
                  rebuilt['contract_registrations'] = [registration]
              rebuilt[key] = value
          rebuilt['materials'].extend([
              {
                  'source': 'files/contracts/cli-interface.json',
                  'destination': 'contracts/cli-interface.json',
                  'ownership': 'seed',
              },
              {
                  'source': 'files/schemas/cli-interface.schema.json',
                  'destination': 'schemas/cli-interface.schema.json',
                  'ownership': 'managed',
              },
              {
                  'source': 'files/.template-composition/validators/validate_cli_interface.py',
                  'destination': '.template-composition/validators/validate_cli_interface.py',
                  'ownership': 'managed',
              },
          ])
          write_json(str(cli_descriptor_path), rebuilt)

          # Registry dispatch is selected-component aware; bump its owning component.
          state_descriptor_path = Path('components/lifecycle.composition-state/component.json')
          state = json.loads(state_descriptor_path.read_text(encoding='utf-8'))
          if state['version'] != 3:
              raise SystemExit(f"unexpected lifecycle.composition-state version: {state['version']}")
          state['version'] = 4
          write_json(str(state_descriptor_path), state)

          registry_path = Path('components/lifecycle.composition-state/files/.template-composition/validation-registry.json')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          ids = [item['id'] for item in registry['validators']]
          if 'cli-interface' in ids:
              raise SystemExit('cli-interface validator already registered')
          insertion = next(i for i, item in enumerate(registry['validators']) if item['id'] == 'implementation-evidence') + 1
          registry['validators'].insert(
              insertion,
              {
                  'id': 'cli-interface',
                  'component': 'capability.cli',
                  'entrypoint': '.template-composition/validators/validate_cli_interface.py',
                  'arguments': ['.'],
                  'purpose': 'Validate selected packaged CLI entrypoints and require executable implementation-evidence proof strength.',
              },
          )
          write_json(str(registry_path), registry)

          write_json(
              'components/capability.cli/files/contracts/cli-interface.json',
              {
                  '$schema': '../schemas/cli-interface.schema.json',
                  'schemaVersion': 1,
                  'mode': 'template',
                  'entrypoints': [],
              },
          )

          cli_schema = {
              '$schema': 'https://json-schema.org/draft/2020-12/schema',
              'type': 'object',
              'additionalProperties': False,
              'required': ['$schema', 'schemaVersion', 'mode', 'entrypoints'],
              '$defs': {
                  'identifier': {
                      'type': 'string',
                      'pattern': '^[a-z][a-z0-9-]*$',
                  },
                  'nonBlankText': {
                      'type': 'string',
                      'minLength': 1,
                  },
                  'arguments': {
                      'type': 'array',
                      'minItems': 1,
                      'items': {'$ref': '#/$defs/nonBlankText'},
                  },
                  'exitCode': {
                      'type': 'integer',
                      'minimum': 0,
                      'maximum': 255,
                  },
                  'structuredOutput': {
                      'type': 'object',
                      'additionalProperties': False,
                      'required': ['arguments', 'format', 'contractVersionField'],
                      'properties': {
                          'arguments': {'$ref': '#/$defs/arguments'},
                          'format': {'const': 'json'},
                          'contractVersionField': {
                              'type': 'string',
                              'pattern': '^[A-Za-z_][A-Za-z0-9_.-]*$',
                          },
                      },
                  },
                  'exitCodes': {
                      'type': 'object',
                      'additionalProperties': False,
                      'required': [
                          'success',
                          'negativeResult',
                          'invalidInput',
                          'unavailable',
                          'refused',
                          'internalFailure',
                          'additionalInputRequired',
                      ],
                      'properties': {
                          'success': {'$ref': '#/$defs/exitCode'},
                          'negativeResult': {'$ref': '#/$defs/exitCode'},
                          'invalidInput': {'$ref': '#/$defs/exitCode'},
                          'unavailable': {'$ref': '#/$defs/exitCode'},
                          'refused': {'$ref': '#/$defs/exitCode'},
                          'internalFailure': {'$ref': '#/$defs/exitCode'},
                          'additionalInputRequired': {'$ref': '#/$defs/exitCode'},
                      },
                  },
                  'entrypoint': {
                      'type': 'object',
                      'additionalProperties': False,
                      'required': [
                          'id',
                          'command',
                          'workingDirectory',
                          'helpArguments',
                          'versionArguments',
                          'structuredOutput',
                          'exitCodes',
                      ],
                      'properties': {
                          'id': {'$ref': '#/$defs/identifier'},
                          'command': {'$ref': '#/$defs/arguments'},
                          'workingDirectory': {
                              'type': 'string',
                              'pattern': r'^(?:\.|(?!.*(?:^|/)\.\.?(?:/|$))(?![A-Za-z]:)(?!/)[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)*)$',
                          },
                          'helpArguments': {'$ref': '#/$defs/arguments'},
                          'versionArguments': {'$ref': '#/$defs/arguments'},
                          'structuredOutput': {'$ref': '#/$defs/structuredOutput'},
                          'exitCodes': {'$ref': '#/$defs/exitCodes'},
                      },
                  },
              },
              'properties': {
                  '$schema': {'const': '../schemas/cli-interface.schema.json'},
                  'schemaVersion': {'const': 1},
                  'mode': {'enum': ['template', 'product']},
                  'entrypoints': {
                      'type': 'array',
                      'uniqueItems': True,
                      'items': {'$ref': '#/$defs/entrypoint'},
                  },
              },
              'allOf': [
                  {
                      'if': {'properties': {'mode': {'const': 'template'}}, 'required': ['mode']},
                      'then': {'properties': {'entrypoints': {'maxItems': 0}}},
                  },
                  {
                      'if': {'properties': {'mode': {'const': 'product'}}, 'required': ['mode']},
                      'then': {'properties': {'entrypoints': {'minItems': 1}}},
                  },
              ],
          }
          write_json('components/capability.cli/files/schemas/cli-interface.schema.json', cli_schema)

          validator_path = Path('components/capability.cli/files/.template-composition/validators/validate_cli_interface.py')
          validator_path.parent.mkdir(parents=True, exist_ok=True)
          validator_path.write_text(r'''#!/usr/bin/env python3
"""Validate selected packaged CLI contracts and executable evidence strength."""
from __future__ import annotations

import argparse
import json
import sys
from pathlib import Path
from typing import Any

CLI_CONTRACT = Path("contracts/cli-interface.json")
IMPLEMENTATION_EVIDENCE = Path("contracts/implementation-evidence.json")
EXECUTABLE_PROOF_KINDS = frozenset({"integration-test", "end-to-end-test"})


def load_json(root: Path, relative: Path) -> dict[str, Any]:
    value = json.loads((root / relative).read_text(encoding="utf-8"))
    if not isinstance(value, dict):
        raise TypeError(f"{relative} must contain a JSON object")
    return value


def target_key(target: object) -> tuple[object, ...]:
    if not isinstance(target, dict):
        return (None, None, None, None)
    return (
        target.get("kind"),
        target.get("contractId"),
        target.get("itemKind"),
        target.get("itemId"),
    )


def entrypoint_target(entrypoint_id: str) -> tuple[str, str, str, str]:
    return ("contract-item", "cli_interface", "entrypoint", entrypoint_id)


def proof_kinds(record: dict[str, Any], field: str) -> set[str]:
    proofs = record.get(field)
    if not isinstance(proofs, list):
        return set()
    return {
        proof.get("kind")
        for proof in proofs
        if isinstance(proof, dict) and isinstance(proof.get("kind"), str)
    }


def validate(root: Path) -> list[str]:
    contract = load_json(root, CLI_CONTRACT)
    evidence = load_json(root, IMPLEMENTATION_EVIDENCE)
    cli_mode = contract.get("mode")
    evidence_mode = evidence.get("mode")

    if cli_mode == "template":
        if evidence_mode == "product":
            return [
                "capability.cli is selected but contracts/cli-interface.json remains in "
                "template mode while product implementation evidence is active; either "
                "remove capability.cli from Composition intent or declare the CLI contract "
                "in product mode and add executable CLI evidence"
            ]
        return []
    if cli_mode != "product":
        return [f"unsupported CLI interface mode: {cli_mode!r}"]
    if evidence_mode != "product":
        return [
            "product CLI interface requires product implementation evidence; switch "
            "contracts/implementation-evidence.json to product mode and prove each CLI entrypoint"
        ]

    entrypoints = contract.get("entrypoints")
    records = evidence.get("records")
    requirements = evidence.get("requirements")
    if not isinstance(entrypoints, list):
        return ["CLI interface entrypoints must be an array"]
    if not isinstance(records, list):
        return ["implementation-evidence records must be an array"]
    if not isinstance(requirements, list):
        return ["implementation-evidence requirements must be an array"]

    errors: list[str] = []
    ids = [
        item.get("id")
        for item in entrypoints
        if isinstance(item, dict) and isinstance(item.get("id"), str)
    ]
    if len(ids) != len(entrypoints):
        errors.append("every product CLI entrypoint must have a text id")
    duplicate_ids = sorted({item for item in ids if ids.count(item) > 1})
    for duplicate in duplicate_ids:
        errors.append(f"duplicate CLI entrypoint id: {duplicate}")

    exit_code_sets: list[tuple[str, list[int]]] = []
    for item in entrypoints:
        if not isinstance(item, dict) or not isinstance(item.get("id"), str):
            continue
        exit_codes = item.get("exitCodes")
        if isinstance(exit_codes, dict):
            values = [value for value in exit_codes.values() if isinstance(value, int)]
            exit_code_sets.append((item["id"], values))
    for entrypoint_id, values in exit_code_sets:
        if len(values) != len(set(values)):
            errors.append(f"CLI entrypoint {entrypoint_id!r} assigns one exit code to multiple meanings")

    records_by_target: dict[tuple[object, ...], list[dict[str, Any]]] = {}
    cli_records_by_id: dict[str, dict[str, Any]] = {}
    for record in records:
        if not isinstance(record, dict):
            continue
        target = record.get("target")
        key = target_key(target)
        if len(key) >= 2 and key[1] == "cli_interface":
            records_by_target.setdefault(key, []).append(record)
            record_id = record.get("id")
            if isinstance(record_id, str):
                cli_records_by_id[record_id] = record

    expected = {entrypoint_target(entrypoint_id) for entrypoint_id in ids}
    actual = set(records_by_target)
    for missing in sorted(expected - actual, key=str):
        errors.append(f"missing CLI implementation-evidence target: {missing}")
    for extra in sorted(actual - expected, key=str):
        if extra[0] == "contract-item":
            errors.append(f"unknown CLI implementation-evidence target: {extra}")
    for key, matching in sorted(records_by_target.items(), key=lambda item: str(item[0])):
        if key in expected and len(matching) != 1:
            errors.append(f"CLI implementation-evidence target {key} must have exactly one record")

    allowed = ", ".join(sorted(EXECUTABLE_PROOF_KINDS))
    requirement_refs: dict[str, list[dict[str, Any]]] = {}
    for requirement in requirements:
        if not isinstance(requirement, dict):
            continue
        refs = requirement.get("recordIds")
        if not isinstance(refs, list):
            continue
        for record_id in refs:
            if isinstance(record_id, str):
                requirement_refs.setdefault(record_id, []).append(requirement)

    for key in sorted(expected & actual, key=str):
        matching = records_by_target[key]
        if len(matching) != 1:
            continue
        record = matching[0]
        record_id = record.get("id")
        if not isinstance(record_id, str):
            errors.append(f"CLI implementation-evidence target {key} must have a text record id")
            continue
        for field, label in (("positiveEvidence", "positive"), ("negativeEvidence", "negative")):
            if proof_kinds(record, field).isdisjoint(EXECUTABLE_PROOF_KINDS):
                errors.append(
                    f"CLI target {key} requires at least one {label} executable proof kind "
                    f"({allowed}); static inspection or unit-only proof is insufficient"
                )
        linked = requirement_refs.get(record_id, [])
        strong = False
        for requirement in linked:
            kinds = requirement.get("requiredPositiveProofKinds")
            declared = {kind for kind in kinds if isinstance(kind, str)} if isinstance(kinds, list) else set()
            if not declared.isdisjoint(EXECUTABLE_PROOF_KINDS):
                strong = True
                break
        if not strong:
            errors.append(
                f"CLI record {record_id!r} must be linked from at least one requirement whose "
                f"requiredPositiveProofKinds includes an executable CLI proof kind ({allowed})"
            )
    return errors


def main() -> int:
    parser = argparse.ArgumentParser(description=__doc__)
    parser.add_argument("root", nargs="?", default=".")
    args = parser.parse_args()
    root = Path(args.root).resolve()
    try:
        errors = validate(root)
    except (OSError, ValueError, KeyError, TypeError, json.JSONDecodeError) as exc:
        print(f"ERROR: cannot validate CLI interface: {exc}", file=sys.stderr)
        return 1
    if errors:
        for error in errors:
            print(f"ERROR: {error}", file=sys.stderr)
        return 1
    contract = load_json(root, CLI_CONTRACT)
    if contract.get("mode") == "template":
        print("CLI interface: template mode OK; no product CLI claim is active")
    else:
        print("CLI interface and executable evidence strength: OK")
    return 0


if __name__ == "__main__":
    raise SystemExit(main())
''', encoding='utf-8')

          # Human-facing CLI seed points to the machine-readable authority instead of owning state itself.
          cli_md = Path('components/capability.cli/files/CLI_INTERFACE.md')
          text = cli_md.read_text(encoding='utf-8')
          old = '''## Status\n\n```text\nSelection status: UNSELECTED\n```\n\nChange the status to `SELECTED` only after every applicable field is concrete and the canonical command agrees with `RUNTIME.md`.\n'''
          new = '''## Machine-readable authority\n\n`contracts/cli-interface.json` is the canonical machine-readable state for this selected capability. Its initial `template` mode makes no product CLI claim. Switch it to `product` only after every caller-visible entrypoint is concrete and the shared implementation-evidence graph contains executable positive and negative proof for each entrypoint.\n\nWhen `capability.cli` is selected, product implementation evidence cannot remain release-valid while this contract is still in template mode. Static source inspection and unit-only proof do not satisfy the CLI executable-proof obligation.\n\nKeep the narrative notes below aligned with the machine contract; when they conflict, the JSON contract is authoritative for validation.\n'''
          if old not in text:
