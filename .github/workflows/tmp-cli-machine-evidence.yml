name: Temporary machine-readable CLI evidence authority

on:
  push:
    branches:
      - agent/cli-machine-evidence-pr14

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/cli-machine-evidence-pr14
          fetch-depth: 0
      - name: Fix and apply CLI authority patch
        shell: bash
        run: |
          python .github/fix-cli-machine-evidence-script.py
          python .github/tmp-cli-machine-evidence.py
      - name: Commit patch and remove temporary files
        shell: bash
        run: |
          rm .github/fix-cli-machine-evidence-script.py
          rm .github/tmp-cli-machine-evidence.py
          rm .github/workflows/tmp-cli-machine-evidence.yml
          git config user.name "TakashiSasaki templates automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Require executable evidence for selected CLI capability"
          git push origin HEAD:agent/cli-machine-evidence-pr14
