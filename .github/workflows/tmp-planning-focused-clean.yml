name: Temporary clean planning-mode acceptance
on:
  push:
    branches:
      - agent/planning-requirement-ledger-pr16
permissions:
  contents: write
jobs:
  focused:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/planning-requirement-ledger-pr16
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Create external validation environment
        shell: bash
        run: |
          set -eu
          VENV="$RUNNER_TEMP/planning-venv"
          python -I -m venv --clear "$VENV"
          "$VENV/bin/python" -m pip install --isolated --disable-pip-version-check --no-deps --requirement requirements-dev.lock
          "$VENV/bin/python" -m pip check
          echo "VENV=$VENV" >> "$GITHUB_ENV"
      - name: Run focused lifecycle acceptance
        run: |
          "$VENV/bin/python" -B -m unittest tests.test_implementation_evidence_planning -v
          "$VENV/bin/python" -B -m unittest tests.test_implementation_evidence_schema -v
          "$VENV/bin/python" -B -m unittest tests.test_webapp_evidence_scaffold -v
          "$VENV/bin/python" -B -m unittest tests.test_release_execution_contract -v
      - name: Audit source cleanliness and stale component expectations
        if: always()
        shell: bash
        run: |
          set -eu
          git status --short
          if find . -path './.git' -prune -o -type f -name '*.pyc' -print -quit | grep -q .; then
            echo 'generated pyc remains' >&2
            exit 1
          fi
          echo '=== component version expectation candidates ==='
          grep -RIn --include='*.py' -E '(implementation-evidence|composition-state|release-execution).*(version|to_version|7|5|3)' tests || true
      - name: Self-delete temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/tmp-planning-focused-clean.yml
          git config user.name 'TakashiSasaki templates automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary planning focused acceptance'
          git push origin HEAD:agent/planning-requirement-ledger-pr16
