name: Temporary apply materialized template expectation migration
on:
  push:
    branches:
      - agent/planning-requirement-ledger-pr16
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/planning-requirement-ledger-pr16
          fetch-depth: 0
      - name: Apply smoke expectation migration
        run: |
          python .github/tmp/update_materialized_template_expectation.py
          python -m py_compile scripts/smoke_test_materialized_validation.py
      - name: Commit migration and self-delete
        run: |
          rm -f .github/tmp/update_materialized_template_expectation.py
          rm -f .github/workflows/tmp-apply-materialized-template-migration.yml
          find . -path './.git' -prune -o -type f -name '*.pyc' -delete
          find . -path './.git' -prune -o -type d -name '__pycache__' -empty -delete
          git config user.name 'TakashiSasaki templates automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Align materialized template validation expectation'
          git push origin HEAD:agent/planning-requirement-ledger-pr16
