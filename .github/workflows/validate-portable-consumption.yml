name: Validate portable skill consumption

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-core-consumption:
    name: portable-core-consumption (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python validator dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3

      - name: Treat Windows drive paths as local tar archives
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value 'TAR_OPTIONS=--force-local'

      - name: Validate canonical copyable template root
        run: python template/.github/scripts/validate_skill_repository.py template

      - name: Test reduced profile layouts
        run: python .github/scripts/test_minimal_profile_layouts.py

      - name: Test clean-room template adoption and installation
        run: python .github/scripts/test_copyable_template_consumption.py

      - name: Test concrete skill completion hygiene
        run: python .github/scripts/test_concrete_skill_completion.py

      - name: Test parent-owned archive vendoring
        run: python .github/scripts/test_parent_owned_vendoring.py

      - name: Test non-mutating skill consumption
        run: python .github/scripts/test_non_mutating_consumption.py

      - name: Test core consumption under space and Unicode paths
        run: python .github/scripts/test_path_safe_consumption.py
