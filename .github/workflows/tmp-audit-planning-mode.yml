name: Temporary planning-mode audit
on:
  push:
    branches:
      - agent/planning-requirement-ledger-pr16
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/planning-requirement-ledger-pr16
          fetch-depth: 1
      - name: Find implementation-evidence mode assumptions
        shell: bash
        run: |
          set -eu
          echo '=== mode comparisons near implementation-evidence ==='
          grep -RInE 'implementation-evidence|implementation_evidence' components scripts tests docs examples translations 2>/dev/null \
            | grep -E 'mode|product|template|release-readiness|requirements' \
            | head -n 500 || true
          echo '=== direct mode predicates in implementation-evidence consumers ==='
          grep -RInE 'mode[^\n]*(product|template)|get\(["'"']mode["'"']\)' \
            components/lifecycle.implementation-evidence components/artifact.webapp-core components/capability.cli components/capability.service tests \
            2>/dev/null | head -n 800 || true
