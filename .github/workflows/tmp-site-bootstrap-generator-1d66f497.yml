name: Temporary Site stable bootstrap projection generator

on:
  push:
    branches:
      - tmp-site-bootstrap-generator-1d66f497

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact prepared Site revision
        uses: actions/checkout@v7
        with:
          ref: 43cb9f2f50b33cadb23a59d65354f2806e88b8a2
          path: site-root
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact merged Composition revision
        uses: actions/checkout@v7
        with:
          ref: 1d66f4976e0d5146bc33b3350f8ab2a7382109c3
          path: composition-root
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run canonical Site publication advance
        run: |
          python site-root/scripts/advance_publication_source.py \
            --site-root site-root \
            --provider composition \
            --provider-root composition-root \
            --composition-root composition-root \
            --target 1d66f4976e0d5146bc33b3350f8ab2a7382109c3 \
            --expected-current b4581b58301b1f2736fce86dfcd56d7ddb98bff0

      - name: Emit exact generated bytes and digests
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib

          root = Path('site-root')
          for relative in ('publication-sources.json', 'agent.json', 'assets/agent.json'):
              data = (root / relative).read_bytes()
              print(f'===BEGIN_GENERATED:{relative}===')
              print(base64.b64encode(data).decode('ascii'))
              print(f'SHA256:{hashlib.sha256(data).hexdigest()}')
              print(f'===END_GENERATED:{relative}===')
          PY

      - name: Upload exact generated files
        uses: actions/upload-artifact@v4
        with:
          name: site-stable-bootstrap-projection-generated
          path: |
            site-root/publication-sources.json
            site-root/agent.json
            site-root/assets/agent.json
          if-no-files-found: error
          retention-days: 1
