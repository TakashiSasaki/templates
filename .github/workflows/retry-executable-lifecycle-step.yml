name: Retry executable lifecycle next step

on:
  push:
    branches:
      - feat/executable-lifecycle-next-step

permissions:
  contents: write

jobs:
  retry:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Run corrected finalizer and remove staging workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          PARENT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/finalize-executable-lifecycle-step.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          code = textwrap.dedent(source[start:end])
          code = code.replace(
              "checkpoint_component, '\"version\": 1', '\"version\": 2', label=\"checkpoint component version\"",
              "checkpoint_component, '  \"version\": 1,', '  \"version\": 2,', label=\"checkpoint component version\"",
              1,
          )
          deletion = 'entries.append({"path": workflow_path, "mode": "100644", "type": "blob", "sha": None})'
          replacement = deletion + '\nentries.append({"path": ".github/workflows/retry-executable-lifecycle-step.yml", "mode": "100644", "type": "blob", "sha": None})'
          if deletion not in code:
              raise SystemExit('workflow deletion marker missing')
          code = code.replace(deletion, replacement, 1)
          exec(compile(code, '<corrected-finalizer>', 'exec'), {'__name__': '__main__'})
          PY
