name: Validate Integration authority
on:
  pull_request:
  push:
    branches: [integration]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: |
          python3 -m pip install --no-deps -r requirements-build.lock
          python3 -m pip check
      - name: Run canonical Integration local preflight
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/run_integration_preflight.py fast --expected-head "$EXPECTED_HEAD"
  qualification:
    needs: contracts
    uses: ./.github/workflows/integration-qualification.yml
    with:
      producer_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      artifact_namespace: integration
