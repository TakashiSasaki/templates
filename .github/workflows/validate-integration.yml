name: Validate Integration authority
on:
  pull_request:
    branches: [integration, 'integration-*']
  push:
    branches: [integration]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --no-deps -r requirements-build.lock
          python -m pip check
      - run: python -m unittest discover -s tests -v
  qualification:
    needs: contracts
    uses: ./.github/workflows/integration-qualification.yml
    with:
      producer_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      artifact_namespace: integration
