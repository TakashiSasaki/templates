name: Promote checkpoint lifecycle installer candidate

on:
  push:
    branches:
      - promote/checkpoint-lifecycle-installer
    paths:
      - .github/workflows/promote-checkpoint-lifecycle-installer.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Pin installer to reviewed Skill source
        run: |
          python - <<'PY'
          from pathlib import Path

          old = "cc180cecbde7f75cd5f07c1aa311014d6db7c97c"
          new = "dee6278c275d4c480373acd5b66cfc2c2db4c663"
          paths = [
              Path("scripts/install_composition_skill.py"),
              Path("tests/test_composition_remote_skill_installer.py"),
          ]
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one old Skill source in {path}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python -m unittest tests.test_composition_remote_skill_installer
      - name: Commit installer candidate and remove helper
        env:
          BRANCH: promote/checkpoint-lifecycle-installer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/install_composition_skill.py tests/test_composition_remote_skill_installer.py
          git rm .github/workflows/promote-checkpoint-lifecycle-installer.yml
          git commit -m "Pin Composition installer to checkpoint lifecycle Skill source"
          git push origin HEAD:${BRANCH}
