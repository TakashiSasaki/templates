name: Rebuild workflow strategy publication

on:
  push:
    branches:
      - release/workflow-strategy-publication

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Rebuild publication tree on final installer candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          START_SHA: ${{ github.sha }}
          BRANCH: release/workflow-strategy-publication
          OLD_INSTALLER: 23ac7ce36e6e0d11f4a7bc72ab1103d1062f31ae
          NEW_INSTALLER: bad638f58c74a12078d4e02bca62151a7bb86dea
          OLD_BOOTSTRAP_BLOB: 82a7b60f70a4a72c05dbe3136fb2760fab9ffec4
          OLD_GETTING_STARTED_BLOB: 346a664da0cefb27182c27bd4fa2f6885b3786c4
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repository = os.environ["REPOSITORY"]
          start_sha = os.environ["START_SHA"]
          branch = os.environ["BRANCH"]
          old_installer = os.environ["OLD_INSTALLER"]
          new_installer = os.environ["NEW_INSTALLER"]
          old_bootstrap_blob = os.environ["OLD_BOOTSTRAP_BLOB"]
          old_getting_blob = os.environ["OLD_GETTING_STARTED_BLOB"]
          api = f"https://api.github.com/repos/{repository}"

          def request(method, path, data=None):
              body = None if data is None else json.dumps(data).encode("utf-8")
              req = urllib.request.Request(
                  api + path,
                  data=body,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "templates-publication-rebuilder",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          def content(path):
              encoded = urllib.parse.quote(path, safe="/")
              value = request("GET", f"/contents/{encoded}?ref={start_sha}")
              return base64.b64decode(value["content"]).decode("utf-8")

          def blob(text):
              value = request(
                  "POST",
                  "/git/blobs",
                  {"content": text, "encoding": "utf-8"},
              )
              return value["sha"]

          base_commit = request("GET", f"/git/commits/{new_installer}")
          base_tree = base_commit["tree"]["sha"]

          paths = [
              "release/skill-installer.json",
              "README.md",
              "docs/bootstrap.md",
              "docs/getting-started.md",
              "tests/test_skill_installer_publication.py",
              "translations/ja/docs/bootstrap.md",
              "translations/ja/docs/getting-started.md",
          ]
          entries = []
          canonical_blobs = {}
          for path in paths:
              text = content(path)
              count = text.count(old_installer)
              if count < 1:
                  raise SystemExit(f"expected old installer identity in {path}")
              text = text.replace(old_installer, new_installer)
              if old_installer in text:
                  raise SystemExit(f"old installer identity remains in {path}")
              sha = blob(text)
              entries.append({"path": path, "mode": "100644", "type": "blob", "sha": sha})
              if path in {"docs/bootstrap.md", "docs/getting-started.md"}:
                  canonical_blobs[path] = sha

          manifest = content("translations/manifest.json")
          if manifest.count(old_bootstrap_blob) != 1:
              raise SystemExit("bootstrap provenance identity is not singular")
          if manifest.count(old_getting_blob) != 1:
              raise SystemExit("getting-started provenance identity is not singular")
          manifest = manifest.replace(
              old_bootstrap_blob,
              canonical_blobs["docs/bootstrap.md"],
          ).replace(
              old_getting_blob,
              canonical_blobs["docs/getting-started.md"],
          )
          entries.append(
              {
                  "path": "translations/manifest.json",
                  "mode": "100644",
                  "type": "blob",
                  "sha": blob(manifest),
              }
          )

          tree = request("POST", "/git/trees", {"base_tree": base_tree, "tree": entries})
          commit = request(
              "POST",
              "/git/commits",
              {
                  "message": "Rebuild corrected installer publication on final candidate",
                  "tree": tree["sha"],
                  "parents": [start_sha, new_installer],
              },
          )
          current = request(
              "GET",
              f"/git/ref/heads/{urllib.parse.quote(branch, safe='/')}",
          )["object"]["sha"]
          if current != start_sha:
              raise SystemExit(f"branch moved: expected {start_sha}, observed {current}")
          request(
              "PATCH",
              f"/git/refs/heads/{urllib.parse.quote(branch, safe='/')}",
              {"sha": commit["sha"], "force": False},
          )
          print(f"publication_commit={commit['sha']}")
          print(f"bootstrap_blob={canonical_blobs['docs/bootstrap.md']}")
          print(f"getting_started_blob={canonical_blobs['docs/getting-started.md']}")
          PY
