name: Composition consumer runtime

on:
  push:
    branches:
      - composition
      - "agent/composition-**"
  pull_request:
    branches:
      - composition

permissions:
  contents: read

concurrency:
  group: composition-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify_runtime:
    name: classify consumer-runtime requirement
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      required: ${{ steps.classify.outputs.required }}
      reason: ${{ steps.classify.outputs.reason }}
      changed_count: ${{ steps.classify.outputs.changed_count }}
    steps:
      - name: Check out repository history for change classification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify consumer-runtime requirement
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 -I scripts/classify_composition_ci.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"

  clean-runtime:
    name: ${{ matrix.platform.os }} / Python ${{ matrix.python-version }}
    needs:
      - classify_runtime
    if: ${{ always() && (github.event_name != 'pull_request' || needs.classify_runtime.outputs.required == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-24.04
            pip-config-file: /dev/null
          - os: windows-2022
            pip-config-file: NUL
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 15
    env:
      PYTHONHOME: ""
      PYTHONPATH: ""
      PYTHONUSERBASE: ""
      PYTHONNOUSERSITE: "1"
      PIP_PYTHON: ""
      PIP_CACHE_DIR: ""
      PIP_NO_CACHE_DIR: ""
      PIP_QUIET: ""
      PIP_LOG: ""
      PIP_CONFIG_FILE: ${{ matrix.platform.pip-config-file }}
    steps:
      - name: Check out repository with Composition history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build and exercise clean consumer runtime
        run: python -I scripts/smoke_test_runtime_distribution.py

  materialized-validation:
    name: materialized validation / ${{ matrix.platform.os }} / Python ${{ matrix.python-version }}
    needs:
      - classify_runtime
    if: ${{ always() && (github.event_name != 'pull_request' || needs.classify_runtime.outputs.required == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-24.04
            pip-config-file: /dev/null
          - os: windows-2022
            pip-config-file: NUL
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 20
    env:
      PYTHONHOME: ""
      PYTHONPATH: ""
      PYTHONUSERBASE: ""
      PYTHONNOUSERSITE: "1"
      PIP_PYTHON: ""
      PIP_CACHE_DIR: ""
      PIP_NO_CACHE_DIR: ""
      PIP_QUIET: ""
      PIP_LOG: ""
      PIP_CONFIG_FILE: ${{ matrix.platform.pip-config-file }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Exercise materialized validation without host site packages
        run: python -I scripts/smoke_test_materialized_validation.py

  skill-runner:
    name: installed skill / ${{ matrix.platform.os }} / Python 3.12
    needs:
      - classify_runtime
    if: ${{ always() && (github.event_name != 'pull_request' || needs.classify_runtime.outputs.required == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-24.04
            pip-config-file: /dev/null
          - os: windows-2022
            pip-config-file: NUL
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 20
    env:
      PYTHONHOME: ""
      PYTHONPATH: ""
      PYTHONUSERBASE: ""
      PYTHONNOUSERSITE: "1"
      PIP_PYTHON: ""
      PIP_CACHE_DIR: ""
      PIP_NO_CACHE_DIR: ""
      PIP_QUIET: ""
      PIP_LOG: ""
      PIP_CONFIG_FILE: ${{ matrix.platform.pip-config-file }}
    steps:
      - name: Check out runner source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install skill and exercise immutable runner
        run: python -I scripts/smoke_test_skill_runner.py

      - name: Download and exercise immutable remote installer candidate
        run: python -I scripts/smoke_test_remote_skill_installer.py

  validate:
    name: consumer runtime validate
    if: ${{ always() }}
    needs:
      - classify_runtime
      - clean-runtime
      - materialized-validation
      - skill-runner
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require policy-correct consumer-runtime outcome
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLASSIFIER_RESULT: ${{ needs.classify_runtime.result }}
          RUNTIME_REQUIRED: ${{ needs.classify_runtime.outputs.required }}
          CLEAN_RUNTIME_RESULT: ${{ needs.clean-runtime.result }}
          MATERIALIZED_VALIDATION_RESULT: ${{ needs.materialized-validation.result }}
          SKILL_RUNNER_RESULT: ${{ needs.skill-runner.result }}
        run: |
          case "$EVENT_NAME" in
            push)
              test "$CLASSIFIER_RESULT" = skipped
              test "$CLEAN_RUNTIME_RESULT" = success
              test "$MATERIALIZED_VALIDATION_RESULT" = success
              test "$SKILL_RUNNER_RESULT" = success
              ;;
            pull_request)
              test "$CLASSIFIER_RESULT" = success
              case "$RUNTIME_REQUIRED" in
                true)
                  test "$CLEAN_RUNTIME_RESULT" = success
                  test "$MATERIALIZED_VALIDATION_RESULT" = success
                  test "$SKILL_RUNNER_RESULT" = success
                  ;;
                false)
                  test "$CLEAN_RUNTIME_RESULT" = skipped
                  test "$MATERIALIZED_VALIDATION_RESULT" = skipped
                  test "$SKILL_RUNNER_RESULT" = skipped
                  ;;
                *)
                  echo "invalid consumer-runtime classification: $RUNTIME_REQUIRED" >&2
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "unexpected workflow event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
