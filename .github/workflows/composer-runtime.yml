name: Composition consumer runtime

on:
  push:
    branches:
      - composition
  pull_request:
    branches:
      - composition
      - 'feat/composition-*'
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: composition-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify_runtime:
    name: classify consumer-runtime requirement
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      required: ${{ steps.classify.outputs.required }}
      reason: ${{ steps.classify.outputs.reason }}
      changed_count: ${{ steps.classify.outputs.changed_count }}
    steps:
      - name: Check out repository history for change classification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify consumer-runtime requirement
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 -I scripts/classify_composition_ci.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"

      - name: Record runtime CI selection
        env:
          RUNTIME_REQUIRED: ${{ steps.classify.outputs.required }}
          RUNTIME_REASON: ${{ steps.classify.outputs.reason }}
          CHANGED_COUNT: ${{ steps.classify.outputs.changed_count }}
        run: |
          {
            echo '### Composition consumer runtime selection'
            echo
            echo "- fast runtime required: \`$RUNTIME_REQUIRED\`"
            echo "- reason: \`$RUNTIME_REASON\`"
            echo "- changed paths: \`$CHANGED_COUNT\`"
            echo '- default qualification: Ubuntu 24.04 / Python 3.11'
            echo '- Windows and Python 3.12-3.14 are explicit compatibility checkpoints only'
          } >> "$GITHUB_STEP_SUMMARY"

  # Clean runtime and materialized validation share checkout/Python setup. They
  # remain parallel with the slower skill runner, preserving the fast critical path.
  runtime-core:
    name: runtime core / Ubuntu / Python 3.11
    needs:
      - classify_runtime
    if: ${{ always() && !cancelled() && needs.classify_runtime.result == 'success' && needs.classify_runtime.outputs.required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONHOME: ""
      PYTHONPATH: ""
      PYTHONUSERBASE: ""
      PYTHONNOUSERSITE: "1"
      PIP_PYTHON: ""
      PIP_CACHE_DIR: ""
      PIP_NO_CACHE_DIR: ""
      PIP_QUIET: ""
      PIP_LOG: ""
      PIP_CONFIG_FILE: /dev/null
    steps:
      - name: Check out repository with Composition history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 'requirements*.lock'

      - name: Run canonical runtime-core checks
        run: python -I scripts/run_composer_runtime_checks.py --check runtime-core

  skill-runner:
    name: installed skill / Ubuntu / Python 3.11
    needs:
      - classify_runtime
    if: ${{ always() && !cancelled() && needs.classify_runtime.result == 'success' && needs.classify_runtime.outputs.required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONHOME: ""
      PYTHONPATH: ""
      PYTHONUSERBASE: ""
      PYTHONNOUSERSITE: "1"
      PIP_PYTHON: ""
      PIP_CACHE_DIR: ""
      PIP_NO_CACHE_DIR: ""
      PIP_QUIET: ""
      PIP_LOG: ""
      PIP_CONFIG_FILE: /dev/null
    steps:
      - name: Check out runner source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 'requirements*.lock'

      - name: Run canonical installed-skill checks
        run: python -I scripts/run_composer_runtime_checks.py --check skill-runner

  validate:
    name: consumer runtime validate
    if: ${{ always() }}
    needs:
      - classify_runtime
      - runtime-core
      - skill-runner
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require policy-correct consumer-runtime outcome
        env:
          CLASSIFIER_RESULT: ${{ needs.classify_runtime.result }}
          RUNTIME_REQUIRED: ${{ needs.classify_runtime.outputs.required }}
          RUNTIME_CORE_RESULT: ${{ needs.runtime-core.result }}
          SKILL_RUNNER_RESULT: ${{ needs.skill-runner.result }}
        run: |
          test "$CLASSIFIER_RESULT" = success

          case "$RUNTIME_REQUIRED" in
            true)
              test "$RUNTIME_CORE_RESULT" = success
              test "$SKILL_RUNNER_RESULT" = success
              ;;
            false)
              test "$RUNTIME_CORE_RESULT" = skipped
              test "$SKILL_RUNNER_RESULT" = skipped
              ;;
            *)
              echo "invalid consumer-runtime classification: $RUNTIME_REQUIRED" >&2
              exit 1
              ;;
          esac
