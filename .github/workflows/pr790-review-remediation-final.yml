name: PR 790 review remediation final

on:
  push:
    branches:
      - perf/site-provider-materialization-phase

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run final PR 790 review remediation'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/site-provider-materialization-phase
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Apply implementation patch and align legacy fixtures
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import base64
          import gzip
          import re
          from pathlib import Path

          # Reuse the previously validated implementation-patch payload from the
          # temporary workflow. Its prior run reached the focused test suite; only
          # three legacy fixtures needed alignment with the stricter source-state guard.
          workflow = Path('.github/workflows/pr790-review-remediation.yml').read_text(encoding='utf-8')
          match = re.search(r"payload = ('[^'\n]+')", workflow)
          assert match, 'embedded remediation payload not found'
          payload = ast.literal_eval(match.group(1))
          exec(gzip.decompress(base64.b64decode(payload)).decode('utf-8'))

          tests = Path('tests/test_materialize_publication_assets.py')
          text = tests.read_text(encoding='utf-8')
          function_start = text.index('    def test_persistent_stamp_invalidated_by_git_head_advance')
          function_end = text.index('\n    def ', function_start + 5)
          block = text[function_start:function_end]
          needle = '            self.write_materializer(root)\n'
          assert block.count(needle) == 1
          block = block.replace(
              needle,
              needle + '            (root / ".gitignore").write_text("materializer-runs.txt\\n", encoding="utf-8")\n',
              1,
          )
          text = text[:function_start] + block + text[function_end:]
          tests.write_text(text, encoding='utf-8')

          followup = Path('tests/test_materialize_publication_assets_review_followup.py')
          text = followup.read_text(encoding='utf-8')
          for name in (
              'test_git_identity_is_rechecked_at_stamp_commit_boundary',
              'test_git_identity_is_rechecked_before_success_returns',
          ):
              function_start = text.index(f'    def {name}')
              try:
                  function_end = text.index('\n    def ', function_start + 5)
              except ValueError:
                  function_end = len(text)
              block = text[function_start:function_end]
              needle = '            with patch.object(\n                materialization,\n                "_provider_git_worktree_fingerprint",\n'
              assert block.count(needle) == 1
              replacement = (
                  '            with patch.object(\n'
                  '                materialization,\n'
                  '                "_provider_git_untracked_paths",\n'
                  '                return_value=(),\n'
                  '            ), patch.object(\n'
                  '                materialization,\n'
                  '                "_provider_git_worktree_fingerprint",\n'
              )
              block = block.replace(needle, replacement, 1)
              text = text[:function_start] + block + text[function_end:]
          followup.write_text(text, encoding='utf-8')
          PY

      - name: Run focused regression suite
        run: >-
          python -m unittest
          tests.test_materialize_publication_assets
          tests.test_materialize_publication_assets_review_followup
          tests.test_assembly_materialization_boundary
          --verbose

      - name: Commit remediation and remove temporary workflows
        shell: bash
        run: |
          rm .github/workflows/pr790-review-remediation.yml
          rm .github/workflows/pr790-review-remediation-final.yml
          git config user.name 'TakashiSasaki'
          git config user.email '556958+TakashiSasaki@users.noreply.github.com'
          git add scripts/materialize_publication_assets.py \
            tests/test_materialize_publication_assets.py \
            tests/test_materialize_publication_assets_review_followup.py \
            .github/workflows/pr790-review-remediation.yml \
            .github/workflows/pr790-review-remediation-final.yml
          git commit -m 'Address latest materialization race findings'
          git push origin HEAD:perf/site-provider-materialization-phase
