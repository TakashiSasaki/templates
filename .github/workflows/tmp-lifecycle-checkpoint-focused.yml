name: Temporary lifecycle checkpoint focused tests

on:
  push:
    branches:
      - agent/lifecycle-checkpoint-authority

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run lifecycle checkpoint tests
        run: python -m unittest tests/test_lifecycle_checkpoints.py
