name: WebMCP S1 product finalizer

on:
  pull_request:
    paths:
      - .github/workflows/webmcp-s1-product-export.yml

permissions:
  actions: read
  contents: write

jobs:
  finalize:
    if: >-
      github.event.pull_request.number == 765 &&
      github.event.pull_request.head.ref == 'webmcp/s1-reader-docs' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pull request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify finalizer provenance boundary
        env:
          EXPECTED_SOURCE_HEAD: 18b221a399373ad7794e416aee7a0b50ad8934ee
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_SOURCE_HEAD" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/webmcp-s1-product-export.yml"

      - name: Download canonical product export
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '10007599880'
        run: |
          set -euo pipefail
          mkdir -p /tmp/webmcp-s1-product-export
          curl --fail-with-body --location \
            --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/webmcp-s1-product-export.zip
          unzip -q /tmp/webmcp-s1-product-export.zip -d /tmp/webmcp-s1-product-export

      - name: Verify canonical artifact byte identities
        run: |
          set -euo pipefail
          cat > /tmp/webmcp-s1-expected.txt <<'EOF'
          artifacts/lifecycle/006-webmcp-reader-publication-product/contracts/browser-identity.json 40ae870f5d8f909ce10ea25c44dbcf0c7fff397c 238
          artifacts/lifecycle/006-webmcp-reader-publication-product/contracts/document-metadata.json 7641fdd55cbaea0201ddeaa979155ca573d2c0c0 39234
          artifacts/lifecycle/006-webmcp-reader-publication-product/contracts/implementation-evidence.json 2b381fb89c1e5343b770c0a76f000ebfa3570433 517925
          artifacts/lifecycle/006-webmcp-reader-publication-product/contracts/manifest.json 1af92e6152d4084248ca9d1a06ad3adf6c10cf65 7581
          artifacts/lifecycle/006-webmcp-reader-publication-product/contracts/pwa-manifest.json 7ef9a5a37abec71c0809af053d8c965ce6ac4c34 1451
          artifacts/lifecycle/006-webmcp-reader-publication-product/contracts/pwa-offline.json ed015b79c24f7f9aae1d2eea9b908dcb7a3e1e5f 18124
          artifacts/lifecycle/006-webmcp-reader-publication-product/contracts/pwa-update.json b12243960b8ddd12dbb9c10b2155d0e11462415a 204
          artifacts/lifecycle/006-webmcp-reader-publication-product/contracts/routes.json 1c2e4fd1bc8f0848097a1ef64ff2a71a065b9eb8 32130
          artifacts/lifecycle/006-webmcp-reader-publication-product/contracts/site-discovery.json b41bb590a9dc6f3eb51251724e408fc175d5416c 4803
          artifacts/lifecycle/006-webmcp-reader-publication-product/contracts/site-structure.json 5c2102f7cb96606fb71dd3e5b408343170c64947 28560
          artifacts/lifecycle/006-webmcp-reader-publication-product/contracts/viewports.json f940e9e76a8907f5d84fdb325e15b862fd657a8a 485
          artifacts/lifecycle/006-webmcp-reader-publication-product/manifest.json 311a3d90e0a27f49fbbc6bd44313496acff6e603 5633
          artifacts/lifecycle/006-webmcp-reader-publication-product/schemas/browser-identity.schema.json b07cf72a093417dc74ee61bac5e103fb1e12549f 1418
          artifacts/lifecycle/006-webmcp-reader-publication-product/schemas/document-metadata.schema.json 23f17754c1d0421953580c35f6c4edf741fab9d5 1486
          artifacts/lifecycle/006-webmcp-reader-publication-product/schemas/implementation-evidence.schema.json b625b8dd455fd6f7f82583797955171e35a6588a 7863
          artifacts/lifecycle/006-webmcp-reader-publication-product/schemas/lifecycle-checkpoints.schema.json a84b8e5004d05e96f91c1930f66bccb2d1489a60 1832
          artifacts/lifecycle/006-webmcp-reader-publication-product/schemas/pwa-manifest.schema.json 41791ed933e9b38146d2e1a85a8d8d8014d313af 4792
          artifacts/lifecycle/006-webmcp-reader-publication-product/schemas/pwa-offline.schema.json c5661ef6e2de2e9b863a098609e8fe4c162c4edf 3591
          artifacts/lifecycle/006-webmcp-reader-publication-product/schemas/pwa-update.schema.json bb6ba96dafe43ee595db12c2994b0466e7a0dfe9 1989
          artifacts/lifecycle/006-webmcp-reader-publication-product/schemas/routes.schema.json 93ba5cc30de6805848752e89652331072802ac24 2204
          artifacts/lifecycle/006-webmcp-reader-publication-product/schemas/site-discovery.schema.json c4d57e89297088c7a49c000d920ec7b802cde6ea 1743
          artifacts/lifecycle/006-webmcp-reader-publication-product/schemas/site-structure.schema.json 91d32836622998b4de68f0b5d44865c8c5b5e0ca 1233
          artifacts/lifecycle/006-webmcp-reader-publication-product/schemas/viewports.schema.json 7b440afe0ac9482c59cf80bd36bf97f511855ee6 1440
          artifacts/lifecycle/006-webmcp-reader-publication-product/validation.json cad74089272fc27413bf5d7714bd5cd3d233adca 57406
          assets/reference-consumer.json 1708e1dc123672671650c5e7949ebe5e3c708eb5 19891
          contracts/implementation-evidence.json 2b381fb89c1e5343b770c0a76f000ebfa3570433 517925
          contracts/lifecycle-checkpoints.json cde29f293695b3d499ee2ac33fa72209d79e8ec4 2545
          docs/policy-composition-coexistence.md cd474329b511ab80c0080a0605522cc7840a3e43 16519
          translations/ja/docs/policy-composition-coexistence.md 1b1011579b01b29572585d39003b1f6e9bbaa3d2 18791
          EOF

          test "$(find /tmp/webmcp-s1-product-export -type f | wc -l)" -eq 29
          while read -r path expected_sha expected_size; do
            file="/tmp/webmcp-s1-product-export/$path"
            test -f "$file"
            test "$(stat -c%s "$file")" = "$expected_size"
            actual_sha="$(git hash-object "$file")"
            test "$actual_sha" = "$expected_sha" || {
              echo "blob mismatch: $path expected=$expected_sha actual=$actual_sha" >&2
              exit 1
            }
          done < /tmp/webmcp-s1-expected.txt

      - name: Install Site renderer dependency
        run: python -m pip install PyYAML==6.0.3

      - name: Apply and validate canonical product state
        run: |
          set -euo pipefail
          cp -a /tmp/webmcp-s1-product-export/. .

          checkpoint_root='artifacts/lifecycle/006-webmcp-reader-publication-product'
          test "$(sha256sum .template-composition/lock.json | cut -d' ' -f1)" = '3859023e77c765c9a40e065dbd01aa6fcfaaae7c6e139416c9e1fda0dbd3b964'
          test "$(sha256sum .template-composition/validation-registry.json | cut -d' ' -f1)" = '96b6aeee60a25a9cde7a11646068491e0519249f41ae28b5b71c0e14c85541bb'
          mkdir -p "$checkpoint_root/.template-composition"
          cp .template-composition/lock.json "$checkpoint_root/.template-composition/lock.json"
          cp .template-composition/validation-registry.json "$checkpoint_root/.template-composition/validation-registry.json"
          test "$(git hash-object "$checkpoint_root/.template-composition/lock.json")" = '4d7b91efc73df0b108688135f7085746ded35e6d'
          test "$(git hash-object "$checkpoint_root/.template-composition/validation-registry.json")" = '9a8d97bf177d4ecf62215f76095548e5e20feba3'

          while read -r path expected_sha expected_size; do
            actual_sha="$(git hash-object "$path")"
            test "$actual_sha" = "$expected_sha" || {
              echo "working-tree blob mismatch: $path expected=$expected_sha actual=$actual_sha" >&2
              exit 1
            }
          done < /tmp/webmcp-s1-expected.txt

          python .template-composition/validate.py . --format json
          python scripts/render_reference_consumer.py

      - name: Reject unexpected working-tree changes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          expected = {
              line.split()[0]
              for line in Path('/tmp/webmcp-s1-expected.txt').read_text().splitlines()
              if line.strip()
          }
          expected.update({
              'artifacts/lifecycle/006-webmcp-reader-publication-product/.template-composition/lock.json',
              'artifacts/lifecycle/006-webmcp-reader-publication-product/.template-composition/validation-registry.json',
          })
          raw = subprocess.check_output(['git', 'status', '--porcelain=v1', '-z'])
          entries = [entry for entry in raw.decode().split('\0') if entry]
          changed = set()
          for entry in entries:
              path = entry[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              changed.add(path)
          unexpected = sorted(changed - expected)
          if unexpected:
              raise SystemExit(f'unexpected working-tree changes: {unexpected}')
          if not changed:
              raise SystemExit('canonical product state produced no repository changes')
          print(f'validated {len(changed)} canonical changed paths')
          PY

      - name: Commit canonical S1 product checkpoint
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          while read -r path _ _; do
            git add -- "$path"
          done < /tmp/webmcp-s1-expected.txt
          git add -- artifacts/lifecycle/006-webmcp-reader-publication-product/.template-composition/lock.json
          git add -- artifacts/lifecycle/006-webmcp-reader-publication-product/.template-composition/validation-registry.json
          git diff --cached --check
          git commit -m 'Finalize WebMCP S1 product checkpoint'
          git push origin "HEAD:${PR_BRANCH}"
