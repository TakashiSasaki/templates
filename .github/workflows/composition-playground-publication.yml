name: Composition Playground publication

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: composition-playground-publication-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    name: materialize deterministic binary once
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/composition-playground-v1-publication
          fetch-depth: 0
          persist-credentials: true
      - name: Generate and verify canonical gzip
        run: |
          python tools/package_composition_playground.py \
            --output generated/composition-playground-v1.json.gz \
            --source-revision 6c1ee765795ff44add2ab284e9e82977d91ef40c
          printf '%s  %s\n' \
            ec92e567b287d3900f6129b4c58407eda4c3fdb66f5e9dcc1ab8c1ee2f1ccdf2 \
            generated/composition-playground-v1.json.gz | sha256sum --check --strict
      - name: Commit corrected binary transport
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated/composition-playground-v1.json.gz
          git diff --cached --quiet && exit 1
          git commit -m 'Fix Playground publication binary transport'
          git push origin HEAD:codex/composition-playground-v1-publication
