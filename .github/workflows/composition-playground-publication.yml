name: Composition Playground publication

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: composition-playground-publication-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publication:
    name: deterministic published asset
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Create isolated validation environment
        run: python -I -m venv --clear .venv

      - name: Install locked validation dependencies
        run: .venv/bin/python -m pip install --isolated --disable-pip-version-check --no-deps --requirement requirements-dev.lock

      - name: Verify dependency graph
        run: .venv/bin/python -m pip check

      - name: Run publication regression tests
        run: .venv/bin/python -I tests/test_composition_playground_publication.py

      - name: Verify committed publication bytes are current
        run: .venv/bin/python scripts/generate_composition_playground_publication.py --check generated/composition-playground-v1.json.gz

      - name: Verify exact-head checkout and bounded transport size
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(wc -c < generated/composition-playground-v1.json.gz)" -lt 131072
          .venv/bin/python - <<'PY'
          import gzip, json, pathlib
          path = pathlib.Path("generated/composition-playground-v1.json.gz")
          projection = json.loads(gzip.decompress(path.read_bytes()))
          source = projection["source"]["revision"]
          assert len(source) == 40 and all(c in "0123456789abcdef" for c in source)
          catalog = json.loads(pathlib.Path("docs/publication-catalog.json").read_text())
          assert {
              "source": "generated/composition-playground-v1.json.gz",
              "destination": "playground/composition-playground-v1.json.gz",
              "optional": False,
          } in catalog["assets"]
          PY
