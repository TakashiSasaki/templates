name: Check integrated site compatibility

on:
  pull_request:
    branches:
      - policy
    paths:
      - docs/**
      - .github/workflows/site-compatibility.yml
      - tests/test_site_compatibility_workflow.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: policy-site-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    if: github.repository == 'TakashiSasaki/templates'
    uses: TakashiSasaki/templates/.github/workflows/build-pages.yml@3ae5d1e60c65e7a8ebf5f9af0436044484e42983
    with:
      site_ref: 3ae5d1e60c65e7a8ebf5f9af0436044484e42983
      policy_ref: ${{ github.sha }}
    # The reusable workflow and Site source are pinned to the reviewed
    # PR #313 Site merge commit. That revision includes the current
    # composition + policy provider lock and the Site-owned canonical
    # schema-v3 publication protocol established by PR #313. Composition is
    # resolved from that Site revision's reviewed publication-sources lock.
    # For pull requests, github.sha is GitHub's proposed merge commit; for
    # workflow_dispatch it is the selected ref's exact commit. The called
    # workflow is build-only and cannot deploy Pages.
    permissions:
      contents: read
