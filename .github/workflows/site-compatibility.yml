name: Check integrated site compatibility

on:
  pull_request:
    branches:
      - policy
    paths:
      - docs/**
      - .github/workflows/pages.yml
      - .github/workflows/site-compatibility.yml
      - tests/test_publication_protocol_consumption.py
      - tests/test_site_compatibility_workflow.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: policy-site-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    if: github.repository == 'TakashiSasaki/templates'
    uses: TakashiSasaki/templates/.github/workflows/build-pages.yml@76db390476b2b6fd2fb49c90fd4b9fbcf0c65f94
    with:
      site_ref: 76db390476b2b6fd2fb49c90fd4b9fbcf0c65f94
      policy_ref: ${{ github.sha }}
      publication_staging_id: policy-concepts
    # The reusable workflow and Site source are pinned to the reviewed
    # PR #643 Site merge commit. That revision retains the Site-owned
    # policy-concepts staging mapping and runs pristine Site tests before
    # explicit staged materialization and strict assembly. Composition is
    # resolved from that exact Site revision's reviewed publication-sources lock.
    # For pull requests, github.sha is GitHub's proposed merge commit; for
    # workflow_dispatch it is the selected ref's exact commit. The called
    # workflow is build-only, explicitly selects the policy-concepts staging ID,
    # and cannot deploy Pages.
    permissions:
      contents: read
