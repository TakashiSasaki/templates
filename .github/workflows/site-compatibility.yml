name: Check integrated site compatibility

on:
  pull_request:
    branches:
      - webapp
    paths:
      - docs/**
      - template/**
      - distribution-manifest.json
      - tests/test_workflow_configuration.py
      - .github/workflows/site-compatibility.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webapp-site-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    if: github.repository == 'TakashiSasaki/templates'
    uses: TakashiSasaki/templates/.github/workflows/build-pages.yml@e95959f5a47b071fb1178565893ea0d572f4ff97
    with:
      site_ref: e95959f5a47b071fb1178565893ea0d572f4ff97
      webapp_ref: ${{ github.sha }}
    # The reusable workflow and Site source are pinned to the reviewed
    # schema-v3-only Site merge commit. For pull requests, github.sha is
    # GitHub's proposed merge commit; for workflow_dispatch it is the selected
    # ref's exact commit. The called workflow is build-only and cannot deploy Pages.
    permissions:
      contents: read
