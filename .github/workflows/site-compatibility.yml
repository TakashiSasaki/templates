name: Check integrated site compatibility

on:
  pull_request:
    branches:
      - policy
      - "policy-*"
    paths:
      - docs/**
      - .github/workflows/pages.yml
      - .github/workflows/site-compatibility.yml
      - tests/test_publication_protocol_consumption.py
      - tests/test_site_compatibility_workflow.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: policy-site-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    if: github.repository == 'TakashiSasaki/templates'
    strategy:
      fail-fast: false
      matrix:
        staging_id:
          - contributing
          - maintainer-workflow
          - adr-review-authority-and-github-runtime-boundary
          - adr-review-result-representation-boundary
    uses: TakashiSasaki/templates/.github/workflows/build-pages.yml@f79eaa9e90197da0bb0c7eefaa039f265ad4b347
    with:
      site_ref: f79eaa9e90197da0bb0c7eefaa039f265ad4b347
      policy_ref: ${{ github.sha }}
      publication_staging_id: ${{ matrix.staging_id }}
    # The reusable workflow and Site source are pinned to the reviewed
    # PR #848 Site merge commit. That revision retains the Site-owned
    # maintainer documentation staging mappings and runs pristine Site tests before
    # explicit staged materialization and strict assembly. Composition is
    # resolved from that exact Site revision's reviewed publication-sources lock.
    # For pull requests, github.sha is GitHub's proposed merge commit; for
    # workflow_dispatch it is the selected ref's exact commit. The called
    # workflow is build-only, dynamically selects the staging mapping from matrix,
    # and cannot deploy Pages. actions:read is required because the pinned reusable
    # workflow can discover and reuse an exact-input build artifact.
    permissions:
      contents: read
      actions: read
