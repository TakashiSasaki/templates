name: Normalize policy publication metadata

on:
  push:
    branches:
      - agent/site-remove-legacy-policy-publication
    paths:
      - .github/workflows/normalize-policy-publication.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out operation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/site-remove-legacy-policy-publication

      - name: Update locked policy revision and navigation
        env:
          EXPECTED_OLD_POLICY: 8724b429ec062ac21e0ade86b46e69378cc69c87
          NEW_POLICY: 2b37ee53c234a6a945caaa4269656eecba5e4ba7
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          sources_path = Path("publication-sources.json")
          sources = json.loads(sources_path.read_text(encoding="utf-8"))
          current = sources["publications"]["policy"]["revision"]
          expected = os.environ["EXPECTED_OLD_POLICY"]
          new = os.environ["NEW_POLICY"]
          if current != expected:
              raise SystemExit(f"unexpected policy revision: {current}")
          sources["publications"]["policy"]["revision"] = new
          sources_path.write_text(
              json.dumps(sources, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          manifest_path = Path("site-manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          removed = 0

          def filter_nodes(nodes):
              global removed
              result = []
              for node in nodes:
                  children = node.get("children")
                  if children is not None:
                      node = dict(node)
                      node["children"] = filter_nodes(children)
                  if (
                      node.get("publication") == "policy"
                      and node.get("document") == "adr-bootstrap-history"
                  ):
                      removed += 1
                      continue
                  result.append(node)
              return result

          manifest["navigation"] = filter_nodes(manifest["navigation"])
          if removed != 1:
              raise SystemExit(f"expected one obsolete policy navigation node, removed {removed}")
          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit bounded metadata update
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = "publication-sources.json
          site-manifest.json"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add publication-sources.json site-manifest.json
          git commit -m "Repin policy publication after history cleanup"
          git push origin HEAD:agent/site-remove-legacy-policy-publication
