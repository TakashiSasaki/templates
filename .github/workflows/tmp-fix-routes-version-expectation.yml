name: Temporary fix routes version expectation
on:
  push:
    branches:
      - agent/planning-proof-strength-pr21
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix stale current Webapp component expectation and audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_routes_v3_access_failures.py')
          text = path.read_text(encoding='utf-8')
          old = 'self.assertEqual(component["version"], 11)'
          new = 'self.assertEqual(component["version"], 12)'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one stale routes component version assertion; found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          echo 'Remaining explicit current Webapp version 11 assertions:'
          grep -RFn 'self.assertEqual(component["version"], 11)' tests || true
      - name: Run affected regression
        shell: bash
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest tests.test_routes_v3_access_failures
      - name: Commit fix and self-delete
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/tmp-fix-routes-version-expectation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Refresh routes v3 component version expectation"
            git push
          fi
