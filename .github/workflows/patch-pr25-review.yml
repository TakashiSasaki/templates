name: Apply PR 25 review fixes

on:
  push:
    branches:
      - site-generated-link-validation

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply URL canonicalization review fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: site-generated-link-validation
      - name: Apply focused fixes and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          script_path = Path('scripts/validate_site_links.py')
          text = script_path.read_text(encoding='utf-8')
          text = text.replace(
              'import argparse\nimport re\nimport sys\nimport tomllib\n',
              'import argparse\nimport ipaddress\nimport re\nimport sys\nimport tomllib\nimport unicodedata\n',
          )
          old_origin = '''    try:\n        canonical_hostname = unquote(hostname).encode("idna").decode("ascii").lower()\n    except UnicodeError as exc:\n        raise SiteLinkError(f"{description} contains an invalid hostname") from exc\n    canonical_hostname = _canonical_ipv4(canonical_hostname) or canonical_hostname\n'''
          new_origin = '''    try:\n        decoded_hostname = unquote(hostname)\n        normalized_hostname = unicodedata.normalize("NFKC", decoded_hostname).lower()\n        normalized_hostname = normalized_hostname.translate(\n            str.maketrans({"\\u3002": ".", "\\uff0e": ".", "\\uff61": "."})\n        )\n        labels = normalized_hostname.split(".")\n        canonical_labels = [\n            label\n            if label.isascii()\n            else "xn--" + label.encode("punycode").decode("ascii")\n            for label in labels\n        ]\n        canonical_hostname = ".".join(canonical_labels)\n    except (UnicodeError, ValueError) as exc:\n        raise SiteLinkError(f"{description} contains an invalid hostname") from exc\n    try:\n        if ":" in canonical_hostname:\n            canonical_hostname = ipaddress.IPv6Address(canonical_hostname).compressed\n        else:\n            canonical_hostname = _canonical_ipv4(canonical_hostname) or canonical_hostname\n    except ipaddress.AddressValueError as exc:\n        raise SiteLinkError(f"{description} contains an invalid hostname") from exc\n'''
          if old_origin not in text:
              raise SystemExit('normalized_origin block not found')
          text = text.replace(old_origin, new_origin)
          old_constants = '_ASCII_URL_WHITESPACE = " \\t\\r\\n\\f"\n\n\ndef normalize_special_url_backslashes'
          new_constants = '''_ASCII_URL_WHITESPACE = " \\t\\r\\n\\f"\n_EMBEDDED_ASCII_URL_WHITESPACE = str.maketrans("", "", "\\t\\r\\n")\n\n\ndef preprocess_url_input(raw_url: str) -> str:\n    """Apply browser URL whitespace preprocessing without removing Unicode space."""\n    return raw_url.strip(_ASCII_URL_WHITESPACE).translate(\n        _EMBEDDED_ASCII_URL_WHITESPACE\n    )\n\n\ndef normalize_special_url_backslashes'''
          if old_constants not in text:
              raise SystemExit('URL whitespace constants block not found')
          text = text.replace(old_constants, new_constants)
          old_raw = '            raw = reference.href.strip(_ASCII_URL_WHITESPACE)\n'
          new_raw = '            raw = preprocess_url_input(reference.href)\n'
          if old_raw not in text:
              raise SystemExit('href preprocessing line not found')
          text = text.replace(old_raw, new_raw)
          script_path.write_text(text, encoding='utf-8')

          tests_path = Path('tests/test_site_links.py')
          tests = tests_path.read_text(encoding='utf-8')
          marker = '''    def test_treats_explicit_zero_port_as_a_distinct_origin(self) -> None:\n'''
          additions = '''    def test_removes_embedded_ascii_whitespace_before_url_parsing(self) -> None:\n        self.write(\n            "index.html",\n            '<a href="https://exa\\nmple.test/docs/absent/">Absent</a>',\n        )\n        result = self.run_validator()\n        self.assertEqual(result.returncode, 1)\n        self.assertIn("has no generated target", result.stderr)\n\n    def test_rejects_expanded_ipv6_same_origin_hostname_when_missing(self) -> None:\n        self.config_file.write_text(\n            '[project]\\nsite_url = "https://[::1]/docs/"\\n',\n            encoding="utf-8",\n        )\n        self.write(\n            "index.html",\n            '<a href="https://[0:0:0:0:0:0:0:1]/docs/absent/">Absent</a>',\n        )\n        result = self.run_validator()\n        self.assertEqual(result.returncode, 1)\n        self.assertIn("has no generated target", result.stderr)\n\n    def test_uses_nontransitional_idna_for_same_origin_hostname(self) -> None:\n        self.config_file.write_text(\n            '[project]\\nsite_url = "https://xn--fa-hia.de/docs/"\\n',\n            encoding="utf-8",\n        )\n        self.write(\n            "index.html",\n            '<a href="https://faß.de/docs/absent/">Absent</a>',\n        )\n        result = self.run_validator()\n        self.assertEqual(result.returncode, 1)\n        self.assertIn("has no generated target", result.stderr)\n\n'''
          if marker not in tests:
              raise SystemExit('test insertion marker not found')
          tests = tests.replace(marker, additions + marker)
          tests_path.write_text(tests, encoding='utf-8')
          PY
          python -m unittest discover --start-directory tests --verbose
      - name: Commit focused fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/validate_site_links.py tests/test_site_links.py
          git commit -m 'Apply URL canonicalization review fixes'
          git push origin HEAD:site-generated-link-validation
