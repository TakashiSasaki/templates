name: Temporary Composition runtime doctor audit

on:
  push:
    branches:
      - agent/composition-runtime-doctor

permissions:
  contents: read

jobs:
  focused-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-deps -r requirements-dev.lock
      - name: Run runtime doctor and runner regressions
        run: >-
          python -m unittest
          tests.test_composition_runtime_doctor
          tests.test_composition_skill_cli
          tests.test_composition_skill_runner
          tests.test_composition_skill_provenance
          tests.test_composition_runtime_cache_ux
          tests.test_composition_skill_installer_publication

  installed-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Exercise installed skill doctor and cache lifecycle
        run: python scripts/smoke_test_skill_runner.py
