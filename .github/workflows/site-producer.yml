name: Site canonical producer
on:
  workflow_call:
    inputs:
      core_tests_scheduled:
        description: Caller schedules independent core tests and gates their result
        type: boolean
        default: false
      reuse_pr_build:
        description: Reuse the canonical exact-input PR artifact when provider/configuration inputs match
        required: false
        type: boolean
        default: false
      site_ref:
        description: Exact Site implementation commit
        required: false
        type: string
        default: ''
      deployment_timestamp:
        description: JST deployment timestamp rendered in the footer; empty for non-deploying builds
        required: false
        type: string
        default: ''
      artifact_name:
        type: string
        default: github-pages
      trusted_release_required:
        description: Require the exact Integration promoted Bundle and trusted receipt
        type: boolean
        default: false
    outputs:
      artifact_id:
        value: ${{ jobs.build.outputs.artifact_id }}
      artifact_digest:
        value: ${{ jobs.build.outputs.artifact_digest }}
      build_inputs:
        value: ${{ jobs.build.outputs.build_inputs }}
      bundle_receipt:
        value: ${{ jobs.build.outputs.bundle_receipt }}
      compatibility_classification:
        value: ${{ jobs.build.outputs.compatibility_classification }}
permissions:
  contents: read
  actions: read
env:
  PUBLIC_SITE_URL: https://templates.moukaeritai.work/
jobs:
  selection:
    runs-on: ubuntu-24.04
    outputs:
      available: ${{ steps.select.outputs.available }}
      integration_revision: ${{ steps.select.outputs.integration_revision }}
      receipt: ${{ steps.select.outputs.receipt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.site_ref }}
          persist-credentials: false
      - name: Resolve exact reviewed Integration artifact
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRE_TRUSTED_RELEASE: ${{ inputs.trusted_release_required }}
          EXPECTED_POLICY_REVISION: ${{ vars.PUBLICATION_POLICY_REVISION || '' }}
          EXPECTED_CONTROLLER_REVISION: ${{ vars.PUBLICATION_CONTROLLER_REVISION || '' }}
        run: |
          args=(locate --receipt receipt.json --github-output "$GITHUB_OUTPUT")
          if [ "$REQUIRE_TRUSTED_RELEASE" = true ]; then
            args+=(--require-trusted-release)
            if [ -n "$EXPECTED_POLICY_REVISION" ]; then args+=(--expected-policy-revision "$EXPECTED_POLICY_REVISION"); fi
            if [ -n "$EXPECTED_CONTROLLER_REVISION" ]; then args+=(--expected-controller-revision "$EXPECTED_CONTROLLER_REVISION"); fi
          fi
          python3 scripts/acquire_integration_bundle.py "${args[@]}"
  regenerate:
    needs: selection
    if: ${{ needs.selection.outputs.available == 'false' && inputs.trusted_release_required != true }}
    uses: TakashiSasaki/templates/.github/workflows/integration-qualification.yml@a92006b95ef67abaa52d59e7a583c1f59656e7a7
    with:
      producer_ref: ${{ needs.selection.outputs.integration_revision }}
      artifact_namespace: site-adoption
  build:
    needs:
      - selection
      - regenerate
    if: ${{ always() && needs.selection.result == 'success' && (needs.regenerate.result == 'success' || needs.regenerate.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.published.outputs.artifact_id }}
      artifact_digest: ${{ steps.published.outputs.artifact_digest }}
      build_inputs: ${{ steps.published.outputs.build_inputs }}
      bundle_receipt: ${{ steps.bundle.outputs.receipt }}
      compatibility_classification: ${{ steps.compatibility.outputs.classification }}
    steps:
      - name: Check out site implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.site_ref }}
          path: site-source
          persist-credentials: false
      - name: Check out the trusted Site receipt verifier
        if: ${{ inputs.trusted_release_required == true }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted-controller
          sparse-checkout: |
            scripts/acquire_trusted_integration_receipt.py
            scripts/verify_trusted_integration_receipt.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Resolve checked-out Site revision
        id: site_revision
        run: python3 site-source/scripts/resolve_site_checkout.py --root site-source --output "$GITHUB_OUTPUT"
      - name: Install pinned contract and renderer dependencies
        run: |
          python3 -m pip install --no-deps --requirement site-source/requirements-build.lock
          python3 -m pip check
      - name: Validate build entrypoint dependency boundary
        run: python3 site-source/scripts/check_python_dependencies.py site-source --environment build
      - name: Consume exact qualified Publication Bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT: ${{ needs.selection.outputs.receipt }}
          REGENERATED_ARTIFACT: ${{ needs.regenerate.outputs.artifact_id }}
        run: |
          if [ -n "$REGENERATED_ARTIFACT" ]; then
            python3 site-source/scripts/acquire_integration_bundle.py receipt --lock site-source/integration-source.json --receipt receipt.json --artifact-id "$REGENERATED_ARTIFACT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
          else
            python3 -c 'import os; from pathlib import Path; Path("receipt.json").write_text(os.environ["RECEIPT"])'
          fi
          python3 site-source/scripts/acquire_integration_bundle.py consume --lock site-source/integration-source.json --receipt receipt.json --output publication-bundle
          python3 -c 'import json; print("receipt=" + json.dumps(json.load(open("receipt.json")),separators=(",",":")))' >> "$GITHUB_OUTPUT"
        id: bundle
      - name: Re-verify the exact promoted receipt from trusted Site code
        if: ${{ inputs.trusted_release_required == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_POLICY_REVISION: ${{ vars.PUBLICATION_POLICY_REVISION || '' }}
          EXPECTED_CONTROLLER_REVISION: ${{ vars.PUBLICATION_CONTROLLER_REVISION || '' }}
        run: |
          EXPECTED_INTEGRATION_REVISION=$(python3 -c 'import json; print(json.load(open("site-source/integration-source.json"))["revision"])')
          EXPECTED_BUNDLE_IDENTITY=$(python3 -c 'import json; print(json.load(open("site-source/integration-source.json"))["bundle_identity"])')
          EXPECTED_BUNDLE_CONTENT_DIGEST=$(python3 -c 'import json; print(json.load(open("site-source/integration-source.json"))["content_digest"])')
          args=(
            --receipt receipt.json
            --repository "$GITHUB_REPOSITORY"
            --expected-integration-revision "$EXPECTED_INTEGRATION_REVISION"
            --expected-bundle-identity "$EXPECTED_BUNDLE_IDENTITY"
            --expected-bundle-content-digest "$EXPECTED_BUNDLE_CONTENT_DIGEST"
          )
          if [ -n "$EXPECTED_POLICY_REVISION" ]; then args+=(--expected-policy-revision "$EXPECTED_POLICY_REVISION"); fi
          if [ -n "$EXPECTED_CONTROLLER_REVISION" ]; then args+=(--expected-controller-revision "$EXPECTED_CONTROLLER_REVISION"); fi
          python3 trusted-controller/scripts/verify_trusted_integration_receipt.py "${args[@]}"
      - name: Classify selected Bundle against Site support
        id: compatibility
        env:
          TRUSTED_POLICY_REVISION: ${{ vars.PUBLICATION_POLICY_REVISION || '' }}
          TRUSTED_CONTROLLER_REVISION: ${{ vars.PUBLICATION_CONTROLLER_REVISION || '' }}
        run: |
          python3 site-source/scripts/classify_site_compatibility.py \
            --bundle publication-bundle \
            --support site-source/contracts/site-publication-support.json \
            --trusted-policy-revision "$TRUSTED_POLICY_REVISION" \
            --trusted-controller-revision "$TRUSTED_CONTROLLER_REVISION" \
            --site-revision "${{ steps.site_revision.outputs.sha }}" \
            --output site-compatibility-report.json
          classification=$(python3 -c 'import json; print(json.load(open("site-compatibility-report.json"))["classification"])')
          test "$classification" = COMPATIBLE_PENDING_QUALIFICATION
          echo "classification=$classification" >> "$GITHUB_OUTPUT"
          cat site-compatibility-report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Check out executed build workflow definition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow-source
          sparse-checkout: .github/workflows/site-producer.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Resolve exact build inputs and reuse qualified PR artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_BUNDLE_ROOT: publication-bundle
          IS_CANONICAL_BUILD: ${{ inputs.artifact_name == 'github-pages' }}
          REUSE_PR_BUILD: ${{ inputs.reuse_pr_build && github.event.pull_request.head.repo.full_name == github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEPLOYMENT_TIMESTAMP: ${{ inputs.deployment_timestamp }}
          CORE_TESTS_SCHEDULED: ${{ inputs.core_tests_scheduled }}
        run: python3 site-source/scripts/site_build_artifact.py --output "$GITHUB_OUTPUT" --workflow-file workflow-source/.github/workflows/site-producer.yml
      - name: Run Site contract regression tests
        if: ${{ steps.artifact.outputs.reused != 'true' && !inputs.core_tests_scheduled }}
        run: python3 site-source/scripts/run_core_tests.py --suite core
      - name: Render Site from validated Publication Bundle
        if: ${{ steps.artifact.outputs.reused != 'true' }}
        id: site_metadata
        env:
          DEPLOYMENT_TIMESTAMP: ${{ inputs.deployment_timestamp }}
        run: |
          python3 site-source/scripts/render_publication_bundle.py \
            --bundle publication-bundle \
            --bundle-identity "$(python3 -c 'import json; print(json.load(open("site-source/integration-source.json"))["bundle_identity"])')" \
            --site-root site-source \
            --output build \
            --public-url "$PUBLIC_SITE_URL" \
            --deployment-timestamp "$DEPLOYMENT_TIMESTAMP" \
            --github-output "$GITHUB_OUTPUT"
      - name: Verify the Pages entry point and deployment notice
        if: ${{ steps.artifact.outputs.reused != 'true' }}
        run: |
          python3 site-source/scripts/check_audience_artifact.py --site-root build/site --bundle publication-bundle --lock site-source/integration-source.json
          test -f build/site/index.html
          test -f build/site/app.webmanifest
          test -f build/site/service-worker.js
          test -f build/site/glossary/index.json
          test -f build/site/guided/graph.json
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          lock=json.load(open('site-source/integration-source.json'))
          provenance=json.load(open('build/site/build-provenance.json'))
          assert provenance['schema_version']==3
          assert provenance['integration']['producer']['revision']==lock['revision']
          assert provenance['integration']['identity']==lock['bundle_identity']
          assert provenance['integration']['content_digest']==lock['content_digest']
          PYCODE
          python3 site-source/scripts/check_bundle_reader.py --site-root build/site --bundle publication-bundle --lock site-source/integration-source.json
          python3 site-source/scripts/check_site_artifact.py --site-root build/site --bundle publication-bundle --lock site-source/integration-source.json
      - name: Embed exact build input identity
        if: ${{ steps.artifact.outputs.reused != 'true' }}
        run: cp build-inputs.json build/site/ci-build-inputs.json
      - name: Final immutable artifact qualification
        if: ${{ steps.artifact.outputs.reused != 'true' }}
        run: |
          python3 site-source/scripts/check_audience_artifact.py --site-root build/site --bundle publication-bundle --lock site-source/integration-source.json
          python3 site-source/scripts/check_bundle_reader.py --site-root build/site --bundle publication-bundle --lock site-source/integration-source.json
          python3 site-source/scripts/check_site_artifact.py --site-root build/site --bundle publication-bundle --lock site-source/integration-source.json
          test -s build/site/ci-build-inputs.json
          echo 'Final artifact qualification passed; the next step uploads these exact bytes.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: build/site
          name: ${{ inputs.artifact_name }}
        id: upload
      - name: Export immutable scheduled artifact identity
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import json, os, subprocess
          from pathlib import Path
          artifact = json.loads(subprocess.check_output(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{os.environ['ARTIFACT_ID']}"]))
          print('artifact_id=' + str(artifact['id']))
          print('artifact_digest=' + artifact['digest'])
          print('build_inputs=' + json.dumps(json.loads(Path('build-inputs.json').read_text())['inputs'], separators=(',', ':')))
          PYCODE
