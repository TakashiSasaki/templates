name: Finalize Policy Site cutover

on:
  push:
    branches:
      - site-policy-cutover-c5a32948

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Build and commit deterministic Site cutover
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: site-policy-cutover-c5a32948
          EXPECTED_HEAD: ${{ github.sha }}
          OLD_POLICY: 462cd0dbd0802d960f6eb01b8a34c5b0cd6520b7
          NEW_POLICY: c5a3294809a1066bf59b83f467f1d597f885289a
          OLD_INSTALLER: 709df0be6287723bf3f1bb38ae5f64d8b3bde08e
          NEW_INSTALLER: f4457c90854db34c3ce8e1c381f67a4d7d5ea523
          OLD_SKILL: a7b260ccc361ad8cd1bab94803a9b355c640fe7e
          NEW_SKILL: 344aaf0b140e3c066363297012bb866efbc106e4
          WORKFLOW_PATH: .github/workflows/finalize-policy-site-cutover.yml
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ['REPOSITORY']
          branch = os.environ['BRANCH']
          expected = os.environ['EXPECTED_HEAD']
          token = os.environ['GH_TOKEN']
          old_policy = os.environ['OLD_POLICY']
          new_policy = os.environ['NEW_POLICY']
          old_installer = os.environ['OLD_INSTALLER']
          new_installer = os.environ['NEW_INSTALLER']
          old_skill = os.environ['OLD_SKILL']
          new_skill = os.environ['NEW_SKILL']
          workflow_path = os.environ['WORKFLOW_PATH']
          api = f'https://api.github.com/repos/{repo}'

          def request(method, url, payload=None):
              data = None
              headers = {
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
              }
              if payload is not None:
                  data = json.dumps(payload).encode('utf-8')
                  headers['Content-Type'] = 'application/json'
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req) as resp:
                  return json.load(resp)

          ref = request('GET', f'{api}/git/ref/heads/{urllib.parse.quote(branch, safe="/")}')
          actual = ref['object']['sha']
          if actual != expected:
              raise SystemExit(f'branch moved before finalize: expected {expected}, got {actual}')

          commit = request('GET', f'{api}/git/commits/{expected}')
          base_tree = commit['tree']['sha']

          def read_text(path):
              item = request('GET', f'{api}/contents/{urllib.parse.quote(path)}?ref={expected}')
              if item.get('encoding') != 'base64':
                  raise SystemExit(f'unexpected encoding for {path}: {item.get("encoding")}')
              return base64.b64decode(item['content']).decode('utf-8')

          source_lock = read_text('publication-sources.json')
          if source_lock.count(old_policy) != 1:
              raise SystemExit('publication-sources old Policy count mismatch')
          source_lock = source_lock.replace(old_policy, new_policy)

          def transform_agent(text, label):
              counts = {
                  old_policy: 2,
                  old_installer: 2,
                  old_skill: 2,
              }
              for old, count in counts.items():
                  actual_count = text.count(old)
                  if actual_count != count:
                      raise SystemExit(f'{label}: expected {count} occurrences of {old}, got {actual_count}')
              text = text.replace(old_policy, new_policy)
              text = text.replace(old_installer, new_installer)
              text = text.replace(old_skill, new_skill)
              value = json.loads(text)
              if value['authorities']['policy']['publication_revision'] != new_policy:
                  raise SystemExit(f'{label}: authority publication revision mismatch')
              if value['policy']['publication_revision'] != new_policy:
                  raise SystemExit(f'{label}: Policy publication revision mismatch')
              if value['policy']['installer']['revision'] != new_installer:
                  raise SystemExit(f'{label}: installer revision mismatch')
              if value['policy']['skill']['revision'] != new_skill:
                  raise SystemExit(f'{label}: Skill revision mismatch')
              return text

          agent = transform_agent(read_text('agent.json'), 'agent.json')
          asset_agent = transform_agent(read_text('assets/agent.json'), 'assets/agent.json')
          if agent.encode('utf-8') != asset_agent.encode('utf-8'):
              raise SystemExit('agent projections are not byte-identical')

          test = read_text('tests/test_policy_concepts_promotion.py')
          if test.count(old_policy) != 1:
              raise SystemExit('promotion regression old Policy count mismatch')
          test = test.replace(old_policy, new_policy)

          outputs = {
              'publication-sources.json': source_lock,
              'agent.json': agent,
              'assets/agent.json': asset_agent,
              'tests/test_policy_concepts_promotion.py': test,
          }

          entries = []
          for path, text in outputs.items():
              blob = request('POST', f'{api}/git/blobs', {
                  'content': base64.b64encode(text.encode('utf-8')).decode('ascii'),
                  'encoding': 'base64',
              })
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          entries.append({'path': workflow_path, 'mode': '100644', 'type': 'blob', 'sha': None})

          tree = request('POST', f'{api}/git/trees', {
              'base_tree': base_tree,
              'tree': entries,
          })
          final = request('POST', f'{api}/git/commits', {
              'message': 'Publish corrected Policy release through Site',
              'tree': tree['sha'],
              'parents': [expected],
          })

          ref = request('GET', f'{api}/git/ref/heads/{urllib.parse.quote(branch, safe="/")}')
          actual = ref['object']['sha']
          if actual != expected:
              raise SystemExit(f'branch moved before ref update: expected {expected}, got {actual}')
          request('PATCH', f'{api}/git/refs/heads/{urllib.parse.quote(branch, safe="/")}', {
              'sha': final['sha'],
              'force': False,
          })
          print(f'Final Site cutover commit: {final["sha"]}')
          PY
