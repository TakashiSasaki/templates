name: Refresh publication
# GitHub runs schedules only on the default branch. This adapter owns no
# Integration code, provider tuple, Site build or publication approval state.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication:
    uses: TakashiSasaki/templates/.github/workflows/integration-publish.yml@integration
