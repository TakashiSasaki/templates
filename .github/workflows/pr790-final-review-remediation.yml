name: PR 790 final review remediation

on:
  push:
    branches:
      - perf/site-provider-materialization-phase

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v7
        with:
          ref: perf/site-provider-materialization-phase
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Apply review remediation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/materialize_publication_assets.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, got {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '''    excluded_roots: tuple[PurePosixPath, ...] = (),\n    untracked_paths: tuple[bytes, ...] | None = None,\n) -> str:\n''',
              '''    excluded_roots: tuple[PurePosixPath, ...] = (),\n    untracked_paths: tuple[bytes, ...] | None = None,\n    tracked_excluded_roots: tuple[PurePosixPath, ...] | None = None,\n) -> str:\n''',
          )

          anchor = 'def _provider_git_worktree_fingerprint('
          start = text.index(anchor)
          idx = text.index('        diff_proc = subprocess.run(', start)
          text = text[:idx] + '''        tracked_roots = (\n            excluded_roots if tracked_excluded_roots is None else tracked_excluded_roots\n        )\n''' + text[idx:]
          start = text.index(anchor)
          idx = text.index('*_provider_worktree_pathspecs(excluded_roots),', start)
          text = text[:idx] + '*_provider_worktree_pathspecs(tracked_roots),' + text[idx + len('*_provider_worktree_pathspecs(excluded_roots),'):]

          replace_once(
              '''def _provider_semantic_revision(root: Path) -> str:\n    manifest_path = root / "generated" / "composition-playground-publication.json"\n    if manifest_path.is_file() and not manifest_path.is_symlink():\n        try:\n            data = json.loads(manifest_path.read_text(encoding="utf-8"))\n            if isinstance(data, dict) and isinstance(data.get("semantic_revision"), str):\n                return data["semantic_revision"]\n        except Exception:\n            pass\n    return ""\n\n\ndef _materializer_output_roots(\n''',
              '''def _provider_semantic_revision(root: Path) -> str:\n    manifest_path = root / "generated" / "composition-playground-publication.json"\n    if manifest_path.is_file() and not manifest_path.is_symlink():\n        try:\n            data = json.loads(manifest_path.read_text(encoding="utf-8"))\n            if isinstance(data, dict) and isinstance(data.get("semantic_revision"), str):\n                return data["semantic_revision"]\n        except Exception:\n            pass\n    return ""\n\n\ndef _assert_semantic_revision(\n    root: Path,\n    expected: str,\n    label: str,\n    *,\n    boundary: str,\n) -> None:\n    current = _provider_semantic_revision(root)\n    if current != expected:\n        raise PublicationMaterializationError(\n            f"{label}: provider semantic revision changed {boundary} "\n            f"({expected!r} → {current!r}); retry after obtaining stable provider metadata"\n        )\n\n\ndef _materializer_output_roots(\n''',
          )

          replace_once(
              '''def _materializer_output_roots(\n    root: Path,\n    version: int,\n    source_catalog: Any | None,\n) -> tuple[PurePosixPath, ...]:\n''',
              '''def _materializer_output_roots(\n    root: Path,\n    version: int,\n    source_catalog: Any | None,\n    *,\n    for_tracked: bool = False,\n) -> tuple[PurePosixPath, ...]:\n''',
          )
          replace_once(
              '''            candidate = parsed.parent if parsed.parent != PurePosixPath('.') else parsed\n''',
              '''            candidate = (\n                parsed\n                if for_tracked\n                else (parsed.parent if parsed.parent != PurePosixPath('.') else parsed)\n            )\n''',
          )
          replace_once(
              '''    generated_root = PurePosixPath("generated")\n    if generated_root not in roots:\n        roots.append(generated_root)\n    return tuple(roots)\n''',
              '''    if not for_tracked:\n        generated_root = PurePosixPath("generated")\n        if generated_root not in roots:\n            roots.append(generated_root)\n    return tuple(roots)\n''',
          )

          replace_once(
              '''    pre_run_untracked_paths: tuple[bytes, ...],\n    output_roots: tuple[PurePosixPath, ...],\n    label: str,\n''',
              '''    pre_run_untracked_paths: tuple[bytes, ...],\n    output_roots: tuple[PurePosixPath, ...],\n    tracked_output_roots: tuple[PurePosixPath, ...],\n    label: str,\n''',
          )
          replace_once(
              '''            excluded_roots=output_roots,\n            untracked_paths=current_untracked_paths,\n        )\n        if current != expected_worktree_fingerprint:\n''',
              '''            excluded_roots=output_roots,\n            untracked_paths=current_untracked_paths,\n            tracked_excluded_roots=tracked_output_roots,\n        )\n        if current != expected_worktree_fingerprint:\n''',
          )

          replace_once(
              '''    input_untracked_paths: tuple[bytes, ...] = (),\n    output_roots: tuple[PurePosixPath, ...] = (),\n) -> tuple[str, dict[str, str]]:\n''',
              '''    input_untracked_paths: tuple[bytes, ...] = (),\n    output_roots: tuple[PurePosixPath, ...] = (),\n    tracked_output_roots: tuple[PurePosixPath, ...] = (),\n) -> tuple[str, dict[str, str], str]:\n''',
          )

          old_call = '''        input_untracked_paths,\n        output_roots,\n        label,\n        boundary='''
          new_call = '''        input_untracked_paths,\n        output_roots,\n        tracked_output_roots,\n        label,\n        boundary='''
          count = text.count(old_call)
          if count != 5:
              raise SystemExit(f'expected five input-state call sites, got {count}')
          text = text.replace(old_call, new_call)

          replace_once(
              '''    _assert_materialization_fingerprint(\n        root,\n        fingerprint,\n        label,\n        boundary="after output snapshot before materialization stamp commit",\n    )\n    _atomic_write_json(root / STAMP_FILE, stamp_data)\n    return git_worktree_fingerprint, generated_digests\n''',
              '''    _assert_materialization_fingerprint(\n        root,\n        fingerprint,\n        label,\n        boundary="after output snapshot before materialization stamp commit",\n    )\n    _assert_semantic_revision(\n        root,\n        semantic_rev,\n        label,\n        boundary="after output snapshot before materialization stamp commit",\n    )\n    _atomic_write_json(root / STAMP_FILE, stamp_data)\n    return git_worktree_fingerprint, generated_digests, semantic_rev\n''',
          )

          replace_once(
              '''        semantic_rev = _provider_semantic_revision(root)\n        if semantic_rev and data.get("semantic_revision") != semantic_rev:\n            return None\n''',
              '''        semantic_rev = _provider_semantic_revision(root)\n        if data.get("semantic_revision") != semantic_rev:\n            return None\n''',
          )
          replace_once(
              '''        _assert_materialization_fingerprint(\n            root,\n            fingerprint,\n            label,\n            boundary="after output snapshot while accepting materialization stamp",\n        )\n        return catalog\n''',
              '''        _assert_materialization_fingerprint(\n            root,\n            fingerprint,\n            label,\n            boundary="after output snapshot while accepting materialization stamp",\n        )\n        _assert_semantic_revision(\n            root,\n            semantic_rev,\n            label,\n            boundary="after output snapshot while accepting materialization stamp",\n        )\n        return catalog\n''',
          )

          replace_once(
              '''    output_roots = _materializer_output_roots(\n        root,\n        version,\n        catalog if version == 4 else None,\n    )\n    pre_run_untracked_paths = _provider_git_untracked_paths(\n''',
              '''    output_roots = _materializer_output_roots(\n        root,\n        version,\n        catalog if version == 4 else None,\n    )\n    tracked_output_roots = _materializer_output_roots(\n        root,\n        version,\n        catalog if version == 4 else None,\n        for_tracked=True,\n    )\n    pre_run_untracked_paths = _provider_git_untracked_paths(\n''',
          )
          replace_once(
              '''        excluded_roots=output_roots,\n        untracked_paths=pre_run_untracked_paths,\n    )\n    run_fingerprint = _materialization_fingerprint(root, materializer)\n''',
              '''        excluded_roots=output_roots,\n        untracked_paths=pre_run_untracked_paths,\n        tracked_excluded_roots=tracked_output_roots,\n    )\n    run_fingerprint = _materialization_fingerprint(root, materializer)\n''',
          )
          replace_once(
              '''    stamped_worktree_fingerprint, stamped_output_digests = _write_stamp(\n''',
              '''    (\n        stamped_worktree_fingerprint,\n        stamped_output_digests,\n        stamped_semantic_revision,\n    ) = _write_stamp(\n''',
          )
          replace_once(
              '''        input_untracked_paths=pre_run_untracked_paths,\n        output_roots=output_roots,\n    )\n''',
              '''        input_untracked_paths=pre_run_untracked_paths,\n        output_roots=output_roots,\n        tracked_output_roots=tracked_output_roots,\n    )\n''',
          )
          replace_once(
              '''    _assert_materialization_fingerprint(\n        root,\n        run_fingerprint,\n        label,\n        boundary="after output snapshot before returning materialization success",\n    )\n    _remember_success(root, run_fingerprint)\n''',
              '''    _assert_materialization_fingerprint(\n        root,\n        run_fingerprint,\n        label,\n        boundary="after output snapshot before returning materialization success",\n    )\n    _assert_semantic_revision(\n        root,\n        stamped_semantic_revision,\n        label,\n        boundary="after output snapshot before returning materialization success",\n    )\n    _remember_success(root, run_fingerprint)\n''',
          )

          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_materialize_publication_assets_review_followup.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = '\nif __name__ == "__main__":\n'
          if tests.count(marker) != 1:
              raise SystemExit('test insertion marker not unique')
          additions = r'''
    def test_tracked_sibling_of_generated_output_remains_an_input(self) -> None:
        with tempfile.TemporaryDirectory() as directory:
            root = Path(directory)
            materializer = self.write_v4_provider(root)
            tracked_input = root / "generated" / "input.bin"
            tracked_input.parent.mkdir(parents=True, exist_ok=True)
            tracked_input.write_bytes(b"A")
            materializer.write_text(
                "from __future__ import annotations\n"
                "import argparse\n"
                "from pathlib import Path\n"
                "parser = argparse.ArgumentParser()\n"
                "parser.add_argument('--source-root', type=Path, required=True)\n"
                "args = parser.parse_args()\n"
                "source = args.source_root / 'generated' / 'input.bin'\n"
                "payload = source.read_bytes()\n"
                "out = args.source_root / 'generated' / 'output.bin'\n"
                "out.write_bytes(payload)\n"
                "source.write_bytes(b'B')\n",
                encoding="utf-8",
            )
            self.initialize_git_checkout(root)

            with self.assertRaisesRegex(
                PublicationMaterializationError,
                "worktree changed while the materializer was running",
            ):
                materialize_publication(root, "fixture")

            self.assertEqual(b"A", (root / "generated" / "output.bin").read_bytes())
            self.assertEqual(b"B", tracked_input.read_bytes())
            self.assertFalse((root / STAMP_FILE).exists())

    def test_semantic_revision_is_rechecked_after_output_snapshot_on_acceptance(self) -> None:
        with tempfile.TemporaryDirectory() as directory:
            root = Path(directory)
            materializer = self.write_v4_provider(root)
            manifest = root / "generated" / "composition-playground-publication.json"
            (root / ".gitignore").write_text(
                "generated/composition-playground-publication.json\n",
                encoding="utf-8",
            )
            materializer.write_text(
                materializer.read_text(encoding="utf-8")
                + "manifest = args.source_root / 'generated' / 'composition-playground-publication.json'\n"
                + "manifest.write_text('{"semantic_revision": "A"}', encoding='utf-8')\n",
                encoding="utf-8",
            )
            self.initialize_git_checkout(root)
            self.assertTrue(materialize_publication(root, "fixture"))
            self.assertTrue(is_publication_materialized(root, "fixture"))

            original = materialization._snapshot_materialized_outputs
            mutated = False

            def mutate_after_output_snapshot(*args, **kwargs):
                nonlocal mutated
                observed = original(*args, **kwargs)
                if not mutated:
                    manifest.write_text('{"semantic_revision": "B"}', encoding="utf-8")
                    mutated = True
                return observed

            with patch.object(
                materialization,
                "_snapshot_materialized_outputs",
                side_effect=mutate_after_output_snapshot,
            ):
                self.assertFalse(is_publication_materialized(root, "fixture"))
            self.assertTrue(mutated)

    def test_semantic_revision_is_rechecked_after_output_snapshot_on_stamp_commit(self) -> None:
        with tempfile.TemporaryDirectory() as directory:
            root = Path(directory)
            materializer = self.write_v4_provider(root)
            manifest = root / "generated" / "composition-playground-publication.json"
            (root / ".gitignore").write_text(
                "generated/composition-playground-publication.json\n",
                encoding="utf-8",
            )
            materializer.write_text(
                materializer.read_text(encoding="utf-8")
                + "manifest = args.source_root / 'generated' / 'composition-playground-publication.json'\n"
                + "manifest.write_text('{"semantic_revision": "A"}', encoding='utf-8')\n",
                encoding="utf-8",
            )
            self.initialize_git_checkout(root)
            original = materialization._snapshot_materialized_outputs
            snapshots = 0

            def mutate_during_commit_snapshot(*args, **kwargs):
                nonlocal snapshots
                observed = original(*args, **kwargs)
                snapshots += 1
                if snapshots == 2:
                    manifest.write_text('{"semantic_revision": "B"}', encoding="utf-8")
                return observed

            with patch.object(
                materialization,
                "_snapshot_materialized_outputs",
                side_effect=mutate_during_commit_snapshot,
            ):
                with self.assertRaisesRegex(
                    PublicationMaterializationError,
                    "semantic revision changed after output snapshot before materialization stamp commit",
                ):
                    materialize_publication(root, "fixture")
            self.assertGreaterEqual(snapshots, 2)
            self.assertFalse((root / STAMP_FILE).exists())

'''
          tests = tests.replace(marker, '\n' + additions + marker, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Syntax check
        run: python -m py_compile scripts/materialize_publication_assets.py tests/test_materialize_publication_assets_review_followup.py

      - name: Run focused regressions
        run: python -m unittest tests.test_materialize_publication_assets tests.test_materialize_publication_assets_review_followup tests.test_assembly_materialization_boundary --verbose

      - name: Commit remediation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/materialize_publication_assets.py tests/test_materialize_publication_assets_review_followup.py
          git diff --cached --check
          git commit -m "Fix final materialization review races"
          git push origin HEAD:perf/site-provider-materialization-phase
