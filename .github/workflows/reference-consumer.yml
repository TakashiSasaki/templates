name: Site reference consumer
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
permissions:
  contents: read
concurrency:
  group: reference-consumer-${{ (github.event.action == 'labeled' && github.event.label.name != 'ci/full-qualification' && github.event.label.name != 'ci/full-site-verification') && format('unrelated-label-{0}', github.run_id) || (github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true
jobs:
  classify:
    name: Classify reference consumer requirement
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'ci/full-qualification' ||
      github.event.label.name == 'ci/full-site-verification'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      required: ${{ steps.classify.outputs.reference_consumer_required }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Check out repository history for change classification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.13'
      - name: Classify reference consumer requirement
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FORCE_FULL_REQUESTED: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'ci/full-qualification') || contains(github.event.pull_request.labels.*.name, 'ci/full-site-verification'))) }}
        run: |
          set -euo pipefail
          classifier_dir="$RUNNER_TEMP/site-ci-classifier-authority"
          rm -rf "$classifier_dir"
          mkdir -p "$classifier_dir"
          force_full="${FORCE_FULL_REQUESTED:-false}"
          git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths.txt"
          if git show "$BASE_SHA:scripts/classify_site_ci.py" > "$classifier_dir/classify_site_ci.py" 2>/dev/null; then
            output_file="$RUNNER_TEMP/site-ci-output.txt"
            python3 -I "$classifier_dir/classify_site_ci.py" \
              --changed-paths "$RUNNER_TEMP/changed-paths.txt" \
              --force-full "$force_full" \
              --output "$output_file"
            req="$(grep '^reference_consumer_required=' "$output_file" | cut -d= -f2)"
            reason="$(grep '^reason=' "$output_file" | cut -d= -f2)"
            echo "reference_consumer_required=$req" >> "$GITHUB_OUTPUT"
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
          else
            echo "reference_consumer_required=true" >> "$GITHUB_OUTPUT"
            echo "reason=base-classifier-unavailable" >> "$GITHUB_OUTPUT"
          fi
  composition:
    needs: classify
    if: ${{ always() && !cancelled() && needs.classify.result == 'success' && needs.classify.outputs.required == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - run: python scripts/site_website_contract.py
      - run: python -m pip install PyYAML==6.0.3
      - run: python scripts/render_reference_consumer.py
      - run: python .template-composition/validate.py . --format json
  build:
    needs: classify
    if: ${{ always() && !cancelled() && needs.classify.result == 'success' && needs.classify.outputs.required == 'true' }}
    uses: ./.github/workflows/build-pages.yml
    with:
      site_ref: ${{ github.event.pull_request.head.sha }}
  browser:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - run: python -m pip install --requirement requirements-visual.txt
      - name: Install worker-lifecycle browser
        run: python -m playwright install --only-shell chromium
      - uses: actions/download-artifact@v5
        with:
          name: github-pages
          path: pages-artifact
      - name: Extract exact Pages artifact
        run: |
          mkdir -p build/site
          tar --extract --file pages-artifact/artifact.tar --directory build/site
      - name: Verify Website product contract in Chrome
        run: python scripts/check_reference_website.py
      - name: Verify PWA positive and failure paths
        run: python scripts/check_reference_pwa.py
