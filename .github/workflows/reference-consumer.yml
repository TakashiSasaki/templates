name: Site reference consumer
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: reference-consumer-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  composition:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Emit canonical generated projections for connector application
        run: |
          python scripts/site_website_contract.py --write
          python -m pip install PyYAML==6.0.3
          python scripts/render_reference_consumer.py --write
          for path in \
            contracts/routes.json \
            contracts/site-structure.json \
            contracts/document-metadata.json \
            contracts/site-discovery.json \
            assets/reference-consumer.json \
            docs/policy-composition-coexistence.md \
            translations/ja/docs/policy-composition-coexistence.md; do
            echo "BEGIN_CANONICAL ${path}"
            base64 -w0 "${path}"
            echo
            echo "END_CANONICAL ${path}"
          done
          exit 1
  build:
    uses: ./.github/workflows/build-pages.yml
    with:
      site_ref: ${{ github.event.pull_request.head.sha }}
  browser:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - run: python -m pip install --requirement requirements-visual.txt
      - name: Install worker-lifecycle browser
        run: python -m playwright install --only-shell chromium
      - uses: actions/download-artifact@v5
        with:
          name: github-pages
          path: pages-artifact
      - name: Extract exact Pages artifact
        run: |
          mkdir -p build/site
          tar --extract --file pages-artifact/artifact.tar --directory build/site
      - name: Verify Website product contract in Chrome
        run: python scripts/check_reference_website.py
      - name: Verify PWA positive and failure paths
        run: python scripts/check_reference_pwa.py
