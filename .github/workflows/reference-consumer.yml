name: Site reference consumer
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: reference-consumer-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  composition:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - run: python scripts/site_website_contract.py
      - run: python .template-composition/validate.py . --format json
  build:
    uses: ./.github/workflows/build-pages.yml
    with:
      site_ref: ${{ github.event.pull_request.head.sha }}
  browser:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - run: python -m pip install --requirement requirements-visual.txt
      - name: Install worker-lifecycle browser
        run: python -m playwright install --only-shell chromium
      - uses: actions/download-artifact@v5
        with:
          name: github-pages
          path: pages-artifact
      - name: Extract exact Pages artifact
        run: |
          mkdir -p build/site
          tar --extract --file pages-artifact/artifact.tar --directory build/site
      - name: Verify Website product contract in Chrome
        run: python scripts/check_reference_website.py
      - name: Verify PWA positive and failure paths
        run: python scripts/check_reference_pwa.py
