name: Site reference consumer
on:
  workflow_call:
    inputs:
      artifact_id:
        type: string
        required: true
      artifact_digest:
        type: string
        required: true
      build_inputs:
        type: string
        required: true
      browser_required:
        type: string
        required: true
      pwa_required:
        type: string
        required: true
      reference_consumer_required:
        type: string
        required: true
      cross_authority_required:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  browser:
    if: ${{ inputs.browser_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python3 -m pip install --requirement requirements-visual.txt
      - name: Validate visual entrypoint dependency boundary
        run: python3 scripts/check_python_dependencies.py . --environment visual
      - name: Verify system Chrome runtime
        run: |
          google-chrome --version | tee "$RUNNER_TEMP/system-chrome-version.txt"
          echo "Playwright launch mode: channel=chrome" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify and consume scheduled Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ARTIFACT_ID: ${{ inputs.artifact_id }}
          BUILD_ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          BUILD_INPUTS: ${{ inputs.build_inputs }}
        run: python3 scripts/consume_site_build_artifact.py
      - name: Verify Website product contract in Chrome
        run: python3 scripts/check_reference_website.py
      - name: Verify PWA positive and failure paths
        if: ${{ inputs.pwa_required == 'true' }}
        run: python3 scripts/check_reference_pwa.py
