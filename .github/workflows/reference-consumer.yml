name: Site reference consumer
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
permissions:
  contents: read
  actions: read
concurrency:
  group: reference-consumer-${{ (github.event.action == 'labeled' && github.event.label.name != 'ci/full-qualification' && github.event.label.name != 'ci/full-site-verification' && github.event.label.name != 'ci/browser') && format('unrelated-label-{0}', github.run_id) || (github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true
jobs:
  classify:
    name: Classify reference consumer requirement
    uses: ./.github/workflows/classify.yml
    if: github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'ci/full-qualification' || github.event.label.name == 'ci/full-site-verification' || github.event.label.name == 'ci/browser'

  composition:
    needs: classify
    if: ${{ always() && !cancelled() && needs.classify.result == 'success' && needs.classify.outputs.required == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - run: python scripts/site_website_contract.py
      - run: python -m pip install PyYAML==6.0.3
      - run: python scripts/render_reference_consumer.py
      - run: python .template-composition/validate.py . --format json
  build:
    needs: classify
    if: ${{ always() && !cancelled() && needs.classify.result == 'success' && needs.classify.outputs.required == 'true' && needs.classify.outputs.build_required == 'true' }}
    uses: ./.github/workflows/build-pages.yml
    with:
      reuse_pr_build: true
      site_ref: ${{ github.event.pull_request.head.sha }}
  browser:
    needs: [classify, build]
    if: ${{ needs.classify.outputs.browser_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - run: python -m pip install --requirement requirements-visual.txt
      - name: Install worker-lifecycle browser
        run: python -m playwright install --only-shell chromium
      - uses: actions/download-artifact@v5
        with:
          name: github-pages
          path: pages-artifact
      - name: Extract exact Pages artifact
        run: |
          mkdir -p build/site
          tar --extract --file pages-artifact/artifact.tar --directory build/site
      - name: Verify Website product contract in Chrome
        run: python scripts/check_reference_website.py
      - name: Verify PWA positive and failure paths
        if: ${{ needs.classify.outputs.pwa_required == 'true' }}
        run: python scripts/check_reference_pwa.py
