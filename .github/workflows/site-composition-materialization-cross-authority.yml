name: Site Composition materialization cross-authority acceptance

on:
  pull_request:
    branches:
      - site
      - 'feat/site-*'
      - site-composition-audience-publication-staging
      - "perf/site-*"
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  actions: read

concurrency:
  group: site-composition-materialization-cross-authority-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify cross-authority acceptance requirement
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'ci/full-qualification' ||
      github.event.label.name == 'ci/full-site-verification' || github.event.label.name == 'ci/browser'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      required: ${{ steps.classify.outputs.cross_authority_required }}
      browser_required: ${{ steps.classify.outputs.browser_required }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Check out repository history for change classification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.13'
      - name: Classify cross-authority acceptance requirement
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FORCE_BROWSER_REQUESTED: ${{ contains(github.event.pull_request.labels.*.name, 'ci/browser') }}
          FORCE_FULL_REQUESTED: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'ci/full-qualification') || contains(github.event.pull_request.labels.*.name, 'ci/full-site-verification'))) }}
        run: |
          set -euo pipefail
          classifier_dir="$RUNNER_TEMP/site-ci-classifier-authority"
          rm -rf "$classifier_dir"
          mkdir -p "$classifier_dir"
          force_full="${FORCE_FULL_REQUESTED:-false}"
          git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths.txt"
          if git show "$BASE_SHA:scripts/classify_site_ci.py" > "$classifier_dir/classify_site_ci.py" 2>/dev/null; then
            browser_args=()
            if grep -q -- '--force-browser' "$classifier_dir/classify_site_ci.py"; then
              browser_args=(--force-browser "${FORCE_BROWSER_REQUESTED:-false}")
            elif [ "${FORCE_BROWSER_REQUESTED:-false}" = true ]; then
              force_full=true
            fi
            output_file="$RUNNER_TEMP/site-ci-output.txt"
            python3 -I "$classifier_dir/classify_site_ci.py" \
              --changed-paths "$RUNNER_TEMP/changed-paths.txt" \
              --force-full "$force_full" "${browser_args[@]}" \
              --output "$output_file"
            for capability in build_required browser_required pwa_required reference_consumer_required cross_authority_required playground_required; do
              value="$(sed -n "s/^${capability}=//p" "$output_file")"
              if [ -z "$value" ] && [ "$capability" = playground_required ]; then value=true; fi
              case "$value" in true|false) ;; *) exit 1 ;; esac
              echo "$capability=$value" >> "$GITHUB_OUTPUT"
            done
            sed -n '/^reason=/p' "$output_file" >> "$GITHUB_OUTPUT"
          else
            echo "playground_required=true" >> "$GITHUB_OUTPUT"
            echo "browser_required=true" >> "$GITHUB_OUTPUT"
            echo "cross_authority_required=true" >> "$GITHUB_OUTPUT"
            echo "reason=base-classifier-unavailable" >> "$GITHUB_OUTPUT"
          fi

  build_candidate:
    name: Build exact cross-authority materialization candidate
    needs: classify
    if: >-
      github.repository == 'TakashiSasaki/templates' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.classify.outputs.required == 'true'
    uses: ./.github/workflows/build-pages.yml
    with:
      site_ref: ${{ github.event.pull_request.head.sha }}
      composition_ref: 0f0c4012818a3b8646ad89fbca7db22c71ad5dd8
