name: Temporary apply planning requirement ledger
on:
  push:
    branches:
      - agent/planning-requirement-ledger-pr16
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/planning-requirement-ledger-pr16
          fetch-depth: 0
      - name: Apply planning requirement-ledger patch
        run: python .github/tmp/patch_planning_evidence.py
      - name: Commit patch and remove temporary files
        run: |
          rm -f .github/tmp/patch_planning_evidence.py
          rm -f .github/workflows/tmp-audit-planning-mode.yml
          rm -f .github/workflows/tmp-apply-planning-mode.yml
          git config user.name 'TakashiSasaki templates automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Add pre-coding planning requirement ledger'
          git push origin HEAD:agent/planning-requirement-ledger-pr16
