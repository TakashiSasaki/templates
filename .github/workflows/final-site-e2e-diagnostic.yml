name: Final Site E2E diagnostic

on:
  pull_request:
    branches:
      - site

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify merged Site deployment succeeded
        uses: actions/github-script@v8
        env:
          TARGET_SITE_SHA: 8e506300aa27f1822dba805f6113ad170de08ad3
        with:
          script: |
            const target = process.env.TARGET_SITE_SHA;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-pages.yml',
              event: 'push',
              branch: 'site',
              per_page: 50,
            });
            const run = data.workflow_runs.find((candidate) => candidate.head_sha === target);
            if (!run) {
              core.setFailed(`No deploy-pages push run found for ${target}`);
              return;
            }
            core.info(`Deployment workflow run: ${run.html_url}`);
            core.info(`status=${run.status} conclusion=${run.conclusion}`);
            if (run.status !== 'completed' || run.conclusion !== 'success') {
              core.setFailed(
                `Deploy documentation from site is ${run.status}/${run.conclusion} for ${target}`
              );
            }

      - name: Verify public routes and provenance
        env:
          PUBLIC_SITE_URL: https://templates.moukaeritai.work
          EXPECTED_SITE_SHA: 8e506300aa27f1822dba805f6113ad170de08ad3
          EXPECTED_COMPOSITION_SHA: 3d60c0e32120c0eb4c060f43b4698dc48385e34e
          EXPECTED_POLICY_SHA: 3388f2df6c59cf2466b114cc236dd1b512349dc7
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          fetch() {
            local path="$1"
            local output="$2"
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 2 --retry-all-errors \
              "${PUBLIC_SITE_URL}${path}" -o "$output"
          }

          fetch /composition/release/ "$work/release.html"
          fetch /lifecycle/release-execution/ "$work/release-execution.html"
          fetch /webapp/docs/migrations/routes-v2-to-v3/ "$work/routes-v3.html"
          fetch /lifecycle/ "$work/lifecycle.html"
          fetch /build-provenance.json "$work/provenance.json"

          grep -Fq 'Producing a product release' "$work/release.html"
          grep -Fq 'Release execution contract' "$work/release-execution.html"
          grep -Fq 'Routes v2 to v3 migration' "$work/routes-v3.html"
          grep -Eq 'href="(/)?lifecycle/release-execution/"|href="release-execution/"' "$work/lifecycle.html"

          python - "$work/provenance.json" <<'PY'
          import json
          import os
          import pathlib
          import sys

          provenance = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert provenance["site_commit"] == os.environ["EXPECTED_SITE_SHA"], provenance
          assert provenance["publication_commits"]["composition"] == os.environ["EXPECTED_COMPOSITION_SHA"], provenance
          assert provenance["publication_commits"]["policy"] == os.environ["EXPECTED_POLICY_SHA"], provenance
          print(json.dumps(provenance, sort_keys=True))
          PY
