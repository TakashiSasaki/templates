name: Build and deploy documentation

on:
  pull_request:
    branches:
      - site
  push:
    branches:
      - site
  workflow_call:
    inputs:
      source_ref:
        description: Commit, branch, or tag containing the canonical documentation
        required: false
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event_name == 'pull_request' && github.ref || 'deployment' }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'TakashiSasaki/templates'
    runs-on: ubuntu-latest

    steps:
      - name: Check out site implementation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'push' && github.sha || 'site' }}
          path: site-source

      - name: Check out canonical documentation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_call' && inputs.source_ref || 'main' }}
          path: canonical-source

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the pinned site generator
        run: python -m pip install --requirement site-source/requirements.txt

      - name: Assemble the documentation project
        run: |
          python site-source/scripts/assemble_docs.py \
            --source-root canonical-source \
            --site-root site-source \
            --output-root build

      - name: Build the static site
        run: zensical build --config-file build/zensical.toml --clean --strict

      - name: Verify the Pages entry point
        run: test -f build/site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
