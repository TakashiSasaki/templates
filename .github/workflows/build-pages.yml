name: Build documentation artifact
on:
  schedule:
    - cron: 43 19 * * *
  workflow_dispatch: null
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - ready_for_review
  workflow_call:
    inputs:
      reuse_pr_build:
        description: Reuse the canonical exact-input PR artifact when provider/configuration inputs match
        required: false
        type: boolean
        default: false
      site_ref:
        description: Commit, branch, or tag containing the site implementation
        required: false
        type: string
        default: ''
      deployment_timestamp:
        description: JST deployment timestamp rendered in the footer; empty for non-deploying builds
        required: false
        type: string
        default: ''
permissions:
  contents: read
  actions: read
env:
  PUBLIC_SITE_URL: https://templates.moukaeritai.work/
concurrency:
  group: documentation-build-${{ github.workflow }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'ci/full-qualification' && github.event.label.name != 'ci/full-site-verification' && github.event.label.name != 'ci/browser') && format('unrelated-label-{0}', github.run_id) || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: |-
      always() && github.repository == 'TakashiSasaki/templates' && (github.event_name != 'pull_request' ||
       github.event.action != 'labeled' ||
       github.event.label.name == 'ci/full-qualification' ||
       github.event.label.name == 'ci/full-site-verification' || github.event.label.name == 'ci/browser') &&
      (inputs.site_ref != '' ||
       github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name != github.repository ||
       (needs.classify_browser.result == 'success' && needs.classify_browser.outputs.site_candidate == 'true' && needs.classify_browser.outputs.build_required == 'true'))
    needs:
      - classify_browser
    uses: ./.github/workflows/site-producer.yml
    permissions:
      contents: read
      actions: read
    with:
      core_tests_scheduled: ${{ inputs.site_ref == '' && needs.classify_browser.result == 'success' }}
      reuse_pr_build: ${{ inputs.reuse_pr_build || false }}
      site_ref: ${{ inputs.site_ref || github.event.pull_request.head.sha || github.sha }}
      deployment_timestamp: ${{ inputs.deployment_timestamp }}
  classify_browser:
    name: Classify browser acceptance scope
    uses: ./.github/workflows/classify.yml
    if: |-
      github.repository == 'TakashiSasaki/templates' && (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && inputs.site_ref == '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event.action != 'labeled' ||
       github.event.label.name == 'ci/full-qualification' ||
       github.event.label.name == 'ci/full-site-verification' || github.event.label.name == 'ci/browser')
  check:
    if: |-
      always() && github.repository == 'TakashiSasaki/templates' && (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && inputs.site_ref == '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.classify_browser.outputs.site_candidate == 'true' && (github.event.action != 'labeled' ||
       github.event.label.name == 'ci/full-qualification' ||
       github.event.label.name == 'ci/full-site-verification' || github.event.label.name == 'ci/browser')
    needs:
      - build
      - classify_browser
    runs-on: ubuntu-24.04
    steps:
      - name: Require coherent build and browser classification
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          CLASSIFIER_RESULT: ${{ needs.classify_browser.result }}
          BROWSER_REQUIRED: ${{ needs.classify_browser.outputs.browser_required }}
          BUILD_REQUIRED: ${{ needs.classify_browser.outputs.build_required }}
          PWA_REQUIRED: ${{ needs.classify_browser.outputs.pwa_required }}
        run: |
          test "$CLASSIFIER_RESULT" = success
          case "$BUILD_REQUIRED" in
            true)
              test "$BUILD_RESULT" = success
              ;;
            false)
              test "$BUILD_RESULT" = skipped
              ;;
            *)
              echo "::error::Unexpected build requirement: $BUILD_REQUIRED"
              exit 1
              ;;
          esac
          case "$BROWSER_REQUIRED" in
            true|false)
              ;;
            *)
              echo "::error::Unexpected browser acceptance classification: $BROWSER_REQUIRED"
              exit 1
              ;;
          esac
          case "$PWA_REQUIRED" in
            true|false)
              ;;
            *)
              echo "::error::Unexpected PWA acceptance classification: $PWA_REQUIRED"
              exit 1
              ;;
          esac
      - name: Record browser acceptance outcome
        env:
          BROWSER_REQUIRED: ${{ needs.classify_browser.outputs.browser_required }}
          BROWSER_REASON: ${{ needs.classify_browser.outputs.reason }}
          BUILD_REQUIRED: ${{ needs.classify_browser.outputs.build_required }}
        run: |
          {
            echo '### Site browser acceptance'
            echo
            echo "- required: \`$BROWSER_REQUIRED\`"
            echo "- build_required: \`$BUILD_REQUIRED\`"
            echo "- reason: \`$BROWSER_REASON\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check out proposed Site revision
        if: ${{ needs.classify_browser.outputs.browser_required == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify and consume scheduled Pages artifact
        if: ${{ needs.classify_browser.outputs.browser_required == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          BUILD_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
          BUILD_INPUTS: ${{ needs.build.outputs.build_inputs }}
        run: python3 scripts/consume_site_build_artifact.py
      - name: Acquire selected Integration Bundle for consumer acceptance
        if: ${{ needs.classify_browser.outputs.browser_required == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT: ${{ needs.build.outputs.bundle_receipt }}
        run: |
          python3 -c 'import os; from pathlib import Path; Path("receipt.json").write_text(os.environ["RECEIPT"])'
          python3 scripts/acquire_integration_bundle.py consume --receipt receipt.json --output publication-bundle
      - name: Check audience artifact contract before browser setup
        if: ${{ needs.classify_browser.outputs.browser_required == 'true' }}
        run: python3 scripts/check_audience_artifact.py --site-root build/site --bundle publication-bundle
      - name: Install Playwright controller
        if: ${{ needs.classify_browser.outputs.browser_required == 'true' }}
        run: python3 -m pip install --disable-pip-version-check -r requirements-visual.txt
      - name: Validate visual entrypoint dependency boundary
        if: ${{ needs.classify_browser.outputs.browser_required == 'true' }}
        run: python3 scripts/check_python_dependencies.py . --environment visual
      - name: Cache Playwright binaries
        if: ${{ needs.classify_browser.outputs.browser_required == 'true' && (needs.classify_browser.outputs.pwa_required == 'true' || needs.classify_browser.outputs.full_required == 'true') }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-shell-${{ hashFiles('requirements-visual.txt') }}
      - name: Install Playwright Chromium for PWA lifecycle
        if: ${{ needs.classify_browser.outputs.browser_required == 'true' && (needs.classify_browser.outputs.pwa_required == 'true' || needs.classify_browser.outputs.full_required == 'true') }}
        run: python3 -m playwright install --only-shell chromium
      - name: Verify system Chrome runtime
        if: ${{ needs.classify_browser.outputs.browser_required == 'true' }}
        run: |
          google-chrome --version | tee "$RUNNER_TEMP/system-chrome-version.txt"
          echo "Playwright launch mode: channel=chrome" >> "$GITHUB_STEP_SUMMARY"
      - name: Install Japanese browser font
        if: ${{ needs.classify_browser.outputs.browser_required == 'true' }}
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update || true
          sudo apt-get install --yes --no-install-recommends fonts-ipafont-gothic
      - name: Check changed-feature audience
        if: ${{ needs.classify_browser.outputs.browser_required == 'true' && needs.classify_browser.outputs.browser_priority == 'audience' }}
        run: |
          python3 scripts/check_audience_runtime.py \
            --site-root build/site \
            --output build/mobile-visual/audience-runtime.json \
            --bundle publication-bundle
        id: priority_audience
      - name: Check changed-feature search
        if: ${{ needs.classify_browser.outputs.browser_required == 'true' && needs.classify_browser.outputs.browser_priority == 'search' }}
        run: |
          python3 scripts/check_search_history.py \
            --site-root build/site \
            --output build/search-history/search-history.json
        id: priority_search
      - name: Check changed-feature pwa
        if: ${{ needs.classify_browser.outputs.browser_required == 'true' && (needs.classify_browser.outputs.pwa_required == 'true' || needs.classify_browser.outputs.full_required == 'true') && needs.classify_browser.outputs.browser_priority == 'pwa' }}
        run: |
          python3 scripts/check_pwa_freshness.py \
            --site-root build/site \
            --output build/mobile-visual/pwa-freshness.json
        id: priority_pwa
      - name: Check changed-feature layout
        if: ${{ needs.classify_browser.outputs.browser_required == 'true' && needs.classify_browser.outputs.browser_priority == 'layout' }}
        run: |
          python3 scripts/check_mobile_layout.py \
            --site-root build/site \
            --output-root build/mobile-visual
        id: priority_layout
      - name: Check mobile layout geometry
        if: ${{ needs.classify_browser.outputs.browser_required == 'true' && steps.priority_layout.outcome != 'success' }}
        run: |
          python3 scripts/check_mobile_layout.py \
            --site-root build/site \
            --output-root build/mobile-visual
      - name: Check localized inline Glossary chrome
        if: ${{ needs.classify_browser.outputs.browser_required == 'true' }}
        run: |
          python3 scripts/check_glossary_locale_chrome.py \
            --site-root build/site \
            --output build/mobile-visual/glossary-locale-chrome.json
      - name: Check assembled audience runtime and navigation
        if: ${{ needs.classify_browser.outputs.browser_required == 'true' && steps.priority_audience.outcome != 'success' }}
        run: |
          python3 scripts/check_audience_runtime.py \
            --site-root build/site \
            --output build/mobile-visual/audience-runtime.json \
            --bundle publication-bundle
      - name: Check Site search history
        if: ${{ needs.classify_browser.outputs.browser_required == 'true' && steps.priority_search.outcome != 'success' }}
        run: |
          python3 scripts/check_search_history.py \
            --site-root build/site \
            --output build/search-history/search-history.json
      - name: Check review regressions for Site search history
        if: ${{ needs.classify_browser.outputs.browser_required == 'true' }}
        run: |
          python3 scripts/check_search_history_review_regressions.py \
            --site-root build/site \
            --output build/search-history/review-regressions.json
      - name: Check translation warnings online and offline
        if: ${{ needs.classify_browser.outputs.browser_required == 'true' && (needs.classify_browser.outputs.pwa_required == 'true' || needs.classify_browser.outputs.full_required == 'true') }}
        run: python3 scripts/check_stale_translation_runtime.py --site-root build/site --bundle publication-bundle --output build/mobile-visual/translation-status.json
      - name: Check PWA freshness lifecycle
        if: ${{ needs.classify_browser.outputs.browser_required == 'true' && (needs.classify_browser.outputs.pwa_required == 'true' || needs.classify_browser.outputs.full_required == 'true') && steps.priority_pwa.outcome != 'success' }}
        run: |
          python3 scripts/check_pwa_freshness.py \
            --site-root build/site \
            --output build/mobile-visual/pwa-freshness.json
      - name: Check localized PWA freshness chrome
        if: ${{ needs.classify_browser.outputs.browser_required == 'true' && (needs.classify_browser.outputs.pwa_required == 'true' || needs.classify_browser.outputs.full_required == 'true') }}
        run: |
          python3 scripts/check_pwa_locale_chrome.py \
            --site-root build/site \
            --output build/mobile-visual/pwa-locale-chrome.json
      - name: Check PWA document commit correlation
        if: ${{ needs.classify_browser.outputs.browser_required == 'true' && (needs.classify_browser.outputs.pwa_required == 'true' || needs.classify_browser.outputs.full_required == 'true') }}
        run: |
          python3 scripts/check_pwa_commit_regressions.py \
            --site-root build/site \
            --output build/mobile-visual/pwa-document-commit.json
      - name: Check PWA freshness capability messaging
        if: ${{ needs.classify_browser.outputs.browser_required == 'true' && (needs.classify_browser.outputs.pwa_required == 'true' || needs.classify_browser.outputs.full_required == 'true') }}
        run: |
          python3 scripts/check_pwa_capabilities.py \
            --site-root build/site \
            --output build/mobile-visual/pwa-capabilities.json
      - name: Check PWA slow-network convergence
        if: ${{ needs.classify_browser.outputs.browser_required == 'true' && (needs.classify_browser.outputs.pwa_required == 'true' || needs.classify_browser.outputs.full_required == 'true') }}
        run: |
          python3 scripts/check_pwa_slow_convergence.py \
            --site-root build/site \
            --output build/mobile-visual/pwa-slow-convergence.json
      - name: Upload search-history evidence
        if: ${{ always() && needs.classify_browser.outputs.browser_required == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: search-history-${{ github.event.pull_request.number }}
          path: build/search-history
          if-no-files-found: warn
          retention-days: 7
      - name: Upload mobile visual evidence
        if: ${{ always() && needs.classify_browser.outputs.browser_required == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: mobile-visual-${{ github.event.pull_request.number }}
          path: build/mobile-visual
          if-no-files-found: warn
          retention-days: 7
  core_tests:
    name: Core repository unit and contract validation
    if: |-
      always() && github.repository == 'TakashiSasaki/templates' && inputs.site_ref == '' && (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.classify_browser.outputs.site_candidate == 'true' && (github.event.action != 'labeled' ||
       github.event.label.name == 'ci/full-qualification' ||
       github.event.label.name == 'ci/full-site-verification' || github.event.label.name == 'ci/browser')
    needs:
      - classify_browser
    runs-on: ubuntu-24.04
    steps:
      - name: Check out site candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install dependencies
        run: python3 -m pip install --requirement requirements.txt
      - name: Validate core entrypoint dependency boundary
        run: python3 scripts/check_python_dependencies.py . --environment core
      - name: Run core unit and contract validation
        run: python3 scripts/run_core_tests.py --verbose
  validate:
    name: Site Construction CI / validate
    if: |-
      always() && github.repository == 'TakashiSasaki/templates' && (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && inputs.site_ref == '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.classify_browser.outputs.site_candidate == 'true' && (github.event.action != 'labeled' ||
       github.event.label.name == 'ci/full-qualification' ||
       github.event.label.name == 'ci/full-site-verification' || github.event.label.name == 'ci/browser')
    needs:
      - build
      - classify_browser
      - check
      - core_tests
    runs-on: ubuntu-24.04
    steps:
      - name: Verify build, classifier, and browser gate results
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          CLASSIFY_RESULT: ${{ needs.classify_browser.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          CORE_TESTS_RESULT: ${{ needs.core_tests.result }}
          BUILD_REQUIRED: ${{ needs.classify_browser.outputs.build_required }}
          BROWSER_REQUIRED: ${{ needs.classify_browser.outputs.browser_required }}
          FORCE_FULL: ${{ needs.classify_browser.outputs.full_required }}
        run: |
          test "$CLASSIFY_RESULT" = success
          test "$CORE_TESTS_RESULT" = success
          test "$CHECK_RESULT" = success
          case "$FORCE_FULL" in
            true)
              test "$BUILD_RESULT" = success
              test "$BROWSER_REQUIRED" = true
              echo "Site Construction CI gate passed (full qualification mode)"
              ;;
            false)
              case "$BUILD_REQUIRED" in
                true)
                  test "$BUILD_RESULT" = success
                  ;;
                false)
                  test "$BUILD_RESULT" = skipped
                  ;;
                *)
                  echo "::error::Unexpected build requirement: $BUILD_REQUIRED"
                  exit 1
                  ;;
              esac
              echo "Site Construction CI aggregate gate passed (build_required=$BUILD_REQUIRED, browser_required=$BROWSER_REQUIRED)"
              ;;
          esac
  policy:
    needs:
      - classify_browser
    if: ${{ inputs.site_ref == '' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.classify_browser.result == 'success' && needs.classify_browser.outputs.site_candidate == 'true' }}
    uses: ./.github/workflows/check-agent-policy.yml
  website_contract:
    needs:
      - classify_browser
    if: ${{ inputs.site_ref == '' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.classify_browser.result == 'success' && needs.classify_browser.outputs.site_candidate == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate Site-owned Website contracts
        run: python3 scripts/validate_website_contracts.py .
      - name: Validate Site-owned Playground declarations
        run: python3 scripts/validate_site_declarations.py .
      - name: Validate Python entrypoint dependency boundaries
        run: python3 scripts/check_python_dependencies.py .
      - name: Validate selected Composition components
        run: python3 .template-composition/validate.py .
  full_qualification:
    name: Site Full Qualification / validate
    needs:
      - classify_browser
      - build
      - check
      - core_tests
      - validate
      - policy
      - website_contract
      - reference_consumer
      - cross_authority
      - explainability
      - playground
    if: ${{ always() && inputs.site_ref == '' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.classify_browser.result == 'success' && needs.classify_browser.outputs.site_candidate == 'true' && needs.classify_browser.outputs.full_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all scheduled qualification results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          needs = json.loads(os.environ['RESULTS'])
          expected = {'website_contract', 'cross_authority', 'reference_consumer', 'policy', 'core_tests', 'build', 'validate', 'classify_browser', 'check', 'explainability', 'playground'}
          if set(needs) != expected:
              raise SystemExit('Incomplete qualification job snapshot')
          failed = {name: result['result'] for name, result in needs.items() if result['result'] != 'success'}
          if failed:
              raise SystemExit('Qualification incomplete: ' + json.dumps(failed, sort_keys=True))
          print('Exact-head DAG qualification passed; runner polling seconds=0')
          PYCODE
  reference_consumer:
    needs:
      - classify_browser
      - build
    if: ${{ inputs.site_ref == '' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.classify_browser.result == 'success' && needs.classify_browser.outputs.site_candidate == 'true' && needs.classify_browser.outputs.reference_consumer_required == 'true' }}
    uses: ./.github/workflows/reference-consumer.yml
    with:
      artifact_id: ${{ needs.build.outputs.artifact_id }}
      artifact_digest: ${{ needs.build.outputs.artifact_digest }}
      build_inputs: ${{ needs.build.outputs.build_inputs }}
      browser_required: ${{ needs.classify_browser.outputs.browser_required }}
      pwa_required: ${{ needs.classify_browser.outputs.pwa_required }}
      reference_consumer_required: ${{ needs.classify_browser.outputs.reference_consumer_required }}
      cross_authority_required: ${{ needs.classify_browser.outputs.cross_authority_required }}
  cross_authority:
    needs:
      - classify_browser
      - build
    if: ${{ inputs.site_ref == '' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.classify_browser.result == 'success' && needs.classify_browser.outputs.site_candidate == 'true' && (needs.classify_browser.outputs.browser_required == 'true' || needs.classify_browser.outputs.cross_authority_required == 'true') }}
    uses: ./.github/workflows/site-composition-playground-cross-authority.yml
    with:
      artifact_id: ${{ needs.build.outputs.artifact_id }}
      artifact_digest: ${{ needs.build.outputs.artifact_digest }}
      build_inputs: ${{ needs.build.outputs.build_inputs }}
      browser_required: ${{ needs.classify_browser.outputs.browser_required }}
      pwa_required: ${{ needs.classify_browser.outputs.pwa_required }}
      reference_consumer_required: ${{ needs.classify_browser.outputs.reference_consumer_required }}
      cross_authority_required: ${{ needs.classify_browser.outputs.cross_authority_required }}
  explainability:
    needs:
      - classify_browser
    if: ${{ inputs.site_ref == '' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.classify_browser.result == 'success' && needs.classify_browser.outputs.site_candidate == 'true' && needs.classify_browser.outputs.playground_required == 'true' }}
    uses: ./.github/workflows/site-composition-playground-explain.yml
  playground:
    needs:
      - classify_browser
    if: ${{ inputs.site_ref == '' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.classify_browser.result == 'success' && needs.classify_browser.outputs.site_candidate == 'true' && needs.classify_browser.outputs.playground_required == 'true' }}
    uses: ./.github/workflows/site-composition-playground.yml
