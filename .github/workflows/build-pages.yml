name: Site validation
on:
  pull_request:
  push:
    branches: [site]
permissions:
  contents: read
concurrency:
  group: site-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -m pip install -r requirements-build.lock
      - name: Run Site-owned source and consumer contract tests
        run: python3 -m unittest discover -s tests -v
      - name: Run browser-independent JavaScript tests
        run: node --test tests/*.test.mjs
