name: Build documentation artifact

on:
  pull_request:
    branches:
      - site
  workflow_call:
    inputs:
      site_ref:
        description: Commit, branch, or tag containing the site implementation
        required: false
        type: string
        default: site
      composition_ref:
        description: Optional override for the locked composition publication revision
        required: false
        type: string
        default: ''
      policy_ref:
        description: Optional override for the locked policy publication revision
        required: false
        type: string
        default: ''
      deployment_timestamp:
        description: JST deployment timestamp rendered in the footer; empty for non-deploying builds
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  PUBLIC_SITE_URL: https://templates.moukaeritai.work/

concurrency:
  group: documentation-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'TakashiSasaki/templates'
    runs-on: ubuntu-latest

    steps:
      - name: Check out site implementation
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.site_ref || github.event.pull_request.head.sha || 'site' }}
          path: site-source

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Resolve publication source revisions
        id: publication_refs
        env:
          COMPOSITION_REF_OVERRIDE: ${{ inputs.composition_ref }}
          POLICY_REF_OVERRIDE: ${{ inputs.policy_ref }}
        run: |
          overrides=()
          if [ -n "$COMPOSITION_REF_OVERRIDE" ]; then
            overrides+=(--override "composition=$COMPOSITION_REF_OVERRIDE")
          fi
          if [ -n "$POLICY_REF_OVERRIDE" ]; then
            overrides+=(--override "policy=$POLICY_REF_OVERRIDE")
          fi
          python site-source/scripts/resolve_publication_sources.py \
            --lock site-source/publication-sources.json \
            --output "$GITHUB_OUTPUT" \
            "${overrides[@]}"

      - name: Check out composition publication
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.publication_refs.outputs.composition }}
          path: composition-source

      - name: Check out policy publication
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.publication_refs.outputs.policy }}
          path: policy-source

      - name: Install pinned site dependencies
        run: python -m pip install --requirement site-source/requirements.txt

      - name: Run site assembly tests
        run: PYTHONPATH=site-source python -m unittest discover --start-directory site-source/tests --verbose

      - name: Prepare repository-tree publication
        run: |
          python site-source/scripts/prepare_repository_tree_publication.py \
            --site-root site-source \
            --output-root site-publication

      - name: Assemble the documentation project
        run: |
          python site-source/scripts/assemble_publications_v3.py \
            --publication site=site-publication \
            --publication composition=composition-source \
            --publication policy=policy-source \
            --site-root site-publication \
            --output-root build

      - name: Publish declared translations
        run: |
          python site-source/scripts/publish_provider_translations.py \
            --publication site=site-publication \
            --publication composition=composition-source \
            --publication policy=policy-source \
            --site-root site-publication \
            --output-root build

      - name: Generate repository trees
        run: |
          python site-source/scripts/generate_repository_trees_composition.py \
            --repository "$GITHUB_REPOSITORY" \
            --site-root site-publication \
            --output-root build \
            --publication composition=composition-source \
            --publication policy=policy-source

      - name: Generate inline file previews
        run: |
          python site-source/scripts/generate_repository_file_previews_composition.py \
            --repository "$GITHUB_REPOSITORY" \
            --site-root site-publication \
            --output-root build \
            --publication composition=composition-source \
            --publication policy=policy-source

      - name: Prepare deployment metadata
        id: site_metadata
        run: |
          notice="$(
            python site-source/scripts/prepare_site_metadata.py \
              --config-file build/zensical.toml \
              --deployment-timestamp "${{ inputs.deployment_timestamp }}" \
              --canonical-url "${PUBLIC_SITE_URL}"
          )"
          printf 'notice=%s\n' "$notice" >> "$GITHUB_OUTPUT"

      - name: Build the static site
        run: zensical build --config-file build/zensical.toml --clean --strict

      - name: Generate integrated glossary
        run: |
          python site-source/scripts/generate_glossary.py \
            --repository "$GITHUB_REPOSITORY" \
            --output build/site/glossary/index.json \
            --publication site=site-publication \
            --revision "site=$(git -C site-source rev-parse HEAD)" \
            --publication composition=composition-source \
            --revision "composition=$(git -C composition-source rev-parse HEAD)" \
            --publication policy=policy-source \
            --revision "policy=$(git -C policy-source rev-parse HEAD)"

      - name: Normalize generated canonical links and PWA metadata
        run: |
          python site-source/scripts/finalize_site_metadata.py \
            --site-root build/site \
            --canonical-url "${PUBLIC_SITE_URL}"

      - name: Generate static repository browser
        run: |
          python site-source/scripts/generate_repository_browser_composition.py \
            --repository "$GITHUB_REPOSITORY" \
            --output-root build/site \
            --branch site=site-source \
            --branch composition=composition-source \
            --branch policy=policy-source

      - name: Generate index navigation graph
        run: |
          python site-source/scripts/run_composition_navigation.py graph \
            --repository "$GITHUB_REPOSITORY" \
            --output build/index-navigation.json \
            --provider composition=composition-source \
            --provider policy=policy-source

      - name: Generate index navigation locale overlays
        run: |
          python site-source/scripts/run_composition_navigation.py locales \
            --graph build/index-navigation.json \
            --output build/index-navigation-locales.json \
            --provider composition=composition-source \
            --provider policy=policy-source

      - name: Generate index-guided navigation viewer
        run: |
          python site-source/scripts/run_composition_navigation.py viewer \
            --repository "$GITHUB_REPOSITORY" \
            --graph build/index-navigation.json \
            --site-root site-publication \
            --output-root build/site \
            --provider composition=composition-source \
            --provider policy=policy-source

      - name: Generate localized index-guided navigation viewer
        run: |
          python site-source/scripts/run_composition_navigation.py locale-viewer \
            --repository "$GITHUB_REPOSITORY" \
            --graph build/index-navigation.json \
            --locale-overlays build/index-navigation-locales.json \
            --translation-map build/translation-publication.json \
            --site-root site-publication \
            --output-root build/site \
            --pair-map build/guided-locale-publication.json \
            --provider composition=composition-source \
            --provider policy=policy-source

      - name: Normalize guided canonical links and PWA metadata
        run: |
          python site-source/scripts/finalize_site_metadata.py \
            --site-root build/site/guided \
            --canonical-url "${PUBLIC_SITE_URL}"

      - name: Finalize per-page and translation reader metadata
        run: |
          python site-source/scripts/finalize_translation_reader.py \
            --site-root build/site \
            --translation-map build/translation-publication.json \
            --canonical-url "${PUBLIC_SITE_URL}"

      - name: Finalize localized guided metadata
        run: |
          python site-source/scripts/finalize_guided_locales.py \
            --site-root build/site \
            --pair-map build/guided-locale-publication.json \
            --canonical-url "${PUBLIC_SITE_URL}"

      - name: Annotate Glossary terms
        run: |
          python site-source/scripts/finalize_glossary_annotations.py \
            --site-root build/site \
            --glossary build/site/glossary/index.json

      - name: Verify generated public URL boundary
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          root = Path("build/site")
          forbidden_text = (
              "https://takashisasaki.github.io/templates/",
              "https://templates.moukaeritai.work/templates/",
          )
          root_attribute = re.compile(r'''(?:href|src|action)=["']/templates(?:/|["'])''')

          class URLAttributeParser(HTMLParser):
              def __init__(self) -> None:
                  super().__init__()
                  self.targets = []

              def collect(self, attrs) -> None:
                  for name, value in attrs:
                      if name in {"href", "src", "action", "content"} and value:
                          self.targets.append(value)

              def handle_starttag(self, tag, attrs) -> None:
                  self.collect(attrs)

              def handle_startendtag(self, tag, attrs) -> None:
                  self.collect(attrs)

          def retired_target(value: str) -> bool:
              return (
                  any(value.startswith(prefix) for prefix in forbidden_text)
                  or value == "/templates"
                  or value.startswith("/templates/")
              )

          failures = []
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix.lower() not in {".html", ".xml"}:
                  continue
              text = path.read_text(encoding="utf-8")
              relative = path.relative_to(root)
              browser_source_view = (
                  path.suffix.lower() == ".html"
                  and len(relative.parts) == 4
                  and relative.parts[0] == "files"
                  and relative.parts[2] == "content"
              )
              guided_view = (
                  path.suffix.lower() == ".html"
                  and bool(relative.parts)
                  and (
                      relative.parts[0] == "guided"
                      or (len(relative.parts) > 1 and relative.parts[1] == "guided")
                  )
              )
              if browser_source_view or guided_view:
                  parser = URLAttributeParser()
                  parser.feed(text)
                  if any(retired_target(target) for target in parser.targets):
                      failures.append(path.as_posix())
              elif any(value in text for value in forbidden_text) or root_attribute.search(text):
                  failures.append(path.as_posix())
          if failures:
              raise SystemExit(
                  "generated site retains the retired /templates/ publication base: "
                  + ", ".join(failures)
              )
          PY

      - name: Verify the Pages entry point and deployment notice
        run: |
          test -f build/site/index.html
          test -f build/site/app.webmanifest
          test -f build/site/icon.svg
          test -f build/site/service-worker.js
          test -f build/site/javascripts/pwa.js
          test -f build/site/glossary/index.json
          grep --recursive --include='*.html' --files-with-matches -- \
            'data-glossary-id=' build/site | grep --quiet .
          grep --fixed-strings -- \
            '"id": "templates-provider-branch"' \
            build/site/glossary/index.json
          grep --fixed-strings -- \
            '"id": "templates-composition-component"' \
            build/site/glossary/index.json
          site_revision="$(git -C site-source rev-parse HEAD)"
          composition_revision="$(git -C composition-source rev-parse HEAD)"
          grep --fixed-strings -- \
            "\"source_revision\": \"${site_revision}\"" \
            build/site/glossary/index.json
          grep --fixed-strings -- \
            "\"source_revision\": \"${composition_revision}\"" \
            build/site/glossary/index.json
          grep --fixed-strings -- \
            '<link rel="manifest" href="/app.webmanifest">' \
            build/site/index.html
          grep --fixed-strings -- \
            '<meta name="theme-color" content="#3f51b5">' \
            build/site/index.html
          test -f build/site/composition/index.html
          test -f build/site/skill/index.html
          test -f build/site/capabilities/runtime/index.html
          test -f build/site/webapp/index.html
          test -f build/site/lifecycle/composition-state/index.html
          test -f build/site/policy/index.html
          test -f build/site/policy/provider/index.html
          test -f build/site/policy/shared-policy/index.html
          test -f build/site/policy/consumer/index.html
          test -f build/site/repository-trees/index.html
          test -f build/site/repository-trees/composition/index.html
          test -f build/site/repository-trees/policy/index.html
          for publication in composition policy; do
            page="build/site/repository-trees/${publication}/index.html"
            grep --fixed-strings -- 'repository-file-viewer' "$page"
            if grep --quiet --fixed-strings -- 'repository-file-preview-link' "$page"; then
              test -n "$(
                find \
                  "build/site/repository-trees/previews/${publication}" \
                  -type f \
                  -name '*.html' \
                  -print \
                  -quit
              )"
            fi
          done
          test -f build/site/files/index.html
          test -f build/site/files/repository-browser.js
          for branch in site composition policy; do
            page="build/site/files/${branch}/index.html"
            test -f "$page"
            grep --fixed-strings -- 'repository-file-viewer' "$page"
            grep --fixed-strings -- \
              '<script src="../repository-browser.js" defer></script>' "$page"
            test -n "$(
              find \
                "build/site/files/${branch}/content" \
                -type f \
                -name '*.html' \
                -print \
                -quit
            )"
          done
          test -f build/site/guided/index.html
          test -f build/site/guided/graph.json
          grep --fixed-strings -- 'Index-guided document discovery' \
            build/site/guided/index.html
          grep --fixed-strings -- \
            '<link rel="manifest" href="/app.webmanifest">' \
            build/site/guided/index.html
          grep --fixed-strings -- \
            '<meta name="theme-color" content="#3f51b5">' \
            build/site/guided/index.html
          for provider in composition policy; do
            page="build/site/guided/${provider}/index.html"
            revision="$(git -C "${provider}-source" rev-parse HEAD)"
            test -f "$page"
            grep --fixed-strings -- 'Index-guided navigation' "$page"
            grep --fixed-strings -- "$revision" "$page"
            grep --fixed-strings -- \
              '<link rel="manifest" href="/app.webmanifest">' "$page"
            grep --fixed-strings -- \
              '<meta name="theme-color" content="#3f51b5">' "$page"
          done
          test -f build/site/ja/guided/index.html
          test ! -e build/site/ja/guided/graph.json
          grep --fixed-strings -- \
            '<link rel="manifest" href="/app.webmanifest">' \
            build/site/ja/guided/index.html
          grep --fixed-strings -- \
            'data-copy-name="public URL"' \
            build/site/ja/guided/index.html
          grep --fixed-strings -- \
            '<script src="/javascripts/guided-copy.js" defer></script>' \
            build/site/ja/guided/index.html
          python - <<'PY'
          import json
          from pathlib import Path, PurePosixPath

          root = Path("build/site")
          graph = json.loads((root / "guided/graph.json").read_text(encoding="utf-8"))
          if graph.get("schema_version") != 1:
            raise SystemExit("guided graph schema version mismatch")
          if [provider.get("name") for provider in graph.get("providers", [])] != ["composition", "policy"]:
            raise SystemExit("guided graph provider order mismatch")
          for provider in graph.get("providers", []):
              name = provider["name"]
              for index in provider["indexes"]:
                  source = index["path"]
                  if source == "docs/index.md":
                      page = root / "guided" / name / "index.html"
                  elif source == "index.md":
                      page = root / "guided" / "_repository-root" / name / "index.html"
                  else:
                      page = root / "guided" / name / Path(PurePosixPath(source).parent.as_posix()) / "index.html"
                  if not page.is_file():
                      raise SystemExit(f"missing guided index page: {page}")
          PY
          grep --fixed-strings -- \
            "${{ steps.site_metadata.outputs.notice }}" \
            build/site/index.html

      - name: Record build provenance
        run: |
          python site-source/scripts/write_publication_provenance.py \
            --output build/site/build-provenance.json \
            --repository "$GITHUB_REPOSITORY" \
            --site-commit "$(git -C site-source rev-parse HEAD)" \
            --publication-commit "composition=$(git -C composition-source rev-parse HEAD)" \
            --publication-commit "policy=$(git -C policy-source rev-parse HEAD)"

      - name: Validate generated site links
        run: |
          python site-source/scripts/validate_site_links.py \
            --site-root build/site \
            --config-file build/zensical.toml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  check:
    if: >-
      github.repository == 'TakashiSasaki/templates' &&
      github.event_name == 'pull_request' &&
      inputs.site_ref == '' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out proposed Site revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download built Pages artifact
        uses: actions/download-artifact@v5
        with:
          name: github-pages
          path: pages-artifact

      - name: Extract built site
        run: |
          mkdir -p build/site
          tar --extract --file pages-artifact/artifact.tar --directory build/site
          test -f build/site/index.html

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Playwright controller
        run: python -m pip install --disable-pip-version-check -r requirements-visual.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Check mobile layout geometry
        run: |
          python scripts/check_mobile_layout.py \
            --site-root build/site \
            --output-root build/mobile-visual

      - name: Check localized inline Glossary chrome
        run: |
          python scripts/check_glossary_locale_chrome.py \
            --site-root build/site \
            --output build/mobile-visual/glossary-locale-chrome.json

      - name: Check PWA freshness lifecycle
        run: |
          python scripts/check_pwa_freshness.py \
            --site-root build/site \
            --output build/mobile-visual/pwa-freshness.json

      - name: Check localized PWA freshness chrome
        run: |
          python scripts/check_pwa_locale_chrome.py \
            --site-root build/site \
            --output build/mobile-visual/pwa-locale-chrome.json

      - name: Check PWA document commit correlation
        run: |
          python scripts/check_pwa_commit_regressions.py \
            --site-root build/site \
            --output build/mobile-visual/pwa-document-commit.json

      - name: Check PWA slow-network convergence
        run: |
          python scripts/check_pwa_slow_convergence.py \
            --site-root build/site \
            --output build/mobile-visual/pwa-slow-convergence.json

      - name: Check PWA freshness capability messaging
        run: |
          python scripts/check_pwa_capabilities.py \
            --site-root build/site \
            --output build/mobile-visual/pwa-capabilities.json

      - name: Upload mobile visual evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mobile-visual-${{ github.event.pull_request.number }}
          path: build/mobile-visual
          if-no-files-found: warn
          retention-days: 7
