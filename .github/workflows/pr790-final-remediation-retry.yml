name: PR 790 final remediation retry

on:
  push:
    branches:
      - perf/site-provider-materialization-phase
    paths:
      - .github/workflows/pr790-final-remediation-retry.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/site-provider-materialization-phase
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Apply existing remediation and normalize v4 output roots
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/pr790-final-remediation.yml').read_text(encoding='utf-8')
          start = workflow.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = workflow.index("\n          PY\n", start)
          embedded = workflow[start:end]
          embedded = '\n'.join(line[10:] if line.startswith('          ') else line for line in embedded.splitlines())
          exec(compile(embedded, '<embedded-remediation>', 'exec'))

          source_path = Path('scripts/materialize_publication_assets.py')
          source = source_path.read_text(encoding='utf-8')
          function_start = source.index('def _materializer_output_roots(\n')
          function_end = source.index('def _check_reserved_stamp_collision(catalog: Any, label: str) -> None:\n', function_start)
          replacement = dedent(r'''
          def _materializer_output_roots(
              root: Path,
              version: int,
              source_catalog: Any | None,
          ) -> tuple[PurePosixPath, ...]:
              if version == 4:
                  assert source_catalog is not None
                  roots: list[PurePosixPath] = []
                  for asset in source_catalog.generated_assets:
                      parsed = PurePosixPath(asset.source)
                      candidate = parsed.parent if parsed.parent != PurePosixPath('.') else parsed
                      if candidate not in roots:
                          roots.append(candidate)
                  return tuple(roots)

              try:
                  data = read_json_object(root / CATALOG, "publication catalog")
              except PublicationContractError as exc:
                  raise PublicationMaterializationError(str(exc)) from exc

              roots: list[PurePosixPath] = []

              def add_source(value: Any) -> None:
                  if not isinstance(value, str) or not value or "\\" in value or ":" in value or "\0" in value:
                      return
                  parsed = PurePosixPath(value)
                  if parsed.is_absolute() or any(
                      part in ("", ".", "..") or part.casefold() == ".git"
                      for part in parsed.parts
                  ):
                      return
                  if parsed not in roots:
                      roots.append(parsed)

              for collection in ("documents", "assets"):
                  raw_items = data.get(collection)
                  if isinstance(raw_items, list):
                      for raw in raw_items:
                          if isinstance(raw, dict):
                              add_source(raw.get("source"))
              glossary = data.get("glossary")
              if isinstance(glossary, dict):
                  add_source(glossary.get("source"))

              generated_root = PurePosixPath("generated")
              if generated_root not in roots:
                  roots.append(generated_root)
              return tuple(roots)
          ''').lstrip()
          source = source[:function_start] + replacement + '\n\n' + source[function_end:]
          source_path.write_text(source, encoding='utf-8')
          PY

      - name: Syntax check
        run: python -m py_compile scripts/materialize_publication_assets.py tests/test_materialize_publication_assets_review_followup.py

      - name: Run focused regressions
        run: >-
          python -m unittest
          tests.test_materialize_publication_assets
          tests.test_materialize_publication_assets_review_followup
          tests.test_assembly_materialization_boundary
          --verbose

      - name: Commit remediation and remove temporary workflows
        shell: bash
        run: |
          rm .github/workflows/pr790-final-remediation.yml
          rm .github/workflows/pr790-final-remediation-retry.yml
          git config user.name "Takashi SASAKI"
          git config user.email "takashi316@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Close final materialization snapshot races"
          git push origin HEAD:perf/site-provider-materialization-phase
