name: Regenerate self-hosted policy projections

on:
  push:
    branches:
      - agent/single-agent-policy-skill

permissions:
  contents: write

concurrency:
  group: regenerate-self-host-agent-policy
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONHOME: ""
      PYTHONPATH: ""
      PYTHONNOUSERSITE: "1"
      PIP_CONFIG_FILE: /dev/null
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/single-agent-policy-skill

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.13"

      - name: Create isolated environment
        run: python -I -m venv --clear .venv

      - name: Install locked CI environment
        run: |
          .venv/bin/python -m pip install --disable-pip-version-check --no-deps --requirement requirements-ci.lock
          .venv/bin/python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .

      - name: Regenerate policy projections
        run: .venv/bin/agent-policy --repository . render --config .agent-policy.yml

      - name: Commit generated projections
        run: |
          if git diff --quiet -- AGENTS.md .github/REVIEW_GUIDELINES.md .agent-policy.lock; then
            echo "Generated projections are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md .github/REVIEW_GUIDELINES.md .agent-policy.lock
          git commit -m "Regenerate self-hosted policy projections"
          git push origin HEAD:agent/single-agent-policy-skill
