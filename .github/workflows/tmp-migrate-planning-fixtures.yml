name: Temporary migrate planning-mode fixtures
on:
  push:
    branches:
      - agent/planning-requirement-ledger-pr16
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/planning-requirement-ledger-pr16
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Migrate implementation-evidence v3 fixtures to v4
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              'tests/test_webapp_static_browser_inspection.py',
              'tests/test_field_log_evidence_gap.py',
              'tests/test_task_ledger_walkthrough_browser_acceptance.py',
              'tests/test_webapp_evidence_projection.py',
              'tests/test_webapp_productization_acceptance.py',
              'tests/test_service_interface_contract.py',
              'tests/test_webapp_auth_productization.py',
              'tests/test_release_evidence_producer.py',
              'tests/test_cli_interface_contract.py',
              'tests/test_implementation_evidence_deferred.py',
              'tests/test_implementation_evidence_schema.py',
              'tests/test_implementation_evidence_requirement_traceability.py',
              'examples/onboarding/task-ledger/implementation-evidence.example.json',
          ]
          for name in paths:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              old = '"schemaVersion": 3'
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f'{name}: expected implementation-evidence schemaVersion 3')
              path.write_text(text.replace(old, '"schemaVersion": 4'), encoding='utf-8')
              print(f'{name}: migrated {count}')
          PY
      - name: Create validation environment
        run: |
          python -I -m venv --clear .venv
          .venv/bin/python -m pip install --isolated --disable-pip-version-check --no-deps --requirement requirements-dev.lock
          .venv/bin/python -m pip check
      - name: Run focused planning-state tests
        run: |
          .venv/bin/python -m unittest tests.test_implementation_evidence_planning -v
          .venv/bin/python -m unittest tests.test_implementation_evidence_schema -v
          .venv/bin/python -m unittest tests.test_webapp_evidence_scaffold -v
      - name: Audit remaining schema/version literals
        if: always()
        run: |
          echo '=== remaining schemaVersion 3 ==='
          grep -RIn --include='*.py' --include='*.json' --include='*.md' '"schemaVersion"[[:space:]]*:[[:space:]]*3' tests components docs examples translations || true
          echo '=== likely stale current component versions ==='
          grep -RIn --include='*.py' -E '(to_version|\["version"\]|get\("version"\)).*(10|7|5|3)' tests || true
          echo '=== implementation evidence schema registration/current assertions ==='
          grep -RIn --include='*.py' -E '(implementation_evidence|implementation-evidence).*(schema|version|3|7)' tests || true
      - name: Commit migrations and remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/tmp-migrate-planning-fixtures.yml
          git config user.name 'TakashiSasaki templates automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Migrate implementation-evidence fixtures to v4'
            git push origin HEAD:agent/planning-requirement-ledger-pr16
          fi
