name: Site Composition Playground explainability

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled

permissions:
  contents: read

concurrency:
  group: site-composition-playground-explain-${{ github.workflow }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'ci/full-qualification' && github.event.label.name != 'ci/full-site-verification') && format('unrelated-label-{0}', github.run_id) || (github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify Playground explainability requirement
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'ci/full-qualification' ||
      github.event.label.name == 'ci/full-site-verification'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      required: ${{ steps.classify.outputs.browser_required }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Check out repository history for change classification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.13'
      - name: Classify Playground explainability requirement
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FORCE_FULL_REQUESTED: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'ci/full-qualification') || contains(github.event.pull_request.labels.*.name, 'ci/full-site-verification'))) }}
        run: |
          set -euo pipefail
          classifier_dir="$RUNNER_TEMP/site-ci-classifier-authority"
          rm -rf "$classifier_dir"
          mkdir -p "$classifier_dir"
          force_full="${FORCE_FULL_REQUESTED:-false}"
          git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths.txt"
          if git show "$BASE_SHA:scripts/classify_site_ci.py" > "$classifier_dir/classify_site_ci.py" 2>/dev/null; then
            output_file="$RUNNER_TEMP/site-ci-output.txt"
            python3 -I "$classifier_dir/classify_site_ci.py" \
              --changed-paths "$RUNNER_TEMP/changed-paths.txt" \
              --force-full "$force_full" \
              --output "$output_file"
            req="$(grep '^browser_required=' "$output_file" | cut -d= -f2)"
            reason="$(grep '^reason=' "$output_file" | cut -d= -f2)"
            echo "browser_required=$req" >> "$GITHUB_OUTPUT"
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
          else
            echo "browser_required=true" >> "$GITHUB_OUTPUT"
            echo "reason=base-classifier-unavailable" >> "$GITHUB_OUTPUT"
          fi

  explainability:
    name: projection explanations and browser acceptance
    needs: classify
    if: >-
      always() &&
      needs.classify.result == 'success' &&
      needs.classify.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: ""

      - name: Run Playground consumer and explainability tests
        run: |
          node --test tests/composition-playground.test.mjs
          node --test tests/composition-playground-final-remediation.test.mjs
          node --test tests/composition-playground-hash-copy-review.test.mjs
          node --test tests/composition-playground-final-three-review.test.mjs
          node --test tests/composition-playground-latest-review.test.mjs
          node --test tests/composition-playground-root-reachability.test.mjs
          node --test tests/composition-playground-latest-five-review.test.mjs
          node --test tests/composition-playground-explain.test.mjs

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-visual.txt

      - name: Validate cross-authority trigger contract
        run: python -I tests/test_composition_playground_cross_authority_workflow.py

      - name: Install browser acceptance dependency
        run: python -m pip install --disable-pip-version-check --requirement requirements-visual.txt

      - name: Verify system Chrome runtime
        run: |
          google-chrome --version
          echo "Playwright launch mode: channel=chrome" >> "$GITHUB_STEP_SUMMARY"

      - name: Run 360px keyboard, share-state, and desktop-grid acceptance
        run: |
          python -I scripts/check_composition_playground_browser.py
          python -I scripts/check_composition_playground_final_browser.py
          python -I scripts/check_composition_playground_final_three_browser.py
          python -I scripts/check_composition_playground_final_grid_browser.py

      - name: Verify exact-head and active publication binding
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_COMPOSITION_REVISION: 2b07b411dc7e903f84dcaf89900ebd614a4cde7a
          EXPECTED_POLICY_REVISION: c5a3294809a1066bf59b83f467f1d597f885289a
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          grep --fixed-strings -- 'composition-playground-explain.js' zensical.template.toml
          grep --fixed-strings -- 'composition-playground-v1.json.gz' docs/composition-playground.md
          python -I scripts/resolve_publication_sources.py > "$RUNNER_TEMP/publication-sources.txt"
          test "$(wc -l < "$RUNNER_TEMP/publication-sources.txt")" -eq 2
          grep --fixed-strings --line-regexp -- "composition=$EXPECTED_COMPOSITION_REVISION" "$RUNNER_TEMP/publication-sources.txt"
          grep --fixed-strings --line-regexp -- "policy=$EXPECTED_POLICY_REVISION" "$RUNNER_TEMP/publication-sources.txt"
