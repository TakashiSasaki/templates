name: Site Composition Playground explainability
on:
  workflow_call: {}
permissions:
  contents: read
jobs:
  classify:
    name: Classify Playground explainability requirement
    uses: ./.github/workflows/classify.yml
    if: github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'ci/full-qualification' || github.event.label.name == 'ci/full-site-verification' || github.event.label.name == 'ci/browser'
  explainability:
    name: projection explanations
    needs: classify
    if: always() && needs.classify.result == 'success' && needs.classify.outputs.playground_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ''
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Run Playground consumer and explainability tests
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/run_site_preflight.py fast --check node --check site-contracts --expected-head "$EXPECTED_HEAD"
  browser:
    name: Playground browser acceptance
    needs:
      - classify
      - explainability
    if: ${{ needs.classify.outputs.browser_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-visual.txt
      - name: Install browser acceptance dependency
        run: python -m pip install --disable-pip-version-check --requirement requirements-visual.txt
      - name: Verify system Chrome runtime
        run: |
          google-chrome --version
          echo "Playwright launch mode: channel=chrome" >> "$GITHUB_STEP_SUMMARY"
      - name: Run 360px keyboard, share-state, and desktop-grid acceptance
        run: |
          python -I scripts/check_composition_playground_browser.py
          python -I scripts/check_composition_playground_final_browser.py
          python -I scripts/check_composition_playground_final_three_browser.py
          python -I scripts/check_composition_playground_final_grid_browser.py
