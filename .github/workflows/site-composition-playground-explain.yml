name: Site Composition Playground explainability

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled

permissions:
  contents: read

concurrency:
  group: site-composition-playground-explain-${{ github.workflow }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'ci/full-qualification' && github.event.label.name != 'ci/full-site-verification' && github.event.label.name != 'ci/browser') && format('unrelated-label-{0}', github.run_id) || (github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify Playground explainability requirement
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'ci/full-qualification' ||
      github.event.label.name == 'ci/full-site-verification' || github.event.label.name == 'ci/browser'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      required: ${{ steps.classify.outputs.playground_required }}
      browser_required: ${{ steps.classify.outputs.browser_required }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Check out repository history for change classification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.13'
      - name: Classify Playground explainability requirement
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FORCE_BROWSER_REQUESTED: ${{ contains(github.event.pull_request.labels.*.name, 'ci/browser') }}
          FORCE_FULL_REQUESTED: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'ci/full-qualification') || contains(github.event.pull_request.labels.*.name, 'ci/full-site-verification'))) }}
        run: |
          set -euo pipefail
          classifier_dir="$RUNNER_TEMP/site-ci-classifier-authority"
          rm -rf "$classifier_dir"
          mkdir -p "$classifier_dir"
          force_full="${FORCE_FULL_REQUESTED:-false}"
          git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths.txt"
          if git show "$BASE_SHA:scripts/classify_site_ci.py" > "$classifier_dir/classify_site_ci.py" 2>/dev/null; then
            browser_args=()
            if grep -q -- '--force-browser' "$classifier_dir/classify_site_ci.py"; then
              browser_args=(--force-browser "${FORCE_BROWSER_REQUESTED:-false}")
            elif [ "${FORCE_BROWSER_REQUESTED:-false}" = true ]; then
              force_full=true
            fi
            output_file="$RUNNER_TEMP/site-ci-output.txt"
            python3 -I "$classifier_dir/classify_site_ci.py" \
              --changed-paths "$RUNNER_TEMP/changed-paths.txt" \
              --force-full "$force_full" "${browser_args[@]}" \
              --output "$output_file"
            for capability in build_required browser_required pwa_required reference_consumer_required cross_authority_required playground_required; do
              value="$(sed -n "s/^${capability}=//p" "$output_file")"
              if [ -z "$value" ] && [ "$capability" = playground_required ]; then value=true; fi
              case "$value" in true|false) ;; *) exit 1 ;; esac
              echo "$capability=$value" >> "$GITHUB_OUTPUT"
            done
            sed -n '/^reason=/p' "$output_file" >> "$GITHUB_OUTPUT"
          else
            echo "playground_required=true" >> "$GITHUB_OUTPUT"
            echo "browser_required=true" >> "$GITHUB_OUTPUT"
            echo "browser_required=true" >> "$GITHUB_OUTPUT"
            echo "reason=base-classifier-unavailable" >> "$GITHUB_OUTPUT"
          fi

  explainability:
    name: projection explanations
    needs: classify
    if: >-
      always() &&
      needs.classify.result == 'success' &&
      needs.classify.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: ""

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-visual.txt

      - name: Run Playground consumer and explainability tests
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python scripts/run_site_preflight.py fast
          --check node-explainability
          --expected-head "$EXPECTED_HEAD"

      - name: Validate cross-authority trigger contract
        run: python -I tests/test_composition_playground_cross_authority_workflow.py

      - name: Verify exact-head and active publication binding
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          grep --fixed-strings -- 'composition-playground-explain.js' zensical.template.toml
          grep --fixed-strings -- 'composition-playground-v1.json.gz' docs/composition-playground.md
          python -I scripts/resolve_publication_sources.py > "$RUNNER_TEMP/publication-sources.txt"
          test "$(wc -l < "$RUNNER_TEMP/publication-sources.txt")" -eq 2
          grep --extended-regexp --line-regexp -- 'composition=[0-9a-f]{40}' "$RUNNER_TEMP/publication-sources.txt"
          grep --extended-regexp --line-regexp -- 'policy=[0-9a-f]{40}' "$RUNNER_TEMP/publication-sources.txt"

  browser:
    name: Playground browser acceptance
    needs: [classify, explainability]
    if: ${{ needs.classify.outputs.browser_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser acceptance dependency
        run: python -m pip install --disable-pip-version-check --requirement requirements-visual.txt

      - name: Verify system Chrome runtime
        run: |
          google-chrome --version
          echo "Playwright launch mode: channel=chrome" >> "$GITHUB_STEP_SUMMARY"

      - name: Run 360px keyboard, share-state, and desktop-grid acceptance
        run: |
          python -I scripts/check_composition_playground_browser.py
          python -I scripts/check_composition_playground_final_browser.py
          python -I scripts/check_composition_playground_final_three_browser.py
          python -I scripts/check_composition_playground_final_grid_browser.py
