name: Temporary integrate #834 exact build reuse

on:
  push:
    branches:
      - feat/site-exact-build-reuse

permissions:
  contents: read

jobs:
  diagnose-merge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/site-exact-build-reuse
          fetch-depth: 0
          persist-credentials: false

      - name: Apply clean historical #834 member patches
        run: |
          set -euo pipefail
          clean_paths=(
            .github/workflows/build-pages-stacked-site.yml
            .github/workflows/deploy-pages.yml
            .github/workflows/reference-consumer.yml
            .github/workflows/site-build-detailed-profile.yml
            MAINTENANCE.md
            requirements-build.lock
            scripts/classify_site_ci.py
            scripts/site_build_artifact.py
            scripts/verify_site_full_qualification.py
            tests/test_site_browser_qualification_workflows.py
            tests/test_site_build_artifact.py
            tests/test_site_build_artifact_review_regression.py
            tests/test_site_composition_materialization_cross_authority_workflow.py
            tests/test_stacked_site_documentation_workflow.py
            tests/test_verify_site_full_qualification.py
          )
          for path in "${clean_paths[@]}"; do
            patch="$RUNNER_TEMP/member.patch"
            git diff ecf7aec28793609a1a38f43998530fed0a4ccb25 cde90168a6c34c3c78b7c1b8d0e4b64b5d3fa4a2 -- "$path" > "$patch"
            test -s "$patch"
            git apply --check "$patch"
            git apply "$patch"
          done

      - name: Capture three-way merge results
        id: merge
        shell: bash
        run: |
          set -u
          base=ecf7aec28793609a1a38f43998530fed0a4ccb25
          theirs=cde90168a6c34c3c78b7c1b8d0e4b64b5d3fa4a2
          debug_root="$RUNNER_TEMP/site-834-merge-debug"
          mkdir -p "$debug_root/files"
          : > "$debug_root/report.txt"
          conflicts=0
          paths=(
            .github/workflows/build-pages.yml
            .github/workflows/check-publication-freshness.yml
            .github/workflows/provider-coexistence.yml
            .github/workflows/site-composition-materialization-cross-authority.yml
            .github/workflows/site-composition-playground-cross-authority.yml
            .github/workflows/site-full-qualification.yml
            tests/test_composition_playground_cross_authority_workflow.py
            tests/test_publication_freshness_workflow.py
          )
          for path in "${paths[@]}"; do
            safe="${path//\//__}"
            base_file="$debug_root/${safe}.base"
            theirs_file="$debug_root/${safe}.theirs"
            git show "$base:$path" > "$base_file"
            git show "$theirs:$path" > "$theirs_file"
            git merge-file --diff3 -L current -L historical-base -L historical-834 "$path" "$base_file" "$theirs_file"
            status=$?
            if [ "$status" -eq 0 ]; then
              echo "MERGED $path" | tee -a "$debug_root/report.txt"
            else
              echo "CONFLICT($status) $path" | tee -a "$debug_root/report.txt"
              conflicts=$((conflicts + 1))
            fi
            cp "$path" "$debug_root/files/$safe"
            grep -n -C 12 '^<<<<<<< current$\|^||||||| historical-base$\|^=======$\|^>>>>>>> historical-834$' "$path" \
              > "$debug_root/${safe}.markers.txt" || true
          done
          printf 'conflicts=%s\n' "$conflicts" | tee -a "$debug_root/report.txt"
          echo "conflicts=$conflicts" >> "$GITHUB_OUTPUT"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/site-834-merge-debug.tar.gz" site-834-merge-debug
          cat "$debug_root/report.txt"
          exit 0

      - name: Upload merge diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: site-834-merge-debug
          path: ${{ runner.temp }}/site-834-merge-debug.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Fail closed after diagnostics are retained
        env:
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        run: |
          set -euo pipefail
          test "${CONFLICTS:-1}" -eq 0
