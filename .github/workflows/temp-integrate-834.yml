name: Temporary integrate #834 exact build reuse

on:
  push:
    branches: [feat/site-exact-build-reuse]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/site-exact-build-reuse
          fetch-depth: 0

      - name: Apply historical #834 members
        run: |
          set -euo pipefail
          clean_paths=(
            .github/workflows/build-pages-stacked-site.yml
            .github/workflows/deploy-pages.yml
            .github/workflows/reference-consumer.yml
            .github/workflows/site-build-detailed-profile.yml
            MAINTENANCE.md requirements-build.lock scripts/classify_site_ci.py
            scripts/site_build_artifact.py scripts/verify_site_full_qualification.py
            tests/test_site_browser_qualification_workflows.py
            tests/test_site_build_artifact.py tests/test_site_build_artifact_review_regression.py
            tests/test_site_composition_materialization_cross_authority_workflow.py
            tests/test_stacked_site_documentation_workflow.py tests/test_verify_site_full_qualification.py
          )
          for path in "${clean_paths[@]}"; do
            git diff ecf7aec28793609a1a38f43998530fed0a4ccb25 cde90168a6c34c3c78b7c1b8d0e4b64b5d3fa4a2 -- "$path" > "$RUNNER_TEMP/member.patch"
            test -s "$RUNNER_TEMP/member.patch"
            git apply --check "$RUNNER_TEMP/member.patch"
            git apply "$RUNNER_TEMP/member.patch"
          done
          set +e
          mkdir -p "$RUNNER_TEMP/merge"
          overlap=(
            .github/workflows/build-pages.yml .github/workflows/check-publication-freshness.yml
            .github/workflows/provider-coexistence.yml .github/workflows/site-composition-materialization-cross-authority.yml
            .github/workflows/site-composition-playground-cross-authority.yml .github/workflows/site-full-qualification.yml
          )
          for path in "${overlap[@]}"; do
            safe="${path//\//__}"
            git show ecf7aec28793609a1a38f43998530fed0a4ccb25:"$path" > "$RUNNER_TEMP/merge/$safe.base"
            git show cde90168a6c34c3c78b7c1b8d0e4b64b5d3fa4a2:"$path" > "$RUNNER_TEMP/merge/$safe.theirs"
            git merge-file --diff3 -L current -L historical-base -L historical-834 "$path" "$RUNNER_TEMP/merge/$safe.base" "$RUNNER_TEMP/merge/$safe.theirs"
          done
          exit 0

      - name: Resolve prerequisite overlaps
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          START='<<<<<<< current\n'; BASE='||||||| historical-base\n'; SEP='=======\n'; END='>>>>>>> historical-834\n'
          def resolve(path,replacements):
              p=Path(path); text=p.read_text()
              for repl in replacements:
                  s=text.index(START); b=text.index(BASE,s); q=text.index(SEP,b); e=text.index(END,q)+len(END)
                  text=text[:s]+repl+text[e:]
              if any(x in text for x in ('<<<<<<< ','||||||| ','>>>>>>> ')): raise SystemExit(f'unresolved marker: {path}')
              p.write_text(text)
          with_codex="      - site-composition-audience-publication-staging\n      - 'site-*'\n      - 'perf/site-*'\n      - codex/site-composition-playground-v1-shell\n"
          without_codex="      - site-composition-audience-publication-staging\n      - 'site-*'\n      - 'perf/site-*'\n"
          resolve('.github/workflows/build-pages.yml',[with_codex,''])
          p=Path('.github/workflows/build-pages.yml'); text=p.read_text()
          needle='      - name: Run site assembly tests\n        run: PYTHONPATH=site-source python -m unittest discover --start-directory site-source/tests --verbose\n'
          literal='        if: '+'$'+"{{ steps.artifact.outputs.reused != 'true' }}\n"
          if text.count(needle)!=1: raise SystemExit(f'assembly block count={text.count(needle)}')
          p.write_text(text.replace(needle,'      - name: Run site assembly tests\n'+literal+'        run: PYTHONPATH=site-source python -m unittest discover --start-directory site-source/tests --verbose\n',1))
          resolve('.github/workflows/check-publication-freshness.yml',[without_codex])
          resolve('.github/workflows/provider-coexistence.yml',[without_codex])
          resolve('.github/workflows/site-composition-materialization-cross-authority.yml',[with_codex])
          resolve('.github/workflows/site-composition-playground-cross-authority.yml',[with_codex])
          resolve('.github/workflows/site-full-qualification.yml',[with_codex])

          p=Path('tests/test_composition_playground_cross_authority_workflow.py'); text=p.read_text()
          text=re.sub(r'EXPECTED_BASES = \{.*?\n\}', 'EXPECTED_BASES = {\n    "codex/site-composition-playground-v1-shell",\n    "site",\n    "feat/site-*",\n    "site-composition-audience-publication-staging",\n    "site-*",\n    "perf/site-*",\n}', text, count=1, flags=re.S)
          p.write_text(text)

          p=Path('tests/test_publication_freshness_workflow.py'); text=p.read_text()
          pattern=r'(self\.assertEqual\(\n)\s*\[[^\n]+\],\n(\s*pull_request\["branches"\],)'
          repl=r'\1            ["site", "feat/site-*", "site-composition-audience-publication-staging", "site-*", "perf/site-*", "codex/site-composition-playground-v1-shell"],\n\2'
          text,n=re.subn(pattern,repl,text,count=1)
          if n!=1: raise SystemExit('freshness branch expectation not found')
          text=text.replace('self.assertEqual({"contents": "read"}, self.workflow["permissions"])','self.assertEqual({"contents": "read", "actions": "read"}, self.workflow["permissions"])')
          text=text.replace('self.assertEqual({"contents": "read"}, candidate["permissions"])','self.assertEqual({"contents": "read", "actions": "read"}, candidate["permissions"])')
          p.write_text(text)
          PY

      - name: Validate integrated contracts
        run: |
          set -euo pipefail
          ! grep -R -n '^<<<<<<< \|^||||||| \|^>>>>>>> ' .github/workflows tests/test_composition_playground_cross_authority_workflow.py tests/test_publication_freshness_workflow.py
          grep -F 'SITE_PUBLICATION_ROOT' .github/workflows/build-pages.yml
          grep -F 'ci/browser' .github/workflows/build-pages.yml
          grep -F 'reuse_pr_build' .github/workflows/build-pages.yml
          grep -F 'site_build_artifact.py' .github/workflows/build-pages.yml
          grep -F '6b7d764c963f957c6bee43c0c1d42eb03970ec8f' .github/workflows/site-composition-materialization-cross-authority.yml
          test ! -e .github/workflows/build-pages-stacked-site.yml
          python -m pip install --disable-pip-version-check PyYAML==6.0.3
          python -m unittest tests.test_composition_playground_cross_authority_workflow tests.test_publication_freshness_workflow tests.test_site_browser_qualification_workflows tests.test_site_build_artifact tests.test_site_build_artifact_review_regression tests.test_site_composition_materialization_cross_authority_workflow tests.test_stacked_site_documentation_workflow tests.test_verify_site_full_qualification -v

      - name: Stage integrated members
        run: |
          set -euo pipefail
          stage=tmp/site-ci-recovery/834; rm -rf "$stage"; mkdir -p "$stage"
          workflows=(.github/workflows/build-pages.yml .github/workflows/check-publication-freshness.yml .github/workflows/deploy-pages.yml .github/workflows/provider-coexistence.yml .github/workflows/reference-consumer.yml .github/workflows/site-build-detailed-profile.yml .github/workflows/site-composition-materialization-cross-authority.yml .github/workflows/site-composition-playground-cross-authority.yml .github/workflows/site-full-qualification.yml)
          for path in "${workflows[@]}"; do cp "$path" "$stage/${path//\//__}"; done
          printf '%s\n' '.github/workflows/build-pages-stacked-site.yml' > "$stage/DELETE.txt"
          git restore -- "${workflows[@]}"; git restore --source=HEAD -- .github/workflows/build-pages-stacked-site.yml
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MAINTENANCE.md requirements-build.lock scripts/classify_site_ci.py scripts/site_build_artifact.py scripts/verify_site_full_qualification.py tests/test_composition_playground_cross_authority_workflow.py tests/test_publication_freshness_workflow.py tests/test_site_browser_qualification_workflows.py tests/test_site_build_artifact.py tests/test_site_build_artifact_review_regression.py tests/test_site_composition_materialization_cross_authority_workflow.py tests/test_stacked_site_documentation_workflow.py tests/test_verify_site_full_qualification.py "$stage"
          git commit -m 'Stage integrated #834 exact-build-reuse members'
          git push origin HEAD:feat/site-exact-build-reuse
