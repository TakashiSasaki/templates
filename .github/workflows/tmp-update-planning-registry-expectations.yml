name: Temporary update planning registry expectations
on:
  push:
    branches:
      - agent/planning-requirement-ledger-pr16
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/planning-requirement-ledger-pr16
          fetch-depth: 0
      - name: Update selected-component template evidence expectations
        run: python .github/tmp/update_planning_registry_expectations.py
      - name: Audit remaining implementation-evidence deferred expectations
        run: grep -RIn --include='*.py' -E 'implementation-evidence.*deferred|DEFERRED: implementation-evidence' tests || true
      - name: Commit and self-delete
        run: |
          rm -f .github/tmp/update_planning_registry_expectations.py
          rm -f .github/workflows/tmp-update-planning-registry-expectations.yml
          git config user.name 'TakashiSasaki templates automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Align template evidence validation expectations'
          git push origin HEAD:agent/planning-requirement-ledger-pr16
