name: Contract validation

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: contract-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked validation dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-dev.lock

      - name: Verify installed dependency graph
        run: python -m pip check

      - name: Validate contracts as a standalone script
        run: python scripts/validate_contracts.py

      - name: Validate contracts as a module
        run: python -m scripts.validate_contracts

      - name: Run tests
        run: python -m unittest discover -s tests -v
