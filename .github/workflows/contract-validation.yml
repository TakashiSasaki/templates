name: Contract validation

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: contract-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked validation dependencies
        run: python -m pip install --disable-pip-version-check --no-deps --requirement requirements-dev.lock

      - name: Verify installed dependency graph
        run: python -m pip check

      - name: Validate contracts as a standalone script
        run: python scripts/validate_contracts.py

      - name: Validate contracts as a module
        run: python -m scripts.validate_contracts

      - name: Run tests
        run: python -m unittest discover -s tests -v
