name: Prepare workflow strategy installer publication
on:
  push:
    branches:
      - release/workflow-strategy-publication
    paths:
      - '.github/workflows/prepare-workflow-strategy-publication.yml'
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'TakashiSasaki/templates'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact preparation head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare publication and commit through GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request

          old_i = '709df0be6287723bf3f1bb38ae5f64d8b3bde08e'
          old_s = 'a7b260ccc361ad8cd1bab94803a9b355c640fe7e'
          new_i = '23ac7ce36e6e0d11f4a7bc72ab1103d1062f31ae'
          new_s = '20cdbc720249516e3d30fc93e050391b81eaa6b4'
          content_paths = [
              pathlib.Path('README.md'),
              pathlib.Path('docs/bootstrap.md'),
              pathlib.Path('docs/getting-started.md'),
              pathlib.Path('release/skill-installer.json'),
              pathlib.Path('tests/test_skill_installer_publication.py'),
              pathlib.Path('translations/ja/docs/bootstrap.md'),
              pathlib.Path('translations/ja/docs/getting-started.md'),
          ]
          manifest_path = pathlib.Path('translations/manifest.json')
          root = pathlib.Path('.').resolve()
          token = os.environ['GH_TOKEN']
          expected = os.environ['EXPECTED_SHA']
          branch = os.environ['BRANCH']
          repository = os.environ['REPOSITORY']
          api = f'https://api.github.com/repos/{repository}'

          def call(method: str, path: str, payload: object | None = None) -> object:
              data = None if payload is None else json.dumps(payload, separators=(',', ':')).encode()
              request = urllib.request.Request(
                  api + path,
                  data=data,
                  method=method,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'templates-installer-publication-preparer/1',
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          ref_path = '/git/ref/heads/' + urllib.parse.quote(branch, safe='/')
          ref = call('GET', ref_path)
          if not isinstance(ref, dict) or ref.get('object', {}).get('sha') != expected:
              raise SystemExit('branch moved before publication preparation')

          total_i = 0
          total_s = 0
          for relative in content_paths:
              path = root / relative
              text = path.read_text(encoding='utf-8')
              count_i = text.count(old_i)
              count_s = text.count(old_s)
              total_i += count_i
              total_s += count_s
              text = text.replace(old_i, new_i).replace(old_s, new_s)
              if old_i in text or old_s in text:
                  raise SystemExit(f'{relative}: old immutable identity remained after replacement')
              path.write_text(text, encoding='utf-8')
          if total_i < 1 or total_s < 1:
              raise SystemExit(f'expected published identities were not found: I={total_i} S={total_s}')

          def git_blob_sha(path: pathlib.Path) -> str:
              data = (root / path).read_bytes()
              prefix = f'blob {len(data)}\0'.encode('ascii')
              return hashlib.sha1(prefix + data).hexdigest()

          canonical_blobs = {
              'docs/bootstrap.md': git_blob_sha(pathlib.Path('docs/bootstrap.md')),
              'docs/getting-started.md': git_blob_sha(pathlib.Path('docs/getting-started.md')),
          }
          manifest = json.loads((root / manifest_path).read_text(encoding='utf-8'))
          if not isinstance(manifest, dict) or not isinstance(manifest.get('translations'), list):
              raise SystemExit('translation manifest shape is unsupported')
          observed = set()
          for item in manifest['translations']:
              if not isinstance(item, dict):
                  continue
              canonical = item.get('canonical')
              if canonical in canonical_blobs:
                  item['canonical_blob_sha'] = canonical_blobs[canonical]
                  observed.add(canonical)
          if observed != set(canonical_blobs):
              raise SystemExit(f'translation provenance entries missing: {set(canonical_blobs) - observed}')
          (root / manifest_path).write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          commit = call('GET', f'/git/commits/{expected}')
          if not isinstance(commit, dict) or not isinstance(commit.get('tree'), dict):
              raise SystemExit('unable to resolve base tree')
          entries = []
          for relative in [*content_paths, manifest_path]:
              blob = call(
                  'POST',
                  '/git/blobs',
                  {
                      'content': base64.b64encode((root / relative).read_bytes()).decode('ascii'),
                      'encoding': 'base64',
                  },
              )
              if not isinstance(blob, dict) or not isinstance(blob.get('sha'), str):
                  raise SystemExit(f'blob creation failed: {relative}')
              entries.append({'path': relative.as_posix(), 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          tree = call('POST', '/git/trees', {'base_tree': commit['tree']['sha'], 'tree': entries})
          created = call(
              'POST',
              '/git/commits',
              {
                  'message': 'Publish corrected workflow installer chain',
                  'tree': tree['sha'],
                  'parents': [expected],
              },
          )
          ref = call('GET', ref_path)
          if not isinstance(ref, dict) or ref.get('object', {}).get('sha') != expected:
              raise SystemExit('branch moved before guarded publication ref update')
          call('PATCH', '/git/refs/heads/' + urllib.parse.quote(branch, safe='/'), {'sha': created['sha'], 'force': False})
          print(f"Publication candidate commit: {created['sha']}")
          print(f"bootstrap canonical blob: {canonical_blobs['docs/bootstrap.md']}")
          print(f"getting-started canonical blob: {canonical_blobs['docs/getting-started.md']}")
          PY
