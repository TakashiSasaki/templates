name: Close checkpoint action registry

on:
  push:
    branches:
      - feat/executable-lifecycle-next-step-clean
    paths:
      - .github/workflows/close-checkpoint-action-registry.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Run line-oriented registry repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Tighten registry parser
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("components/lifecycle.composition-state/files/.template-composition/validate.py")
          lines = path.read_text(encoding="utf-8").splitlines()

          actions_line = '    actions = registry.get("actions")'
          if lines.count(actions_line) != 1:
              raise SystemExit(f"actions line count mismatch: {lines.count(actions_line)}")
          i = lines.index(actions_line)
          expected = [
              '    actions = registry.get("actions")',
              '    if not isinstance(actions, dict):',
              '        return None',
              '    entry = actions.get(action)',
          ]
          if lines[i:i + 4] != expected:
              raise SystemExit(f"actions slice mismatch: {lines[i:i + 4]!r}")
          replacement = [
              '    actions = registry.get("actions")',
              '    if (',
              '        registry.get("$schema") != "./lifecycle-checkpoint-actions.schema.json"',
              '        or not isinstance(actions, dict)',
              '        or set(actions) != {',
              '            "create-planning-checkpoint",',
              '            "create-product-checkpoint",',
              '        }',
              '    ):',
              '        return None',
              '    entry = actions.get(action)',
          ]
          lines[i:i + 4] = replacement

          binding_line = '    if any(token not in argv for token in caller_inputs):'
          if lines.count(binding_line) != 1:
              raise SystemExit(f"binding line count mismatch: {lines.count(binding_line)}")
          j = lines.index(binding_line)
          if lines[j:j + 2] != [binding_line, '        return None']:
              raise SystemExit(f"binding slice mismatch: {lines[j:j + 2]!r}")
          lines[j:j + 2] = [
              '    if (',
              '        any(token not in argv for token in caller_inputs)',
              '        or any(token not in argv for token in bindings)',
              '    ):',
              '        return None',
          ]

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          python -m py_compile components/lifecycle.composition-state/files/.template-composition/validate.py tests/test_lifecycle_next_actions.py
          python -m unittest tests.test_lifecycle_next_actions
      - name: Commit repair and remove workflow
        env:
          BRANCH: feat/executable-lifecycle-next-step-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/lifecycle.composition-state/files/.template-composition/validate.py
          git rm .github/workflows/close-checkpoint-action-registry.yml
          git commit -m "Fail closed on malformed checkpoint action registries"
          git push origin HEAD:${BRANCH}
