name: Initialize orphan site branch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/init-orphan-site.yml
  pull_request_target:
    types:
      - edited

permissions:
  contents: write

jobs:
  initialize:
    if: >-
      github.repository == 'TakashiSasaki/templates' &&
      (
        github.event_name == 'push' ||
        (
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.number == 2 &&
          contains(github.event.pull_request.body, '<!-- initialize-orphan-site -->')
        )
      )
    runs-on: ubuntu-latest

    steps:
      - name: Check out trusted default-branch code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace site with an orphan root commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --orphan site-root
          git rm -rf .

          cat > README.md <<'EOF'
          # Documentation site

          This branch contains only the source and deployment workflow for the
          TakashiSasaki/templates GitHub Pages site.

          Canonical documentation content remains on the `main` branch.
          EOF

          git add README.md
          git commit -m "Initialize documentation site branch"

          parent_count=$(git rev-list --parents -n 1 HEAD | awk '{print NF - 1}')
          if [[ "$parent_count" -ne 0 ]]; then
            echo "Expected an orphan root commit, found $parent_count parent(s)." >&2
            exit 1
          fi

          git push --force origin HEAD:site
