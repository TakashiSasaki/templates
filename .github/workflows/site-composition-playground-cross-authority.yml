name: Site Composition Playground cross-authority acceptance

on:
  pull_request:
    branches:
      - codex/site-composition-playground-v1-shell
      - site
    types:
      - opened
      - synchronize
      - reopened
      - labeled

permissions:
  contents: read
  actions: read

concurrency:
  group: site-composition-playground-cross-authority-${{ (github.event.action == 'labeled' && github.event.label.name != 'ci/full-qualification' && github.event.label.name != 'ci/full-site-verification') && format('unrelated-label-{0}', github.run_id) || (github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify cross-authority acceptance requirement
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'ci/full-qualification' ||
      github.event.label.name == 'ci/full-site-verification'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      required: ${{ steps.classify.outputs.cross_authority_required }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Check out repository history for change classification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.13'
      - name: Classify cross-authority acceptance requirement
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FORCE_FULL_REQUESTED: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'ci/full-qualification') || contains(github.event.pull_request.labels.*.name, 'ci/full-site-verification'))) }}
        run: |
          set -euo pipefail
          classifier_dir="$RUNNER_TEMP/site-ci-classifier-authority"
          rm -rf "$classifier_dir"
          mkdir -p "$classifier_dir"
          force_full="${FORCE_FULL_REQUESTED:-false}"
          git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths.txt"
          if git show "$BASE_SHA:scripts/classify_site_ci.py" > "$classifier_dir/classify_site_ci.py" 2>/dev/null; then
            output_file="$RUNNER_TEMP/site-ci-output.txt"
            python3 -I "$classifier_dir/classify_site_ci.py" \
              --changed-paths "$RUNNER_TEMP/changed-paths.txt" \
              --force-full "$force_full" \
              --output "$output_file"
            req="$(grep '^cross_authority_required=' "$output_file" | cut -d= -f2)"
            reason="$(grep '^reason=' "$output_file" | cut -d= -f2)"
            echo "cross_authority_required=$req" >> "$GITHUB_OUTPUT"
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
          else
            echo "cross_authority_required=true" >> "$GITHUB_OUTPUT"
            echo "reason=base-classifier-unavailable" >> "$GITHUB_OUTPUT"
          fi

  build_candidate:
    name: Build exact cross-authority candidate
    needs: classify
    if: >-
      github.repository == 'TakashiSasaki/templates' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.classify.outputs.required == 'true'
    uses: ./.github/workflows/build-pages.yml
    with:
      site_ref: ${{ github.event.pull_request.head.sha }}
      composition_ref: 2575a4257398426378443074af743d78ff61dbff

  producer_consumer:
    name: Real producer to Chromium consumer
    if: >-
      github.repository == 'TakashiSasaki/templates' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.classify.outputs.required == 'true'
    needs: [classify, build_candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact Site candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download normally assembled Pages artifact
        uses: actions/download-artifact@v5
        with:
          name: github-pages
          path: pages-artifact

      - name: Extract built Site
        run: |
          mkdir -p build/site
          tar --extract --file pages-artifact/artifact.tar --directory build/site
          test -f build/site/playground/index.html
          test -f build/site/composition/playground/composition-playground-v1.json.gz
          test -f build/site/build-provenance.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.13'

      - name: Install Playwright controller
        run: python -m pip install --disable-pip-version-check -r requirements-visual.txt

      - name: Verify system Chrome runtime
        run: |
          google-chrome --version | tee "$RUNNER_TEMP/system-chrome-version.txt"
          echo "Playwright launch mode: channel=chrome" >> "$GITHUB_STEP_SUMMARY"

      - name: Exercise actual Composition candidate through actual Site candidate
        env:
          EXPECTED_SITE_REVISION: ${{ github.event.pull_request.head.sha }}
          EXPECTED_PROVIDER_REVISION: 2575a4257398426378443074af743d78ff61dbff
          EXPECTED_SEMANTIC_REVISION: 84bb23f6e8ebf5cafbef3e93f25b7076fe47f3b7
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SITE_REVISION"
          python scripts/check_composition_playground_cross_authority.py \
            --site-root build/site \
            --expected-site-revision "$EXPECTED_SITE_REVISION" \
            --expected-provider-revision "$EXPECTED_PROVIDER_REVISION" \
            --expected-semantic-revision "$EXPECTED_SEMANTIC_REVISION"
          python scripts/check_composition_playground_final_browser.py --site-root build/site
          python scripts/check_composition_playground_final_grid_browser.py --site-root build/site
          python scripts/check_composition_playground_latest_five_browser.py --site-root build/site
          python scripts/check_composition_playground_webmcp_browser.py --site-root build/site
