name: Site Composition Playground cross-authority acceptance
on:
  workflow_call:
    inputs:
      artifact_id:
        type: string
        required: true
      artifact_digest:
        type: string
        required: true
      build_inputs:
        type: string
        required: true
      browser_required:
        type: string
        required: true
      pwa_required:
        type: string
        required: true
      reference_consumer_required:
        type: string
        required: true
      cross_authority_required:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  producer_consumer:
    name: Real producer to Chromium consumer
    if: github.repository == 'TakashiSasaki/templates' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && inputs.browser_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact Site candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify and consume scheduled Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ARTIFACT_ID: ${{ inputs.artifact_id }}
          BUILD_ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          BUILD_INPUTS: ${{ inputs.build_inputs }}
        run: python3 scripts/consume_site_build_artifact.py
      - name: Install Playwright controller
        run: python3 -m pip install --disable-pip-version-check -r requirements-visual.txt
      - name: Validate visual entrypoint dependency boundary
        run: python3 scripts/check_python_dependencies.py . --environment visual
      - name: Verify system Chrome runtime
        run: |
          google-chrome --version | tee "$RUNNER_TEMP/system-chrome-version.txt"
          echo "Playwright launch mode: channel=chrome" >> "$GITHUB_STEP_SUMMARY"
      - name: Exercise integrated projection through exact Site UI
        env:
          EXPECTED_SITE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SITE_REVISION"
          python3 scripts/check_composition_playground_cross_authority.py --site-root build/site --expected-site-revision "$EXPECTED_SITE_REVISION" --from-bundle
          python3 scripts/check_composition_playground_final_browser.py --site-root build/site
          python3 scripts/check_composition_playground_final_grid_browser.py --site-root build/site
          python3 scripts/check_composition_playground_latest_five_browser.py --site-root build/site
          python3 scripts/check_composition_playground_webmcp_browser.py --site-root build/site
