name: Site Composition Playground cross-authority acceptance

on:
  pull_request:
    branches:
      - site
      - 'feat/site-*'
      - site-composition-audience-publication-staging
      - 'site-*'
      - 'perf/site-*'
      - codex/site-composition-playground-v1-shell
    types:
      - opened
      - synchronize
      - reopened
      - labeled

permissions:
  contents: read
  actions: read

concurrency:
  group: site-composition-playground-cross-authority-${{ (github.event.action == 'labeled' && github.event.label.name != 'ci/full-qualification' && github.event.label.name != 'ci/full-site-verification' && github.event.label.name != 'ci/browser') && format('unrelated-label-{0}', github.run_id) || (github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify cross-authority acceptance requirement
    uses: ./.github/workflows/classify.yml
    if: github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'ci/full-qualification' || github.event.label.name == 'ci/full-site-verification' || github.event.label.name == 'ci/browser'

  build_candidate:
    name: Build exact cross-authority candidate
    needs: classify
    if: >-
      github.repository == 'TakashiSasaki/templates' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.classify.outputs.required == 'true' || needs.classify.outputs.browser_required == 'true')
    uses: ./.github/workflows/build-pages.yml
    with:
      reuse_pr_build: true
      site_ref: ${{ github.event.pull_request.head.sha }}
      composition_ref: ${{ needs.classify.outputs.composition_revision }}

  producer_consumer:
    name: Real producer to Chromium consumer
    if: >-
      github.repository == 'TakashiSasaki/templates' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.classify.outputs.browser_required == 'true'
    needs: [classify, build_candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact Site candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download normally assembled Pages artifact
        uses: actions/download-artifact@v5
        with:
          name: github-pages
          path: pages-artifact

      - name: Extract built Site
        run: |
          mkdir -p build/site
          tar --extract --file pages-artifact/artifact.tar --directory build/site
          test -f build/site/playground/index.html
          test -f build/site/composition/playground/composition-playground-v1.json.gz
          test -f build/site/build-provenance.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: 'requirements*.txt'

      - name: Install Playwright controller
        run: python -m pip install --disable-pip-version-check -r requirements-visual.txt

      - name: Verify system Chrome runtime
        run: |
          google-chrome --version | tee "$RUNNER_TEMP/system-chrome-version.txt"
          echo "Playwright launch mode: channel=chrome" >> "$GITHUB_STEP_SUMMARY"

      - name: Exercise actual Composition candidate through actual Site candidate
        env:
          EXPECTED_SITE_REVISION: ${{ github.event.pull_request.head.sha }}
          EXPECTED_PROVIDER_REVISION: ${{ needs.classify.outputs.composition_revision }}
          EXPECTED_SEMANTIC_REVISION: ${{ needs.classify.outputs.semantic_revision }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SITE_REVISION"
          python scripts/check_composition_playground_cross_authority.py             --site-root build/site             --expected-site-revision "$EXPECTED_SITE_REVISION"             --expected-provider-revision "$EXPECTED_PROVIDER_REVISION"             --expected-semantic-revision "$EXPECTED_SEMANTIC_REVISION"
          python scripts/check_composition_playground_final_browser.py --site-root build/site
          python scripts/check_composition_playground_final_grid_browser.py --site-root build/site
          python scripts/check_composition_playground_latest_five_browser.py --site-root build/site
          python scripts/check_composition_playground_webmcp_browser.py --site-root build/site
