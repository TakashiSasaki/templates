name: PR6 unit-test diagnostics

on:
  pull_request:
    branches:
      - site

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Site candidate
        uses: actions/checkout@v7
        with:
          path: site-source

      - name: Check out locked Composition provider
        uses: actions/checkout@v7
        with:
          ref: af5712208e88b3fcd7db744503ae3ffa32414da7
          path: composition-source

      - name: Check out locked Policy provider
        uses: actions/checkout@v7
        with:
          ref: 27a3319a3785250236bee056fd917379c245aaef
          path: policy-source

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pinned Site dependencies
        run: python -m pip install --requirement site-source/requirements.txt

      - name: Run first-failure Site test diagnostics
        run: PYTHONPATH=site-source python -m unittest discover --start-directory site-source/tests --failfast
