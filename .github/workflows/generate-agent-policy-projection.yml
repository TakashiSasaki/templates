name: Generate agent policy projection
on:
  pull_request:
    paths:
      - '.agent-policy.yml'
      - '.github/workflows/generate-agent-policy-projection.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: TakashiSasaki/templates@2d18f495d0494961f8da5ac10dfca332409cd2d8
        with:
          command: render
          config: .agent-policy.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-policy-projection
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .agent-policy.lock
            AGENTS.md
            .review-authority/review-policy.md
            .agents/skills/
