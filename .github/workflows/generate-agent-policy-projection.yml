name: Finalize agent policy projection
on:
  push:
    branches:
      - fix/workflow-strategy-self-host
    paths:
      - '.github/workflows/generate-agent-policy-projection.yml'
permissions:
  contents: write
jobs:
  finalize:
    if: github.repository == 'TakashiSasaki/templates'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact intermediate head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Render with exact corrected Policy toolchain
        uses: TakashiSasaki/templates@2d18f495d0494961f8da5ac10dfca332409cd2d8
        with:
          command: render
          config: .agent-policy.yml
      - name: Commit exact generated bytes through GitHub Git Data API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request

          token = os.environ['GH_TOKEN']
          expected = os.environ['EXPECTED_SHA']
          branch = os.environ['BRANCH']
          repository = os.environ['REPOSITORY']
          root = pathlib.Path('.').resolve()
          api = f'https://api.github.com/repos/{repository}'

          def call(method: str, path: str, payload: object | None = None) -> object:
              data = None
              if payload is not None:
                  data = json.dumps(payload, separators=(',', ':')).encode('utf-8')
              request = urllib.request.Request(
                  api + path,
                  data=data,
                  method=method,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'templates-policy-projection-finalizer/1',
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          ref_path = '/git/ref/heads/' + urllib.parse.quote(branch, safe='/')
          ref = call('GET', ref_path)
          if not isinstance(ref, dict) or ref.get('object', {}).get('sha') != expected:
              raise SystemExit('branch moved before projection commit')

          lock = (root / '.agent-policy.lock').read_text(encoding='utf-8')
          if '2d18f495d0494961f8da5ac10dfca332409cd2d8' not in lock:
              raise SystemExit('rendered lock is not bound to exact corrected toolchain')

          paths = [
              pathlib.Path('.agent-policy.lock'),
              pathlib.Path('AGENTS.md'),
              pathlib.Path('.review-authority/review-policy.md'),
          ]
          skill_root = root / '.agents' / 'skills'
          for path in sorted(skill_root.rglob('*')):
              if path.is_symlink():
                  raise SystemExit(f'generated projection contains symlink: {path}')
              if path.is_file():
                  paths.append(path.relative_to(root))

          commit = call('GET', f'/git/commits/{expected}')
          if not isinstance(commit, dict) or not isinstance(commit.get('tree'), dict):
              raise SystemExit('unable to resolve base tree')
          base_tree = commit['tree']['sha']

          entries = []
          for relative in paths:
              data = (root / relative).read_bytes()
              blob = call(
                  'POST',
                  '/git/blobs',
                  {
                      'content': base64.b64encode(data).decode('ascii'),
                      'encoding': 'base64',
                  },
              )
              if not isinstance(blob, dict) or not isinstance(blob.get('sha'), str):
                  raise SystemExit(f'blob creation failed: {relative}')
              entries.append(
                  {
                      'path': relative.as_posix(),
                      'mode': '100644',
                      'type': 'blob',
                      'sha': blob['sha'],
                  }
              )

          tree = call('POST', '/git/trees', {'base_tree': base_tree, 'tree': entries})
          if not isinstance(tree, dict) or not isinstance(tree.get('sha'), str):
              raise SystemExit('tree creation failed')
          created = call(
              'POST',
              '/git/commits',
              {
                  'message': 'Synchronize regenerated workflow policy projection',
                  'tree': tree['sha'],
                  'parents': [expected],
              },
          )
          if not isinstance(created, dict) or not isinstance(created.get('sha'), str):
              raise SystemExit('commit creation failed')

          ref = call('GET', ref_path)
          if not isinstance(ref, dict) or ref.get('object', {}).get('sha') != expected:
              raise SystemExit('branch moved before guarded ref update')
          call('PATCH', '/git/refs/heads/' + urllib.parse.quote(branch, safe='/'), {'sha': created['sha'], 'force': False})
          print(f"Projection commit: {created['sha']}")
          PY
