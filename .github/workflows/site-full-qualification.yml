name: Site full qualification
on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: Exact Site head to audit
        required: true
        type: string
permissions:
  contents: read
  checks: read
  actions: read
concurrency:
  group: site-full-qualification-${{ (github.event.action == 'labeled' && github.event.label.name != 'ci/full-qualification' && github.event.label.name != 'ci/full-site-verification') && format('unrelated-label-{0}', github.run_id) || (github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true
jobs:
  validate:
    name: Site Full Qualification / validate
    if: github.repository == 'TakashiSasaki/templates'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out Site candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate exact-head Full Qualification across the Site DAG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ inputs.head_sha }}
          REPO: ${{ github.repository }}
          TRIGGER_TIME: ''
          RUN_ID: ''
        run: |
          args=(
            --repo "$REPO"
            --head-sha "$HEAD_SHA"
            --token "$GITHUB_TOKEN"
            --timeout-seconds 0
            --poll-interval-seconds 20
          )
          if [ -n "$RUN_ID" ]; then
            args+=(--qualification-run-id "$RUN_ID")
          fi
          if [ -n "$TRIGGER_TIME" ]; then
            args+=(--qualification-trigger-time "$TRIGGER_TIME")
          fi
          python3 scripts/verify_site_full_qualification.py "${args[@]}"
