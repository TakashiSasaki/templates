name: Site full qualification

on:
  pull_request:
    branches:
      - site
      - 'feat/site-*'
    types:
      - opened
      - synchronize
      - reopened
      - labeled

permissions:
  contents: read
  checks: read
  actions: read

concurrency:
  group: site-full-qualification-${{ (github.event.action == 'labeled' && github.event.label.name != 'ci/full-qualification' && github.event.label.name != 'ci/full-site-verification') && format('unrelated-label-{0}', github.run_id) || (github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify full qualification requirement
    if: >-
      github.repository == 'TakashiSasaki/templates' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'pull_request' ||
       github.event.action != 'labeled' ||
       github.event.label.name == 'ci/full-qualification' ||
       github.event.label.name == 'ci/full-site-verification')
    runs-on: ubuntu-24.04
    outputs:
      full_required: ${{ steps.classify.outputs.full_required }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Check out Site candidate for classification
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.13'

      - name: Classify full qualification scope
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FORCE_FULL_REQUESTED: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'ci/full-qualification') || contains(github.event.pull_request.labels.*.name, 'ci/full-site-verification'))) }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ] || [ "${FORCE_FULL_REQUESTED:-false}" = "true" ]; then
            echo "full_required=true" >> "$GITHUB_OUTPUT"
            echo "reason=explicit-full-requested" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/site-fq-paths.txt"
          classifier_dir="$RUNNER_TEMP/site-ci-classifier-authority"
          rm -rf "$classifier_dir"
          mkdir -p "$classifier_dir"

          if git show "$BASE_SHA:scripts/classify_site_ci.py" > "$classifier_dir/classify_site_ci.py" 2>/dev/null; then
            output_file="$RUNNER_TEMP/site-ci-output.txt"
            python3 -I "$classifier_dir/classify_site_ci.py" \
              --changed-paths "$RUNNER_TEMP/site-fq-paths.txt" \
              --output "$output_file"
            full_req="$(grep '^full_required=' "$output_file" | cut -d= -f2)"
            reason="$(grep '^reason=' "$output_file" | cut -d= -f2)"
            echo "full_required=$full_req" >> "$GITHUB_OUTPUT"
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
          else
            echo "full_required=true" >> "$GITHUB_OUTPUT"
            echo "reason=base-classifier-unavailable-full" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: Site Full Qualification / validate
    needs: classify
    if: >-
      always() &&
      github.repository == 'TakashiSasaki/templates' &&
      needs.classify.result == 'success' &&
      needs.classify.outputs.full_required == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out Site candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.13'

      - name: Validate exact-head Full Qualification across all Site workflows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
          TRIGGER_TIME: ${{ github.event.pull_request.updated_at }}
          RUN_ID: ${{ github.run_id }}
        run: |
          args=(
            --repo "$REPO"
            --head-sha "$HEAD_SHA"
            --token "$GITHUB_TOKEN"
            --timeout-seconds 2400
            --poll-interval-seconds 20
          )
          if [ -n "$RUN_ID" ]; then
            args+=(--qualification-run-id "$RUN_ID")
          fi
          if [ -n "$TRIGGER_TIME" ]; then
            args+=(--qualification-trigger-time "$TRIGGER_TIME")
          fi
          python3 scripts/verify_site_full_qualification.py "${args[@]}"
