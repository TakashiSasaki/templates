name: Temporary planning-mode focused checks
on:
  push:
    branches:
      - agent/planning-requirement-ledger-pr16
permissions:
  contents: write
jobs:
  focused:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/planning-requirement-ledger-pr16
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.lock
      - name: Run focused planning and scaffold tests
        run: |
          python -m unittest tests.test_implementation_evidence_planning -v
          python -m unittest tests.test_webapp_evidence_scaffold -v
      - name: Inventory stale implementation-evidence schema and component expectations
        if: always()
        shell: bash
        run: |
          echo '=== implementation-evidence schemaVersion 3 literals ==='
          grep -RIn --include='*.py' --include='*.json' --include='*.md' '"schemaVersion"[[:space:]]*:[[:space:]]*3' tests components docs examples translations || true
          echo '=== implementation-evidence component/version references ==='
          grep -RIn --include='*.py' --include='*.json' -E 'implementation-evidence.*(version|7)|artifact\.webapp-core.*(version|10)|composition-state.*(version|5)|release-execution.*(version|3)' tests || true
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/tmp-test-planning-mode.yml
          git config user.name 'TakashiSasaki templates automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Remove temporary planning-mode checks'
            git push origin HEAD:agent/planning-requirement-ledger-pr16
          fi
