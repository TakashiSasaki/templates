name: Advance Composition publication for PR 649

on:
  pull_request:
    branches:
      - site
    paths:
      - .github/workflows/advance-composition-publication-649.yml

permissions:
  contents: write

jobs:
  advance:
    if: >-
      github.repository == 'TakashiSasaki/templates' &&
      github.event.pull_request.number == 649 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'site-website-webapp-ia-cutover'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact Site PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Check out exact merged Composition provider
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: b4581b58301b1f2736fce86dfcd56d7ddb98bff0
          path: .provider-composition
          persist-credentials: false
          fetch-depth: 1

      - name: Advance canonical publication source and projections
        run: >-
          python3 -I scripts/advance_publication_source.py
          --site-root .
          --provider composition
          --provider-root .provider-composition
          --composition-root .provider-composition
          --target b4581b58301b1f2736fce86dfcd56d7ddb98bff0
          --expected-current 09fa0124669b9a655c97fbe1155d1d1f93f66f27

      - name: Require exact generated scope
        run: |
          git status --short
          unexpected="$(git status --short | awk '{print $2}' | grep -Ev '^(publication-sources\.json|agent\.json|assets/agent\.json|\.provider-composition/)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "unexpected generated paths:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          git diff --exit-code -- . ':!publication-sources.json' ':!agent.json' ':!assets/agent.json'
          grep -F 'b4581b58301b1f2736fce86dfcd56d7ddb98bff0' publication-sources.json
          cmp agent.json assets/agent.json

      - name: Commit generated publication advance
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          rm -rf .provider-composition
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publication-sources.json agent.json assets/agent.json
          git diff --cached --check
          git commit -m 'chore: advance Composition publication'
          git push origin "HEAD:${TARGET_BRANCH}"
