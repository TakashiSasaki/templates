name: Temporary evidence docs patch

on:
  push:
    branches:
      - agent/evidence-v2-walkthrough-pr8

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/evidence-v2-walkthrough-pr8
          fetch-depth: 0
      - name: Patch evidence guidance and translations
        run: python scripts/temp_patch_evidence_docs.py
      - name: Commit docs and remove temporary patch machinery
        run: |
          rm scripts/temp_patch_evidence_docs.py
          rm .github/workflows/temp-patch-evidence-docs.yml
          git config user.name "TakashiSasaki templates automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Align evidence guidance with deferred release semantics"
          git push origin HEAD:refs/heads/agent/evidence-v2-walkthrough-pr8
