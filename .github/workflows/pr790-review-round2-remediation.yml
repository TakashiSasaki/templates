name: PR 790 output snapshot remediation

on:
  push:
    branches:
      - perf/site-provider-materialization-phase

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Stage PR 790 output snapshot remediation'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/site-provider-materialization-phase
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply current review remediation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/materialize_publication_assets.py')
          text = path.read_text(encoding='utf-8')

          old = '''    return tuple(roots)\n\n\ndef _check_reserved_stamp_collision'''
          new = '''    # Schema v3 cannot classify source/output lifecycle. The conventional\n    # materializer bridge treats the conventional generated/ subtree as\n    # materializer-owned state so deterministic regeneration is not mistaken\n    # for concurrent source mutation. Declared products are still digest-bound.\n    generated_root = PurePosixPath("generated")\n    if generated_root not in roots:\n        roots.append(generated_root)\n    return tuple(roots)\n\n\ndef _check_reserved_stamp_collision'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''def _assert_provider_reuse_identity(\n'''
          helper = '''def _assert_materialization_fingerprint(\n    root: Path,\n    expected: str,\n    label: str,\n    *,\n    boundary: str,\n) -> None:\n    current = _materialization_fingerprint(root, root / MATERIALIZER)\n    if current != expected:\n        raise PublicationMaterializationError(\n            f"{label}: publication materialization fingerprint changed {boundary}; "\n            "retry after obtaining a stable provider source snapshot"\n        )\n\n\n'''
          assert text.count(old) == 1
          text = text.replace(old, helper + old, 1)

          old = '''def _assert_materializer_input_state(\n    root: Path,\n    expected_git_revision: str,\n    expected_worktree_fingerprint: str,\n    output_roots: tuple[PurePosixPath, ...],\n    label: str,\n    *,\n    boundary: str,\n) -> None:\n'''
          new = '''def _assert_materializer_input_state(\n    root: Path,\n    expected_git_revision: str,\n    expected_worktree_fingerprint: str,\n    pre_run_untracked_paths: tuple[bytes, ...],\n    output_roots: tuple[PurePosixPath, ...],\n    label: str,\n    *,\n    boundary: str,\n) -> None:\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '''            excluded_roots=output_roots,\n        )\n        if current != expected_worktree_fingerprint:\n'''
          new = '''            excluded_roots=output_roots,\n            untracked_paths=pre_run_untracked_paths,\n        )\n        if current != expected_worktree_fingerprint:\n'''
          # first occurrence after helper is the input-state function; reuse exact count guard conservatively
          idx = text.index('def _assert_materializer_input_state')
          before, after = text[:idx], text[idx:]
          assert after.count(old) >= 1
          after = after.replace(old, new, 1)
          text = before + after

          marker = '''\ndef _write_stamp(\n'''
          snapshot_helpers = '''\ndef _snapshot_materialized_outputs(\n    root: Path,\n    label: str,\n    version: int,\n    catalog: Any,\n) -> dict[str, str]:\n    digests: dict[str, str] = {}\n    if version == 4:\n        for asset in catalog.generated_assets:\n            path = root / asset.source\n            if asset.optional and not path.exists() and not path.is_symlink():\n                continue\n            field = f"{label} generated asset {asset.source}"\n            for candidate in sorted(_enumerate_stamp_asset_files(root, asset.source, field)):\n                digests[candidate.relative_to(root).as_posix()] = _hash_stamp_file(\n                    root, candidate, field\n                )\n        return digests\n\n    for asset in catalog.assets:\n        path = root / asset.source\n        if asset.optional and not path.exists() and not path.is_symlink():\n            continue\n        field = f"{label} asset {asset.source}"\n        for candidate in sorted(_enumerate_stamp_asset_files(root, asset.source, field)):\n            digests[candidate.relative_to(root).as_posix()] = _hash_stamp_file(\n                root, candidate, field\n            )\n    for doc in catalog.documents:\n        path = root / doc.source\n        if doc.optional and not path.exists() and not path.is_symlink():\n            continue\n        field = f"{label} document {doc.source}"\n        digests[path.relative_to(root).as_posix()] = _hash_stamp_file(root, path, field)\n    if catalog.glossary_source is not None:\n        path = root / catalog.glossary_source\n        field = f"{label} glossary {catalog.glossary_source}"\n        digests[path.relative_to(root).as_posix()] = _hash_stamp_file(root, path, field)\n    return digests\n\n\ndef _assert_output_snapshot(\n    root: Path,\n    label: str,\n    version: int,\n    catalog: Any,\n    expected: dict[str, str],\n    *,\n    boundary: str,\n) -> None:\n    current = _snapshot_materialized_outputs(root, label, version, catalog)\n    if current != expected:\n        raise PublicationMaterializationError(\n            f"{label}: materialized output snapshot changed {boundary}; "\n            "retry after obtaining stable publication outputs"\n        )\n\n'''
          assert text.count(marker) == 1
          text = text.replace(marker, snapshot_helpers + marker, 1)

          start = text.index('def _write_stamp(')
          digest_start = text.index('    generated_digests: dict[str, str] = {}\n', start)
          semantic = text.index('    semantic_rev = _provider_semantic_revision(root)\n', digest_start)
          text = text[:digest_start] + '    generated_digests = _snapshot_materialized_outputs(root, label, version, catalog)\n\n' + text[semantic:]

          old = '''    input_worktree_fingerprint: str = "",\n    output_roots: tuple[PurePosixPath, ...] = (),\n) -> str:\n'''
          new = '''    input_worktree_fingerprint: str = "",\n    input_untracked_paths: tuple[bytes, ...] = (),\n    output_roots: tuple[PurePosixPath, ...] = (),\n) -> tuple[str, dict[str, str]]:\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''        input_worktree_fingerprint,\n        output_roots,\n        label,\n        boundary="before materialization stamp commit",\n'''
          new = '''        input_worktree_fingerprint,\n        input_untracked_paths,\n        output_roots,\n        label,\n        boundary="before materialization stamp commit",\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''    _assert_provider_reuse_identity(\n        root,\n        git_revision,\n        git_worktree_fingerprint,\n        label,\n        boundary="before materialization stamp commit",\n    )\n    _atomic_write_json(root / STAMP_FILE, stamp_data)\n    return git_worktree_fingerprint\n'''
          new = '''    _assert_provider_reuse_identity(\n        root,\n        git_revision,\n        git_worktree_fingerprint,\n        label,\n        boundary="before materialization stamp commit",\n    )\n    _assert_materialization_fingerprint(\n        root,\n        fingerprint,\n        label,\n        boundary="before materialization stamp commit",\n    )\n    _assert_output_snapshot(\n        root,\n        label,\n        version,\n        catalog,\n        generated_digests,\n        boundary="before materialization stamp commit",\n    )\n    _atomic_write_json(root / STAMP_FILE, stamp_data)\n    return git_worktree_fingerprint, generated_digests\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''        _assert_provider_reuse_identity(\n            root,\n            git_revision,\n            git_worktree_fingerprint,\n            label,\n            boundary="while validating materialization stamp",\n        )\n        return catalog\n'''
          new = '''        _assert_provider_reuse_identity(\n            root,\n            git_revision,\n            git_worktree_fingerprint,\n            label,\n            boundary="while validating materialization stamp",\n        )\n        _assert_materialization_fingerprint(\n            root,\n            fingerprint,\n            label,\n            boundary="while accepting materialization stamp",\n        )\n        _assert_output_snapshot(\n            root,\n            label,\n            version,\n            catalog,\n            generated_digests,\n            boundary="while accepting materialization stamp",\n        )\n        return catalog\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''    pre_run_input_worktree_fingerprint = _provider_git_worktree_fingerprint(\n        root,\n        pre_run_git_revision,\n        excluded_roots=output_roots,\n    )\n\n    run_materializer(root, label)\n\n    _assert_materializer_input_state(\n        root,\n        pre_run_git_revision,\n        pre_run_input_worktree_fingerprint,\n        output_roots,\n        label,\n        boundary="while the materializer was running",\n    )\n'''
          new = '''    pre_run_untracked_paths = _provider_git_untracked_paths(\n        root,\n        pre_run_git_revision,\n        excluded_roots=output_roots,\n    )\n    pre_run_input_worktree_fingerprint = _provider_git_worktree_fingerprint(\n        root,\n        pre_run_git_revision,\n        excluded_roots=output_roots,\n        untracked_paths=pre_run_untracked_paths,\n    )\n    run_fingerprint = _materialization_fingerprint(root, materializer)\n\n    run_materializer(root, label)\n\n    _assert_materializer_input_state(\n        root,\n        pre_run_git_revision,\n        pre_run_input_worktree_fingerprint,\n        pre_run_untracked_paths,\n        output_roots,\n        label,\n        boundary="while the materializer was running",\n    )\n    _assert_materialization_fingerprint(\n        root,\n        run_fingerprint,\n        label,\n        boundary="while the materializer was running",\n    )\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''    stamped_worktree_fingerprint = _write_stamp(\n        root,\n        label,\n        version,\n        fingerprint,\n        catalog,\n        git_revision=pre_run_git_revision,\n        input_worktree_fingerprint=pre_run_input_worktree_fingerprint,\n        output_roots=output_roots,\n    )\n'''
          new = '''    stamped_worktree_fingerprint, stamped_output_digests = _write_stamp(\n        root,\n        label,\n        version,\n        run_fingerprint,\n        catalog,\n        git_revision=pre_run_git_revision,\n        input_worktree_fingerprint=pre_run_input_worktree_fingerprint,\n        input_untracked_paths=pre_run_untracked_paths,\n        output_roots=output_roots,\n    )\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''    _assert_materializer_input_state(\n        root,\n        pre_run_git_revision,\n        pre_run_input_worktree_fingerprint,\n        output_roots,\n        label,\n        boundary="before returning materialization success",\n    )\n\n    _remember_success(root, fingerprint)\n'''
          new = '''    _assert_materializer_input_state(\n        root,\n        pre_run_git_revision,\n        pre_run_input_worktree_fingerprint,\n        pre_run_untracked_paths,\n        output_roots,\n        label,\n        boundary="before returning materialization success",\n    )\n    _assert_materialization_fingerprint(\n        root,\n        run_fingerprint,\n        label,\n        boundary="before returning materialization success",\n    )\n    _assert_output_snapshot(\n        root,\n        label,\n        version,\n        catalog,\n        stamped_output_digests,\n        boundary="before returning materialization success",\n    )\n\n    _remember_success(root, run_fingerprint)\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          tests = Path('tests/test_materialize_publication_assets_review_followup.py')
          text = tests.read_text(encoding='utf-8')
          start = text.index('    def test_materializer_cannot_create_new_untracked_non_output_state')
          end = text.index('    def test_stamp_hash_fails_if_enumerated_output_vanishes', start)
          replacement = '''    def test_materializer_may_create_new_untracked_byproduct_without_redefining_pre_run_inputs(self) -> None:\n        with tempfile.TemporaryDirectory() as directory:\n            root = Path(directory)\n            materializer = self.write_v4_provider(root)\n            materializer.write_text(\n                "from __future__ import annotations\\n"\n                "import argparse\\n"\n                "from pathlib import Path\\n"\n                "parser = argparse.ArgumentParser()\\n"\n                "parser.add_argument('--source-root', type=Path, required=True)\\n"\n                "args = parser.parse_args()\\n"\n                "out = args.source_root / 'generated' / 'output.bin'\\n"\n                "out.parent.mkdir(parents=True, exist_ok=True)\\n"\n                "out.write_bytes(b'deterministic-output')\\n"\n                "(args.source_root / 'generated' / 'provider-manifest.json').write_text('{}', encoding='utf-8')\\n",\n                encoding="utf-8",\n            )\n            self.initialize_git_checkout(root)\n\n            self.assertTrue(materialize_publication(root, "fixture"))\n            self.assertTrue((root / "generated" / "provider-manifest.json").is_file())\n            self.assertTrue(is_publication_materialized(root, "fixture"))\n\n'''
          text = text[:start] + replacement + text[end:]

          marker = '\n\nif __name__ == "__main__":\n'
          assert text.count(marker) == 1
          additions = r'''

    def test_output_snapshot_is_rechecked_before_stamp_commit(self) -> None:
        with tempfile.TemporaryDirectory() as directory:
            root = Path(directory)
            self.write_v4_provider(root)
            (root / ".gitignore").write_text("generated/\n", encoding="utf-8")
            self.initialize_git_checkout(root)
            original = materialization._assert_provider_reuse_identity
            mutated = False

            def mutate_at_commit(*args, **kwargs):
                nonlocal mutated
                original(*args, **kwargs)
                if kwargs.get("boundary") == "before materialization stamp commit" and not mutated:
                    (root / "generated" / "output.bin").write_bytes(b"late-mutation")
                    mutated = True

            with patch.object(
                materialization,
                "_assert_provider_reuse_identity",
                side_effect=mutate_at_commit,
            ):
                with self.assertRaisesRegex(
                    PublicationMaterializationError,
                    "output snapshot changed before materialization stamp commit",
                ):
                    materialize_publication(root, "fixture")
            self.assertFalse((root / STAMP_FILE).exists())

    def test_ignored_output_snapshot_is_rechecked_before_stamp_acceptance(self) -> None:
        with tempfile.TemporaryDirectory() as directory:
            root = Path(directory)
            self.write_v4_provider(root)
            (root / ".gitignore").write_text("generated/\n", encoding="utf-8")
            self.initialize_git_checkout(root)
            self.assertTrue(materialize_publication(root, "fixture"))
            original = materialization._assert_provider_reuse_identity
            mutated = False

            def mutate_at_acceptance(*args, **kwargs):
                nonlocal mutated
                original(*args, **kwargs)
                if kwargs.get("boundary") == "while validating materialization stamp" and not mutated:
                    (root / "generated" / "output.bin").write_bytes(b"late-mutation")
                    mutated = True

            with patch.object(
                materialization,
                "_assert_provider_reuse_identity",
                side_effect=mutate_at_acceptance,
            ):
                self.assertFalse(is_publication_materialized(root, "fixture"))

    def test_materialization_fingerprint_is_recaptured_with_pre_run_snapshot(self) -> None:
        with tempfile.TemporaryDirectory() as directory:
            root = Path(directory)
            materializer = self.write_v4_provider(root)
            self.initialize_git_checkout(root)
            replacement = materializer.read_text(encoding="utf-8").replace(
                "deterministic-output",
                "replacement-output",
            )

            def invalidate_old_stamp(*args, **kwargs):
                materializer.write_text(replacement, encoding="utf-8")
                return None

            with patch.object(
                materialization,
                "_validate_stamp",
                side_effect=invalidate_old_stamp,
            ):
                self.assertTrue(materialize_publication(root, "fixture"))

            self.assertEqual(b"replacement-output", (root / "generated" / "output.bin").read_bytes())
            self.assertTrue(is_publication_materialized(root, "fixture"))

    def test_v3_required_document_disappearance_aborts_stamping(self) -> None:
        with tempfile.TemporaryDirectory() as directory:
            root = Path(directory)
            self.write_v4_provider(root)
            catalog_path = root / "docs" / "publication-catalog.json"
            catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
            catalog["schema_version"] = 3
            for asset in catalog["assets"]:
                asset.pop("source_kind", None)
            catalog_path.write_text(json.dumps(catalog), encoding="utf-8")
            original = materialization._check_reserved_stamp_collision
            removed = False

            def remove_required_document(parsed_catalog, label):
                nonlocal removed
                original(parsed_catalog, label)
                if not removed:
                    (root / "README.md").unlink()
                    removed = True

            with patch.object(
                materialization,
                "_check_reserved_stamp_collision",
                side_effect=remove_required_document,
            ):
                with self.assertRaisesRegex(
                    PublicationMaterializationError,
                    "document README.md.*no longer a regular non-symlink file",
                ):
                    materialize_publication(root, "fixture")
            self.assertFalse((root / STAMP_FILE).exists())
'''
          text = text.replace(marker, additions + marker, 1)
          tests.write_text(text, encoding='utf-8')
          PY

      - name: Run focused regression suite
        run: >-
          python -m unittest
          tests.test_materialize_publication_assets
          tests.test_materialize_publication_assets_review_followup
          tests.test_assembly_materialization_boundary
          --verbose

      - name: Commit remediation and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/pr790-review-round2-remediation.yml
          git config user.name 'TakashiSasaki'
          git config user.email '556958+TakashiSasaki@users.noreply.github.com'
          git add scripts/materialize_publication_assets.py \
            tests/test_materialize_publication_assets_review_followup.py \
            .github/workflows/pr790-review-round2-remediation.yml
          git commit -m 'Bind materialization stamps to atomic output snapshots'
          git push origin HEAD:perf/site-provider-materialization-phase
