name: PR 790 output snapshot remediation

on:
  push:
    branches:
      - perf/site-provider-materialization-phase

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run corrected PR 790 output snapshot remediation'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/site-provider-materialization-phase
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply current review remediation
        shell: bash
        run: python -c "import base64,gzip; exec(gzip.decompress(base64.b64decode(''))).decode()"
      - name: Run focused regression suite
        run: >-
          python -m unittest
          tests.test_materialize_publication_assets
          tests.test_materialize_publication_assets_review_followup
          tests.test_assembly_materialization_boundary
          --verbose
      - name: Commit remediation and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/pr790-review-round2-remediation.yml
          git config user.name 'TakashiSasaki'
          git config user.email '556958+TakashiSasaki@users.noreply.github.com'
          git add scripts/materialize_publication_assets.py tests/test_materialize_publication_assets_review_followup.py .github/workflows/pr790-review-round2-remediation.yml
          git commit -m 'Bind materialization stamps to atomic output snapshots'
          git push origin HEAD:perf/site-provider-materialization-phase
