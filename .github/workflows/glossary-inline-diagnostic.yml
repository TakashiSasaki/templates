name: Glossary inline diagnostic

on:
  pull_request:
    branches:
      - site

permissions:
  contents: read

jobs:
  diagnose:
    if: github.repository == 'TakashiSasaki/templates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Run inline asset tests
        run: PYTHONPATH=. python -m unittest tests.test_glossary_inline_assets --verbose
      - name: Run inline injection tests
        run: PYTHONPATH=. python -m unittest tests.test_glossary_inline_injection --verbose
      - name: Run finalizer regression tests
        run: PYTHONPATH=. python -m unittest tests.test_finalize_glossary_annotations --verbose
