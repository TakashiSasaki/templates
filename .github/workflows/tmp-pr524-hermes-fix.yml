name: Temporary PR524 Hermes fix

on:
  push:
    branches:
      - agent/capability-planning-item-authority-pr22
    paths:
      - .github/workflows/tmp-pr524-hermes-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/capability-planning-item-authority-pr22
          fetch-depth: 0
      - name: Apply reviewed schema-version migrations
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import json

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one occurrence, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          canonical = "docs/guides/webapp-product-walkthrough.md"
          japanese = "translations/ja/docs/guides/webapp-product-walkthrough.md"
          browser_test = "tests/test_task_ledger_walkthrough_browser_acceptance.py"

          for path in (canonical, japanese):
              replace_once(
                  path,
                  '  "$schema": "../schemas/service-interface.schema.json",\n  "schemaVersion": 1,',
                  '  "$schema": "../schemas/service-interface.schema.json",\n  "schemaVersion": 2,',
              )
              replace_once(
                  path,
                  '  "$schema": "../schemas/cli-interface.schema.json",\n  "schemaVersion": 1,',
                  '  "$schema": "../schemas/cli-interface.schema.json",\n  "schemaVersion": 2,',
              )

          replace_once(
              browser_test,
              '                "$schema": "../schemas/service-interface.schema.json",\n                "schemaVersion": 1,',
              '                "$schema": "../schemas/service-interface.schema.json",\n                "schemaVersion": 2,',
          )
          replace_once(
              browser_test,
              '                "$schema": "../schemas/cli-interface.schema.json",\n                "schemaVersion": 1,',
              '                "$schema": "../schemas/cli-interface.schema.json",\n                "schemaVersion": 2,',
          )

          canonical_bytes = Path(canonical).read_bytes()
          blob_payload = f"blob {len(canonical_bytes)}\0".encode() + canonical_bytes
          canonical_blob_sha = hashlib.sha1(blob_payload).hexdigest()

          manifest_path = Path("translations/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          matches = [entry for entry in manifest["translations"] if entry["canonical"] == canonical]
          if len(matches) != 1:
              raise SystemExit(f"expected one translation manifest entry for {canonical}, found {len(matches)}")
          matches[0]["canonical_blob_sha"] = canonical_blob_sha
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          # Guard the exact stale references reported by Hermes.
          for path in (canonical, japanese, browser_test):
              text = Path(path).read_text(encoding="utf-8")
              for schema in ("service-interface.schema.json", "cli-interface.schema.json"):
                  marker = f'"$schema": "../schemas/{schema}"'
                  pos = text.find(marker)
                  if pos < 0:
                      raise SystemExit(f"{path}: missing {marker}")
                  window = text[pos:pos + 180]
                  if '"schemaVersion": 1' in window:
                      raise SystemExit(f"{path}: stale schemaVersion 1 remains near {schema}")
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-pr524-hermes-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/guides/webapp-product-walkthrough.md \
                  translations/ja/docs/guides/webapp-product-walkthrough.md \
                  translations/manifest.json \
                  tests/test_task_ledger_walkthrough_browser_acceptance.py
          git diff --cached --check
          git commit -m "Fix capability v2 walkthrough fixtures after review"
          git push origin HEAD:agent/capability-planning-item-authority-pr22
