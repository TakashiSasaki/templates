name: PR 790 bytecode remediation

on:
  push:
    branches:
      - perf/site-provider-materialization-phase

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v7
        with:
          ref: perf/site-provider-materialization-phase
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Apply bytecode remediation and regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('scripts/materialize_publication_assets.py')
          text = source.read_text(encoding='utf-8')
          old = '''            sys.executable,
                      "-I",
                      str(materializer),'''
          new = '''            sys.executable,
                      "-I",
                      "-B",
                      str(materializer),'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one isolated materializer invocation, found {text.count(old)}')
          source.write_text(text.replace(old, new), encoding='utf-8')

          tests = Path('tests/test_materialize_publication_assets_review_followup.py')
          text = tests.read_text(encoding='utf-8')
          marker = '\nif __name__ == "__main__":\n    unittest.main()\n'
          if text.count(marker) != 1:
              raise SystemExit('test module footer not found exactly once')
          method = textwrap.indent(textwrap.dedent(r'''

          def test_isolated_materializer_disables_bytecode_writes(self) -> None:
              with tempfile.TemporaryDirectory() as directory:
                  root = Path(directory)
                  materializer = self.write_v4_provider(root)
                  helper = root / "scripts" / "provider_helper.py"
                  helper.write_text("PAYLOAD = b'from-helper'\n", encoding="utf-8")
                  materializer.write_text(
                      "from __future__ import annotations\n"
                      "import argparse\n"
                      "import sys\n"
                      "from pathlib import Path\n"
                      "sys.path.insert(0, str(Path(__file__).resolve().parent))\n"
                      "import provider_helper\n"
                      "parser = argparse.ArgumentParser()\n"
                      "parser.add_argument('--source-root', type=Path, required=True)\n"
                      "args = parser.parse_args()\n"
                      "out = args.source_root / 'generated' / 'output.bin'\n"
                      "out.parent.mkdir(parents=True, exist_ok=True)\n"
                      "out.write_bytes(provider_helper.PAYLOAD)\n",
                      encoding="utf-8",
                  )
                  self.initialize_git_checkout(root)

                  self.assertTrue(materialize_publication(root, "fixture"))
                  self.assertEqual(
                      b"from-helper",
                      (root / "generated" / "output.bin").read_bytes(),
                  )
                  self.assertFalse((root / "scripts" / "__pycache__").exists())
          '''), "    ")
          tests.write_text(text.replace(marker, method + marker), encoding='utf-8')
          PY

      - name: Syntax check
        run: python -m py_compile scripts/materialize_publication_assets.py tests/test_materialize_publication_assets_review_followup.py

      - name: Run focused regressions
        run: python -m unittest tests.test_materialize_publication_assets tests.test_materialize_publication_assets_review_followup tests.test_assembly_materialization_boundary --verbose

      - name: Commit remediation and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/materialize_publication_assets.py tests/test_materialize_publication_assets_review_followup.py
          git rm .github/workflows/pr790-bytecode-remediation.yml
          git diff --cached --check
          git commit -m "Prevent materializer bytecode side effects"
          git push origin HEAD:perf/site-provider-materialization-phase
