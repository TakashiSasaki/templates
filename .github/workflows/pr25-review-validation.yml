name: PR 25 review validation

on:
  push:
    branches:
      - site-generated-link-validation

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Run complete site test suite
        run: python -m unittest discover --start-directory tests --verbose
      - name: Record successful validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/issues/25/comments \
            -f body="Review fixes validated by GitHub Actions on commit \`${{ github.sha }}\`: the complete site test suite passed."
