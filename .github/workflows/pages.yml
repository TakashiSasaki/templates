name: Check documentation site compatibility

on:
  pull_request:
    branches:
      - skill
    paths:
      - README.md
      - docs/**
      - template/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    if: github.repository == 'TakashiSasaki/templates'
    uses: TakashiSasaki/templates/.github/workflows/build-pages.yml@e95959f5a47b071fb1178565893ea0d572f4ff97
    with:
      site_ref: e95959f5a47b071fb1178565893ea0d572f4ff97
      source_ref: ${{ github.event_name == 'pull_request' && github.sha || 'skill' }}
    # Pull-request runs validate GitHub's proposed merge commit against the
    # reviewed Site schema-v3-only merge revision. Manually dispatched runs
    # resolve the current skill branch. The called Site workflow is build-only
    # and exposes no Pages deployment job or write permission.
    permissions:
      contents: read
