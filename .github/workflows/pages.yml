name: Check documentation site compatibility

on:
  pull_request:
    branches:
      - skill
    paths:
      - '**/*.md'
      - docs/**
      - assets/**
      - CLI_INTERFACE.md
      - MCP_INTERFACE.md
      - .github/workflows/pages.yml
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    if: github.repository == 'TakashiSasaki/templates'
    uses: TakashiSasaki/templates/.github/workflows/build-pages.yml@site
    with:
      site_ref: site
      source_ref: ${{ github.event_name == 'pull_request' && github.sha || 'skill' }}
    # Pull-request runs validate GitHub's proposed merge commit. Scheduled and
    # manual runs always resolve the current skill branch, regardless of the ref
    # selected when dispatching the workflow. The called site workflow is
    # build-only and exposes no Pages deployment job or write permission.
    permissions:
      contents: read
