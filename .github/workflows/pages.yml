name: Policy documentation build

on:
  push:
    branches: [policy]
  # The workflow definition comes from the Policy-side base. Do not infer
  # authority ownership from an arbitrary stacked-PR branch name.
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: policy-documentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONHOME: ""
      PYTHONPATH: ""
      PYTHONSAFEPATH: ""
      PYTHONPLATLIBDIR: ""
      PYTHONHASHSEED: ""
      PYTHONUTF8: ""
      PYTHONINTMAXSTRDIGITS: ""
      PYTHONMALLOC: ""
      PYTHONIOENCODING: ""
      PYTHONTRACEMALLOC: ""
      PYTHONINSPECT: ""
      PYTHONNOUSERSITE: "1"
      PIP_PYTHON: ""
      PIP_CACHE_DIR: ""
      PIP_NO_CACHE_DIR: ""
      PIP_QUIET: ""
      PIP_PROGRESS_BAR: ""
      PIP_LOG: ""
      PIP_KEYRING_PROVIDER: ""
      PIP_EXISTS_ACTION: ""
      PIP_USE_PEP517: ""
      PIP_COMPILE: ""
      PIP_ISOLATED: ""
      PIP_USE_FEATURE: ""
      PIP_VERBOSE: ""
      PIP_DEBUG: ""
      PIP_NO_INPUT: ""
      PIP_DISABLE_PIP_VERSION_CHECK: ""
      PIP_NO_COLOR: ""
      PIP_REQUIRE_VIRTUALENV: ""
      PIP_USE_DEPRECATED: ""
      PIP_NO_PYTHON_VERSION_WARNING: ""
      PIP_TIMEOUT: ""
      PIP_DEFAULT_TIMEOUT: ""
      PIP_RETRIES: ""
      PIP_CONFIG_FILE: /dev/null
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Check out Integration publication protocol
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Reviewed Integration owns the standalone generic publication protocol.
          ref: a30699cf7dc56bf3ef7a1b6fd8f6ffd45cdd426d
          path: .integration-publication-protocol
          sparse-checkout: integration/publication_contract.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve checked-out Policy revision
        id: policy-revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements-docs.lock

      - name: Create isolated documentation environment
        run: python -I -m venv --clear .venv

      - name: Install locked documentation dependencies
        run: env -u PIP_REQUIREMENT -u PIP_CONSTRAINT -u PIP_BUILD_CONSTRAINT -u PIP_REQUIRE_HASHES -u PIP_DRY_RUN -u PIP_NO_BINARY -u PIP_ONLY_BINARY -u PIP_PLATFORM -u PIP_PYTHON_VERSION -u PIP_IMPLEMENTATION -u PIP_ABI -u PIP_UPLOADED_PRIOR_TO -u PIP_INDEX_URL -u PIP_EXTRA_INDEX_URL -u PIP_NO_INDEX -u PIP_FIND_LINKS -u PIP_TARGET -u PIP_PREFIX -u PIP_ROOT -u PIP_USER -u PIP_PYTHON -u PIP_CACHE_DIR -u PIP_NO_CACHE_DIR -u PIP_QUIET -u PIP_PROGRESS_BAR -u PIP_EDITABLE -u PIP_GROUP -u PIP_REQUIREMENTS_FROM_SCRIPT -u PIP_REPORT -u PIP_CONFIG_SETTINGS -u PIP_USE_PEP517 -u PIP_COMPILE -u PIP_ISOLATED -u PIP_USE_FEATURE -u PIP_VERBOSE -u PIP_DEBUG -u PIP_NO_INPUT -u PIP_DISABLE_PIP_VERSION_CHECK -u PIP_NO_COLOR -u PIP_REQUIRE_VIRTUALENV -u PIP_USE_DEPRECATED -u PIP_NO_PYTHON_VERSION_WARNING -u PIP_KEYRING_PROVIDER -u PIP_EXISTS_ACTION -u PIP_IGNORE_REQUIRES_PYTHON -u PIP_LOG -u PIP_TRUSTED_HOST -u PIP_CERT -u PIP_CLIENT_CERT -u PIP_PROXY -u PIP_TIMEOUT -u PIP_DEFAULT_TIMEOUT -u PIP_RETRIES .venv/bin/python -m pip install --isolated --disable-pip-version-check --no-deps --requirement requirements-docs.lock

      - name: Run canonical Policy documentation qualification
        env:
          BUILD_COMMIT: ${{ steps.policy-revision.outputs.sha }}
          BUILD_REPOSITORY: ${{ github.repository }}
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_RUN_NUMBER: ${{ github.run_number }}
          POLICY_DOCS_ENV_READY: "1"
          INTEGRATION_PUBLICATION_PROTOCOL: .integration-publication-protocol/integration/publication_contract.py
        run: .venv/bin/python scripts/run_policy_preflight.py --check docs
