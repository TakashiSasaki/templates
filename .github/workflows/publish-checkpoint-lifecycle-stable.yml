name: Publish checkpoint lifecycle stable candidate

on:
  push:
    branches:
      - publish/checkpoint-lifecycle-stable

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Update stable publication from immutable chain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re
          import subprocess

          old_i = "01c65730afdbd431749ffd00e790ff3c5bd72015"
          old_sha = "7c2ed9ae19e331f1042299f7f55014632e0b21cceca7df8a56750b2e222c3194"
          old_s = "cc180cecbde7f75cd5f07c1aa311014d6db7c97c"
          old_t = "2bf8c86060d48281a03807b2429ce045aa8e2a91"
          new_i = "b862171ed7d8fb7f53cb5a28a0d89eab07ab534e"
          new_s = "dee6278c275d4c480373acd5b66cfc2c2db4c663"
          new_t = "1e8fd592d82670c3d524d5038b8045715bb01038"

          installer = subprocess.check_output(
              ["git", "show", f"{new_i}:scripts/install_composition_skill.py"]
          )
          if Path("scripts/install_composition_skill.py").read_bytes() != installer:
              raise SystemExit("worktree installer bytes differ from immutable I")
          new_sha = hashlib.sha256(installer).hexdigest()
          print(f"installer_revision={new_i}")
          print(f"installer_sha256={new_sha}")
          print(f"skill_source_revision={new_s}")
          print(f"toolchain_revision={new_t}")

          descriptor_path = Path("release/composition-installer.json")
          descriptor = json.loads(descriptor_path.read_text(encoding="utf-8"))
          if descriptor["installer"]["revision"] != old_i:
              raise SystemExit("unexpected old installer revision")
          if descriptor["installer"]["sha256"] != old_sha:
              raise SystemExit("unexpected old installer digest")
          if descriptor["skill_source"]["revision"] != old_s:
              raise SystemExit("unexpected old skill source revision")
          if descriptor["toolchain"]["revision"] != old_t:
              raise SystemExit("unexpected old toolchain revision")
          descriptor["installer"]["revision"] = new_i
          descriptor["installer"]["sha256"] = new_sha
          descriptor["skill_source"]["revision"] = new_s
          descriptor["toolchain"]["revision"] = new_t
          descriptor_path.write_text(
              json.dumps(descriptor, indent=2) + "\n", encoding="utf-8"
          )

          replacements = {
              old_i: new_i,
              old_sha: new_sha,
              old_s: new_s,
              old_t: new_t,
          }
          files = {
              "release/README.md": tuple(replacements),
              "docs/consumer-guide.md": tuple(replacements),
              "docs/guides/skill-first-use-walkthrough.md": (old_i, old_sha),
              "docs/guides/webapp-product-walkthrough.md": (old_i, old_sha),
              "tests/test_composition_skill_installer_publication.py": tuple(replacements),
              "translations/ja/docs/consumer-guide.md": tuple(replacements),
              "translations/ja/docs/guides/skill-first-use-walkthrough.md": (old_i, old_sha),
              "translations/ja/docs/guides/webapp-product-walkthrough.md": (old_i, old_sha),
          }
          for filename, required in files.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old in required:
                  if old not in text:
                      raise SystemExit(f"{filename}: missing expected publication token {old}")
                  text = text.replace(old, replacements[old])
              path.write_text(text, encoding="utf-8")

          def git_blob_sha(path: Path) -> str:
              data = path.read_bytes()
              return hashlib.sha1(
                  f"blob {len(data)}\0".encode("ascii") + data
              ).hexdigest()

          manifest_path = Path("translations/manifest.json")
          manifest = manifest_path.read_text(encoding="utf-8")
          canonical_paths = (
              "docs/consumer-guide.md",
              "docs/guides/skill-first-use-walkthrough.md",
              "docs/guides/webapp-product-walkthrough.md",
          )
          for canonical in canonical_paths:
              blob = git_blob_sha(Path(canonical))
              pattern = re.compile(
                  r'("canonical": "' + re.escape(canonical) + r'",\n'
                  r'\s+"language": "ja",\n'
                  r'\s+"translation": "[^"]+",\n'
                  r'\s+"canonical_blob_sha": ")[0-9a-f]{40}(")'
              )
              manifest, count = pattern.subn(r"\g<1>" + blob + r"\2", manifest)
              if count != 1:
                  raise SystemExit(
                      f"translation manifest entry count for {canonical}: {count}"
                  )
              print(f"canonical_blob {canonical}={blob}")
          manifest_path.write_text(manifest, encoding="utf-8")
          PY
          python3 -m json.tool release/composition-installer.json >/dev/null
          python3 -m json.tool translations/manifest.json >/dev/null
          git diff --check
      - name: Commit publication candidate and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            release/composition-installer.json \
            release/README.md \
            docs/consumer-guide.md \
            docs/guides/skill-first-use-walkthrough.md \
            docs/guides/webapp-product-walkthrough.md \
            tests/test_composition_skill_installer_publication.py \
            translations/ja/docs/consumer-guide.md \
            translations/ja/docs/guides/skill-first-use-walkthrough.md \
            translations/ja/docs/guides/webapp-product-walkthrough.md \
            translations/manifest.json
          git commit -m "Publish checkpoint lifecycle Composition stable distribution"
          git rm .github/workflows/publish-checkpoint-lifecycle-stable.yml
          git commit -m "Remove stable publication staging helper"
          git push origin HEAD:publish/checkpoint-lifecycle-stable
