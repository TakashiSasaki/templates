name: Dispatch provider qualification to Integration

# repository_dispatch is resolved from the default Site branch. This workflow
# is intentionally only a transport adapter: the exact Integration controller
# owns provider resolution, qualification, authorization, and any lock PR.
# It never executes provider code and never invokes an LLM or coding agent.
on:
  repository_dispatch:
    types:
      - publication.provider-qualified

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  integration_controller:
    if: github.repository == 'TakashiSasaki/templates'
    uses: TakashiSasaki/templates/.github/workflows/integration-reconcile.yml@454fb86ce1ad5bc109fb334a5095fff15d6c114d
    with:
      producer_ref: ${{ github.event.client_payload.producer_ref }}
      composition_ref: ${{ github.event.client_payload.composition_ref || '' }}
      policy_ref: ${{ github.event.client_payload.policy_ref || '' }}
      modeling_ref: ${{ github.event.client_payload.modeling_ref || '' }}
      controller_ref: 454fb86ce1ad5bc109fb334a5095fff15d6c114d
    secrets: inherit
    permissions:
      contents: write
      actions: read
      pull-requests: write
