name: Dispatch provider qualification to Integration

# repository_dispatch is resolved from the default Site branch, and
# workflow_dispatch is registered there. This workflow is intentionally only a
# transport adapter: the exact Integration controller owns provider
# resolution, qualification, authorization, and any lock PR. It never executes
# provider code and never invokes an LLM or coding agent.
on:
  repository_dispatch:
    types:
      - publication.provider-qualified
  workflow_dispatch:
    inputs:
      producer_ref:
        description: Exact Integration producer commit SHA
        required: true
        type: string
      composition_ref:
        description: Optional exact Composition SHA; empty uses the committed Integration selection
        required: false
        default: ''
        type: string
      policy_ref:
        description: Optional exact Policy SHA; empty uses the committed Integration selection
        required: false
        default: ''
        type: string
      modeling_ref:
        description: Optional exact Modeling SHA; empty uses the committed Integration selection
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  validate_event:
    name: Validate provider notification or manual request
    if: github.repository == 'TakashiSasaki/templates' && github.ref == 'refs/heads/site'
    runs-on: ubuntu-24.04
    outputs:
      producer_ref: ${{ github.event_name == 'workflow_dispatch' && steps.manual.outputs.producer_ref || steps.integration.outputs.integration_ref }}
      modeling_ref: ${{ github.event_name == 'workflow_dispatch' && steps.manual.outputs.modeling_ref || steps.payload.outputs.modeling_ref }}
      composition_ref: ${{ github.event_name == 'workflow_dispatch' && steps.manual.outputs.composition_ref || steps.payload.outputs.composition_ref }}
      policy_ref: ${{ github.event_name == 'workflow_dispatch' && steps.manual.outputs.policy_ref || steps.payload.outputs.policy_ref }}
      controller_ref: ${{ steps.controller.outputs.controller_ref }}
      integration_ref: ${{ steps.integration.outputs.integration_ref }}
    steps:
      - name: Validate manual Integration reconciliation inputs
        if: github.event_name == 'workflow_dispatch'
        id: manual
        env:
          PRODUCER_REF: ${{ inputs.producer_ref }}
          COMPOSITION_REF: ${{ inputs.composition_ref }}
          POLICY_REF: ${{ inputs.policy_ref }}
          MODELING_REF: ${{ inputs.modeling_ref }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re

          producer = os.environ.get("PRODUCER_REF", "")
          if re.fullmatch(r"[0-9a-f]{40}", producer) is None:
              raise SystemExit("producer_ref must be a full lowercase 40-character commit SHA")
          print(f"producer_ref={producer}")
          for field in ("composition_ref", "policy_ref", "modeling_ref"):
              value = os.environ.get(field.upper(), "")
              if value and re.fullmatch(r"[0-9a-f]{40}", value) is None:
                  raise SystemExit(f"{field} must be empty or a full lowercase 40-character commit SHA")
              print(f"{field}={value}")
          PY
          echo 'Exact manual request validated. Empty provider overrides are forwarded unchanged for Integration to resolve from its committed selection.' >> "$GITHUB_STEP_SUMMARY"
      - name: Validate immutable provider event payload
        if: github.event_name == 'repository_dispatch'
        id: payload
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re

          payload = json.loads(os.environ["PAYLOAD"])
          expected = {
              "provider", "provider_revision", "provider_qualification_run_id",
              "provider_qualification_attempt", "qualification_workflow_head",
              "qualification_workflow_name", "qualification_workflow_event",
              "qualification_workflow_path",
          }
          if not isinstance(payload, dict) or set(payload) != expected:
              raise SystemExit("provider notification contains unsupported or missing fields")
          provider = payload["provider"]
          revisions = (payload["provider_revision"], payload["qualification_workflow_head"])
          if provider not in {"modeling", "composition", "policy"}:
              raise SystemExit("provider notification names an unregistered provider")
          if any(not isinstance(value, str) or re.fullmatch(r"[0-9a-f]{40}", value) is None for value in revisions):
              raise SystemExit("provider notification revisions must be full lowercase SHAs")
          for field in ("provider_qualification_run_id", "provider_qualification_attempt"):
              if re.fullmatch(r"[1-9][0-9]*", str(payload[field])) is None:
                  raise SystemExit(f"{field} must be a positive decimal identity")
          workflow = {
              "modeling": ("Modeling qualification", ".github/workflows/modeling-ci.yml"),
              "composition": ("Composition Integration compatibility", ".github/workflows/reference-consumer-publication.yml"),
              "policy": ("Policy Integration compatibility", ".github/workflows/integration-compatibility.yml"),
          }[provider]
          if (payload["qualification_workflow_name"], payload["qualification_workflow_path"], payload["qualification_workflow_event"]) != (*workflow, "push"):
              raise SystemExit("provider notification is not from the expected provider push qualification")
          print(f"{provider}_ref={payload['provider_revision']}")
          PY
          echo 'Provider event facts validated; Integration owns the next qualification and authorization decision.' >> "$GITHUB_STEP_SUMMARY"
      - name: Resolve the current Integration producer to one exact revision
        if: github.event_name == 'repository_dispatch'
        id: integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          revision=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/integration" --jq '.object.sha')
          python3 - "$revision" <<'PY'
          import re
          import sys
          if re.fullmatch(r"[0-9a-f]{40}", sys.argv[1]) is None:
              raise SystemExit("Integration branch did not resolve to an immutable commit SHA")
          PY
          echo "integration_ref=$revision" >> "$GITHUB_OUTPUT"
          echo "Resolved the Integration authority head to an exact producer revision; later base movement will be classified as stale." >> "$GITHUB_STEP_SUMMARY"
      - name: Validate the repository-selected trusted controller revision
        id: controller
        env:
          CONTROLLER_REF: ${{ vars.PUBLICATION_CONTROLLER_REVISION }}
        run: |
          python3 - "$CONTROLLER_REF" <<'PY'
          import re
          import sys

          if re.fullmatch(r"[0-9a-f]{40}", sys.argv[1]) is None:
              raise SystemExit("PUBLICATION_CONTROLLER_REVISION must be a full lowercase commit SHA")
          PY
          echo "controller_ref=$CONTROLLER_REF" >> "$GITHUB_OUTPUT"
          echo 'The trusted controller identity came from the repository variable; manual inputs cannot select controller code.' >> "$GITHUB_STEP_SUMMARY"

  integration_controller:
    needs: validate_event
    if: needs.validate_event.result == 'success'
    uses: TakashiSasaki/templates/.github/workflows/integration-reconcile.yml@fb0f078d3e51bb0dcf9bdcb0630b1f934a0ef9a8
    with:
      # Site only normalizes the transport. Provider events resolve Integration
      # live; manual requests bind the exact supplied producer SHA. In both
      # cases, reconciliation semantics remain in the pinned Integration
      # workflow. The required controller input comes only from the repository
      # trust variable, never from an event payload or manual input.
      producer_ref: ${{ needs.validate_event.outputs.producer_ref }}
      composition_ref: ${{ needs.validate_event.outputs.composition_ref || '' }}
      policy_ref: ${{ needs.validate_event.outputs.policy_ref || '' }}
      modeling_ref: ${{ needs.validate_event.outputs.modeling_ref || '' }}
      controller_ref: ${{ needs.validate_event.outputs.controller_ref }}
    secrets: inherit
    permissions:
      contents: write
      actions: read
      pull-requests: write
