name: Validate template structure

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python validator dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3

      - name: Test Skill source and distribution boundary
        shell: bash
        run: python .github/scripts/test_distribution_boundary.py

      - name: Test copyable Skill distribution
        shell: bash
        run: python .github/scripts/test_skill_distribution.py

      - name: Validate copyable Skill distribution
        shell: bash
        run: python .github/scripts/validate_skill_distribution.py

      - name: Validate copyable Skill root
        shell: bash
        run: |
          python template/.github/scripts/validate_skill_repository.py template
          python template/.github/scripts/test_template_baseline.py

      - name: Audit Python-only validator cutover
        shell: bash
        run: python .github/scripts/test_python_template_validator_cutover.py

      - name: Audit restructuring completion
        shell: bash
        run: python .github/scripts/test_restructure_completion.py

      - name: Test GitHub Pages deployment boundary
        shell: bash
        run: python .github/scripts/test_pages_deployment_boundary.py

      - name: Test documentation publication catalog validation
        shell: bash
        run: |
          python .github/scripts/test_publication_catalog.py
          python .github/scripts/test_publication_schema_version.py
          python .github/scripts/test_publication_catalog_root_resolution.py

      - name: Validate documentation publication catalog
        shell: bash
        run: python .github/scripts/validate_publication_catalog.py

      - name: Test translation contract
        shell: bash
        run: python .github/scripts/test_translations.py

      - name: Validate translations
        shell: bash
        run: python .github/scripts/validate_translations.py .

      - name: Reject Ruby tooling regression
        shell: bash
        run: python .github/scripts/test_no_ruby.py

      - name: Reject committed secret assignments
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --exclude-dir=.git -E '(API_KEY|TOKEN|PASSWORD)=[^[:space:]<][^[:space:]]*' .; then
            echo "Possible committed secret assignment found." >&2
            exit 1
          fi
