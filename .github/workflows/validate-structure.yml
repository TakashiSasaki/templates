name: Validate template structure

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate universal skill core and selected resources
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f SKILL.md ]]; then
            echo "Missing universally required file: SKILL.md" >&2
            exit 1
          fi

          ruby <<'RUBY'
          require "find"
          require "pathname"
          require "yaml"

          skill_path = "SKILL.md"
          lines = File.readlines(skill_path, chomp: true)

          unless lines.first == "---"
            warn "SKILL.md must begin with YAML frontmatter."
            exit 1
          end

          closing_index = (1...lines.length).find { |index| lines[index] == "---" }
          unless closing_index
            warn "SKILL.md YAML frontmatter must have a closing --- delimiter."
            exit 1
          end

          frontmatter = lines[1...closing_index].join("\n")

          begin
            metadata = YAML.safe_load(
              frontmatter,
              permitted_classes: [],
              permitted_symbols: [],
              aliases: false
            )
          rescue Psych::Exception => error
            warn "SKILL.md contains invalid YAML frontmatter: #{error.message}"
            exit 1
          end

          unless metadata.is_a?(Hash)
            warn "SKILL.md YAML frontmatter must be a mapping."
            exit 1
          end

          name = metadata["name"]
          unless name.is_a?(String) && name.length.between?(1, 64) && /\A[a-z0-9]+(?:-[a-z0-9]+)*\z/.match?(name)
            warn "SKILL.md frontmatter name must be a 1-64 character lowercase hyphenated string."
            exit 1
          end

          description = metadata["description"]
          unless description.is_a?(String) && !description.strip.empty?
            warn "SKILL.md frontmatter description must be a non-empty string."
            exit 1
          end

          resource_specs = {
            "Reference" => {
              directory: "references",
              placeholder: "references/TODO.md",
              required_fields: ["Read when", "Provides"]
            },
            "Asset" => {
              directory: "assets",
              placeholder: "assets/TODO",
              required_fields: ["Use when", "Handling"]
            },
            "Script" => {
              directory: "scripts",
              placeholder: "scripts/TODO",
              required_fields: ["Run when", "Exact invocation"]
            }
          }

          normalize_line = lambda do |line|
            normalized = line.strip
            normalized = normalized[2..].strip if normalized.start_with?("- ")
            normalized
          end

          strip_backticks = lambda do |value|
            normalized = value.strip
            if normalized.length >= 2 && normalized.start_with?("`") && normalized.end_with?("`")
              normalized[1...-1]
            else
              normalized
            end
          end

          declarations = []
          current = nil

          lines.each_with_index do |raw_line, index|
            line = normalize_line.call(raw_line)

            if (match = line.match(/\A(Reference|Asset|Script):\s*(.+?)\s*\z/))
              current = {
                label: match[1],
                path: strip_backticks.call(match[2]),
                line: index + 1,
                fields: {}
              }
              declarations << current
              next
            end

            next unless current

            if line.start_with?("#") || line == "```"
              current = nil
              next
            end

            if (match = line.match(/\A([^:]+):\s*(.*?)\s*\z/))
              current[:fields][match[1].strip] = strip_backticks.call(match[2])
            end
          end

          concrete_declarations = {}
          errors = []

          declarations.each do |declaration|
            spec = resource_specs.fetch(declaration[:label])
            path = declaration[:path]

            next if path == spec[:placeholder]

            pathname = Pathname.new(path)
            clean_path = pathname.cleanpath.to_s
            expected_prefix = "#{spec[:directory]}/"

            if pathname.absolute? || clean_path != path || !path.start_with?(expected_prefix)
              errors << "SKILL.md line #{declaration[:line]} has an invalid #{declaration[:label]} path: #{path}"
              next
            end

            if concrete_declarations.key?(path)
              errors << "SKILL.md declares the same operational resource more than once: #{path}"
              next
            end

            concrete_declarations[path] = declaration

            spec[:required_fields].each do |field|
              value = declaration[:fields][field]
              if value.nil? || value.strip.empty? || /\bTODO\b/i.match?(value)
                errors << "SKILL.md declaration for #{path} must include a concrete '#{field}:' value."
              end
            end

            unless File.file?(path) && !File.symlink?(path)
              errors << "SKILL.md declares a missing or non-regular operational resource: #{path}"
            end
          end

          operational_files = []

          resource_specs.each_value do |spec|
            directory = spec[:directory]

            if File.symlink?(directory)
              errors << "Operational resource directory symlinks are not allowed: #{directory}"
              next
            end

            next unless Dir.exist?(directory)

            Find.find(directory) do |path|
              next if path == directory

              if File.symlink?(path)
                errors << "Operational resource symlinks are not allowed: #{path}"
                next
              end

              next if File.directory?(path)
              next if path == "#{directory}/README.md"

              unless File.file?(path)
                errors << "Operational resources must be regular files: #{path}"
                next
              end

              operational_files << path
            end
          end

          operational_files.each do |path|
            declaration = concrete_declarations[path]
            unless declaration
              label = resource_specs.find { |_name, spec| path.start_with?("#{spec[:directory]}/") }&.first
              errors << "SKILL.md must declare the exact retained resource path as '#{label}: #{path}'."
            end
          end

          unless errors.empty?
            errors.uniq.each { |error| warn error }
            exit 1
          end
          RUBY

          ruby .github/scripts/validate-core-profile-contracts.rb

          has_operational_files() {
            local directory="$1"
            [[ -d "$directory" ]] && find "$directory" -type f ! -path "$directory/README.md" -print -quit | grep -q .
          }

          if has_operational_files mcp; then
            required_mcp_contracts=(
              RUNTIME.md
              INTERFACES.md
              MCP_INTERFACE.md
              docs/mcp-transports.md
            )

            for path in "${required_mcp_contracts[@]}"; do
              if [[ ! -f "$path" ]]; then
                echo "MCP implementation files require contract file: $path" >&2
                exit 1
              fi
            done
          fi

          if grep -RIn --exclude-dir=.git -E '(API_KEY|TOKEN|PASSWORD)=[^[:space:]<][^[:space:]]*' .; then
            echo "Possible committed secret assignment found." >&2
            exit 1
          fi

          echo "Agent Skill structure is valid for its selected profile."
