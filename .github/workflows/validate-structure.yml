name: Validate template structure

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test Skill source and distribution boundary
        shell: bash
        run: ruby .github/scripts/test-distribution-boundary.rb

      - name: Test GitHub Pages deployment boundary
        shell: bash
        run: ruby .github/scripts/test-pages-deployment-boundary.rb

      - name: Test documentation publication catalog validation
        shell: bash
        run: |
          ruby .github/scripts/test-publication-catalog.rb
          ruby .github/scripts/test-publication-schema-version.rb

      - name: Validate documentation publication catalog
        shell: bash
        run: ruby .github/scripts/validate-publication-catalog.rb

      - name: Validate repository structure and selected profile contracts
        shell: bash
        run: ruby .github/scripts/validate-skill-repository.rb

      - name: Reject committed secret assignments
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --exclude-dir=.git -E '(API_KEY|TOKEN|PASSWORD)=[^[:space:]<][^[:space:]]*' .; then
            echo "Possible committed secret assignment found." >&2
            exit 1
          fi
