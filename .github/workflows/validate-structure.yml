name: Validate template structure

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up minimum supported Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test Skill source and distribution boundary
        shell: bash
        run: ruby .github/scripts/test-distribution-boundary.rb

      - name: Test copyable Skill distribution
        shell: bash
        run: ruby .github/scripts/test-skill-distribution.rb

      - name: Validate copyable Skill distribution
        shell: bash
        run: ruby .github/scripts/validate-skill-distribution.rb

      - name: Validate copyable Skill root
        shell: bash
        run: |
          ruby .github/scripts/validate-skill-repository.rb template
          ruby template/.github/scripts/test-template-baseline.rb

      - name: Audit restructuring completion
        shell: bash
        run: ruby .github/scripts/test-restructure-completion.rb

      - name: Test GitHub Pages deployment boundary
        shell: bash
        run: ruby .github/scripts/test-pages-deployment-boundary.rb

      - name: Test documentation publication catalog validation
        shell: bash
        run: |
          python .github/scripts/test_publication_catalog.py
          python .github/scripts/test_publication_schema_version.py

      - name: Validate documentation publication catalog
        shell: bash
        run: python .github/scripts/validate_publication_catalog.py

      - name: Reject committed secret assignments
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --exclude-dir=.git -E '(API_KEY|TOKEN|PASSWORD)=[^[:space:]<][^[:space:]]*' .; then
            echo "Possible committed secret assignment found." >&2
            exit 1
          fi
