name: Validate template structure

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate universal skill core and selected resources
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f SKILL.md ]]; then
            echo "Missing universally required file: SKILL.md" >&2
            exit 1
          fi

          ruby <<'RUBY'
          require "yaml"

          path = "SKILL.md"
          lines = File.readlines(path, chomp: true)

          unless lines.first == "---"
            warn "SKILL.md must begin with YAML frontmatter."
            exit 1
          end

          closing_index = (1...lines.length).find { |index| lines[index] == "---" }
          unless closing_index
            warn "SKILL.md YAML frontmatter must have a closing --- delimiter."
            exit 1
          end

          frontmatter = lines[1...closing_index].join("\n")

          begin
            metadata = YAML.safe_load(
              frontmatter,
              permitted_classes: [],
              permitted_symbols: [],
              aliases: false
            )
          rescue Psych::Exception => error
            warn "SKILL.md contains invalid YAML frontmatter: #{error.message}"
            exit 1
          end

          unless metadata.is_a?(Hash)
            warn "SKILL.md YAML frontmatter must be a mapping."
            exit 1
          end

          name = metadata["name"]
          unless name.is_a?(String) && name.length.between?(1, 64) && /\A[a-z0-9]+(?:-[a-z0-9]+)*\z/.match?(name)
            warn "SKILL.md frontmatter name must be a 1-64 character lowercase hyphenated string."
            exit 1
          end

          description = metadata["description"]
          unless description.is_a?(String) && !description.strip.empty?
            warn "SKILL.md frontmatter description must be a non-empty string."
            exit 1
          end
          RUBY

          has_operational_files() {
            local directory="$1"
            [[ -d "$directory" ]] && find "$directory" -type f ! -name README.md -print -quit | grep -q .
          }

          reject_operational_symlinks() {
            local directory="$1"
            local path

            [[ -d "$directory" ]] || return 0

            while IFS= read -r -d '' path; do
              echo "Operational resource symlinks are not allowed: $path" >&2
              exit 1
            done < <(find "$directory" -type l -print0)
          }

          validate_operational_file_references() {
            local directory="$1"
            local label
            local path

            [[ -d "$directory" ]] || return 0

            case "$directory" in
              references) label="Reference" ;;
              assets) label="Asset" ;;
              scripts) label="Script" ;;
              *)
                echo "Unsupported operational resource directory: $directory" >&2
                exit 1
                ;;
            esac

            while IFS= read -r -d '' path; do
              if ! awk -v expected="$path" -v label="$label" '
                function trim(value) {
                  sub(/^[[:space:]]+/, "", value)
                  sub(/[[:space:]]+$/, "", value)
                  return value
                }

                {
                  line = trim($0)
                  if (substr(line, 1, 2) == "- ") {
                    line = trim(substr(line, 3))
                  }

                  prefix = label ":"
                  if (index(line, prefix) != 1) {
                    next
                  }

                  value = trim(substr(line, length(prefix) + 1))
                  if (length(value) >= 2 && substr(value, 1, 1) == "`" && substr(value, length(value), 1) == "`") {
                    value = substr(value, 2, length(value) - 2)
                  }

                  if (value == expected) {
                    found = 1
                  }
                }

                END {
                  exit found ? 0 : 1
                }
              ' SKILL.md; then
                echo "SKILL.md must declare the exact retained resource path as '$label: $path'." >&2
                exit 1
              fi
            done < <(find "$directory" -type f ! -name README.md -print0)
          }

          for directory in references assets scripts; do
            reject_operational_symlinks "$directory"
            validate_operational_file_references "$directory"
          done

          if has_operational_files mcp; then
            required_mcp_contracts=(
              RUNTIME.md
              INTERFACES.md
              docs/mcp-transports.md
            )

            for path in "${required_mcp_contracts[@]}"; do
              if [[ ! -f "$path" ]]; then
                echo "MCP implementation files require contract file: $path" >&2
                exit 1
              fi
            done
          fi

          if grep -RIn --exclude-dir=.git -E '(API_KEY|TOKEN|PASSWORD)=[^[:space:]<][^[:space:]]*' .; then
            echo "Possible committed secret assignment found." >&2
            exit 1
          fi

          echo "Agent Skill structure is valid for its selected profile."
