name: Temporary reapply #833 build-pages semantics

on:
  push:
    branches:
      - feat/site-browser-qualification

permissions:
  contents: read

jobs:
  reapply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/site-browser-qualification
          fetch-depth: 0
          persist-credentials: false
      - name: Reapply historical qualified #833 member patch
        run: |
          set -euo pipefail
          git diff 231cf76c2ee94235d3cefbdad08eb5e80ed8fcb3 ecf7aec28793609a1a38f43998530fed0a4ccb25 -- .github/workflows/build-pages.yml > /tmp/build-pages-833.patch
          test -s /tmp/build-pages-833.patch
          git apply --check /tmp/build-pages-833.patch
          git apply /tmp/build-pages-833.patch
      - name: Validate recovered browser qualification contract
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.3
          python -m unittest tests.test_site_browser_qualification_workflows -v
      - name: Export recovered workflow
        uses: actions/upload-artifact@v4
        with:
          name: recovered-build-pages-833
          path: .github/workflows/build-pages.yml
          if-no-files-found: error
          retention-days: 1
