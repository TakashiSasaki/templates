name: Refresh generated Skill source policy
on:
  push:
    branches: [agent/skill-copyable-policy-boundary]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/skill-copyable-policy-boundary
      - uses: TakashiSasaki/templates@5de32547e68fa15e24ff3b8affadf12e9d730a41
        with:
          command: render
          config: .agent-policy.yml
      - name: Commit generated policy artifacts
        run: |
          git add AGENTS.md .agent-policy.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh generated Skill source policy"
          git push origin HEAD:agent/skill-copyable-policy-boundary
