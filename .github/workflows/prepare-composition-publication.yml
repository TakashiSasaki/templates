name: Prepare Composition stable publication

on:
  pull_request:
    branches: [composition]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'publish/composition-next-actions-stable'
    runs-on: ubuntu-latest
    steps:
      - name: Finalize publication bytes through GitHub Git data API
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_EVENT_PATH: ${{ github.event_path }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.parse
          import urllib.request

          REPOSITORY = os.environ["GH_REPOSITORY"]
          TOKEN = os.environ["GH_TOKEN"]
          API = f"https://api.github.com/repos/{REPOSITORY}"
          BRANCH = "publish/composition-next-actions-stable"
          WORKFLOW = ".github/workflows/prepare-composition-publication.yml"

          OLD_I = "677dc68fe35fc285638b46685950d31e3a3d3c2f"
          OLD_S = "69af2ed811875f95838bf978ee09365554405664"
          OLD_T = "16d3eb411729a79549dbaaf6dab1d05207f83415"
          OLD_D = "134fae0e01d1ee1d560f5f2c0284dc56e241626fd4d89a426a68fa41d7e93e34"

          NEW_T = "2bf8c86060d48281a03807b2429ce045aa8e2a91"
          NEW_S = "cc180cecbde7f75cd5f07c1aa311014d6db7c97c"
          NEW_I = "01c65730afdbd431749ffd00e790ff3c5bd72015"

          TEXT_SURFACES = (
              "release/README.md",
              "docs/consumer-guide.md",
              "docs/guides/skill-first-use-walkthrough.md",
              "docs/guides/webapp-product-walkthrough.md",
              "tests/test_composition_skill_installer_publication.py",
              "translations/ja/docs/consumer-guide.md",
              "translations/ja/docs/guides/skill-first-use-walkthrough.md",
              "translations/ja/docs/guides/webapp-product-walkthrough.md",
          )
          CANONICAL_TRANSLATIONS = (
              "docs/consumer-guide.md",
              "docs/guides/skill-first-use-walkthrough.md",
              "docs/guides/webapp-product-walkthrough.md",
          )

          def request(method, path, payload=None):
              url = API + path
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "composition-publication-finalizer/1",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          def content(path, ref):
              encoded_path = urllib.parse.quote(path, safe="/")
              encoded_ref = urllib.parse.quote(ref, safe="")
              payload = request("GET", f"/contents/{encoded_path}?ref={encoded_ref}")
              return base64.b64decode(payload["content"])

          def git_blob_sha(data):
              header = f"blob {len(data)}\0".encode("ascii")
              return hashlib.sha1(header + data).hexdigest()

          with open(os.environ["GH_EVENT_PATH"], encoding="utf-8") as handle:
              event = json.load(handle)
          head_sha = event["pull_request"]["head"]["sha"]
          head_ref = event["pull_request"]["head"]["ref"]
          if head_ref != BRANCH:
              raise SystemExit(f"unexpected head branch: {head_ref}")

          ref_payload = request("GET", f"/git/ref/heads/{urllib.parse.quote(BRANCH, safe='/')}")
          if ref_payload["object"]["sha"] != head_sha:
              raise SystemExit("branch moved after workflow event; refusing stale publication finalization")

          installer_bytes = content("scripts/install_composition_skill.py", NEW_I)
          installer_digest = hashlib.sha256(installer_bytes).hexdigest()
          if NEW_S.encode("ascii") not in installer_bytes:
              raise SystemExit("immutable installer bytes do not pin the expected Skill source")

          changed = {}
          for path in TEXT_SURFACES:
              data = content(path, head_sha)
              text = data.decode("utf-8")
              transformed = (
                  text.replace(OLD_I, NEW_I)
                  .replace(OLD_S, NEW_S)
                  .replace(OLD_T, NEW_T)
                  .replace(OLD_D, installer_digest)
              )
              if transformed == text:
                  raise SystemExit(f"publication surface had no stable identity substitution: {path}")
              changed[path] = transformed.encode("utf-8")

          descriptor_path = "release/composition-installer.json"
          descriptor = json.loads(content(descriptor_path, head_sha).decode("utf-8"))
          descriptor["installer"]["revision"] = NEW_I
          descriptor["installer"]["sha256"] = installer_digest
          descriptor["skill_source"]["revision"] = NEW_S
          descriptor["toolchain"]["revision"] = NEW_T
          changed[descriptor_path] = (json.dumps(descriptor, indent=2) + "\n").encode("utf-8")

          manifest_path = "translations/manifest.json"
          manifest = json.loads(content(manifest_path, head_sha).decode("utf-8"))
          canonical_blobs = {
              path: git_blob_sha(changed[path]) for path in CANONICAL_TRANSLATIONS
          }
          found = set()
          for item in manifest["translations"]:
              canonical = item.get("canonical")
              if canonical in canonical_blobs:
                  item["canonical_blob_sha"] = canonical_blobs[canonical]
                  found.add(canonical)
          if found != set(CANONICAL_TRANSLATIONS):
              raise SystemExit(f"translation manifest entries missing: {sorted(set(CANONICAL_TRANSLATIONS) - found)}")
          changed[manifest_path] = (json.dumps(manifest, indent=2, ensure_ascii=False) + "\n").encode("utf-8")

          for path in TEXT_SURFACES:
              text = changed[path].decode("utf-8")
              if OLD_I in text or OLD_S in text or OLD_T in text or OLD_D in text:
                  raise SystemExit(f"old stable identity remains in publication surface: {path}")

          commit = request("GET", f"/git/commits/{head_sha}")
          entries = []
          for path, data in sorted(changed.items()):
              blob = request(
                  "POST",
                  "/git/blobs",
                  {"content": base64.b64encode(data).decode("ascii"), "encoding": "base64"},
              )
              entries.append({"path": path, "mode": "100644", "type": "blob", "sha": blob["sha"]})
          entries.append({"path": WORKFLOW, "mode": "100644", "type": "blob", "sha": None})

          tree = request("POST", "/git/trees", {"base_tree": commit["tree"]["sha"], "tree": entries})
          new_commit = request(
              "POST",
              "/git/commits",
              {
                  "message": "Publish promoted Composition stable identities",
                  "tree": tree["sha"],
                  "parents": [head_sha],
              },
          )
          request(
              "PATCH",
              f"/git/refs/heads/{urllib.parse.quote(BRANCH, safe='/')}",
              {"sha": new_commit["sha"], "force": False},
          )

          print(f"installer_sha256={installer_digest}")
          print(f"toolchain={NEW_T}")
          print(f"skill_source={NEW_S}")
          print(f"installer={NEW_I}")
          for path in CANONICAL_TRANSLATIONS:
              print(f"canonical_blob[{path}]={canonical_blobs[path]}")
          print(f"publication_head={new_commit['sha']}")
          PY
