name: Temporary capability planning authority tests
on:
  push:
    branches:
      - agent/capability-planning-item-authority-pr22
jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -I -m venv .venv
      - run: .venv/bin/python -m pip install --disable-pip-version-check --no-deps -r requirements-dev.lock
      - run: >-
          .venv/bin/python -m unittest -v
          tests.test_planning_target_proof_strength
          tests.test_cli_interface_contract
          tests.test_service_interface_contract
          tests.test_web_interface_contract
          tests.test_web_interface_materialized_validation
          tests.test_mcp_interface_contract
          tests.test_mcp_apps_contract
          tests.test_selected_component_validation
          tests.test_production_catalog
          tests.test_pr3_production_catalog
          tests.test_component_version_guard
