name: Run PR 464 round 2 fixer v3
on:
  push:
    branches: [agent/composition-task-ledger-browser-proof]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/composition-task-ledger-browser-proof
          fetch-depth: 0
      - name: Apply fixes
        run: echo '' | base64 -d | python
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Address Codex browser contract completeness findings"
          git push origin HEAD:agent/composition-task-ledger-browser-proof
