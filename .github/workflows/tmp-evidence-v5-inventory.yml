name: Temporary evidence v5 inventory
on:
  push:
    branches:
      - agent/evidence-requirement-targets-v5-pr20
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory implementation-evidence v4 fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path('.')
          evidence_schema = '../schemas/implementation-evidence.schema.json'
          version_re = re.compile(r'(["\']\$schema["\']\s*:\s*["\']\.\./schemas/implementation-evidence\.schema\.json["\'][\s\S]{0,160}?["\']schemaVersion["\']\s*:\s*)4')
          for path in sorted(p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts):
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              matches = list(version_re.finditer(text))
              if matches:
                  print(f'V4 {path} count={len(matches)}')
              if evidence_schema in text and '"requirements"' in text:
                  for i, line in enumerate(text.splitlines(), 1):
                      if '"requirements"' in line or "'requirements'" in line:
                          print(f'REQ {path}:{i}: {line.strip()}')
          PY
