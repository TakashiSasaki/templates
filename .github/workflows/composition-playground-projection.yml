name: Composition Playground projection

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: composition-playground-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  projection:
    name: canonical projection
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Keep this venv: the locked development dependencies are the validation
      # boundary, and the ephemeral runner's host Python is not that boundary.
      - name: Create isolated validation environment
        run: python3 -I -m venv --clear .venv

      - name: Install locked validation dependencies
        run: .venv/bin/python -m pip install --isolated --disable-pip-version-check --no-deps --requirement requirements-dev.lock

      - name: Verify dependency graph
        run: .venv/bin/python -m pip check

      - name: Run Playground projection regressions
        run: |
          .venv/bin/python -I tests/test_composition_playground_projection.py
          .venv/bin/python -I tests/test_composition_playground_intent.py
          .venv/bin/python -I tests/test_webmcp_capability.py

      - name: Generate exact-head canonical projection artifacts
        run: |
          .venv/bin/python scripts/generate_composition_playground.py --output composition-playground-v1.json
          .venv/bin/python scripts/generate_composition_playground_intent.py --output composition-playground-intent-v1.json

      - name: Record exact-head provenance
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          .venv/bin/python -I scripts/validate_playground_provenance.py \
            --projection composition-playground-v1.json \
            --projection composition-playground-intent-v1.json \
            --expected-head "$EXPECTED_HEAD"

      - name: Upload canonical projection artifacts
        uses: actions/upload-artifact@v4
        with:
          name: composition-playground-${{ github.event.pull_request.head.sha }}
          path: |
            composition-playground-v1.json
            composition-playground-intent-v1.json
          if-no-files-found: error
          retention-days: 7
