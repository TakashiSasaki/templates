<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Text statistics</title>
</head>
<body>
  <main>
    <h1>Text statistics</h1>
    <pre id="result" aria-live="polite" aria-atomic="true">Waiting for tool result…</pre>
  </main>
  <script>
    (() => {
      const result = document.getElementById("result");
      let nextId = 1;
      let initialized = false;
      const initializeRequestId = nextId++;

      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;

        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") return;

        if (message.id === initializeRequestId && message.result && !initialized) {
          initialized = true;
          window.parent.postMessage({
            jsonrpc: "2.0",
            method: "ui/notifications/initialized"
          }, "*");
          return;
        }

        if (message.method === "ui/notifications/tool-result") {
          if (!initialized) return;
          result.textContent = JSON.stringify(
            message.params?.structuredContent ?? message.params ?? null,
            null,
            2
          );
        }
      });

      window.parent.postMessage({
        jsonrpc: "2.0",
        id: initializeRequestId,
        method: "ui/initialize",
        params: {
          appCapabilities: {
            availableDisplayModes: ["inline"]
          }
        }
      }, "*");
    })();
  </script>
</body>
</html>
