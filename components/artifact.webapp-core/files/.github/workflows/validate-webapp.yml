name: Validate Web application contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-webapp:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.13"
      - name: Install contract validation dependencies
        run: python -m pip install --disable-pip-version-check --no-deps -r .template-composition/requirements-validation.lock
      - name: Validate dependency graph
        run: python -m pip check
      - name: Validate contract schemas and Webapp invariants
        run: python scripts/validate_contracts.py
      - name: Validate contract evolution
        run: python .template-composition/validators/validate_contract_evolution.py .
      - name: Validate implementation evidence
        run: python .template-composition/validators/validate_implementation_evidence.py .
      - name: Validate Webapp evidence coverage
        run: python scripts/validate_webapp_evidence.py
      - name: Detect release document modes
        id: release-modes
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          release = json.loads(
              Path("contracts/release-evidence.json").read_text(encoding="utf-8")
          )
          bundle = json.loads(
              Path("contracts/release-bundle.json").read_text(encoding="utf-8")
          )
          print(f"release_mode={release.get('mode', 'unknown')}")
          print(f"bundle_mode={bundle.get('mode', 'unknown')}")
          PY
      - name: Validate template release evidence
        if: steps.release-modes.outputs.release_mode == 'template'
        run: python .template-composition/validators/validate_release_evidence.py .
      - name: Validate template release bundle
        if: steps.release-modes.outputs.bundle_mode == 'template'
        run: python .template-composition/validators/validate_release_bundle.py .
      - name: Explain product release validation boundary
        if: steps.release-modes.outputs.release_mode == 'product' || steps.release-modes.outputs.bundle_mode == 'product'
        run: |
          echo "Product release evidence and release bundles are revision-bound."
          echo "Run their exact-candidate validation in the product-owned release operation."
