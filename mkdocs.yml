site_name: agent-policy
site_author: Takashi SASAKI
copyright: Copyright © 2026 Takashi SASAKI. All rights reserved.
site_description: 複数のリポジトリとエージェントで共有する規約を、検証・合成・配布するためのポリシーツールチェーン
site_url: https://agent-policy.moukaeritai.work/
repo_url: https://github.com/TakashiSasaki/templates
repo_name: TakashiSasaki/templates
edit_uri: edit/policy/docs/
strict: true
site_dir: site

theme:
  name: readthedocs
  custom_dir: overrides
  favicon: assets/icons/favicon-32.png

nav:
  - ホーム: overview.md
  - レイヤー別ナビゲーション:
      - Provider / toolchain: provider/index.md
      - Shared policy corpus: shared-policy/index.md
      - Consumer effective policy: consumer/index.md
  - 導入:
      - はじめに: getting-started.md
      - Policy concepts: policy-concepts.md
      - Managed repository operation: managed-operation.md
      - CLI: cli.md
      - ブートストラップスキル: bootstrap.md
      - 既存リポジトリの導入: adoption.md
      - Toolchain release lifecycle: release-lifecycle.md
      - Policy completion roadmap: policy-readiness.md
      - Policy readiness audit: policy-readiness-audit.md
      - Documentation publication: documentation-publication.md
      - Publication catalog: publication-catalog.md
      - PWAとして利用する: pwa.md
  - エージェント環境:
      - Google AI Studio Build mode: agent-environments/google-ai-studio.md
  - 設計:
      - リポジトリ構造: repository-structure.md
      - アーキテクチャ: architecture.md
      - 設定ファイル: configuration.md
      - Policy profiles: shared-policy/profiles.md
      - 規約の作成: policy-authoring.md
      - Policy maintainer workflow: policy-maintainer-workflow.md
      - Repository-change orchestration: agent-work-orchestration.md
      - Revision-bound qualification lifecycle: revision-bound-qualification.md
      - Policy authority inventory: policy-authority-inventory.md
      - Shared review policy: review-policy.md
      - 外部artifact受領規約: external-artifact-intake.md
      - 退行防止の普遍規約: regression-prevention.md
      - ブートストラップモデル: bootstrap-model.md
      - 脅威モデル: threat-model.md
      - Architecture decisions:
          - Current decisions:
              - ADR-0002 Repository adoption: adr/0002-repository-adoption.md
              - ADR-0003 Application-neutral scope: adr/0003-application-neutral-policy-scope.md
              - ADR-0005 Single policy authority: adr/0005-single-policy-authority.md
              - ADR-0006 Copyable artifact policy adoption: adr/0006-copyable-artifact-policy-adoption.md
              - ADR-0007 Single agent-policy skill runtime cache: adr/0007-single-agent-policy-skill-runtime-cache.md
              - ADR-0008 Review authority and GitHub runtime boundary: adr/0008-review-authority-and-github-runtime-boundary.md
              - ADR-0009 Review-result representation boundary: adr/0009-review-result-representation-boundary.md
          - Superseded decisions:
              - ADR-0004 Integrated bootstrap skill (superseded): adr/0004-integrated-bootstrap-skill.md

markdown_extensions:
  - admonition
  - fenced_code
  - tables
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/file-preview.css

extra_javascript:
  - assets/javascripts/pwa.js
  - assets/javascripts/file-preview.js
